      .g-spot .ctr .sym.hit{filter:drop-shadow(0 0 6px var(--hc)) drop-shadow(0 0 14px var(--hc))}
      .g-spot.m-shadow .sym{filter:brightness(0) opacity(.82)}
      .g-spot.m-shadow .ctr .sym.gold{filter:brightness(0) drop-shadow(0 0 5px #ffc400) drop-shadow(0 0 12px #ffb300)}
      .g-spot.m-shadow .ctr .sym.hit{filter:brightness(0) drop-shadow(0 0 6px var(--hc)) drop-shadow(0 0 14px var(--hc))}
      .g-spot .badge{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:#2b3157;
        border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:42px;z-index:5;
        box-shadow:0 6px 18px rgba(0,0,0,.45);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.6,1)}
      .g-spot .badge.on{transform:scale(1)}
      .g-spot .zi{position:absolute;inset:8px;display:flex;gap:10px;align-items:stretch}
      .g-spot .sc{flex:0 0 84px;border-radius:20px;background:var(--pc);color:#111;display:flex;flex-direction:column;
        align-items:center;justify-content:center;font-weight:900;position:relative}
      .g-spot .sc .n{font-size:48px;line-height:1}
      .g-spot .sc .t{font-size:15px;opacity:.7;margin-top:2px}
      .g-spot .sc .st{position:absolute;top:-6px;right:-6px;font-size:22px;line-height:1;display:none}
      .g-spot .sc .st.on{display:block;animation:spotPop .4s}
      .g-spot .sc.bump{animation:spotPop .45s}
      @keyframes spotPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
      .g-spot .zi.tall{flex-direction:column}
      .g-spot .zi.tall .sc{flex:0 0 64px;flex-direction:row;gap:10px}
      .g-spot .zi.tall .sc .n{font-size:40px}
      .g-spot .card{flex:1;position:relative;border-radius:22px;background:#f4f1e8;
        box-shadow:inset 0 0 0 5px var(--pc);overflow:hidden;transition:opacity .2s}
      .g-spot .cell{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:16px}
      .g-spot.m-swirl .cell{transition:left .45s ease-in-out, top .45s ease-in-out}
      .g-spot .cell.ok{background:color-mix(in srgb, var(--pc) 45%, transparent)}
      .g-spot .cell.half{background:color-mix(in srgb, var(--pc) 30%, transparent);box-shadow:inset 0 0 0 3px var(--pc)}
      .g-spot .cell.bad{background:rgba(255,40,60,.35);animation:spotShake .3s}
      .g-spot .cell .sym{position:static;pointer-events:none}
      .g-spot .frz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
        background:rgba(120,190,255,.6);color:#0b2a4a;font-weight:900;font-size:24px;border-radius:22px;text-align:center;
        backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3}
      .g-spot .frz b{font-size:56px;line-height:1}
      .g-spot .card.frozen .frz{display:flex}
      .g-spot .card.won{box-shadow:inset 0 0 0 5px var(--pc),0 0 0 4px #fff}
      .g-spot.cd .card .cell,.g-spot.cd .ctr .sym{visibility:hidden}
      @keyframes spotShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    `));

    /* ---------- center card ---------- */
    const ctr = U.h('div', { class: 'ctr' });
    const spin = U.h('div', { class: 'spin' });
    ctr.append(spin);
    const badge = U.h('div', { class: 'badge' });
    ctx.root.append(ctr, badge);
    let ctrSyms = [];

    /* ---------- player zones ---------- */
    const depth = ctx.n === 2 ? 0.27 : 0.25;
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth });
      const inner = U.h('div', { class: 'zi' });
      const scN = U.h('div', { class: 'n' }, '0');
      const st = U.h('div', { class: 'st' }, '🔥');
      const sc = U.h('div', { class: 'sc' }, scN, U.h('div', { class: 't' }, 'из ' + TARGET), st);
      const frzIcon = U.h('b', null, '❄️'), frzText = U.h('div', null, 'Заморозка');
      const card = U.h('div', { class: 'card' }, U.h('div', { class: 'frz' }, frzIcon, frzText));
      inner.append(sc, card);
      z.el.append(inner);
      return { z, inner, card, sc, scN, st, frzIcon, frzText, cells: [], order: [] };
    });

    /* ---------- dealing ---------- */
    function pickMod() {
      if (roundNo <= 1 || Math.random() < 0.35) return null;
      const keys = Object.keys(MODS).filter(k => k !== lastMod);
      return U.pick(keys);
    }

    function deal() {
      roundNo++;
      mod = pickMod();
      if (mod) lastMod = mod;
      const k = mod === 'double' ? 2 : 1;
      const pool = U.shuffle(POOL);
      center = pool.slice(0, PER_CARD);
      const rest = pool.slice(PER_CARD);
      const commons = U.shuffle(center).slice(0, ctx.n * k);
      hands = []; common = []; found = [];
      ctx.players.forEach(p => {
        const mine = commons.slice(p.i * k, p.i * k + k);
        const others = U.shuffle(rest).slice(0, PER_CARD - k);
        common[p.i] = mine;
        found[p.i] = new Set();
        hands[p.i] = U.shuffle([...mine, ...others]);
      });
      // golden symbol: sometimes, preferably for the player who is behind
      golden = null;
      if (mod !== 'double' && roundNo > 1 && Math.random() < 0.35) {
        const min = Math.min(...score), max = Math.max(...score);
        const behind = ctx.players.filter(p => score[p.i] === min).map(p => p.i);
        const who = max - min >= 2 ? U.pick(behind) : U.randInt(0, ctx.n - 1);
        golden = common[who][0];
      }
      Object.keys(MODS).forEach(m => ctx.root.classList.toggle('m-' + m, m === mod));
      buildCenter();
      seats.forEach((s, i) => buildHand(i));
      layout();
      // announce
      badge.textContent = mod ? MODS[mod].icon : '';
      badge.classList.toggle('on', !!mod);
      const msgs = [];
      if (mod) msgs.push(`${MODS[mod].icon} ${MODS[mod].text}`);
      if (golden) msgs.push('⭐ Золотой символ: +2');
      if (msgs.length) ctx.toast(msgs.join('  '), { ms: 1500, size: 26, color: '#2b3157' });
      if (swirlTimer) { ctx.cancel(swirlTimer); swirlTimer = null; }
      if (mod === 'swirl') swirlTimer = ctx.every(1700, () => {
        if (state !== 'play') return;
        seats.forEach(s => { s.order = U.shuffle(s.order); layoutHand(s); });
      });
      roundStart = ctx.time;
    }

    function buildCenter() {
      spin.replaceChildren();
      const tiny = mod === 'tiny';
      // slot 0 in the middle, the rest on a ring; random sizes and rotations
      const ringOff = Math.random() * Math.PI * 2;
      ctrSyms = center.map((sym, k) => {
        const el = U.h('div', { class: 'sym' + (sym === golden ? ' gold' : '') }, sym);
        const a = ringOff + (k - 1) * Math.PI * 2 / (PER_CARD - 1);
        el._pos = k === 0
          ? { x: 0, y: 0, s: tiny ? U.rand(0.16, 0.55) : U.rand(0.4, 0.5) }
          : { x: Math.cos(a) * 0.63, y: Math.sin(a) * 0.63, s: tiny ? U.pick([U.rand(0.12, 0.17), U.rand(0.36, 0.44)]) : U.rand(0.29, 0.4) };
        el._pos.jx = U.rand(-0.04, 0.04); el._pos.jy = U.rand(-0.04, 0.04);
        el._rot = Math.random() * 360;
        el._sym = sym;
        spin.append(el);
        return el;
      });
    }

    function buildHand(i) {
      const s = seats[i];
      const tiny = mod === 'tiny';
      s.card.querySelectorAll('.cell').forEach(c => c.remove());
      s.card.classList.remove('won');
      s.cells = hands[i].map(sym => {
        const symEl = U.h('div', { class: 'sym' }, sym);
        const cell = U.h('div', { class: 'cell' }, symEl);
        cell._sym = sym;
        cell._symEl = symEl;
        cell._s = tiny ? U.pick([U.rand(0.24, 0.34), U.rand(0.85, 0.98)]) : U.rand(0.6, 0.86);
        cell._rot = U.rand(-35, 35);
        cell._jx = U.rand(-1, 1); cell._jy = U.rand(-1, 1);
        ctx.tap(cell, () => press(i, cell));
        s.card.append(cell);
        return cell;
      });
      s.order = null;
    }

    /* ---------- layout ---------- */
    // 3 players in portrait: the bottom player's strip is short, so their card grows upward
    // into the free space above it (the center card does not need the full height).
    let extra = 0;
    const EXM = 50;
    function centerRegion() {
      const W = ctx.W, H = ctx.H;
      const d = seats[0].z.h;
      // keep clear of the exit button (2p: middle of the left edge, 3p: middle of the top edge)
      if (ctx.n === 2) return { x: EXM, y: d, w: W - 2 * EXM, h: H - 2 * d };
      return { x: d, y: EXM, w: W - 2 * d, h: H - d - extra - EXM };
    }

    function layout() {
      if (ctx.n === 3) {
        const d = seats[0].z.h, rw = ctx.W - 2 * d, rh = ctx.H - d - EXM;
        extra = Math.round(U.clamp(rh - rw - 20, 0, d * 0.9));
        seats[0].inner.style.top = (8 - extra) + 'px';
        seats[0].inner.classList.toggle('tall', extra > 40);
      }
      const r = centerRegion();
      const D = Math.max(120, Math.min(r.w, r.h) * 0.94);
      const R = D / 2;
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      Object.assign(ctr.style, { width: D + 'px', height: D + 'px', left: (cx - R) + 'px', top: (cy - R) + 'px' });
      // badge: on the rim, on the side with more free room
      const bx = r.w - D > r.h - D ? cx + R + 8 : cx + R * 0.78, by = r.w - D > r.h - D ? cy : cy + R * 0.78;
      badge.style.left = Math.min(bx + 30, r.x + r.w - 40) + 'px';
      badge.style.top = by + 'px';
      ctrSyms.forEach(el => {
        const p = el._pos;
        const fs = p.s * R;
        el.style.fontSize = fs + 'px';
        el.style.width = el.style.height = fs * 1.15 + 'px';
        el.style.lineHeight = fs * 1.15 + 'px';
        const x = R + (p.x + p.jx) * R - fs * 0.575, y = R + (p.y + p.jy) * R - fs * 0.575;
        el._base = `translate(${x}px,${y}px) rotate(${el._rot}deg)`;
        el.style.transform = el._base + (el.classList.contains('hit') ? ' scale(1.35)' : '');
      });
      seats.forEach(layoutHand);
    }

    function layoutHand(s) {
      const cw = s.card.clientWidth, ch = s.card.clientHeight;
      if (!cw || !ch) return;
      const pad = 8;
      const iw = cw - 2 * pad, ih = ch - 2 * pad;
      let best = null;
      for (const [c, r] of [[8, 1], [4, 2], [3, 3], [2, 4], [1, 8]]) {
        const m = Math.min(iw / c, ih / r);
        if (!best || m > best.m) best = { c, r, m };
      }
      const cwid = iw / best.c, chei = ih / best.r;
      const used = best.c * best.r;
      // slot order (random; with a 3x3 grid one slot stays empty)
      if (!s.order || s.order.length !== used) s.order = U.shuffle([...Array(used).keys()]);
      s.cells.forEach((cell, idx) => {
        const k = s.order[idx];
        const cx = k % best.c, cy = Math.floor(k / best.c);
        Object.assign(cell.style, { left: pad + cx * cwid + 'px', top: pad + cy * chei + 'px', width: cwid + 'px', height: chei + 'px' });
        const m = Math.min(cwid, chei);
        const fs = m * cell._s;
        const slackX = Math.max(0, (cwid - fs * 1.2) / 2), slackY = Math.max(0, (chei - fs * 1.2) / 2);
        cell._symEl.style.fontSize = fs + 'px';
        cell._symEl.style.transform = `translate(${cell._jx * slackX}px,${cell._jy * slackY}px) rotate(${cell._rot}deg)`;
      });
    }
    ctx.onResize(() => layout());

    /* ---------- play ---------- */
    const isFrozen = (i) => ctx.time < frozenUntil[i];
    function freeze(i, ms, icon, text) {
      frozenUntil[i] = Math.max(frozenUntil[i], ctx.time + ms / 1000);
      seats[i].frzIcon.textContent = icon;
      seats[i].frzText.textContent = text;
    }

    function render() {
      seats.forEach((s, i) => {
        s.scN.textContent = score[i];
        s.st.classList.toggle('on', streak.who === i && streak.n >= 2);
        s.st.textContent = streak.who === i ? '🔥'.repeat(Math.min(streak.n, 3)) : '';
      });
    }

    function press(i, cell) {
      if (state !== 'play' || isFrozen(i)) return;
      if (found[i].has(cell._sym)) return;
      if (!common[i].includes(cell._sym)) {
        freeze(i, 1500, '❄️', 'Заморозка');
        cell.classList.add('bad');
        ctx.after(1500, () => cell.classList.remove('bad'));
        return;
      }
      found[i].add(cell._sym);
      const c = ctrSyms.find(e => e._sym === cell._sym);
      if (c) {
        c.style.setProperty('--hc', ctx.players[i].color);
        c.classList.add('hit');
        c.style.transform = c._base + ' scale(1.35)';
      }
      if (found[i].size < common[i].length) { cell.classList.add('half'); return; }
      // round won
      state = 'show';
      cell.classList.add('ok');
      seats[i].card.querySelectorAll('.cell.half').forEach(e => e.classList.replace('half', 'ok'));
      seats[i].card.classList.add('won');
      let pts = mod === 'double' ? 2 : 1;
      const parts = [`${cell._sym} +${pts}`];
      if (golden && common[i].includes(golden)) { pts++; parts.push('⭐+1'); }
      if (ctx.time - roundStart < FAST) { pts++; parts.push('⚡+1'); }
      score[i] += pts;
      if (streak.who === i) streak.n++; else streak = { who: i, n: 1 };
      let streakHit = false;
      if (streak.n >= 3) { streakHit = true; streak.n = 0; }
      seats[i].sc.classList.remove('bump'); void seats[i].sc.offsetWidth; seats[i].sc.classList.add('bump');
      render();
      if (score[i] >= TARGET) {
        state = 'done';
        ctx.toast(parts.join(' '), { color: ctx.players[i].color, fg: '#111', ms: 1100 });
        ctx.after(1200, () => ctx.end({ winner: i, scores: score.slice() }));
        return;
      }
      ctx.toast(parts.join(' '), { color: ctx.players[i].color, fg: '#111', ms: 1000, size: pts > 1 ? 30 : 24 });
      ctx.after(1100, () => {
        nextRound();
        if (streakHit) {
          ctx.toast(`🔥 Серия ${ctx.players[i].name}! Соперники замёрзли`, { color: '#ff7a1a', fg: '#111', ms: 1600 });
          ctx.players.forEach(p => { if (p.i !== i) freeze(p.i, 2000, '🔥', 'Серия соперника!'); });
        }
      });
    }

    function nextRound() {
      if (state === 'done') return;
      state = 'play';
      deal();
      render();
    }

    ctx.loop(() => {
      ctx.root.classList.toggle('cd', ctx.paused && ctx.time === 0);
      ctx.root.classList.toggle('pz', ctx.paused);
      seats.forEach((s, i) => s.card.classList.toggle('frozen', isFrozen(i)));
    });
    deal();
    render();
    // the zones' inner sizes are known only after the first layout pass
    requestAnimationFrame(() => layout());
  },
});

</script>
<script>/* games/stopwatch.js */
registerGame({
  id: 'stopwatch',
  title: 'Секундомер',
  emoji: '⏱️',
  desc: 'Останови таймер ровно в цель',
  rules: 'В каждом раунде есть цель, например 7.50 секунды. После отсчёта секундомер стартует сам, жми СТОП, когда думаешь, что прошло ровно столько. Кто ближе всех, получает очко. 5 раундов.\n' +
    'Режимы раундов:\n' +
    '⏱️ Классика: первые 1.5 с время видно.\n' +
    '👻 Невидимка: таймера не видно совсем.\n' +
    '🔄 Обратный: время идёт от цели к нулю, жми на нуле.\n' +
    '🌀 Отвлечение: на экране мелькают ложные цифры.\n' +
    '🎲 Случайная цель: цель с сотыми, например 6.37.\n' +
    '🎯 Снайпер: ошибся меньше чем на 0.10 с, получи +2 бонус.\n' +
    '🆘 Подсказка: кто отстаёт на 2+ очка, видит время на секунду дольше.\n' +
    '🏁 Финал: последний раунд, все очки ×2.',
  start(ctx) {
    const N = ctx.n;
    const ROUNDS = 5;
    const DEPTH = 0.3;
    const SHOW = 1.5;     // seconds the running time is visible
    const GRACE = 5;      // seconds after the target before the round auto-finishes
    const SNIPER = 0.10;
    const TARGETS = [3, 4, 5, 6.5, 7.5, 10];
    const MODES = {
      classic: { icon: '⏱️', name: 'Классика', sub: 'время видно 1.5 с', color: '#ffffff' },
      ghost: { icon: '👻', name: 'Невидимка', sub: 'таймера не видно совсем', color: '#c39bff' },
      reverse: { icon: '🔄', name: 'Обратный отсчёт', sub: 'жми, когда дойдёт до нуля', color: '#4dd0ff' },
      distract: { icon: '🌀', name: 'Отвлечение', sub: 'не верь цифрам!', color: '#ff8a5c' },
      random: { icon: '🎲', name: 'Случайная цель', sub: 'цель с сотыми', color: '#3ddc97' },
    };
    const score = ctx.players.map(() => 0);
    const help = ctx.players.map(() => false);
    let round = 0, target = 5, lastTarget = 0;
    let mode = 'classic';
    let modeBag = U.shuffle(['ghost', 'reverse', 'distract', 'random']);
    let state = 'idle'; // idle | intro | count | run | reveal | show | done
    let t0 = 0, times = [];
    let revealT0 = 0;
    let fakeNext = 0;
    let rolling = false;
    // precise timing between frames
    let frameT = performance.now(), frameGT = 0;

    ctx.root.classList.add('g-sw');
    ctx.root.append(U.h('style', null, `
      .g-sw .sz{display:flex;padding:10px 12px 12px;gap:12px;border-radius:20px}
      .g-sw .sz.row{flex-direction:row}
      .g-sw .sz.col{flex-direction:column;gap:6px}
      .g-sw .inf{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:rgba(255,255,255,.05);border-radius:18px;padding:4px 8px;transition:box-shadow .25s,background .25s}
      .g-sw .top{display:flex;gap:10px;align-items:baseline;justify-content:center;white-space:nowrap;font-weight:800}
      .g-sw .tg{color:#fff}
      .g-sw .tg b{color:var(--pc)}
      .g-sw .sc{color:#c3c8e8}
      .g-sw .disp{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1;color:#fff}
      .g-sw .disp.hid{color:var(--muted)}
      .g-sw .disp.mine{color:var(--pc)}
      .g-sw .disp.fake{color:#ff8a5c;opacity:.75}
      .g-sw .disp.roll{color:#3ddc97}
      .g-sw .disp.pop{animation:swPop .4s ease-out}
      .g-sw .res{font-weight:800;white-space:nowrap;color:var(--muted);min-height:1.2em}
      .g-sw .res.win{color:var(--ok)}
      .g-sw .stop{flex:none;border-radius:22px;background:var(--pc);color:#111;font-weight:900;display:flex;align-items:center;
        justify-content:center;letter-spacing:2px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.2);transition:opacity .15s}
      .g-sw .stop.off{opacity:.3}
      .g-sw .stop.done{background:#2a3150;color:var(--pc);box-shadow:0 0 0 3px var(--pc) inset}
      .g-sw .stop.hit{animation:swHit .16s ease-out}
      .g-sw .sz.won .inf{box-shadow:0 0 0 4px var(--ok) inset,0 0 40px rgba(61,220,151,.5);background:rgba(61,220,151,.12)}
      .g-sw .badge{font-size:.8em;margin-left:6px}
      @keyframes swHit{0%{scale:.92}100%{scale:1}}
      @keyframes swPop{0%{scale:1.5}100%{scale:1}}
      .fx-flash{position:absolute;inset:0;z-index:36;pointer-events:none;transition:opacity .55s ease-out}
      .fx-shake{animation:fxShake .35s}
      @keyframes fxShake{0%,100%{translate:0 0}20%{translate:-9px 4px}40%{translate:8px -5px}60%{translate:-6px -3px}80%{translate:5px 3px}}
      .toast.fx-ban{font-size:26px;text-align:center;line-height:1.15;border:2px solid rgba(255,255,255,.3);animation:fxPop .4s ease-out;padding:10px 20px}
      .toast.fx-ban b{font-size:34px;margin-right:8px;vertical-align:-4px}
      .toast.fx-ban small{display:block;font-size:16px;font-weight:700;opacity:.85;margin-top:2px}
      @keyframes fxPop{0%{scale:.3;opacity:0}60%{scale:1.12;opacity:1}100%{scale:1}}
    `));

    const { g } = ctx.canvas();

    // ---------- juice: particles, flashes, shake, announcements ----------
    const fx = (() => {
      const { cv, g } = ctx.canvas({ z: 35 });
      cv.style.pointerEvents = 'none';
      const ps = [];
      const layer = U.h('div', { class: 'toast-layer' });
      ctx.root.append(layer);
      const active = [];
      const api = {
        at(el) {
          const r = el.getBoundingClientRect(), R = ctx.root.getBoundingClientRect();
          return { x: r.left - R.left + r.width / 2, y: r.top - R.top + r.height / 2 };
        },
        burst(x, y, color, n = 22, sp = 360, size = 6) {
          for (let k = 0; k < n; k++) {
            const a = Math.random() * 6.283, s = sp * (0.35 + Math.random() * 0.65), l = 0.5 + Math.random() * 0.5;
            ps.push({ kind: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, color, size: size * (0.6 + Math.random() * 0.8) });
          }
        },
        ring(x, y, color, r = 90) { ps.push({ kind: 'r', x, y, life: 0.5, max: 0.5, color, r }); },
        text(x, y, str, color, i, size = 38) {
          const v = ctx.toScreen(i, 0, -60);
          ps.push({ kind: 't', x, y, vx: v.x, vy: v.y, str, color, rot: ctx.players[i].rot, size, life: 1.2, max: 1.2 });
        },
        flash(color, a = 0.3) {
          const d = U.h('div', { class: 'fx-flash', style: { background: color, opacity: a } });
          ctx.root.append(d); void d.offsetWidth; d.style.opacity = 0;
          setTimeout(() => d.remove(), 700);
        },
        shake(el = ctx.root) { el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake'); },
        // announcement facing each player, just in front of their own zone (stacks if several are shown)
        banner(icon, title, sub, o = {}) {
          ctx.players.forEach(p => {
            const e = U.h('div', { class: 'toast fx-ban' }, U.h('b', null, icon), title, sub ? U.h('small', null, sub) : null);
            if (o.color) e.style.background = o.color;
            if (o.fg) e.style.color = o.fg;
            const z = zones[p.i].z, r = z.rect, v = ctx.inward(p.i);
            Object.assign(e.style, { maxWidth: (z.w - 16) + 'px', whiteSpace: 'normal' });
            layer.append(e);
            // room between this zone's inner edge and the screen center; drop older banners that would not fit
            const ex = r.x + r.w / 2 + v.x * z.h / 2, ey = r.y + r.h / 2 + v.y * z.h / 2;
            const room = (ctx.W / 2 - ex) * v.x + (ctx.H / 2 - ey) * v.y;
            const mine = active.filter(a => a.i === p.i);
            const sum = () => mine.reduce((s, a) => s + a.e.offsetHeight + 8, 0);
            while (mine.length && sum() + e.offsetHeight + 12 > Math.max(room, e.offsetHeight + 12)) {
              const old = mine.shift(); old.e.remove(); active.splice(active.indexOf(old), 1);
            }
            const stack = sum();
            const off = z.h / 2 + 12 + stack + e.offsetHeight / 2;
            Object.assign(e.style, { left: (r.x + r.w / 2 + v.x * off) + 'px', top: (r.y + r.h / 2 + v.y * off) + 'px', transform: `translate(-50%,-50%) rotate(${p.rot}deg)` });
            const a = { i: p.i, e };
            active.push(a);
            ctx.after(o.ms ?? 1700, () => { e.remove(); const k = active.indexOf(a); if (k >= 0) active.splice(k, 1); });
          });
        },
      };
      ctx.loop((dt) => {
        g.clearRect(0, 0, ctx.W, ctx.H);
        const damp = Math.exp(-3 * dt);
        for (let k = ps.length - 1; k >= 0; k--) {
          const p = ps[k];
          p.life -= dt;
          if (p.life <= 0) { ps.splice(k, 1); continue; }
          const f = p.life / p.max;
          if (p.kind === 'p') {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp;
            g.globalAlpha = Math.min(1, f * 1.5);
            g.fillStyle = p.color;
            g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * f), 0, 6.283); g.fill();
          } else if (p.kind === 'r') {
            g.globalAlpha = f;
            g.strokeStyle = p.color; g.lineWidth = 8 * f + 1;
            g.beginPath(); g.arc(p.x, p.y, p.r * (1 - f) + 10, 0, 6.283); g.stroke();
          } else {
            p.x += p.vx * dt; p.y += p.vy * dt;
            g.save();
            g.globalAlpha = Math.min(1, f * 2);
            g.translate(p.x, p.y); g.rotate(p.rot * Math.PI / 180);
            g.font = `900 ${p.size}px -apple-system,system-ui,sans-serif`;
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(p.str, 0, 0);
            g.fillStyle = p.color; g.fillText(p.str, 0, 0);
            g.restore();
          }
        }
        g.globalAlpha = 1;
      });
      return api;
    })();

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH, className: 'sz' });
      const tg = U.h('span', { class: 'tg' });
      const sc = U.h('span', { class: 'sc' });
      const disp = U.h('div', { class: 'disp' }, '—');
      const res = U.h('div', { class: 'res' }, '');
      const inf = U.h('div', { class: 'inf' }, U.h('div', { class: 'top' }, tg, sc), disp, res);
      const stop = U.h('div', { class: 'stop off' }, 'СТОП');
      z.el.append(inf, stop);
      ctx.tap(stop, () => press(p.i));
      return { z, tg, sc, disp, res, inf, stop };
    });

    function layout() {
      for (const zb of zones) {
        const w = zb.z.w - 24, h = zb.z.h - 22;
        const row = w / h > 1.7;
        zb.z.el.classList.toggle('row', row);
        zb.z.el.classList.toggle('col', !row);
        let infH;
        if (row) {
          const bw = Math.round(Math.min(h * 1.15, w * 0.42));
          Object.assign(zb.stop.style, { width: bw + 'px', height: 'auto' });
          zb.stop.style.fontSize = Math.round(Math.min(bw * 0.2, 46)) + 'px';
          infH = h;
        } else {
          const bh = Math.round(h * 0.4);
          Object.assign(zb.stop.style, { width: 'auto', height: bh + 'px' });
          zb.stop.style.fontSize = Math.round(Math.min(bh * 0.45, 46)) + 'px';
          infH = h - bh - 6;
        }
        const infW = row ? w - parseFloat(zb.stop.style.width) - 12 : w;
        const small = Math.round(U.clamp(Math.min(infH * 0.15, infW / 17), 13, 22));
        zb.tg.parentNode.style.fontSize = small + 'px';
        zb.res.style.fontSize = small + 'px';
        zb.disp.style.fontSize = Math.round(U.clamp(Math.min(infH * 0.42, infW / 5.2), 22, 72)) + 'px';
      }
    }
    layout();
    ctx.onResize(layout);

    const fmt = (s) => s.toFixed(2);
    const final = () => round === ROUNDS;
    function renderInfo() {
      zones.forEach((zb, i) => {
        zb.tg.innerHTML = '';
        const tTxt = rolling ? '?.??' : fmt(target);
        zb.tg.append(MODES[mode].icon + ' ', mode === 'reverse' ? 'С ' : 'Цель ', U.h('b', null, tTxt + ' с'), mode === 'reverse' ? ' до 0' : '');
        zb.sc.textContent = `· ${final() ? '🏁 финал' : `раунд ${Math.max(1, round)}/${ROUNDS}`} · очки ${score[i]}`;
      });
    }

    function elapsed() {
      // game time at the last frame plus real time since then (finer than one frame)
      return frameGT - t0 + (ctx.paused ? 0 : Math.min(0.05, (performance.now() - frameT) / 1000));
    }
    // how long player i may see the running time this round
    function visibleFor(i) {
      const base = mode === 'ghost' ? 0 : SHOW;
      return base + (help[i] ? 1 : 0);
    }

    function newRound() {
      round++;
      mode = round === 1 ? 'classic' : modeBag.pop() || 'classic';
      if (mode === 'random') target = Math.round(U.rand(3.2, 9.4) * 100) / 100;
      else { do { target = U.pick(TARGETS); } while (target === lastTarget); }
      lastTarget = target;
      times = ctx.players.map(() => null);
      const max = Math.max(...score);
      ctx.players.forEach(p => { help[p.i] = round > 1 && max - score[p.i] >= 2; });
      state = 'intro';
      const M = MODES[mode];
      if (final()) {
        fx.banner('🏁', 'Финал! Очки ×2', `${M.icon} ${M.name}`, { color: '#ffd84a', fg: '#111', ms: 2000 });
        fx.flash('#ffd84a', 0.25);
      } else {
        fx.banner(M.icon, M.name, M.sub, { color: M.color, fg: '#111', ms: 1800 });
        if (mode !== 'classic') fx.flash(M.color, 0.15);
      }
      zones.forEach(zb => {
        zb.z.el.classList.remove('won');
        zb.disp.className = 'disp';
        zb.disp.textContent = mode === 'random' ? '🎲' : fmt(target);
        zb.res.className = 'res';
        zb.res.textContent = 'приготовься…';
        zb.stop.className = 'stop off';
        zb.stop.textContent = 'СТОП';
      });
      rolling = mode === 'random';
      renderInfo();
      const helped = ctx.players.filter(p => help[p.i]);
      ctx.after(1900, () => {
        if (helped.length) fx.banner('🆘', 'Подсказка', helped.map(p => p.name).join(', ') + ': время видно дольше', { ms: 1500 });
        state = 'count';
        if (mode === 'random') {
          // slot-machine roll of the target
          let k = 0;
          const roll = () => {
            if (k++ < 10) {
              zones.forEach(zb => { zb.disp.className = 'disp roll'; zb.disp.textContent = fmt(U.rand(3, 9.9)); });
              ctx.after(70, roll);
            } else {
              rolling = false;
              zones.forEach(zb => { zb.disp.className = 'disp roll pop'; zb.disp.textContent = fmt(target); });
              renderInfo();
              ctx.after(900, countdown);
            }
          };
          roll();
        } else countdown();
      });
    }

    function countdown() {
      let count = 3;
      const step = () => {
        if (state !== 'count') return;
        if (count > 0) {
          zones.forEach(zb => { zb.disp.className = 'disp pop'; zb.disp.textContent = String(count); zb.res.textContent = 'старт через…'; });
          count--;
          ctx.after(650, step);
        } else go();
      };
      step();
    }

    function go() {
      state = 'run';
      t0 = ctx.time;
      frameGT = ctx.time; frameT = performance.now();
      fakeNext = 0;
      zones.forEach(zb => {
        zb.stop.className = 'stop';
        zb.res.textContent = mode === 'reverse' ? 'жми на нуле!' : 'считай про себя!';
      });
    }

    function press(i) {
      const zb = zones[i];
      if (state === 'count' || state === 'intro') {
        zb.res.textContent = 'ещё рано!';
        fx.shake(zb.stop);
        return;
      }
      if (state !== 'run' || times[i] != null) return;
      times[i] = elapsed();
      zb.stop.classList.remove('hit'); void zb.stop.offsetWidth; zb.stop.classList.add('hit');
      zb.stop.classList.add('done');
      zb.stop.textContent = '✓';
      zb.disp.className = 'disp mine';
      zb.disp.textContent = 'стоп!';
      const a = fx.at(zb.stop);
      fx.ring(a.x, a.y, ctx.players[i].color, 80);
      zb.res.textContent = times.every(t => t != null) ? '' : 'ждём остальных…';
      if (times.every(t => t != null)) finish();
    }

    // dramatic reveal: everyone's time rolls up from zero at once, then the verdict
    function finish() {
      state = 'reveal';
      revealT0 = ctx.time;
      zones.forEach((zb, i) => {
        zb.stop.className = 'stop off';
        zb.stop.textContent = 'СТОП';
        zb.res.className = 'res';
        zb.res.textContent = times[i] == null ? 'не нажал' : '🥁 …';
      });
      ctx.after(1500, verdict);
    }

    function verdict() {
      state = 'show';
      const mult = final() ? 2 : 1;
      const diffs = times.map(t => t == null ? Infinity : Math.abs(t - target));
      const best = Math.min(...diffs);
      const winners = best === Infinity ? [] : diffs.map((d, i) => d - best < 0.005 ? i : -1).filter(i => i >= 0);
      const snipers = diffs.map((d, i) => d <= SNIPER ? i : -1).filter(i => i >= 0);
      winners.forEach(i => { score[i] += mult; });
      snipers.forEach(i => { score[i] += 2 * mult; });
      zones.forEach((zb, i) => {
        zb.disp.className = 'disp mine pop';
        if (times[i] == null) {
          zb.disp.textContent = '—';
          zb.res.textContent = 'не нажал';
          return;
        }
        zb.disp.textContent = fmt(times[i]) + ' с';
        const d = times[i] - target;
        let pts = (winners.includes(i) ? mult : 0) + (snipers.includes(i) ? 2 * mult : 0);
        zb.res.textContent = (d >= 0 ? '+' : '−') + fmt(Math.abs(d)) + ' с' + (pts ? `  +${pts}` : '') + (snipers.includes(i) ? ' 🎯' : winners.includes(i) ? ' 🏆' : '');
        if (pts) {
          zb.res.className = 'res win';
          zb.z.el.classList.add('won');
          const a = fx.at(zb.inf);
          fx.burst(a.x, a.y, ctx.players[i].color, 34, 460, 7);
          fx.burst(a.x, a.y, '#3ddc97', 16, 300, 5);
          fx.ring(a.x, a.y, '#fff', 120);
          fx.text(a.x, a.y, '+' + pts, '#fff', i, 44);
        }
      });
      renderInfo();
      if (snipers.length) {
        fx.flash('#3ddc97', 0.3);
        fx.shake();
        fx.banner('🎯', 'Снайпер!', snipers.map(i => ctx.players[i].name).join(', ') + `: точнее 0.10 с, +${2 * mult}`, { color: '#3ddc97', fg: '#111', ms: 1800 });
      } else if (winners.length) {
        const c = winners.length === 1 ? ctx.players[winners[0]].color : undefined;
        fx.banner('🏆', '+' + mult + ' ' + winners.map(i => ctx.players[i].name).join(' и '), null, { color: c, fg: c ? '#111' : undefined, ms: 1600 });
      } else {
        fx.banner('😴', 'Никто не нажал', null, { ms: 1500 });
      }
      if (round >= ROUNDS) {
        state = 'done';
        const max = Math.max(...score);
        const ws = score.map((s, i) => s === max ? i : -1).filter(i => i >= 0);
        ctx.after(2800, () => ctx.end({ winners: ws, scores: score.slice() }));
      } else {
        ctx.after(3200, newRound);
      }
    }

    ctx.loop((dt, t) => {
      if (dt > 0) { frameT = t; frameGT = ctx.time; }
      if (state === 'run') {
        const e = ctx.time - t0;
        const flick = mode === 'distract' && ctx.time >= fakeNext;
        if (flick) fakeNext = ctx.time + U.rand(0.08, 0.22);
        zones.forEach((zb, i) => {
          if (times[i] != null) return;
          const shown = e < visibleFor(i);
          if (shown) {
            zb.disp.className = 'disp';
            zb.disp.textContent = fmt(mode === 'reverse' ? Math.max(0, target - e) : e);
          } else if (mode === 'distract') {
            if (flick) { zb.disp.className = 'disp fake'; zb.disp.textContent = fmt(U.rand(0, target * 1.6)); }
          } else {
            zb.disp.className = 'disp hid';
            zb.disp.textContent = mode === 'ghost' ? '👻' : '???';
          }
        });
        if (dt > 0 && e > target + GRACE) finish();
      } else if (state === 'reveal') {
        const f = U.clamp((ctx.time - revealT0) / 1.2, 0, 1);
        const ease = 1 - Math.pow(1 - f, 3);
        zones.forEach((zb, i) => {
          if (times[i] == null) return;
          zb.disp.className = 'disp mine';
          zb.disp.textContent = fmt(times[i] * ease);
        });
      }
      draw(t / 1000);
    });

    function draw(T) {
      const W = ctx.W, H = ctx.H, d = zones[0].z.h;
      g.clearRect(0, 0, W, H);
      const cx = W / 2, cy = N === 2 ? H / 2 : (H - d) / 2;
      const room = N === 2 ? Math.min(W, H - 2 * d) : Math.min(W - 2 * d, H - d);
      const R = U.clamp(room * 0.36, 40, 170);
      const SPAN = 12; // seconds per revolution
      const ang = (s) => -Math.PI / 2 + s / SPAN * Math.PI * 2;
      g.save();
      g.translate(cx, cy);
      if (final() && state !== 'idle') {
        g.shadowColor = '#ffd84a';
        g.shadowBlur = 30 + 10 * Math.sin(T * 4);
      }
      // dial
      g.fillStyle = '#1b2038';
      g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
      g.lineWidth = Math.max(4, R * 0.06);
      g.strokeStyle = final() ? '#ffd84a' : '#3a4270';
      g.stroke();
      g.shadowBlur = 0;
      // ticks
      for (let k = 0; k < SPAN; k++) {
        const a = ang(k);
        g.strokeStyle = 'rgba(255,255,255,.35)';
        g.lineWidth = 3;
        g.beginPath();
        g.moveTo(Math.cos(a) * R * 0.78, Math.sin(a) * R * 0.78);
        g.lineTo(Math.cos(a) * R * 0.9, Math.sin(a) * R * 0.9);
        g.stroke();
      }
      // target marker (sniper window around it)
      if (state !== 'idle' && !rolling) {
        const a = ang(target), w = SNIPER / SPAN * Math.PI * 2;
        g.strokeStyle = 'rgba(61,220,151,.35)';
        g.lineWidth = Math.max(10, R * 0.12);
        g.beginPath(); g.arc(0, 0, R * 0.95, a - w, a + w); g.stroke();
        g.strokeStyle = '#3ddc97';
        g.lineWidth = Math.max(6, R * 0.08);
        g.lineCap = 'round';
        g.beginPath(); g.arc(0, 0, R * 0.95, a - 0.04, a + 0.04); g.stroke();
      }
      const e = state === 'run' ? ctx.time - t0 : 0;
      const handVisible = state === 'run' ? e < (mode === 'ghost' ? 0 : SHOW) : true;
      if (state === 'run' && mode === 'distract' && !handVisible) {
        // a lying hand that spins at random speeds
        const a = ang(e * (1.6 + Math.sin(T * 2.3) * 1.2) + Math.sin(T * 5) * 0.8);
        g.strokeStyle = 'rgba(255,138,92,.8)';
        g.lineWidth = Math.max(4, R * 0.05);
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * R * 0.8, Math.sin(a) * R * 0.8); g.stroke();
      } else if (state === 'run' && !handVisible) {
        // hidden: fog over the dial
        g.fillStyle = `rgba(15,18,32,${0.75 + 0.1 * Math.sin(T * 3)})`;
        g.beginPath(); g.arc(0, 0, R * 0.88, 0, Math.PI * 2); g.fill();
        g.strokeStyle = mode === 'ghost' ? 'rgba(195,155,255,.25)' : 'rgba(255,255,255,.12)';
        g.lineWidth = 2;
        for (let k = -3; k <= 3; k++) {
          const s = T * (k % 2 ? 1.2 : -0.9);
          g.beginPath(); g.arc(0, 0, R * (0.3 + 0.08 * (k + 3)), s, s + 1.6); g.stroke();
        }
      } else if (state !== 'reveal' && state !== 'show' && state !== 'done') {
        const s = state === 'run' ? (mode === 'reverse' ? Math.max(0, target - e) : e) : (mode === 'reverse' ? target : 0);
        const a = ang(s);
        g.strokeStyle = '#fff';
        g.lineWidth = Math.max(4, R * 0.05);
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * R * 0.8, Math.sin(a) * R * 0.8); g.stroke();
      }
      // everyone's stop points sweep out during the reveal
      if (state === 'reveal' || state === 'show' || state === 'done') {
        const f = state === 'reveal' ? 1 - Math.pow(1 - U.clamp((ctx.time - revealT0) / 1.2, 0, 1), 3) : 1;
        times.forEach((tt, i) => {
          if (tt == null) return;
          const a = ang(Math.min(tt, SPAN) * f);
          const r = R * (0.5 + 0.1 * i);
          g.strokeStyle = U.alpha(ctx.players[i].color, 0.5);
          g.lineWidth = 4;
          g.beginPath(); g.arc(0, 0, r, -Math.PI / 2, a); g.stroke();
          g.fillStyle = ctx.players[i].color;
          g.beginPath(); g.arc(Math.cos(a) * r, Math.sin(a) * r, Math.max(7, R * 0.07), 0, Math.PI * 2); g.fill();
        });
      }
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(0, 0, Math.max(6, R * 0.06), 0, Math.PI * 2); g.fill();
      // crown button
      g.fillStyle = final() ? '#ffd84a' : '#3a4270';
      g.fillRect(-R * 0.1, -R * 1.17, R * 0.2, R * 0.14);
      g.restore();
    }

    renderInfo();
    zones.forEach(zb => { zb.disp.textContent = '—'; zb.res.textContent = 'приготовься…'; });
    ctx.after(0, newRound);
  },
});

</script>
<script>/* games/stroop.js */
registerGame({
  id: 'stroop',
  title: 'Цвет или слово',
  emoji: '🎨',
  desc: 'Слово, цвет букв и хитрые карточки-ловушки',
  rules: 'Появляется название цвета, написанное каким-то цветом. Перед словом показан тип карточки:\n✓✗ Совпадает? Слово и цвет букв совпадают: «СОВПАДАЕТ», иначе «НЕТ».\n🔄 Наоборот: отвечай противоположное.\n🎯 Цвет букв: нажми кнопку того цвета, которым написано слово.\n📖 Что написано: нажми цвет, который назван словом.\n⚡ Блиц: 2 секунды на ответ, +2.\n🦎 Хамелеон: цвет букв меняется на глазах, отвечай по текущему.\n💰 Золотая карточка: очки ×2. 🔥 Три верных подряд: +1.\nПервый верный ответ получает очки. Ошибка: −1 и пропуск карточки. Игра до 10 очков.',
  start(ctx) {
    const TARGET = 10;
    const INKS = [
      { word: 'КРАСНЫЙ', color: '#ff2d2d' },
      { word: 'СИНИЙ', color: '#2f6dff' },
      { word: 'ЗЕЛЁНЫЙ', color: '#1fd15a' },
      { word: 'ЖЁЛТЫЙ', color: '#ffe414' },
      { word: 'ФИОЛЕТОВЫЙ', color: '#b44dff' },
      { word: 'БЕЛЫЙ', color: '#ffffff' },
    ];
    const TYPES = {
      classic: { icon: '✓✗', text: 'Совпадает?', w: 30 },
      reverse: { icon: '🔄', text: 'Наоборот!', w: 14 },
      ink: { icon: '🎯', text: 'Цвет букв', w: 16 },
      word: { icon: '📖', text: 'Что написано', w: 12 },
      blitz: { icon: '⚡', text: 'Блиц: 2 сек, +2', w: 14 },
      chameleon: { icon: '🦎', text: 'Хамелеон', w: 14 },
    };
    const BLITZ = 2.0;
    const score = ctx.players.map(() => 0);
    const streak = ctx.players.map(() => 0);
    let locked = new Set();
    let state = 'gap'; // gap | ask | done
    let card = null;   // {type, word, ink, gold, opts, deadline}
    let nextType = 'classic', nextGold = false;
    let lastWord = -1, cardNo = 0;
    let chamTimer = null;

    ctx.root.classList.add('g-stroop');
    ctx.root.append(U.h('style', null, `
      .g-stroop .wd{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
        border-radius:22px;background:#2a2f44;box-shadow:0 6px 24px rgba(0,0,0,.35);border:4px solid transparent;
        font-weight:900;letter-spacing:1px;white-space:nowrap;transition:background .2s,border-color .2s;overflow:hidden}
      .g-stroop .wd .w{font-size:var(--ws);transition:color .12s}
      .g-stroop .wd .tag{position:absolute;left:0;right:0;top:7%;text-align:center;font-size:var(--ts);letter-spacing:0;color:#c9cee6}
      .g-stroop .wd .res{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:var(--ts);letter-spacing:0}
      .g-stroop .wd .big{font-size:calc(var(--ts) * 1.7);color:#e9ecf6;letter-spacing:0}
      .g-stroop .wd .bar{position:absolute;left:0;bottom:0;height:8px;background:#ffd23c;width:100%}
      .g-stroop .wd.empty{background:#1b1f31}
      .g-stroop .wd .q{color:#596086}
      .g-stroop .wd.t-reverse{border-color:#ff9d2e}
      .g-stroop .wd.t-reverse .tag{color:#ff9d2e}
      .g-stroop .wd.t-blitz{border-color:#ffd23c}
      .g-stroop .wd.t-ink,.g-stroop .wd.t-word{border-color:#7fd4ff}
      .g-stroop .wd.t-chameleon{border-color:#61e3a5}
      .g-stroop .wd.gold{background:linear-gradient(135deg,#4a3a10,#2a2f44 45%,#2a2f44 55%,#4a3a10);box-shadow:0 0 30px rgba(255,200,40,.45)}
      .g-stroop .wd.pop{animation:stPop .35s}
      @keyframes stPop{0%{transform:var(--tf) scale(.85)}60%{transform:var(--tf) scale(1.05)}100%{transform:var(--tf) scale(1)}}
      .g-stroop .zi{position:absolute;inset:8px;display:flex;gap:10px;align-items:stretch}
      .g-stroop .sc{flex:0 0 86px;border-radius:20px;border:4px solid var(--pc);color:var(--pc);display:flex;flex-direction:column;
        align-items:center;justify-content:center;font-weight:900;background:#151a2c;position:relative}
      .g-stroop .sc .n{font-size:44px;line-height:1}
      .g-stroop .sc .t{font-size:14px;opacity:.75;margin-top:2px}
      .g-stroop .sc .fl{position:absolute;top:-8px;right:-8px;font-size:20px;line-height:1}
      .g-stroop .sc.bump{animation:stBump .45s}
      @keyframes stBump{40%{transform:scale(1.2)}}
      .g-stroop .grp{flex:1;display:flex;gap:10px;min-width:0}
      .g-stroop .grp.hide{display:none}
      .g-stroop .bt{flex:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-weight:900;color:#141726;background:#e9ecf6;transition:transform .06s, opacity .15s;min-width:0;position:relative}
      .g-stroop .bt .i{font-size:34px;line-height:1}
      .g-stroop .bt .l{font-size:22px;margin-top:4px}
      .g-stroop .bt.no{background:#9aa1c4}
      .g-stroop .bt.sw{border:4px solid rgba(255,255,255,.25)}
      .g-stroop .bt:active{transform:scale(.96)}
      .g-stroop .bt.good{outline:6px solid #fff;background:#3ddc97}
      .g-stroop .bt.sw.good{outline:6px solid #fff}
      .g-stroop .bt.sw.good::after{content:'✓';font-size:44px;color:#111;text-shadow:0 0 6px #fff}
      .g-stroop .bt.wrong{background:#ff4d6d;color:#fff}
      .g-stroop .bt.sw.wrong::after{content:'✗';font-size:44px;color:#111}
      .g-stroop .zi.locked .bt{opacity:.25}
      .g-stroop .zi.locked .bt.wrong{opacity:.6}
    `));

    /* ---------- word copies: one per player, in the center area, facing them ---------- */
    const words = ctx.players.map(() => {
      const el = U.h('div', { class: 'wd empty' });
      ctx.root.append(el);
      return el;
    });

    /* ---------- zones ---------- */
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 0.2 });
      const inner = U.h('div', { class: 'zi' });
      const scN = U.h('div', { class: 'n' }, '0');
      const fl = U.h('div', { class: 'fl' });
      const sc = U.h('div', { class: 'sc' }, scN, U.h('div', { class: 't' }, 'из ' + TARGET), fl);
      const yes = U.h('div', { class: 'bt yes' }, U.h('div', { class: 'i' }, '✓'), U.h('div', { class: 'l' }, 'СОВПАДАЕТ'));
      const no = U.h('div', { class: 'bt no' }, U.h('div', { class: 'i' }, '✗'), U.h('div', { class: 'l' }, 'НЕТ'));
      ctx.tap(yes, () => answer(p.i, true, yes));
      ctx.tap(no, () => answer(p.i, false, no));
      const two = U.h('div', { class: 'grp' }, yes, no);
      const sws = [0, 1, 2, 3].map(k => {
        const b = U.h('div', { class: 'bt sw' });
        ctx.tap(b, () => answer(p.i, b._color, b));
        return b;
      });
      const four = U.h('div', { class: 'grp hide' }, ...sws);
      inner.append(sc, two, four);
      z.el.append(inner);
      return { z, inner, sc, scN, fl, yes, no, two, four, sws };
    });

    /* ---------- layout ---------- */
    const meas = document.createElement('canvas').getContext('2d');
    function textW(txt, fs) {
      meas.font = `900 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
      return meas.measureText(txt).width + txt.length * 1; // + letter-spacing
    }
    const LONGEST = INKS.reduce((a, b) => a.word.length > b.word.length ? a : b).word;

    // Slots stay clear of the exit button (2p: middle of the left edge, 3p: middle of the top edge).
    // Slot for each player's copy: rect in screen px (axis-aligned).
    function slots() {
      const W = ctx.W, H = ctx.H, d = seats[0].z.h, g = 12;
      if (ctx.n === 2) {
        const h = (H - 2 * d - 3 * g) / 2;
        return [
          { x: 56, y: H - d - g - h, w: W - 112, h },
          { x: 56, y: d + g, w: W - 112, h },
        ];
      }
      const x0 = d + g, w = W - 2 * d - 2 * g, y0 = 52, h = H - d - g - y0;
      const bh = Math.min(h * 0.32, Math.max(130, w * 0.3));
      const sideH = h - bh - g;
      const sw = (w - g) / 2;
      return [
        { x: x0, y: y0 + sideH + g, w, h: bh },
        { x: x0, y: y0, w: sw, h: sideH },
        { x: x0 + sw + g, y: y0, w: sw, h: sideH },
      ];
    }

    function layout() {
      const sl = slots();
      ctx.players.forEach(p => {
        const r = sl[p.i];
        const vertical = p.side === 'left' || p.side === 'right';
        const len = vertical ? r.h : r.w, dep = vertical ? r.w : r.h;
        const bw = Math.min(len, 760), bh = Math.min(dep, 240);
        const el = words[p.i];
        // font that fits the longest word into the box, leaving room for the tag and result lines
        let fs = Math.min(bh * 0.4, 110);
        const tw = textW(LONGEST, fs);
        if (tw > bw * 0.9) fs *= bw * 0.9 / tw;
        el.style.width = bw + 'px';
        el.style.height = bh + 'px';
        el.style.setProperty('--ws', fs + 'px');
        el.style.setProperty('--ts', U.clamp(bh * 0.13, 15, 28) + 'px');
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        const tf = `translate(${cx - bw / 2}px,${cy - bh / 2}px) rotate(${p.rot}deg)`;
        el.style.setProperty('--tf', tf);
        el.style.transform = tf;
      });
      // zone labels: shrink text if the buttons are narrow
      seats.forEach(s => {
        const bw = (s.z.w - 16 - 86 - 20) / 2;
        const fs = U.clamp(bw / 7.5, 13, 24);
        s.yes.querySelector('.l').style.fontSize = fs + 'px';
        s.no.querySelector('.l').style.fontSize = fs + 'px';
      });
    }
    layout();
    ctx.onResize(layout);

    /* ---------- game ---------- */
    function render() {
      seats.forEach((s, i) => {
        s.scN.textContent = score[i];
        s.inner.classList.toggle('locked', locked.has(i));
        s.fl.textContent = streak[i] >= 2 ? '🔥'.repeat(streak[i]) : '';
        const four = card && (card.type === 'ink' || card.type === 'word');
        s.two.classList.toggle('hide', !!four);
        s.four.classList.toggle('hide', !four);
      });
    }

    function bump(i) {
      const sc = seats[i].sc;
      sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
    }

    // result line under the word in every copy (instead of toasts, which would cover the word)
    function showResult(text, color) {
      words.forEach(el => { el.querySelector('.res')?.remove(); el.append(U.h('div', { class: 'res', style: { color } }, text)); });
    }

    function tagText(type, gold) {
      return `${TYPES[type].icon} ${TYPES[type].text}${gold ? '  💰×2' : ''}`;
    }

    // Empty box between cards announces the type of the next card.
    function showGap() {
      words.forEach(el => {
        el.className = 'wd empty t-' + nextType + (nextGold ? ' gold' : '');
        el.replaceChildren(U.h('span', { class: nextType === 'classic' && !nextGold ? 'q' : 'big' },
          nextType === 'classic' && !nextGold ? '• • •' : tagText(nextType, nextGold)));
      });
    }

    function showWord() {
      words.forEach(el => {
        el.className = 'wd pop t-' + card.type + (card.gold ? ' gold' : '');
        const kids = [U.h('div', { class: 'tag' }, tagText(card.type, card.gold)),
          U.h('span', { class: 'w', style: { color: INKS[card.ink].color } }, INKS[card.word].word)];
        if (card.type === 'blitz') kids.push(U.h('div', { class: 'bar' }));
        el.replaceChildren(...kids);
      });
    }

    function setInk(k) {
      card.ink = k;
      words.forEach(el => { const w = el.querySelector('.w'); if (w) w.style.color = INKS[k].color; });
    }

    function pickType() {
      if (cardNo < 1) return 'classic';
      let tot = 0;
      for (const k in TYPES) tot += TYPES[k].w;
      let x = Math.random() * tot;
      for (const k in TYPES) { x -= TYPES[k].w; if (x < 0) return k; }
      return 'classic';
    }

    function newCard() {
      if (state === 'done') return;
      cardNo++;
      locked = new Set();
      seats.forEach(s => [s.yes, s.no, ...s.sws].forEach(b => b.classList.remove('good', 'wrong')));
      let w;
      do { w = U.randInt(0, INKS.length - 1); } while (w === lastWord);
      lastWord = w;
      const type = nextType;
      let ink = w;
      const differ = type === 'ink' || type === 'word' || Math.random() >= 0.4;
      if (differ) { do { ink = U.randInt(0, INKS.length - 1); } while (ink === w); }
      card = { type, word: w, ink, gold: nextGold, deadline: ctx.time + BLITZ };
      if (type === 'ink' || type === 'word') {
        const others = U.shuffle([...INKS.keys()].filter(k => k !== w && k !== ink)).slice(0, 2);
        card.opts = U.shuffle([w, ink, ...others]);
        seats.forEach(s => s.sws.forEach((b, k) => { b._color = card.opts[k]; b.style.background = INKS[card.opts[k]].color; }));
      }
      state = 'ask';
      showWord();
      render();
      if (type === 'chameleon') {
        chamTimer = ctx.every(800, () => {
          if (state !== 'ask' || card.type !== 'chameleon') return;
          let k;
          if (card.ink !== card.word && Math.random() < 0.45) k = card.word;
          else { do { k = U.randInt(0, INKS.length - 1); } while (k === card.ink || k === card.word); }
          setInk(k);
        });
      }
    }

    function endCard(ms) {
      state = 'gap';
      if (chamTimer) { ctx.cancel(chamTimer); chamTimer = null; }
      nextType = pickType();
      nextGold = cardNo >= 2 && Math.random() < 0.15;
      ctx.after(ms, () => {
        if (state === 'done') return;
        card = null;
        showGap();
        render();
        ctx.after(nextType === 'classic' && !nextGold ? 450 : 1100, newCard);
      });
    }

    function correctAnswer() {
      const match = card.ink === card.word;
      switch (card.type) {
        case 'reverse': return !match;
        case 'ink': return card.ink;
        case 'word': return card.word;
        default: return match;
      }
    }

    function answer(i, val, btn) {
      if (state !== 'ask' || locked.has(i)) return;
      if (val === correctAnswer()) {
        let pts = card.type === 'blitz' ? 2 : 1;
        if (card.gold) pts *= 2;
        streak[i]++;
        ctx.players.forEach(p => { if (p.i !== i) streak[p.i] = 0; });
        let extra = '';
        if (streak[i] >= 3) { pts++; streak[i] = 0; extra = ' 🔥 серия +1'; }
        score[i] += pts;
        btn.classList.add('good');
        bump(i);
        render();
        showResult(`${ctx.players[i].name} +${pts}${extra}`, ctx.players[i].color);
        if (score[i] >= TARGET) {
          state = 'done';
          if (chamTimer) ctx.cancel(chamTimer);
          ctx.after(1100, () => ctx.end({ winner: i, scores: score.slice() }));
        } else endCard(900);
      } else {
        score[i] = Math.max(0, score[i] - 1);
        streak[i] = 0;
        locked.add(i);
        btn.classList.add('wrong');
        render();
        if (locked.size === ctx.n) {
          const c = correctAnswer();
          const txt = typeof c === 'number' ? 'Правильно: ' + INKS[c].word.toLowerCase()
            : card.type === 'reverse' ? (c ? 'Надо было: СОВПАДАЕТ' : 'Надо было: НЕТ')
            : (c ? 'Совпадало!' : 'Не совпадало!');
          showResult(txt, '#e9ecf6');
          endCard(1200);
        }
      }
    }

    ctx.loop(() => {
      if (state === 'ask' && card && card.type === 'blitz') {
        const left = card.deadline - ctx.time;
        const frac = U.clamp(left / BLITZ, 0, 1);
        words.forEach(el => { const b = el.querySelector('.bar'); if (b) { b.style.width = frac * 100 + '%'; b.style.background = frac < 0.35 ? '#ff4d6d' : '#ffd23c'; } });
        if (left <= 0) {
          showResult('⏰ Время вышло!', '#ffd23c');
          endCard(900);
        }
      }
    });

    showGap();
    render();
    // first word appears right after the countdown
    ctx.after(400, newCard);
  },
});

</script>
<script>/* games/sumo.js */
registerGame({
  id: 'sumo',
  title: 'Сумо',
  emoji: '🥋',
  desc: 'Толкайся, хватай бонусы, вытолкни всех с арены',
  rules: 'У каждого тяжёлый шар своего цвета на арене.\n' +
    'Управление — джойстик: коснись своей части экрана и тяни в нужную сторону.\n' +
    '🚀 Двойное касание — рывок туда, куда ты двигался (перезарядка 2 с).\n' +
    'Вытолкни соперников за край. Последний на арене выигрывает раунд. Через 20 с арена сжимается.\n' +
    'Бонусы на арене — наезжай своим шаром:\n' +
    '💪 тяжеловес · 🛡️ бампер (отбрасывает соперников) · ⚡ ударная волна · 🍌 банановые шкурки соперникам · 👟 турбо\n' +
    'У каждого раунда свой сюрприз: 🧊 лёд, 🔍 маленькая арена, 🐘 тяжеловесы, 🔴 бамперы по краю, 🌀 карусель, 🕳️ дыры.\n' +
    'Кто первым выиграет 3 раунда, тот победил.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const { cv, g } = ctx.canvas();
    const P = ctx.players;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    // only the latest message stays on screen, so quick events don't pile up
    let lastToast = null;
    const say = (text, o = {}) => {
      if (lastToast) lastToast.forEach(e => e.remove());
      lastToast = ctx.toast(text, Object.assign({ offset: ctx.n === 3 ? Math.min(ctx.W, ctx.H) * 0.2 : 70 }, o));
      return lastToast;
    };
    const WIN_ROUNDS = 3;
    // Physics in normalized units: 1 = min(W,H), origin at screen center.
    const A_BASE = 0.39;
    const RB = 0.062;
    const ACC = 1.15;
    const DRAG = 1.25;
    const E = 0.9;
    const JOY = 0.095;
    const SHRINK_AT = 20, SHRINK_V = 0.018;
    const DASH_CD = 2, DASH_V = 1.0;
    const IR = 0.038;

    const PU = {
      heavy: { icon: '💪', name: 'Тяжеловес', w: 2 },
      bumper: { icon: '🛡️', name: 'Бампер', w: 2 },
      shock: { icon: '⚡', name: 'Ударная волна!', w: 2 },
      banana: { icon: '🍌', name: 'Шкурки соперникам!', w: 1.6 },
      turbo: { icon: '👟', name: 'Турбо', w: 1.6 },
    };
    const MODS = {
      none: { icon: '🥋', name: 'Обычный раунд' },
      ice: { icon: '🧊', name: 'Ледяные пятна' },
      small: { icon: '🔍', name: 'Маленькая арена' },
      fat: { icon: '🐘', name: 'Тяжеловесы' },
      bumpers: { icon: '🔴', name: 'Бамперы по краю' },
      spin: { icon: '🌀', name: 'Карусель' },
      holes: { icon: '🕳️', name: 'Дыры' },
    };

    const wins = P.map(() => 0);
    const effects = P.map(() => []);
    let round = 1, state = 'fight', roundStart = 0, A0 = A_BASE, A = A_BASE, warned = false;
    let mod = 'none', modBag = [];
    let W = ctx.W, H = ctx.H, S = Math.min(W, H);
    ctx.onResize(() => { W = ctx.W; H = ctx.H; S = Math.min(W, H); });
    const toS = (x, y) => ({ x: W / 2 + x * S, y: H / 2 + y * S });

    function addFx(i, k, dur) {
      const e = effects[i].find(e => e.k === k);
      if (e) { e.until = ctx.time + dur; e.dur = dur; } else effects[i].push({ k, until: ctx.time + dur, dur });
    }
    const has = (i, k) => effects[i].some(e => e.k === k);

    const balls = P.map(p => ({ i: p.i, x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, r: RB, fall: 0, onArena: true, hit: 0, safe: false, stun: 0, dashAt: -9, lastDir: null, lastDirAt: -9, spin: 0 }));
    const baseR = () => RB * (mod === 'fat' ? 1.3 : 1);
    const radiusOf = (b) => baseR() * (has(b.i, 'heavy') ? 1.3 : 1);
    const massOf = (b) => (has(b.i, 'heavy') ? 2.5 : 1);
    function placeBalls() {
      for (const b of balls) {
        const v = ctx.inward(b.i);
        b.x = -v.x * A0 * 0.55; b.y = -v.y * A0 * 0.55;
        b.vx = b.vy = 0; b.fall = 0; b.onArena = true; b.hit = 0; b.safe = false; b.stun = 0; b.r = radiusOf(b); b.spin = 0;
      }
    }

    // ---------- round modifiers & hazards ----------
    const items = [];
    let peels = [], patches = [], holes = [], posts = [];
    let nextItem = 3, nextHole = 0, spinDir = 1, nextSpinFlip = 0;
    function setupMod() {
      A0 = A_BASE * (mod === 'small' ? 0.78 : 1);
      A = A0;
      patches = []; holes = []; posts = []; peels = []; items.length = 0;
      if (mod === 'ice') {
        for (let k = 0; k < 3; k++) {
          const a = (k / 3) * Math.PI * 2 + U.rand(-0.4, 0.4), r = U.rand(0.1, 0.25) * A0 / A_BASE;
          patches.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: U.rand(0.1, 0.13) });
        }
      }
      if (mod === 'bumpers') for (let k = 0; k < 6; k++) posts.push({ a: k / 6 * Math.PI * 2 + Math.PI / 6, r: 0.03, hit: 0 });
      nextHole = 4; spinDir = Math.random() < 0.5 ? -1 : 1; nextSpinFlip = 7;
      nextItem = 3;
    }
    function pickMod() {
      if (!modBag.length) modBag = U.shuffle(['ice', 'small', 'fat', 'bumpers', 'spin', 'holes']);
      return modBag.pop();
    }
    setupMod();
    placeBalls();
    ctx.onStart = () => say('Раунд 1 · 🥋 Толкай соперников!', { ms: 1300 });

    // ---------- juice (normalized units) ----------
    const parts = [], rings = [], pops = [];
    let shakeT = 0, shakeA = 0;
    function burst(x, y, color, n, speed, life = 0.6, size = 4) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, s = speed * (0.25 + Math.random() * 0.75);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, t: life * (0.6 + Math.random() * 0.4), color, size: size * (0.6 + Math.random() * 0.8) });
      }
      if (parts.length > 700) parts.splice(0, parts.length - 700);
    }
    const ring = (x, y, r0, r1, color, life = 0.5, w = 5) => rings.push({ x, y, r0, r1, color, life, t: life, w });
    const pop = (x, y, text) => pops.push({ x, y, text, t: 0.9, life: 0.9 });
    const shake = (a, t = 0.35) => { shakeA = Math.max(shakeT > 0 ? shakeA : 0, a); shakeT = Math.max(shakeT, t); };
    function updJuice(dt) {
      for (let k = parts.length - 1; k >= 0; k--) {
        const p = parts[k]; p.t -= dt;
        if (p.t <= 0) { parts.splice(k, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        const d = Math.exp(-3 * dt); p.vx *= d; p.vy *= d;
      }
      for (let k = rings.length - 1; k >= 0; k--) { rings[k].t -= dt; if (rings[k].t <= 0) rings.splice(k, 1); }
      for (let k = pops.length - 1; k >= 0; k--) { pops[k].t -= dt; pops[k].y -= dt * 0.05; if (pops[k].t <= 0) pops.splice(k, 1); }
      shakeT = Math.max(0, shakeT - dt);
    }

    // ---------- joysticks ----------
    const joys = P.map(() => null);
    const lastTap = P.map(() => -9);
    const owner = new Map();
    ctx.pointer(cv, {
      down(id, x, y) {
        const i = ctx.seatAt(x, y);
        owner.set(id, i);
        joys[i] = { id, ox: x, oy: y, x, y };
        const now = performance.now() / 1000;
        if (now - lastTap[i] < 0.33) { tryDash(i); lastTap[i] = -9; } else lastTap[i] = now;
      },
      move(id, x, y) {
        const i = owner.get(id);
        if (i == null || !joys[i] || joys[i].id !== id) return;
        joys[i].x = x; joys[i].y = y;
      },
      up(id) {
        const i = owner.get(id);
        owner.delete(id);
        if (i != null && joys[i] && joys[i].id === id) joys[i] = null;
      },
    });
    function stick(i) {
      const j = joys[i];
      if (!j) return { x: 0, y: 0 };
      let dx = (j.x - j.ox) / S / JOY, dy = (j.y - j.oy) / S / JOY;
      const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      if (m < 0.08) return { x: 0, y: 0 };
      return { x: dx, y: dy };
    }
    function tryDash(i) {
      const b = balls[i];
      if (ctx.paused || state !== 'fight' || !b.onArena || b.stun > 0) return;
      if (ctx.time - b.dashAt < DASH_CD) return;
      let d = null;
      const s = stick(i);
      if (s.x || s.y) d = s;
      else if (b.lastDir && ctx.time - b.lastDirAt < 1.5) d = b.lastDir;
      else if (Math.hypot(b.vx, b.vy) > 0.05) d = { x: b.vx, y: b.vy };
      else d = { x: -b.x, y: -b.y };
      const L = Math.hypot(d.x, d.y) || 1;
      b.vx += d.x / L * DASH_V; b.vy += d.y / L * DASH_V;
      b.dashAt = ctx.time;
      ring(b.x, b.y, b.r, b.r * 2.4, P[i].color, 0.35, 5);
      for (let k = 0; k < 14; k++) {
        const sp = U.rand(0.2, 0.6);
        parts.push({ x: b.x, y: b.y, vx: -d.x / L * sp + U.rand(-0.15, 0.15), vy: -d.y / L * sp + U.rand(-0.15, 0.15), life: 0.45, t: U.rand(0.25, 0.45), color: P[i].color, size: U.rand(3, 6) });
      }
      pop(b.x, b.y - b.r * 1.4, '🚀');
    }

    // ---------- rounds ----------
    function newRound() {
      round++;
      warned = false;
      mod = pickMod();
      setupMod();
      for (const p of P) effects[p.i] = [];
      placeBalls();
      state = 'ready';
      say(`Раунд ${round} · ${MODS[mod].icon} ${MODS[mod].name}`, { ms: 1700 });
      ctx.after(1800, () => { state = 'fight'; roundStart = ctx.time; nextItem = ctx.time + 2.5; nextHole = ctx.time + 3; nextSpinFlip = ctx.time + 7; });
    }
    function checkRound() {
      if (state !== 'fight') return;
      const on = balls.filter(b => b.onArena);
      if (on.length > 1) return;
      state = 'end';
      if (on.length === 1) {
        const w = on[0].i;
        on[0].safe = true;
        wins[w]++;
        const c = on[0];
        burst(c.x, c.y, P[w].color, 40, 0.6, 0.9, 5);
        ring(c.x, c.y, c.r, c.r * 4, P[w].color, 0.7, 8);
        if (wins[w] >= WIN_ROUNDS) {
          state = 'over';
          say(`🏆 ${P[w].name} — чемпион!`, { color: P[w].color, fg: '#111', ms: 1500 });
          ctx.after(1500, () => ctx.end({ winner: w, scores: wins.slice(), msg: `Раунды: ${wins.join(' : ')}` }));
          return;
        }
        say(`🥋 Раунд за: ${P[w].name}`, { color: P[w].color, fg: '#111', ms: 1300 });
      } else {
        say('Ничья в раунде', { ms: 1300 });
      }
      ctx.after(1700, newRound);
    }

    // ---------- items ----------
    function spawnItem() {
      const pool = Object.keys(PU).map(k => [k, PU[k].w]);
      const tot = pool.reduce((s, e) => s + e[1], 0);
      let r = Math.random() * tot, k = pool[0][0];
      for (const e of pool) { r -= e[1]; if (r <= 0) { k = e[0]; break; } }
      for (let tries = 0; tries < 20; tries++) {
        const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * A * 0.7;
        const x = Math.cos(a) * d, y = Math.sin(a) * d;
        if (balls.some(b => b.onArena && Math.hypot(b.x - x, b.y - y) < b.r + IR * 2)) continue;
        if (items.some(it => Math.hypot(it.x - x, it.y - y) < IR * 4)) continue;
        items.push({ x, y, k, born: ctx.time, life: 10 });
        ring(x, y, IR * 2.5, IR, '#ffffff', 0.4, 3);
        return;
      }
    }
    function collect(it, b) {
      const i = b.i, col = P[i].color, def = PU[it.k];
      burst(it.x, it.y, col, 26, 0.6, 0.7, 4);
      ring(it.x, it.y, IR, IR * 4, col, 0.55, 6);
      switch (it.k) {
        case 'heavy': addFx(i, 'heavy', 8); break;
        case 'bumper': addFx(i, 'bumper', 7); break;
        case 'turbo': addFx(i, 'turbo', 6); break;
        case 'shock': {
          ring(b.x, b.y, b.r, 0.7, '#ffe95c', 0.6, 10);
          ring(b.x, b.y, b.r, 0.5, '#ffffff', 0.45, 5);
          shake(0.018, 0.35);
          for (const o of balls) {
            if (o === b || !o.onArena) continue;
            const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 1;
            const k = U.clamp(1.6 * (1 - d / 0.8), 0.35, 1.6) / massOf(o);
            o.vx += dx / d * k; o.vy += dy / d * k;
            o.hit = 1;
          }
          break;
        }
        case 'banana': {
          for (const o of balls) {
            if (o === b || !o.onArena) continue;
            for (let n = 0; n < 2; n++) {
              const sp = Math.hypot(o.vx, o.vy);
              const ahead = sp > 0.05 ? { x: o.vx / sp, y: o.vy / sp } : { x: -o.x, y: -o.y };
              const L = Math.hypot(ahead.x, ahead.y) || 1;
              let x = o.x + ahead.x / L * (o.r * 2.2 + n * 0.08) + U.rand(-0.05, 0.05);
              let y = o.y + ahead.y / L * (o.r * 2.2 + n * 0.08) + U.rand(-0.05, 0.05);
              const dd = Math.hypot(x, y);
              if (dd > A * 0.9) { x *= A * 0.9 / dd; y *= A * 0.9 / dd; }
              peels.push({ x, y, owner: i, born: ctx.time, rot: U.rand(0, 6.28) });
            }
          }
          break;
        }
      }
      say(`${def.icon} ${def.name}`, { color: col, fg: '#111', ms: 1200 });
    }

    // ---------- physics ----------
    function collide(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d >= min) return;
      let nx, ny;
      if (d < 1e-9) { nx = 1; ny = 0; } else { nx = dx / d; ny = dy / d; }
      const ma = massOf(a), mb = massOf(b);
      const ov = min - d;
      a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb);
      b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const j = -(1 + E) * rv / (1 / ma + 1 / mb);
        a.vx -= j * nx / ma; a.vy -= j * ny / ma;
        b.vx += j * nx / mb; b.vy += j * ny / mb;
        // bumper shields fling the other ball
        if (has(a.i, 'bumper')) { b.vx += nx * 0.75; b.vy += ny * 0.75; ring(b.x - nx * b.r, b.y - ny * b.r, 0.01, 0.12, '#9fe8ff', 0.35, 5); }
        if (has(b.i, 'bumper')) { a.vx -= nx * 0.75; a.vy -= ny * 0.75; ring(a.x + nx * a.r, a.y + ny * a.r, 0.01, 0.12, '#9fe8ff', 0.35, 5); }
        const k = Math.min(1, -rv * 2);
        a.hit = Math.max(a.hit, k); b.hit = Math.max(b.hit, k);
        const cx = a.x + nx * a.r, cy = a.y + ny * a.r;
        const n = Math.round(4 + 22 * k);
        for (let q = 0; q < n; q++) {
          const ang = Math.atan2(ny, nx) + Math.PI / 2 * (q % 2 ? 1 : -1) + U.rand(-0.6, 0.6), sp = U.rand(0.1, 0.7) * (0.4 + k);
          parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.45, t: U.rand(0.2, 0.45), color: q % 3 ? '#fff4c8' : P[q % 2 ? a.i : b.i].color, size: U.rand(2, 4.5) });
        }
        if (-rv > 0.55) shake(0.008 + 0.01 * k, 0.2);
      }
    }
    function step(dt) {
      for (const p of P) effects[p.i] = effects[p.i].filter(e => e.until > ctx.time);
      if (state === 'fight' && ctx.time - roundStart > SHRINK_AT) {
        if (!warned) { warned = true; say('⚠️ Арена сжимается!', { ms: 1200 }); }
        A = Math.max(baseR() * 1.3, A - SHRINK_V * dt);
      }
      const moving = state !== 'ready';
      for (const b of balls) {
        b.stun = Math.max(0, b.stun - dt);
        if (b.onArena && state === 'fight' && b.stun <= 0) {
          const s = stick(b.i);
          let acc = ACC * (has(b.i, 'turbo') ? 1.7 : 1) * (mod === 'fat' ? 0.9 : 1) / Math.sqrt(massOf(b));
          if (patches.some(pt => Math.hypot(b.x - pt.x, b.y - pt.y) < pt.r)) acc *= 0.45;
          b.ax = s.x * acc; b.ay = s.y * acc;
          if (s.x || s.y) { b.lastDir = { x: s.x, y: s.y }; b.lastDirAt = ctx.time; }
        } else { b.ax = b.ay = 0; }
        b.hit = Math.max(0, b.hit - dt * 3);
        b.r += (radiusOf(b) - b.r) * (1 - Math.exp(-dt * 8));
        b.spin *= Math.exp(-dt * 2);
      }
      if (!moving) return;
      // carousel: tangential drift
      let spinF = 0;
      if (mod === 'spin' && state === 'fight') {
        if (ctx.time > nextSpinFlip) { spinDir = -spinDir; nextSpinFlip = ctx.time + U.rand(6, 9); say('🌀 Карусель в другую сторону!', { ms: 900 }); }
        spinF = 0.45 * spinDir;
      }
      const maxV = Math.max(...balls.map(b => Math.hypot(b.vx, b.vy)));
      const n = U.clamp(Math.ceil(maxV * dt / (RB * 0.25)), 1, 30);
      const h = dt / n;
      for (let s = 0; s < n; s++) {
        for (const b of balls) {
          let drag = b.safe ? 5 : DRAG;
          if (b.onArena && patches.some(pt => Math.hypot(b.x - pt.x, b.y - pt.y) < pt.r)) drag = 0.15;
          if (b.stun > 0) drag *= 0.4;
          const dmp = Math.exp(-drag * h);
          let ax = b.ax, ay = b.ay;
          if (spinF && b.onArena) { const d = Math.hypot(b.x, b.y) || 1; ax += -b.y / d * spinF * (d / A0); ay += b.x / d * spinF * (d / A0); }
          b.vx = (b.vx + ax * h) * dmp;
          b.vy = (b.vy + ay * h) * dmp;
          b.x += b.vx * h; b.y += b.vy * h;
        }
        for (let a = 0; a < balls.length; a++) for (let c = a + 1; c < balls.length; c++) {
          if (balls[a].onArena && balls[c].onArena) collide(balls[a], balls[c]);
        }
        for (const b of balls) {
          if (!b.onArena) continue;
          // rim bumpers
          for (const pt of posts) {
            const px = Math.cos(pt.a) * A, py = Math.sin(pt.a) * A;
            const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = b.r + pt.r;
            if (d < min && d > 1e-6) {
              const nx = dx / d, ny = dy / d;
              b.x = px + nx * min; b.y = py + ny * min;
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0.6) { b.vx += (0.6 - vn) * nx * 1.4; b.vy += (0.6 - vn) * ny * 1.4; }
              if (pt.hit < 0.5) { ring(px, py, pt.r, pt.r * 3, '#ff6b6b', 0.3, 4); }
              pt.hit = 1;
            }
          }
          const d = Math.hypot(b.x, b.y);
          const inHole = holes.some(ho => ho.open && Math.hypot(b.x - ho.x, b.y - ho.y) < ho.r);
          if (b.safe && d > A - b.r * 0.2) {
            const lim = A - b.r * 0.2, k = lim / d; b.x *= k; b.y *= k;
            const vr = (b.vx * b.x + b.vy * b.y) / (lim || 1);
            if (vr > 0) { b.vx -= vr * b.x / lim; b.vy -= vr * b.y / lim; }
          } else if (!b.safe && (d > A || inHole)) {
            b.onArena = false;
            b.fall = 0.0001;
            burst(b.x, b.y, P[b.i].color, 30, 0.5, 0.8, 4);
            shake(0.014, 0.3);
            pop(b.x, b.y - b.r, '💥');
          }
        }
        // banana peels
        for (const b of balls) {
          if (!b.onArena) continue;
          for (let k = peels.length - 1; k >= 0; k--) {
            const pe = peels[k];
            if (pe.owner === b.i && ctx.time - pe.born < 1.5) continue;
            if (Math.hypot(b.x - pe.x, b.y - pe.y) < b.r + 0.02) {
              peels.splice(k, 1);
              b.stun = 0.9;
              const a = Math.random() * Math.PI * 2;
              b.vx = b.vx * 0.6 + Math.cos(a) * 0.45; b.vy = b.vy * 0.6 + Math.sin(a) * 0.45;
              b.spin = 14;
              pop(b.x, b.y - b.r * 1.3, '🍌');
              burst(pe.x, pe.y, '#ffe46b', 14, 0.35, 0.5, 3);
            }
          }
        }
      }
      for (const b of balls) if (!b.onArena) b.fall = Math.min(1, b.fall + dt * 1.6);
      for (const pt of posts) pt.hit = Math.max(0, pt.hit - dt * 4);
      // items
      if (state === 'fight') {
        for (const b of balls) {
          if (!b.onArena) continue;
          for (let k = items.length - 1; k >= 0; k--) {
            const it = items[k];
            if (Math.hypot(it.x - b.x, it.y - b.y) < IR + b.r) { items.splice(k, 1); collect(it, b); }
          }
        }
        for (let k = items.length - 1; k >= 0; k--) {
          const it = items[k];
          if (ctx.time - it.born > it.life || Math.hypot(it.x, it.y) > A - IR * 0.5) items.splice(k, 1);
        }
        if (ctx.time > nextItem) { if (items.length < 2) spawnItem(); nextItem = ctx.time + U.rand(3.5, 5.5); }
        // peels/patches outside the shrinking arena vanish
        peels = peels.filter(pe => Math.hypot(pe.x, pe.y) < A && ctx.time - pe.born < 14);
        // holes
        if (mod === 'holes') {
          if (ctx.time > nextHole) {
            for (let tries = 0; tries < 10; tries++) {
              const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * A * 0.75;
              const x = Math.cos(a) * d, y = Math.sin(a) * d;
              if (holes.some(ho => Math.hypot(ho.x - x, ho.y - y) < 0.2)) continue;
              holes.push({ x, y, r: 0.065, born: ctx.time, open: false });
              break;
            }
            nextHole = ctx.time + U.rand(3.5, 5);
          }
          for (const ho of holes) {
            const age = ctx.time - ho.born;
            if (!ho.open && age > 1.6) { ho.open = true; ring(ho.x, ho.y, ho.r, ho.r * 2, '#ff6b6b', 0.4, 4); }
          }
          holes = holes.filter(ho => ctx.time - ho.born < 8.5);
        }
      }
      checkRound();
    }

    // ---------- drawing ----------
    function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
    function emoji(ch, x, y, size) {
      g.font = `${Math.round(size)}px ${EMOJI}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, x, y + size * 0.05);
    }
    function drawArena(t) {
      g.fillStyle = '#0f1220';
      g.fillRect(-40, -40, W + 80, H + 80);
      const c = toS(0, 0), r = A * S;
      const gr = g.createRadialGradient(c.x, c.y, r * 0.2, c.x, c.y, r * 1.25);
      gr.addColorStop(0, 'rgba(60,70,130,.0)');
      gr.addColorStop(0.75, 'rgba(60,70,130,.12)');
      gr.addColorStop(1, 'rgba(60,70,130,0)');
      g.fillStyle = gr;
      g.fillRect(0, 0, W, H);
      circle(c.x, c.y, r);
      const mat = g.createRadialGradient(c.x, c.y - r * 0.3, r * 0.1, c.x, c.y, r);
      mat.addColorStop(0, '#2a3160');
      mat.addColorStop(1, '#1c2244');
      g.fillStyle = mat; g.fill();
      // carousel stripes
      if (mod === 'spin') {
        g.save();
        circle(c.x, c.y, r); g.clip();
        g.translate(c.x, c.y);
        g.rotate(ctx.time * 0.9 * spinDir);
        g.fillStyle = 'rgba(255,255,255,.04)';
        for (let k = 0; k < 8; k += 2) {
          g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, k * Math.PI / 4, (k + 1) * Math.PI / 4); g.closePath(); g.fill();
        }
        g.restore();
      }
      // ice patches
      for (const pt of patches) {
        const q = toS(pt.x, pt.y);
        const ig = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, pt.r * S);
        ig.addColorStop(0, 'rgba(200,240,255,.38)');
        ig.addColorStop(1, 'rgba(160,220,255,.08)');
        circle(q.x, q.y, pt.r * S); g.fillStyle = ig; g.fill();
        g.strokeStyle = 'rgba(220,245,255,.35)'; g.lineWidth = 2; g.stroke();
      }
      // holes
      for (const ho of holes) {
        const q = toS(ho.x, ho.y), age = ctx.time - ho.born;
        if (!ho.open) {
          const a = 0.35 + 0.35 * Math.sin(age * 18);
          circle(q.x, q.y, ho.r * S); g.strokeStyle = `rgba(255,107,107,${a})`; g.lineWidth = 4; g.setLineDash([8, 8]); g.stroke(); g.setLineDash([]);
        } else {
          const close = 8.5 - age < 0.6 ? (8.5 - age) / 0.6 : 1;
          circle(q.x, q.y, ho.r * S * close);
          const hg = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, ho.r * S);
          hg.addColorStop(0, '#000'); hg.addColorStop(0.8, '#05060c'); hg.addColorStop(1, '#3a2040');
          g.fillStyle = hg; g.fill();
        }
      }
      const shrinking = A < A0 - 1e-4;
      const pulse = shrinking ? 0.5 + 0.5 * Math.sin(t / 140) : 0;
      g.save();
      g.lineWidth = Math.max(4, S * 0.01);
      g.strokeStyle = shrinking ? `rgba(255,${Math.round(120 - 60 * pulse)},${Math.round(110 - 60 * pulse)},.95)` : '#e8ecff';
      g.shadowColor = shrinking ? '#ff5a5f' : '#9fb4ff'; g.shadowBlur = 18;
      circle(c.x, c.y, r); g.stroke();
      g.restore();
      g.strokeStyle = 'rgba(255,255,255,.12)';
      g.lineWidth = 3;
      circle(c.x, c.y, Math.min(r * 0.92, A0 * S * 0.22)); g.stroke();
      if (shrinking) {
        g.save(); g.setLineDash([8, 10]);
        g.strokeStyle = 'rgba(255,255,255,.08)';
        circle(c.x, c.y, A0 * S); g.stroke();
        g.restore();
      }
      // rim bumpers
      for (const pt of posts) {
        const q = toS(Math.cos(pt.a) * A, Math.sin(pt.a) * A);
        g.save();
        g.shadowColor = '#ff5a5f'; g.shadowBlur = 12 + 20 * pt.hit;
        circle(q.x, q.y, pt.r * S * (1 + 0.25 * pt.hit));
        g.fillStyle = pt.hit > 0 ? '#ffd0d0' : '#ff6b6b'; g.fill();
        g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
        g.restore();
      }
      // peels
      for (const pe of peels) {
        const q = toS(pe.x, pe.y);
        g.save(); g.translate(q.x, q.y); g.rotate(pe.rot);
        emoji('🍌', 0, 0, 0.045 * S);
        g.restore();
      }
    }
    function drawItems() {
      for (const it of items) {
        const age = ctx.time - it.born, left = it.life - age;
        if (left < 2.5 && Math.sin(age * 20) < 0) continue;
        const q = toS(it.x, it.y);
        const r = IR * S * (0.6 + 0.4 * Math.min(1, age * 4)) * (1 + 0.06 * Math.sin(age * 5));
        g.save();
        g.translate(q.x, q.y);
        g.shadowColor = '#fff'; g.shadowBlur = 18;
        circle(0, 0, r); g.fillStyle = 'rgba(30,36,70,.92)'; g.fill();
        g.lineWidth = 3; g.strokeStyle = `hsla(${(age * 120) % 360},90%,70%,.95)`; g.stroke();
        g.shadowBlur = 0;
        g.rotate(Math.sin(age * 1.5) * 0.35);
        emoji(PU[it.k].icon, 0, 0, r * 1.15);
        g.restore();
      }
    }
    function drawBall(b) {
      const p = P[b.i], c = toS(b.x, b.y);
      const sc = b.onArena ? 1 : Math.max(0, 1 - b.fall);
      if (sc <= 0.01) return;
      const r = b.r * S * sc;
      g.save();
      g.globalAlpha = b.onArena ? 1 : Math.max(0, 1 - b.fall * 0.8);
      if (b.onArena) { circle(c.x + r * 0.12, c.y + r * 0.18, r); g.fillStyle = 'rgba(0,0,0,.35)'; g.fill(); }
      g.shadowColor = p.color; g.shadowBlur = 16 + 30 * b.hit;
      circle(c.x, c.y, r);
      const gr = g.createRadialGradient(c.x - r * 0.35, c.y - r * 0.35, r * 0.1, c.x, c.y, r);
      gr.addColorStop(0, '#ffffff');
      gr.addColorStop(0.3, p.color);
      gr.addColorStop(1, U.alpha(p.color, 0.7));
      g.fillStyle = gr; g.fill();
      g.shadowBlur = 0;
      g.lineWidth = has(b.i, 'heavy') ? 6 : 3; g.strokeStyle = has(b.i, 'heavy') ? 'rgba(20,20,30,.6)' : 'rgba(0,0,0,.3)'; g.stroke();
      if (has(b.i, 'bumper')) {
        circle(c.x, c.y, r + 6 + 2 * Math.sin(ctx.time * 10));
        g.strokeStyle = 'rgba(159,232,255,.9)'; g.lineWidth = 4; g.stroke();
      }
      if (has(b.i, 'turbo') && b.onArena && Math.random() < 0.6) {
