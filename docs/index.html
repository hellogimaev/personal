      else { g.strokeStyle = U.alpha(color, 0.3); g.lineWidth = 2; g.stroke(); }
    }
    function drawPaddle(p) {
      const pd = paddles[p.i], c = paddlePos(p.i);
      g.save();
      g.translate(c.x, c.y);
      g.rotate(p.rot * Math.PI / 180);
      g.shadowColor = p.color; g.shadowBlur = 16 + 24 * Math.max(0, pd.hit);
      rrect(-PL / 2, -PT / 2, PL, PT, PT / 2);
      g.fillStyle = p.color; g.fill();
      g.shadowBlur = 0;
      rrect(-PL / 2 + 6, -PT / 2 + 3, PL - 12, PT * 0.35, PT * 0.2);
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fill();
      g.restore();
    }
    function drawBalls() {
      for (const b of balls) {
        const age = ctx.time - b.born;
        for (let k = 0; k < b.trail.length; k++) {
          const tr = b.trail[k], a = (k + 1) / b.trail.length;
          circle(tr.x, tr.y, R * (0.3 + 0.6 * a));
          g.fillStyle = `rgba(255,240,200,${0.15 * a})`;
          g.fill();
        }
        g.save();
        g.globalAlpha = Math.min(1, 0.3 + age * 3);
        g.shadowColor = '#fff2c8'; g.shadowBlur = 20;
        circle(b.x, b.y, R);
        g.fillStyle = '#fffaf0'; g.fill();
        g.restore();
      }
      if (serving && !over) {
        // pulsing spawn marker
        const a = 0.25 + 0.2 * Math.sin(performance.now() / 120);
        circle(W / 2, H / 2, R * 1.3);
        g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3; g.stroke();
      }
    }

    ctx.loop((dt) => {
      if (dt > 0 && !over) step(dt);
      drawField();
      drawHud();
      for (const p of P) if (!out[p.i]) drawPaddle(p);
      drawBalls();
    });

    ctx._pong = { balls, lives, out, paddles };
  },
});

</script>
<script>/* games/reaction.js */
registerGame({
  id: 'reaction',
  title: 'Реакция',
  emoji: '⚡',
  desc: 'Жми первым, когда круг станет зелёным',
  rules: 'Круг в центре загорится зелёным в случайный момент.\nКто первым нажмёт свою кнопку, получает очко.\nНажал раньше времени: минус очко.\nИгра идёт до 5 очков.',
  start(ctx) {
    const TARGET = 5;
    const score = ctx.players.map(() => 0);
    let state = 'wait'; // wait | go | done
    let blocked = new Set();
    let goTimer = null;

    ctx.root.classList.add('g-reaction');
    ctx.root.append(U.h('style', null, `
      .g-reaction .rb{position:absolute;inset:10px;border-radius:24px;background:${'var(--pc)'};opacity:.9;
        display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;font-weight:900}
      .g-reaction .rb .s{font-size:44px;line-height:1}
      .g-reaction .rb .l{font-size:16px;opacity:.75;margin-top:4px}
      .g-reaction .rb.blocked{opacity:.25}
      .g-reaction .rb.won{outline:6px solid #fff}
      .g-reaction .sig{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);
        background:#3a405f;transition:background .05s;box-shadow:0 0 0 10px rgba(255,255,255,.04)}
      .g-reaction .sig.go{background:#3ddc97;box-shadow:0 0 60px 10px rgba(61,220,151,.5)}
    `));

    const sig = U.h('div', { class: 'sig' });
    ctx.root.append(sig);
    const sizeSig = () => {
      const s = Math.min(ctx.W, ctx.H) * 0.32;
      sig.style.width = sig.style.height = s + 'px';
    };
    sizeSig();
    ctx.onResize(sizeSig);

    const buttons = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 0.24 });
      const b = U.h('div', { class: 'rb' }, U.h('div', { class: 's' }, '0'), U.h('div', { class: 'l' }, 'жми, когда зелёный'));
      z.el.append(b);
      ctx.tap(b, () => press(p.i));
      return b;
    });

    function render() {
      buttons.forEach((b, i) => {
        b.querySelector('.s').textContent = score[i];
        b.classList.toggle('blocked', blocked.has(i));
      });
    }

    function newRound() {
      state = 'wait';
      blocked = new Set();
      buttons.forEach(b => b.classList.remove('won'));
      sig.classList.remove('go');
      render();
      goTimer = ctx.after(U.rand(1400, 4200), () => { state = 'go'; sig.classList.add('go'); });
    }

    function press(i) {
      if (state === 'done' || blocked.has(i)) return;
      if (state === 'wait') {
        score[i] = Math.max(0, score[i] - 1);
        blocked.add(i);
        ctx.toast(`${ctx.players[i].name}: фальстарт!`, { color: ctx.players[i].color, fg: '#111' });
        render();
        if (blocked.size === ctx.n) { ctx.cancel(goTimer); ctx.after(900, newRound); state = 'done'; }
        return;
      }
      state = 'done';
      score[i]++;
      buttons[i].classList.add('won');
      sig.classList.remove('go');
      render();
      if (score[i] >= TARGET) {
        ctx.after(700, () => ctx.end({ winner: i, scores: score }));
      } else {
        ctx.toast(`+1 ${ctx.players[i].name}`, { color: ctx.players[i].color, fg: '#111' });
        ctx.after(1200, newRound);
      }
    }

    newRound();
  },
});

</script>
<script>/* games/snakes.js */
registerGame({
  id: 'snakes',
  title: 'Змейки',
  emoji: '🐍',
  desc: 'Не врежься в след и выживи последним',
  rules: 'Каждая змейка ползёт сама и оставляет за собой след.\nДержи ◀ или ▶ в своей зоне, чтобы поворачивать.\nВрезался в любой след или в край поля: выбыл.\nВ следах бывают дырки, в них можно проскочить.\nПоследний выживший выигрывает раунд. До 3 побед.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const WIN = 3;
    const DEPTH = 0.2;
    const BG = '#0f1220';
    const ARW_L = '◀︎', ARW_R = '▶︎';

    ctx.root.classList.add('g-snakes');
    ctx.root.append(U.h('style', null, `
      .g-snakes .zone-inner{display:flex;align-items:stretch;gap:1.6vmin;padding:1.5vmin}
      .g-snakes .cb{flex:1 1 0;max-width:27vmin;border-radius:3vmin;border:.5vmin solid var(--pc);color:var(--pc);
        background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;
        font-size:8vmin;font-weight:900;touch-action:none;transition:transform .07s,background .07s,box-shadow .07s}
      .g-snakes .cb.on{background:var(--pc);color:#0f1220;transform:scale(.95);box-shadow:0 0 3.5vmin var(--pc)}
      .g-snakes .info{flex:1.1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        color:var(--pc);font-weight:900;text-align:center;pointer-events:none}
      .g-snakes .pips{font-size:5vmin;letter-spacing:.5vmin;line-height:1;white-space:nowrap}
      .g-snakes .st{font-size:2.6vmin;opacity:.85;margin-top:1vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
      .g-snakes .st.dead{opacity:.5}
    `));

    const C = ctx.canvas();

    /* ---------- controls ---------- */
    const allBtns = [];
    function btn(label) {
      const b = U.h('div', { class: 'cb' }, label);
      const ids = new Set();
      b.ids = ids;
      ctx.pointer(b, {
        down: (id) => { ids.add(id); b.classList.add('on'); },
        up: (id) => { ids.delete(id); if (!ids.size) b.classList.remove('on'); },
      });
      allBtns.push(b);
      return b;
    }
    // safety net for lost pointer capture
    const releaseAll = (e) => allBtns.forEach(b => { if (b.ids.delete(e.pointerId) && !b.ids.size) b.classList.remove('on'); });
    window.addEventListener('pointerup', releaseAll);
    window.addEventListener('pointercancel', releaseAll);
    ctx.onCleanup(() => {
      window.removeEventListener('pointerup', releaseAll);
      window.removeEventListener('pointercancel', releaseAll);
    });

    const ui = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      z.el.style.background = `linear-gradient(0deg, ${U.alpha(p.color, .2)}, ${U.alpha(p.color, .05)})`;
      z.el.style.borderTop = `2px solid ${U.alpha(p.color, .6)}`;
      const L = btn(ARW_L), R = btn(ARW_R);
      const pips = U.h('div', { class: 'pips' });
      const st = U.h('div', { class: 'st' }, 'в игре');
      z.el.append(L, U.h('div', { class: 'info' }, pips, st), R);
      return { z, L, R, pips, st };
    });

    /* ---------- field geometry ---------- */
    function fieldRect() {
      const d = Math.round(DEPTH * Math.min(ctx.W, ctx.H));
      const sides = ctx.players.map(p => p.side);
      const l = sides.includes('left') ? d : 0, r = sides.includes('right') ? d : 0;
      const t = sides.includes('top') ? d : 0, b = sides.includes('bottom') ? d : 0;
      const m = 8;
      return { x: l + m, y: t + m, w: Math.max(120, ctx.W - l - r - 2 * m), h: Math.max(120, ctx.H - t - b - 2 * m) };
    }
    let FW = 600, FH = 400, S = 500; // logical field
    let view = { s: 1, ox: 0, oy: 0 };
    function updView() {
      const fr = fieldRect();
      const s = Math.min(fr.w / FW, fr.h / FH);
      view = { s, ox: fr.x + (fr.w - FW * s) / 2, oy: fr.y + (fr.h - FH * s) / 2 };
    }
    ctx.onResize(updView);

    /* ---------- state ---------- */
    const wins = ctx.players.map(() => 0);
    let round = 0;
    let state = 'play'; // ready | play | over
    let roundT = 0;
    let TW = 7, SPEED = 110, TURN = 3.1, LAG = 12;
    const GC = 2; // collision grid cell (logical units)
    let gw = 0, gh = 0, grid = null;
    let off = null, og = null, OK = 2;
    let snakes = [];
    let parts = [];

    function stamp(x, y, r) {
      const x0 = Math.max(0, Math.floor((x - r) / GC)), x1 = Math.min(gw - 1, Math.floor((x + r) / GC));
      const y0 = Math.max(0, Math.floor((y - r) / GC)), y1 = Math.min(gh - 1, Math.floor((y + r) / GC));
      const r2 = r * r;
      for (let cy = y0; cy <= y1; cy++) {
        const dy = (cy + .5) * GC - y;
        for (let cx = x0; cx <= x1; cx++) {
          const dx = (cx + .5) * GC - x;
          if (dx * dx + dy * dy <= r2) grid[cy * gw + cx] = 1;
        }
      }
    }
    function occ(x, y) {
      if (x < 0 || y < 0 || x >= FW || y >= FH) return true;
      return grid[Math.floor(y / GC) * gw + Math.floor(x / GC)] === 1;
    }

    function newRound() {
      round++;
      const fr = fieldRect();
      FW = Math.round(fr.w); FH = Math.round(fr.h);
      S = Math.sqrt(FW * FH);
      updView();
      TW = Math.max(5, S * 0.0095);
      SPEED = S * 0.15;
      TURN = 3.1;
      LAG = TW * 1.7;
      gw = Math.ceil(FW / GC); gh = Math.ceil(FH / GC);
      grid = new Uint8Array(gw * gh);
      OK = Math.min(2, Math.sqrt(4e6 / (FW * FH)));
      if (!off) { off = document.createElement('canvas'); og = off.getContext('2d'); }
      off.width = Math.round(FW * OK); off.height = Math.round(FH * OK);
      og.setTransform(OK, 0, 0, OK, 0, 0);
      og.clearRect(0, 0, FW, FH);
      og.lineCap = 'round'; og.lineJoin = 'round';
      parts = [];
      roundT = 0;

      const edge = Math.max(TW * 6, Math.min(FW, FH) * 0.1);
      snakes = ctx.players.map(p => {
        const v = ctx.inward(p.i);
        let x, y;
        const jitter = U.rand(-0.18, 0.18);
        if (p.side === 'bottom') { x = FW * (0.5 + jitter); y = FH - edge; }
        else if (p.side === 'top') { x = FW * (0.5 + jitter); y = edge; }
        else if (p.side === 'left') { x = edge; y = FH * (0.5 + jitter); }
        else { x = FW - edge; y = FH * (0.5 + jitter); }
        const a = Math.atan2(v.y, v.x) + U.rand(-0.35, 0.35);
        return {
          i: p.i, color: p.color, x, y, a, alive: true, pen: false,
          q: [], dist: 0, untilGap: S * U.rand(0.25, 0.55), gapLeft: 0, deadAt: 0,
        };
      });
      ui.forEach(u => { u.st.textContent = 'в игре'; u.st.classList.remove('dead'); });
      renderUI();
      if (round > 1) {
        state = 'ready';
        ctx.toast(`Раунд ${round}`, { ms: 1100, size: 30 });
        ctx.after(1300, () => {
          state = 'play';
          ctx.toast('Вперёд!', { ms: 700, color: '#3ddc97', fg: '#0f1220' });
        });
      } else {
        state = 'play';
      }
    }

    function renderUI() {
      ui.forEach((u, i) => {
        let s = '';
        for (let k = 0; k < WIN; k++) s += k < wins[i] ? '●' : '○';
        u.pips.textContent = s;
      });
    }

    function kill(s) {
      if (!s.alive) return;
      s.alive = false;
      s.deadAt = ctx.time;
      for (let k = 0; k < 28; k++) {
        const a = Math.random() * Math.PI * 2, v = U.rand(20, 120) * S / 700;
        parts.push({ x: s.x, y: s.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: U.rand(.5, 1.1), t: 0, c: s.color });
      }
      const u = ui[s.i];
      u.st.textContent = 'выбыл';
      u.st.classList.add('dead');
    }

    function stepSnake(s, dt) {
      const L = ui[s.i].L.ids.size > 0, R = ui[s.i].R.ids.size > 0;
      const turn = (R ? 1 : 0) - (L ? 1 : 0);
      if (state === 'ready') { s.a += turn * TURN * 0.6 * dt; return; }
      const speed = SPEED * (1 + Math.min(0.5, roundT * 0.012));
      const dist = speed * dt;
      const steps = Math.max(1, Math.ceil(dist / 1));
      const ds = dist / steps;
      og.strokeStyle = s.color;
      og.lineWidth = TW;
      og.shadowColor = s.color;
      og.shadowBlur = 7 * OK;
      og.beginPath();
      let drew = false;
      if (s.pen) og.moveTo(s.x, s.y);
      for (let k = 0; k < steps; k++) {
        s.a += turn * TURN * dt / steps;
        const ca = Math.cos(s.a), sa = Math.sin(s.a);
        const px = s.x, py = s.y;
        s.x += ca * ds; s.y += sa * ds;
        s.dist += ds;
        // gaps
        let gap = false;
        if (s.gapLeft > 0) { s.gapLeft -= ds; gap = true; if (s.gapLeft <= 0) s.untilGap = S * U.rand(0.22, 0.6); }
        else { s.untilGap -= ds; if (s.untilGap <= 0) s.gapLeft = TW * 4.2; }
        if (gap) { s.pen = false; }
        else {
          if (!s.pen) { og.moveTo(px, py); s.pen = true; }
          og.lineTo(s.x, s.y); drew = true;
        }
        s.q.push({ x: s.x, y: s.y, d: s.dist, gap });
        while (s.q.length && s.q[0].d < s.dist - LAG) {
          const e = s.q.shift();
          if (!e.gap) stamp(e.x, e.y, TW / 2);
        }
        // collision: front points
        const r = TW / 2;
        let hit = false;
        if (s.x < r || s.y < r || s.x > FW - r || s.y > FH - r) hit = true;
        if (!hit) {
          for (const off2 of [0, -0.75, 0.75]) {
            const fx = s.x + Math.cos(s.a + off2) * (r + 0.7), fy = s.y + Math.sin(s.a + off2) * (r + 0.7);
            if (occ(fx, fy)) { hit = true; break; }
          }
        }
        if (!hit) {
          // fresh (not yet stamped) trails of other snakes
          const fx = s.x + ca * (r + 0.7), fy = s.y + sa * (r + 0.7);
          for (const o of snakes) {
            if (o === s) continue;
            for (const e of o.q) {
              if (e.gap) continue;
              const dx = e.x - fx, dy = e.y - fy;
              if (dx * dx + dy * dy < r * r) { hit = true; break; }
            }
            if (hit) break;
          }
        }
        if (hit) { if (drew) og.stroke(); kill(s); return; }
      }
      if (drew) og.stroke();
    }

    function endRound() {
      state = 'over';
      const alive = snakes.filter(s => s.alive);
      if (alive.length === 1) {
        const w = alive[0].i;
        wins[w]++;
        renderUI();
        ui[w].st.textContent = 'раунд твой!';
        const p = ctx.players[w];
        if (wins[w] >= WIN) {
          ctx.toast(`${p.name} побеждает!`, { color: p.color, fg: '#111', ms: 1500 });
          ctx.after(1500, () => ctx.end({ winner: w, scores: wins.slice() }));
          return;
        }
        ctx.toast(`Раунд: ${p.name}`, { color: p.color, fg: '#111', ms: 1500 });
      } else {
        ctx.toast('Ничья в раунде', { ms: 1500 });
      }
      ctx.after(1900, newRound);
    }

    ctx.loop((dt) => {
      if (dt > 0) {
        if (state !== 'over') roundT += dt;
        if (state === 'play' || state === 'ready') {
          for (const s of snakes) if (s.alive) stepSnake(s, dt);
          if (state === 'play' && snakes.filter(s => s.alive).length <= 1) endRound();
        }
        for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
        parts = parts.filter(p => p.t < p.life);
      }
      draw();
    });

    function draw() {
      const g = C.g, dpr = C.dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = BG;
      g.fillRect(0, 0, ctx.W, ctx.H);
      const { s, ox, oy } = view;
      g.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
      // field
      g.fillStyle = '#141832';
      g.fillRect(0, 0, FW, FH);
      g.save();
      g.strokeStyle = '#3a4580';
      g.lineWidth = 3;
      g.shadowColor = '#6c7cff';
      g.shadowBlur = 10;
      g.strokeRect(-1.5, -1.5, FW + 3, FH + 3);
      g.restore();
      // faint grid
      g.strokeStyle = 'rgba(255,255,255,.035)';
      g.lineWidth = 1;
      g.beginPath();
      const step = S / 12;
      for (let x = step; x < FW; x += step) { g.moveTo(x, 0); g.lineTo(x, FH); }
      for (let y = step; y < FH; y += step) { g.moveTo(0, y); g.lineTo(FW, y); }
      g.stroke();
      if (off) g.drawImage(off, 0, 0, FW, FH);
      // heads
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
      for (const sn of snakes) {
        if (sn.alive) {
          g.save();
          g.shadowColor = sn.color;
          g.shadowBlur = 16;
          g.fillStyle = sn.color;
          g.beginPath(); g.arc(sn.x, sn.y, TW * 0.95, 0, Math.PI * 2); g.fill();
          g.shadowBlur = 0;
          g.fillStyle = '#fff';
          g.beginPath(); g.arc(sn.x, sn.y, TW * 0.42, 0, Math.PI * 2); g.fill();
          g.restore();
          if (state === 'ready' || ctx.paused || roundT < 1.2) {
            // heading arrow + ring
            const L = TW * 6, ca = Math.cos(sn.a), sa = Math.sin(sn.a);
            g.save();
            g.strokeStyle = U.alpha(sn.color, 0.5 + 0.4 * pulse);
            g.fillStyle = g.strokeStyle;
            g.lineWidth = TW * 0.5;
            g.beginPath(); g.arc(sn.x, sn.y, TW * (2.2 + pulse), 0, Math.PI * 2); g.stroke();
            const tx = sn.x + ca * L, ty = sn.y + sa * L;
            g.beginPath(); g.moveTo(sn.x + ca * TW * 3.5, sn.y + sa * TW * 3.5); g.lineTo(tx, ty); g.stroke();
            g.beginPath();
            g.moveTo(tx + ca * TW * 1.6, ty + sa * TW * 1.6);
            g.lineTo(tx - sa * TW * 1.1, ty + ca * TW * 1.1);
            g.lineTo(tx + sa * TW * 1.1, ty - ca * TW * 1.1);
            g.closePath(); g.fill();
            g.restore();
          }
        } else {
          // dead marker
          g.save();
          g.globalAlpha = 0.7;
          g.strokeStyle = '#fff';
          g.lineWidth = TW * 0.45;
          const r = TW * 1.1;
          g.beginPath();
          g.moveTo(sn.x - r, sn.y - r); g.lineTo(sn.x + r, sn.y + r);
          g.moveTo(sn.x + r, sn.y - r); g.lineTo(sn.x - r, sn.y + r);
          g.stroke();
          g.restore();
        }
      }
      // particles
      for (const p of parts) {
        const k = 1 - p.t / p.life;
        g.globalAlpha = k;
        g.fillStyle = p.c;
        g.beginPath(); g.arc(p.x, p.y, TW * 0.5 * (0.4 + k), 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
    }

    newRound();
  },
});

</script>
<script>/* games/spot.js */
registerGame({
  id: 'spot',
  title: 'Найди пару',
  emoji: '👀',
  desc: 'Найди картинку, которая есть и у тебя, и в центре',
  rules: 'В центре лежит общая карта, у каждого игрока своя карта.\nНа твоей карте ровно одна картинка есть и на центральной.\nНайди её и нажми у себя первым: +1 очко, и все получают новые карты.\nОшибся: заморозка на 1,5 секунды.\nИгра идёт до 7 очков.',
  start(ctx) {
    const TARGET = 7;
    const PER_CARD = 8;
    const FREEZE_MS = 1500;
    const POOL = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍍', '🥕', '🌽', '🍄', '🌵', '🌲', '🌻', '🌹', '🍁',
      '🔥', '💧', '⭐', '🌙', '⚡', '❄️', '🌈', '🎈', '🎁', '🎸', '🥁', '🎲', '🧩', '⚽', '🏀', '🎯',
      '🚗', '🚀', '✈️', '⛵', '🚲', '⏰', '🔑', '💡', '📷', '✏️', '✂️', '🧲', '🐶', '🐱', '🐰', '🦊',
      '🐼', '🐸', '🐵', '🐔', '🐧', '🐢', '🐙', '🦋', '🐝', '🐞', '🦀', '🐳', '🦄', '👻', '🤖', '👑',
      '🎩', '👓', '💎', '❤️', '🍕', '🧀', '🍦'];

    const score = ctx.players.map(() => 0);
    const frozen = ctx.players.map(() => false);
    let state = 'play'; // play | show | done
    let center = [];          // symbols on the center card
    let hands = [];           // hands[i] = symbols on player i's card
    let common = [];          // common[i] = the matching symbol for player i

    ctx.root.classList.add('g-spot');
    ctx.root.append(U.h('style', null, `
      .g-spot .ctr{position:absolute;border-radius:50%;background:#f4f1e8;
        box-shadow:0 0 0 8px rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.5);overflow:hidden}
      .g-spot .sym{position:absolute;left:0;top:0;line-height:1;text-align:center;
        transition:transform .25s, filter .25s;will-change:transform}
      .g-spot .ctr .sym.hit{filter:drop-shadow(0 0 6px var(--hc)) drop-shadow(0 0 14px var(--hc))}
      .g-spot .zi{position:absolute;inset:8px;display:flex;gap:10px;align-items:stretch}
      .g-spot .sc{flex:0 0 84px;border-radius:20px;background:var(--pc);color:#111;display:flex;flex-direction:column;
        align-items:center;justify-content:center;font-weight:900}
      .g-spot .sc .n{font-size:48px;line-height:1}
      .g-spot .sc .t{font-size:15px;opacity:.7;margin-top:2px}
      .g-spot .card{flex:1;position:relative;border-radius:22px;background:#f4f1e8;
        box-shadow:inset 0 0 0 5px var(--pc);overflow:hidden;transition:opacity .2s}
      .g-spot .cell{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:16px}
      .g-spot .cell.ok{background:color-mix(in srgb, var(--pc) 45%, transparent)}
      .g-spot .cell.bad{background:rgba(255,40,60,.35);animation:spotShake .3s}
      .g-spot .cell .sym{position:static;pointer-events:none}
      .g-spot .frz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
        background:rgba(120,190,255,.55);color:#0b2a4a;font-weight:900;font-size:26px;border-radius:22px;
        backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
      .g-spot .frz b{font-size:60px;line-height:1}
      .g-spot .card.frozen .frz{display:flex}
      .g-spot .card.won{box-shadow:inset 0 0 0 5px var(--pc),0 0 0 4px #fff}
      .g-spot.cd .card .cell,.g-spot.cd .ctr .sym{visibility:hidden}
      @keyframes spotShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    `));

    /* ---------- center card ---------- */
    const ctr = U.h('div', { class: 'ctr' });
    ctx.root.append(ctr);
    let ctrSyms = [];

    /* ---------- player zones ---------- */
    // The exit button sits in the screen's top-left corner: keep that end of a zone free.
    const exitEnd = (i) => {
      const side = ctx.players[i].side;
      if (side === 'top') return 'right';
      if (side === 'left') return 'left';
      return null;
    };
    const depth = ctx.n === 2 ? 0.27 : 0.25;
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth });
      const inner = U.h('div', { class: 'zi' });
      const scN = U.h('div', { class: 'n' }, '0');
      const sc = U.h('div', { class: 'sc' }, scN, U.h('div', { class: 't' }, 'из ' + TARGET));
      const card = U.h('div', { class: 'card' }, U.h('div', { class: 'frz' }, U.h('b', null, '❄️'), 'Заморозка'));
      const end = exitEnd(p.i);
      if (end === 'right') { inner.style.right = '56px'; inner.append(card, sc); } else {
        if (end === 'left') inner.style.left = '56px';
        inner.append(sc, card);
      }
      z.el.append(inner);
      return { z, inner, card, scN, cells: [] };
    });

    /* ---------- dealing ---------- */
    function deal() {
      const pool = U.shuffle(POOL);
      center = pool.slice(0, PER_CARD);
      const rest = pool.slice(PER_CARD);
      const commons = U.shuffle(center).slice(0, ctx.n);
      hands = []; common = [];
      ctx.players.forEach(p => {
        const others = U.shuffle(rest).slice(0, PER_CARD - 1);
        common[p.i] = commons[p.i];
        hands[p.i] = U.shuffle([commons[p.i], ...others]);
      });
      buildCenter();
      seats.forEach((s, i) => buildHand(i));
      layout();
    }

    function buildCenter() {
      ctr.replaceChildren();
      // slot 0 in the middle, the rest on a ring; random sizes and rotations
      const ringOff = Math.random() * Math.PI * 2;
      ctrSyms = center.map((sym, k) => {
        const el = U.h('div', { class: 'sym' }, sym);
        const a = ringOff + (k - 1) * Math.PI * 2 / (PER_CARD - 1);
        el._pos = k === 0 ? { x: 0, y: 0, s: U.rand(0.36, 0.46) } : { x: Math.cos(a) * 0.62, y: Math.sin(a) * 0.62, s: U.rand(0.25, 0.36) };
        el._pos.jx = U.rand(-0.04, 0.04); el._pos.jy = U.rand(-0.04, 0.04);
        el._rot = Math.random() * 360;
        el._sym = sym;
        ctr.append(el);
        return el;
      });
    }

    function buildHand(i) {
      const s = seats[i];
      s.card.querySelectorAll('.cell').forEach(c => c.remove());
      s.card.classList.remove('won');
      s.cells = hands[i].map(sym => {
        const symEl = U.h('div', { class: 'sym' }, sym);
        const cell = U.h('div', { class: 'cell' }, symEl);
        cell._sym = sym;
        cell._symEl = symEl;
        cell._s = U.rand(0.6, 0.86);
        cell._rot = U.rand(-35, 35);
        cell._jx = U.rand(-1, 1); cell._jy = U.rand(-1, 1);
        ctx.tap(cell, () => press(i, cell));
        s.card.append(cell);
        return cell;
      });
    }

    /* ---------- layout ---------- */
    function centerRegion() {
      const W = ctx.W, H = ctx.H;
      const d = seats[0].z.h;
      if (ctx.n === 2) return { x: 0, y: d, w: W, h: H - 2 * d };
      return { x: d, y: 0, w: W - 2 * d, h: H - d };
    }

    function layout() {
      const r = centerRegion();
      const D = Math.max(120, Math.min(r.w, r.h) * 0.94);
      const R = D / 2;
      Object.assign(ctr.style, { width: D + 'px', height: D + 'px', left: (r.x + r.w / 2 - R) + 'px', top: (r.y + r.h / 2 - R) + 'px' });
      ctrSyms.forEach(el => {
        const p = el._pos;
        const fs = p.s * R;
        el.style.fontSize = fs + 'px';
        el.style.width = el.style.height = fs * 1.15 + 'px';
        el.style.lineHeight = fs * 1.15 + 'px';
        const x = R + (p.x + p.jx) * R - fs * 0.575, y = R + (p.y + p.jy) * R - fs * 0.575;
        el._base = `translate(${x}px,${y}px) rotate(${el._rot}deg)`;
        el.style.transform = el._base + (el.classList.contains('hit') ? ' scale(1.35)' : '');
      });
      seats.forEach(layoutHand);
    }

    function layoutHand(s) {
      const cw = s.card.clientWidth, ch = s.card.clientHeight;
      if (!cw || !ch) return;
      const pad = 8;
      const iw = cw - 2 * pad, ih = ch - 2 * pad;
      let best = null;
      for (const [c, r] of [[8, 1], [4, 2], [3, 3], [2, 4], [1, 8]]) {
        const m = Math.min(iw / c, ih / r);
        if (!best || m > best.m) best = { c, r, m };
      }
      const cwid = iw / best.c, chei = ih / best.r;
      const used = best.c * best.r;
      // with a 3x3 grid one slot stays empty: pick which at random once per deal
      if (s._skip == null || s._skipFor !== hands[s.z.i]) { s._skip = U.randInt(0, used - 1); s._skipFor = hands[s.z.i]; }
      let k = 0;
      s.cells.forEach((cell, idx) => {
        if (used > PER_CARD && k === s._skip) k++;
        const cx = k % best.c, cy = Math.floor(k / best.c);
        k++;
        Object.assign(cell.style, { left: pad + cx * cwid + 'px', top: pad + cy * chei + 'px', width: cwid + 'px', height: chei + 'px' });
        const m = Math.min(cwid, chei);
        const fs = m * cell._s;
        const slackX = Math.max(0, (cwid - fs * 1.2) / 2), slackY = Math.max(0, (chei - fs * 1.2) / 2);
        cell._symEl.style.fontSize = fs + 'px';
        cell._symEl.style.transform = `translate(${cell._jx * slackX}px,${cell._jy * slackY}px) rotate(${cell._rot}deg)`;
      });
    }
    ctx.onResize(() => layout());

    /* ---------- play ---------- */
    function render() {
      seats.forEach((s, i) => {
        s.scN.textContent = score[i];
        s.card.classList.toggle('frozen', frozen[i]);
      });
    }

    function press(i, cell) {
      if (state !== 'play' || frozen[i]) return;
      if (cell._sym === common[i]) {
        state = 'show';
        score[i]++;
        cell.classList.add('ok');
        seats[i].card.classList.add('won');
        const c = ctrSyms.find(e => e._sym === cell._sym);
        if (c) {
          c.style.setProperty('--hc', ctx.players[i].color);
          c.classList.add('hit');
          c.style.transform = c._base + ' scale(1.35)';
        }
        render();
        if (score[i] >= TARGET) {
          state = 'done';
          ctx.toast(`${ctx.players[i].name} нашёл ${cell._sym}`, { color: ctx.players[i].color, fg: '#111', ms: 1100 });
          ctx.after(1200, () => ctx.end({ winner: i, scores: score.slice() }));
        } else {
          ctx.toast(`+1 ${ctx.players[i].name}`, { color: ctx.players[i].color, fg: '#111', ms: 900 });
          ctx.after(1000, nextRound);
        }
      } else {
        frozen[i] = true;
        cell.classList.add('bad');
        render();
        ctx.after(FREEZE_MS, () => {
          frozen[i] = false;
          cell.classList.remove('bad');
          render();
        });
      }
    }

    function nextRound() {
      if (state === 'done') return;
      state = 'play';
      deal();
      render();
    }

    ctx.loop(() => { ctx.root.classList.toggle('cd', ctx.paused && ctx.time === 0); });
    deal();
    render();
    // the zones' inner sizes are known only after the first layout pass
    requestAnimationFrame(() => layout());
  },
});

</script>
<script>/* games/stroop.js */
registerGame({
  id: 'stroop',
  title: 'Цвет или слово',
  emoji: '🎨',
  desc: 'Совпадает ли слово с цветом, которым оно написано?',
  rules: 'В центре появляется название цвета, написанное каким-то цветом.\nЕсли слово и цвет букв совпадают, жми «СОВПАДАЕТ», иначе «НЕТ».\nПервый правильный ответ: +1 очко.\nОшибка: −1 очко, и до следующего слова ты пропускаешь.\nИгра идёт до 8 очков.',
  start(ctx) {
    const TARGET = 8;
    const INKS = [
      { word: 'КРАСНЫЙ', color: '#ff2d2d' },
      { word: 'СИНИЙ', color: '#2f6dff' },
      { word: 'ЗЕЛЁНЫЙ', color: '#1fd15a' },
      { word: 'ЖЁЛТЫЙ', color: '#ffe414' },
      { word: 'ФИОЛЕТОВЫЙ', color: '#b44dff' },
      { word: 'БЕЛЫЙ', color: '#ffffff' },
    ];
    const score = ctx.players.map(() => 0);
    let locked = new Set();
    let state = 'gap'; // gap | ask | done
    let card = null;   // {word, ink, match}
    let lastWord = -1;

    ctx.root.classList.add('g-stroop');
    ctx.root.append(U.h('style', null, `
      .g-stroop .wd{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
        border-radius:22px;background:#2a2f44;box-shadow:0 6px 24px rgba(0,0,0,.35);
        font-weight:900;letter-spacing:1px;white-space:nowrap;transition:background .2s}
      .g-stroop .wd.empty{background:#1b1f31}
      .g-stroop .wd .q{color:#596086}
      .g-stroop .zi{position:absolute;inset:8px;display:flex;gap:10px;align-items:stretch}
      .g-stroop .sc{flex:0 0 86px;border-radius:20px;border:4px solid var(--pc);color:var(--pc);display:flex;flex-direction:column;
        align-items:center;justify-content:center;font-weight:900;background:#151a2c}
      .g-stroop .sc .n{font-size:44px;line-height:1}
      .g-stroop .sc .t{font-size:14px;opacity:.75;margin-top:2px}
      .g-stroop .bt{flex:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-weight:900;color:#141726;background:#e9ecf6;transition:transform .06s, opacity .15s;min-width:0}
      .g-stroop .bt .i{font-size:34px;line-height:1}
      .g-stroop .bt .l{font-size:22px;margin-top:4px}
      .g-stroop .bt.no{background:#9aa1c4}
      .g-stroop .bt:active{transform:scale(.96)}
      .g-stroop .bt.good{outline:6px solid #fff;background:#3ddc97}
      .g-stroop .bt.wrong{background:#ff4d6d;color:#fff}
      .g-stroop .zi.locked .bt{opacity:.25}
      .g-stroop .zi.locked .bt.wrong{opacity:.6}
    `));

    /* ---------- word copies: one per player, in the center area, facing them ---------- */
    const words = ctx.players.map(() => {
      const el = U.h('div', { class: 'wd empty' });
      ctx.root.append(el);
      return el;
    });

    /* ---------- zones ---------- */
    const exitEnd = (i) => {
      const side = ctx.players[i].side;
      if (side === 'top') return 'right';
      if (side === 'left') return 'left';
      return null;
    };
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 0.2 });
      const inner = U.h('div', { class: 'zi' });
      const scN = U.h('div', { class: 'n' }, '0');
      const sc = U.h('div', { class: 'sc' }, scN, U.h('div', { class: 't' }, 'из ' + TARGET));
      const yes = U.h('div', { class: 'bt yes' }, U.h('div', { class: 'i' }, '✓'), U.h('div', { class: 'l' }, 'СОВПАДАЕТ'));
      const no = U.h('div', { class: 'bt no' }, U.h('div', { class: 'i' }, '✗'), U.h('div', { class: 'l' }, 'НЕТ'));
      ctx.tap(yes, () => answer(p.i, true, yes));
      ctx.tap(no, () => answer(p.i, false, no));
      const end = exitEnd(p.i);
      if (end === 'right') { inner.style.right = '56px'; inner.append(yes, no, sc); } else {
        if (end === 'left') inner.style.left = '56px';
        inner.append(sc, yes, no);
      }
      z.el.append(inner);
      return { z, inner, scN, yes, no };
    });

    /* ---------- layout ---------- */
    const meas = document.createElement('canvas').getContext('2d');
    function textW(txt, fs) {
      meas.font = `900 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
      return meas.measureText(txt).width + txt.length * 1; // + letter-spacing
    }
    const LONGEST = INKS.reduce((a, b) => a.word.length > b.word.length ? a : b).word;

    // Slot for each player's copy: rect in screen px (axis-aligned) + its length along the player's edge.
    function slots() {
      const W = ctx.W, H = ctx.H, d = seats[0].z.h, g = 12;
      if (ctx.n === 2) {
        const h = (H - 2 * d - 3 * g) / 2;
        return [
          { x: g, y: H - d - g - h, w: W - 2 * g, h },
          { x: g, y: d + g, w: W - 2 * g, h },
        ];
      }
      const x0 = d + g, w = W - 2 * d - 2 * g, y0 = g, h = H - d - 2 * g;
      const bh = Math.min(h * 0.32, Math.max(110, w * 0.3));
      const sideH = h - bh - g;
      const sw = (w - g) / 2;
      return [
        { x: x0, y: y0 + sideH + g, w, h: bh },
        { x: x0, y: y0, w: sw, h: sideH },
        { x: x0 + sw + g, y: y0, w: sw, h: sideH },
      ];
    }

    function layout() {
      const sl = slots();
      ctx.players.forEach(p => {
        const r = sl[p.i];
        const vertical = p.side === 'left' || p.side === 'right';
        const len = vertical ? r.h : r.w, dep = vertical ? r.w : r.h;
        const bw = Math.min(len, 760), bh = Math.min(dep, 230);
        const el = words[p.i];
        // font that fits the longest word into the box
        let fs = Math.min(bh * 0.55, 110);
        const tw = textW(LONGEST, fs);
        if (tw > bw * 0.9) fs *= bw * 0.9 / tw;
        el.style.width = bw + 'px';
        el.style.height = bh + 'px';
        el.style.fontSize = fs + 'px';
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        el.style.transform = `translate(${cx - bw / 2}px,${cy - bh / 2}px) rotate(${p.rot}deg)`;
      });
      // zone labels: shrink text if the buttons are narrow
      seats.forEach(s => {
        const bw = s.yes.clientWidth;
        const fs = U.clamp(bw / 7.5, 13, 24);
        s.yes.querySelector('.l').style.fontSize = fs + 'px';
        s.no.querySelector('.l').style.fontSize = fs + 'px';
      });
    }
    layout();
    ctx.onResize(layout);

    /* ---------- game ---------- */
    function render() {
      seats.forEach((s, i) => {
        s.scN.textContent = score[i];
        s.inner.classList.toggle('locked', locked.has(i));
      });
    }

    function showWord() {
      words.forEach(el => {
        el.classList.toggle('empty', !card);
        if (!card) { el.replaceChildren(U.h('span', { class: 'q' }, '• • •')); return; }
        el.replaceChildren(U.h('span', { style: { color: INKS[card.ink].color } }, INKS[card.word].word));
      });
    }

    function newCard() {
      if (state === 'done') return;
      locked = new Set();
      seats.forEach(s => { s.yes.classList.remove('good', 'wrong'); s.no.classList.remove('good', 'wrong'); });
      let w;
      do { w = U.randInt(0, INKS.length - 1); } while (w === lastWord);
      lastWord = w;
      const match = Math.random() < 0.4;
      let ink = w;
      if (!match) { do { ink = U.randInt(0, INKS.length - 1); } while (ink === w); }
      card = { word: w, ink, match };
      state = 'ask';
      showWord();
      render();
    }

    function gap(ms) {
      state = 'gap';
      ctx.after(ms, () => {
        card = null;
        showWord();
        ctx.after(450, newCard);
      });
    }

    function answer(i, saysMatch, btn) {
      if (state !== 'ask' || locked.has(i)) return;
      if (saysMatch === card.match) {
        score[i]++;
        btn.classList.add('good');
        state = 'gap';
        render();
        if (score[i] >= TARGET) {
          state = 'done';
          ctx.toast(`${ctx.players[i].name}: +1`, { color: ctx.players[i].color, fg: '#111', ms: 1000 });
          ctx.after(1000, () => ctx.end({ winner: i, scores: score.slice() }));
        } else {
          ctx.toast(`+1 ${ctx.players[i].name}`, { color: ctx.players[i].color, fg: '#111', ms: 800 });
          gap(800);
        }
      } else {
        score[i] = Math.max(0, score[i] - 1);
        locked.add(i);
        btn.classList.add('wrong');
        render();
        if (locked.size === ctx.n) {
          ctx.toast(card.match ? 'Совпадало!' : 'Не совпадало!', { ms: 1000 });
          gap(1100);
        }
      }
    }

    card = null;
    showWord();
    render();
    // first word appears right after the countdown
    ctx.after(300, newCard);
  },
});

</script>
<script>/* games/tug.js */
registerGame({
  id: 'tug',
  title: 'Перетягивание',
  emoji: '💪',
  desc: 'Жми быстрее всех и перетяни узел к себе',
  rules: 'Посередине завязан узел каната.\nКаждое нажатие на свою большую кнопку тянет узел к вашему краю.\nКто первым затащит узел за свою линию (она вашего цвета), тот победил.\nУзел понемногу сползает обратно к центру, так что тянуть надо без остановки.\nЧем дольше схватка, тем сильнее рывки.',
  start(ctx) {
    const N = ctx.n;
    const DEPTH = 0.22;
    // Pull direction of each player in normalized play-space (u right, v down).
    // 3p: the three pulls sum to zero, so equal tapping keeps the knot still.
    const PULL = N === 2 ? [[0, 1], [0, -1]] : [[0, 1], [-1, -0.5], [1, -0.5]];
    const IMP = 0.27;       // velocity impulse per tap
    const DAMP = 6;         // velocity damping per second
    const DECAY = 0.08;     // drift back to center per second (fraction of offset)
    const KNOT_R = 26;

    const pos = { u: 0, v: 0 }, vel = { u: 0, v: 0 };
    const taps = ctx.players.map(() => 0);
    const tension = ctx.players.map(() => 0);
    const parts = [];
    let shake = 0, flash = 0;
    let state = 'play'; // play | done
    let winner = -1;
    let powerNoted = false;

    ctx.root.classList.add('g-tug');
    ctx.root.append(U.h('style', null, `
      .g-tug .tb{position:absolute;inset:10px;border-radius:24px;background:var(--pc);color:#111;
        display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;
        box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);overflow:hidden}
      .g-tug .tb .lbl{font-size:30px;letter-spacing:2px;line-height:1}
      .g-tug .tb .cnt{font-size:17px;opacity:.7;margin-top:6px}
      .g-tug .tb .bar{position:absolute;left:18px;right:18px;top:10px;height:8px;border-radius:4px;background:rgba(0,0,0,.18)}
      .g-tug .tb .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:rgba(0,0,0,.55);width:0}
      .g-tug .tb.hit{animation:tugHit .14s ease-out}
      .g-tug .tb.won{outline:6px solid #fff}
      .g-tug .tb.lost{opacity:.35}
      @keyframes tugHit{0%{transform:scale(.94);filter:brightness(1.35)}100%{transform:scale(1);filter:none}}
    `));

    const { g } = ctx.canvas();

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      const bar = U.h('i');
      const b = U.h('div', { class: 'tb' },
        U.h('div', { class: 'bar' }, bar),
        U.h('div', { class: 'lbl' }, 'ТЯНИ!'),
        U.h('div', { class: 'cnt' }, 'рывков: 0'));
      z.el.append(b);
      ctx.tap(b, () => pull(p.i));
      return { z, b, bar, cnt: b.querySelector('.cnt') };
    });

    // ----- geometry -----
    function geo() {
      const W = ctx.W, H = ctx.H, d = zones[0].z.h, M = 18;
      if (N === 2) return { W, H, d, cx: W / 2, cy: H / 2, hx: 0, hy: (H - 2 * d) / 2 - M };
      return { W, H, d, cx: W / 2, cy: (H - d) / 2, hx: (W - 2 * d) / 2 - M, hy: (H - d) / 2 - M };
    }
    const toXY = (G, u, v) => ({ x: G.cx + u * G.hx, y: G.cy + v * G.hy });
    function anchor(G, i) {
      const side = ctx.players[i].side;
      const p = toXY(G, PULL[i][0], PULL[i][1]);
      if (side === 'bottom') return { x: p.x, y: G.H - G.d };
      if (side === 'top') return { x: p.x, y: G.d };
      if (side === 'left') return { x: G.d, y: p.y };
      return { x: G.W - G.d, y: p.y };
    }
    // How far the knot is toward player i's goal line (1 = reached).
    function progress(i) {
      const side = ctx.players[i].side;
      return side === 'bottom' ? pos.v : side === 'top' ? -pos.v : side === 'left' ? -pos.u : pos.u;
    }
    const power = () => 1 + Math.max(0, ctx.time - 15) * 0.06;

    function pull(i) {
      if (state !== 'play') return;
      taps[i]++;
      const k = IMP * power();
      vel.u += PULL[i][0] * k;
      vel.v += PULL[i][1] * k;
      tension[i] = Math.min(1, tension[i] + 0.4);
      shake = Math.min(1, shake + 0.35);
      parts.push({ i, s: 0 });
      const zb = zones[i];
      zb.b.classList.remove('hit'); void zb.b.offsetWidth; zb.b.classList.add('hit');
      zb.cnt.textContent = 'рывков: ' + taps[i];
    }

    function win(i) {
      state = 'done';
      winner = i;
      flash = 1;
      zones.forEach((zb, k) => zb.b.classList.add(k === i ? 'won' : 'lost'));
      ctx.toast(`${ctx.players[i].name} перетянул!`, { color: ctx.players[i].color, fg: '#111', ms: 1400 });
      ctx.after(1300, () => ctx.end({ winner: i, msg: 'Рывков: ' + taps.map((t, k) => `${NAMES[k]} ${t}`).join(' · ') }));
    }

    ctx.loop((dt, t) => {
      const G = geo();
      if (dt > 0 && state === 'play') {
        pos.u += vel.u * dt; pos.v += vel.v * dt;
        const damp = Math.exp(-DAMP * dt);
        vel.u *= damp; vel.v *= damp;
        const dec = Math.exp(-DECAY * dt);
        pos.u *= dec; pos.v *= dec;
        if (N === 2) pos.u = 0;
        // win check before clamping
        let best = -1, bp = 1;
        for (let i = 0; i < N; i++) { const pr = progress(i); if (pr >= bp) { bp = pr; best = i; } }
        if (best >= 0) win(best);
        // keep the knot on screen (3p top edge has no player)
        const vmin = N === 3 ? -1 + KNOT_R / Math.max(1, G.hy) : -1;
        if (pos.v < vmin) { pos.v = vmin; if (vel.v < 0) vel.v = 0; }
        pos.u = U.clamp(pos.u, -1, 1); pos.v = U.clamp(pos.v, -1, 1);
        if (!powerNoted && ctx.time > 15) {
          powerNoted = true;
          ctx.toast('Рывки сильнее!', { ms: 1100 });
        }
      }
      for (let i = 0; i < N; i++) tension[i] = Math.max(0, tension[i] - dt * 1.6);
      shake = Math.max(0, shake - dt * 4);
      flash = Math.max(0, flash - dt * 1.2);
      for (const p of parts) p.s += dt / 0.35;
      while (parts.length && parts[0].s >= 1) parts.shift();
      zones.forEach((zb, i) => { zb.bar.style.width = Math.round(U.clamp((progress(i) + 1) / 2, 0, 1) * 100) + '%'; });
      draw(G, t / 1000);
    });

    function draw(G, T) {
      const { W, H } = G;
      g.clearRect(0, 0, W, H);
      // goal lines
      for (let i = 0; i < N; i++) {
        const p = ctx.players[i], c = p.color;
        const near = U.clamp((progress(i) + 1) / 2, 0, 1);
        g.save();
        g.lineWidth = 6;
        g.strokeStyle = c;
        g.shadowColor = c;
        g.shadowBlur = 8 + 30 * near * near;
        g.setLineDash([18, 10]);
        g.beginPath();
        if (p.side === 'bottom' || p.side === 'top') {
          const y = G.cy + (p.side === 'bottom' ? 1 : -1) * G.hy;
          const x0 = N === 3 ? G.d : 0, x1 = N === 3 ? W - G.d : W;
          g.moveTo(x0, y); g.lineTo(x1, y);
          // goal band
          g.fillStyle = U.alpha(c, 0.06 + 0.18 * near * near);
          g.fillRect(x0, p.side === 'bottom' ? y : G.d, x1 - x0, p.side === 'bottom' ? H - G.d - y : y - G.d);
        } else {
          const x = G.cx + (p.side === 'right' ? 1 : -1) * G.hx;
          g.moveTo(x, 0); g.lineTo(x, H - G.d);
          g.fillStyle = U.alpha(c, 0.06 + 0.18 * near * near);
          g.fillRect(p.side === 'left' ? G.d : x, 0, p.side === 'left' ? x - G.d : W - G.d - x, H - G.d);
        }
        g.stroke();
        g.restore();
      }
      // center mark
      g.save();
      g.strokeStyle = 'rgba(255,255,255,.18)';
      g.lineWidth = 3;
      g.beginPath(); g.arc(G.cx, G.cy, KNOT_R + 14, 0, Math.PI * 2); g.stroke();
      g.restore();

      const sx = (Math.random() - 0.5) * 6 * shake, sy = (Math.random() - 0.5) * 6 * shake;
      const k = toXY(G, pos.u, pos.v);
      k.x += sx; k.y += sy;
      // ropes
      for (let i = 0; i < N; i++) {
        const a = anchor(G, i), c = ctx.players[i].color;
        const dx = a.x - k.x, dy = a.y - k.y, L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L, ny = dx / L;
        const sag = (1 - tension[i]) * Math.min(26, L * 0.08) * Math.sin(T * 2.2 + i * 2);
        const mx = (a.x + k.x) / 2 + nx * sag, my = (a.y + k.y) / 2 + ny * sag;
        g.save();
        g.lineCap = 'round';
        g.strokeStyle = '#6b5236';
        g.lineWidth = 14;
        g.beginPath(); g.moveTo(k.x, k.y); g.quadraticCurveTo(mx, my, a.x, a.y); g.stroke();
        g.strokeStyle = c;
        g.lineWidth = 9;
        g.beginPath(); g.moveTo(k.x, k.y); g.quadraticCurveTo(mx, my, a.x, a.y); g.stroke();
        g.strokeStyle = 'rgba(0,0,0,.28)';
        g.lineWidth = 9;
        g.setLineDash([6, 10]);
        g.lineDashOffset = -T * 40 * (1 + tension[i] * 3);
        g.beginPath(); g.moveTo(k.x, k.y); g.quadraticCurveTo(mx, my, a.x, a.y); g.stroke();
        g.restore();
      }
      // tap pulses travelling along the rope toward the puller
      for (const p of parts) {
        const a = anchor(G, p.i);
        const x = U.lerp(k.x, a.x, p.s), y = U.lerp(k.y, a.y, p.s);
        g.save();
        g.globalAlpha = 1 - p.s;
        g.fillStyle = '#fff';
        g.shadowColor = ctx.players[p.i].color;
        g.shadowBlur = 16;
        g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      // knot
      let lead = -1, lp = 0.08;
      for (let i = 0; i < N; i++) if (progress(i) > lp) { lp = progress(i); lead = i; }
      const kc = winner >= 0 ? ctx.players[winner].color : lead >= 0 ? ctx.players[lead].color : '#ffffff';
      g.save();
      g.shadowColor = kc;
      g.shadowBlur = 20 + 30 * flash;
      g.fillStyle = '#f5e6c8';
      g.beginPath(); g.arc(k.x, k.y, KNOT_R * (1 + 0.12 * shake), 0, Math.PI * 2); g.fill();
      g.shadowBlur = 0;
      g.lineWidth = 6;
      g.strokeStyle = kc;
      g.stroke();
      g.strokeStyle = 'rgba(80,60,30,.6)';
      g.lineWidth = 3;
      g.beginPath(); g.arc(k.x, k.y, KNOT_R * 0.5, 0.3, Math.PI * 1.6); g.stroke();
      g.restore();
    }
  },
});

</script>
<script>/* main.js */
'use strict';
// Menu order. Games not listed here go to the end.
const ORDER = ['reaction', 'tug', 'math', 'potato', 'spot', 'stopwatch', 'stroop',
  'airhockey', 'pong', 'snakes', 'paint', 'catch', 'sumo', 'tanks', 'rhythm',
  'memory', 'connect', 'draw'];
App.games.sort((a, b) => {
  const ia = ORDER.indexOf(a.id), ib = ORDER.indexOf(b.id);
  return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
});
App.el = document.getElementById('app');
load();
showMenu();

// iOS: block pinch-zoom and double-tap zoom gestures.
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => {
  if (!e.target.closest || !e.target.closest('.menu')) e.preventDefault();
}, { passive: false });

// Offline support when served from a website (ignored elsewhere).
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
