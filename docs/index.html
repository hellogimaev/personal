          g.shadowColor = '#ffd166'; g.shadowBlur = 12;
          g.beginPath(); g.arc(b.x, b.y, R0 * 1.45, 0, TAU); g.stroke();
          g.restore();
        }
        if (b.fx.magnet > 0) {
          g.save();
          g.strokeStyle = U.alpha('#ff5a7a', 0.35);
          g.lineWidth = CS * 0.2;
          const ph2 = (now * 1.5) % 1;
          for (let k = 0; k < 2; k++) {
            const rr = R0 * (4 - 2.8 * ((ph2 + k * 0.5) % 1));
            g.beginPath(); g.arc(b.x, b.y, rr, 0, TAU); g.stroke();
          }
          g.restore();
        }
        if (b.fx.rev > 0) {
          g.save();
          g.strokeStyle = U.alpha('#ff4d6d', 0.7);
          g.lineWidth = CS * 0.25;
          g.setLineDash([CS * 0.6, CS * 0.5]);
          g.beginPath(); g.arc(b.x, b.y, R0 * 1.7, -now * 3, -now * 3 + TAU); g.stroke();
          g.restore();
        }
        if (ctx.paused || elapsed < 1.2) {
          const ca = Math.cos(b.a), sa = Math.sin(b.a), L = R0 * 2.6;
          const pulse = 0.5 + 0.5 * Math.sin(now * 6);
          g.save();
          g.strokeStyle = g.fillStyle = U.alpha(b.color, 0.55 + 0.4 * pulse);
          g.lineWidth = CS * 0.35;
          const tx = b.x + ca * L, ty = b.y + sa * L;
          g.beginPath(); g.moveTo(b.x + ca * R0 * 1.4, b.y + sa * R0 * 1.4); g.lineTo(tx, ty); g.stroke();
          g.beginPath();
          g.moveTo(tx + ca * CS, ty + sa * CS);
          g.lineTo(tx - sa * CS * 0.7, ty + ca * CS * 0.7);
          g.lineTo(tx + sa * CS * 0.7, ty - ca * CS * 0.7);
          g.closePath(); g.fill();
          g.restore();
        }
      }
      for (const r of rings) {
        const k = r.t / r.life;
        g.strokeStyle = U.alpha(r.c, 1 - k);
        g.lineWidth = CS * 0.5 * (1 - k) + 1;
        g.beginPath(); g.arc(r.x, r.y, r.r * (0.2 + k), 0, TAU); g.stroke();
      }
    }
  },
});

</script>
<script>/* games/pong.js */
registerGame({
  id: 'pong',
  title: 'Пинг-понг',
  emoji: '🏓',
  desc: 'Отбивай мяч и лови бонусы',
  rules: 'У каждого ракетка вдоль своего края. Води пальцем в своей части экрана — ракетка едет за пальцем.\n' +
    'Пропустил мяч — минус жизнь (их 3). Выбывший игрок превращается в стенку. Последний оставшийся побеждает.\n' +
    'Чем дальше от центра ракетки попал мяч, тем круче он отлетает. Мяч ускоряется с каждым ударом.\n' +
    'Бонусы на поле достаются тому, кто последним отбил мяч:\n' +
    '📏 длинная ракетка · 🤏 мини-ракетки соперникам · ⚽ мультимяч (+2 мяча)\n' +
    '🔥 огненный мяч · 🌀 кручёный мяч · 👻 мяч-призрак\n' +
    '🧱 щит за спиной (спасёт один раз) · ❄️ заморозка соперников · 🔄 соперникам управление наоборот\n' +
    '❤️ +1 жизнь (появляется, когда кто-то отстаёт). Отстающим бонусы действуют дольше.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const { cv, g } = ctx.canvas();
    const P = ctx.players;
    const N = ctx.n;
    const LIVES = 3;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    // toast with copies spread apart so they don't overlap in 3p
    // only the latest message stays on screen, so quick events don't pile up
    let lastToast = null;
    const say = (text, o = {}) => {
      if (lastToast) lastToast.forEach(e => e.remove());
      lastToast = ctx.toast(text, Object.assign({ offset: ctx.n === 3 ? Math.min(ctx.W, ctx.H) * 0.2 : 70 }, o));
      return lastToast;
    };
    const lives = P.map(() => LIVES);
    const out = P.map(() => false);
    const effects = P.map(() => []); // {k, until, dur}
    let over = false;

    let W, H, S, R, PL, PT, EDGE, FACE, BASEV, MAXV, CORNER, IR;
    const sideOf = (s) => P.find(p => p.side === s);
    const isPaddle = (s) => { const p = sideOf(s); return !!p && !out[p.i]; };
    const hasSeat = (s) => !!sideOf(s);
    const active = () => P.filter(p => !out[p.i]).map(p => p.i);
    function edgeMid(i) {
      const s = P[i].side;
      return s === 'bottom' ? { x: W / 2, y: H } : s === 'top' ? { x: W / 2, y: 0 } : s === 'left' ? { x: 0, y: H / 2 } : { x: W, y: H / 2 };
    }
    let corners = [];
    function layout() {
      W = ctx.W; H = ctx.H; S = Math.min(W, H);
      R = S * 0.022;
      PL = S * 0.25;
      PT = S * 0.026;
      EDGE = S * 0.06;
      FACE = EDGE + PT / 2;
      BASEV = S * 0.6;
      MAXV = S * 1.75;
      CORNER = FACE;
      IR = S * 0.04;
      corners = [];
      const add = (a, b, x, y) => { if (hasSeat(a) && hasSeat(b)) corners.push({ x, y, w: CORNER, h: CORNER }); };
      add('bottom', 'left', 0, H - CORNER);
      add('bottom', 'right', W - CORNER, H - CORNER);
      add('top', 'left', 0, 0);
      add('top', 'right', W - CORNER, 0);
    }
    layout();

    // ---------- effects ----------
    const PU = {
      long: { icon: '📏', name: 'Длинная ракетка', w: 3, good: true },
      mini: { icon: '🤏', name: 'Мини-ракетки соперникам', w: 2 },
      multi: { icon: '⚽', name: 'Мультимяч!', w: 2 },
      fire: { icon: '🔥', name: 'Огненный мяч!', w: 2 },
      curve: { icon: '🌀', name: 'Кручёный мяч!', w: 2 },
      shield: { icon: '🧱', name: 'Щит за спиной', w: 2, good: true },
      freeze: { icon: '❄️', name: 'Заморозка соперников', w: 2 },
      rev: { icon: '🔄', name: 'Соперникам наоборот', w: 1.5 },
      ghost: { icon: '👻', name: 'Мяч-призрак', w: 1.5 },
      life: { icon: '❤️', name: '+1 жизнь', w: 0 },
    };
    function addEffect(i, k, dur) {
      const e = effects[i].find(e => e.k === k);
      if (e) { e.until = ctx.time + dur; e.dur = dur; } else effects[i].push({ k, until: ctx.time + dur, dur });
    }
    const has = (i, k) => effects[i].some(e => e.k === k);
    const delEffect = (i, k) => { effects[i] = effects[i].filter(e => e.k !== k); };
    const trailing = (i) => { const act = active(); return act.length > 1 && lives[i] < Math.max(...act.map(j => lives[j])); };

    // ---------- paddles ----------
    const paddles = P.map(() => ({ u: 0, tu: 0, hit: 0, len: 0, fx: 0 }));
    const targetLen = (i) => PL * (has(i, 'long') ? 1.6 : 1) * (has(i, 'mini') ? 0.55 : 1);
    P.forEach(p => { paddles[p.i].len = PL; });
    function range(i) {
      const s = P[i].side, horiz = s === 'bottom' || s === 'top';
      const len = horiz ? W : H, mid = len / 2, pl = paddles[i].len;
      let smin = 0, smax = len;
      for (const c of corners) {
        const onEdge = s === 'bottom' ? c.y + c.h >= H - 1 : s === 'top' ? c.y <= 1 : s === 'left' ? c.x <= 1 : c.x + c.w >= W - 1;
        if (!onEdge) continue;
        if (horiz) { if (c.x <= 1) smin = Math.max(smin, c.x + c.w); else smax = Math.min(smax, c.x); }
        else { if (c.y <= 1) smin = Math.max(smin, c.y + c.h); else smax = Math.min(smax, c.y); }
      }
      const a = ctx.toScreen(i, 1, 0), sg = Math.round(horiz ? a.x : a.y);
      let u1 = sg * (smin + pl / 2 - mid), u2 = sg * (smax - pl / 2 - mid);
      if (u1 > u2) [u1, u2] = [u2, u1];
      if (u1 > u2) u1 = u2 = 0;
      return { lo: u1, hi: u2 };
    }
    function paddlePos(i) {
      const m = edgeMid(i), v = ctx.inward(i), a = ctx.toScreen(i, 1, 0), u = paddles[i].u;
      return { x: m.x + v.x * EDGE + a.x * u, y: m.y + v.y * EDGE + a.y * u };
    }

    // ---------- juice ----------
    const parts = [], rings = [];
    let shakeT = 0, shakeA = 0, flashA = 0, flashC = '#fff';
    function burst(x, y, color, n, speed, life = 0.6, size = 4) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, s = speed * (0.25 + Math.random() * 0.75);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, t: life * (0.6 + Math.random() * 0.4), color, size: size * (0.6 + Math.random() * 0.8) });
      }
      if (parts.length > 700) parts.splice(0, parts.length - 700);
    }
    function sparks(x, y, nx, ny, color, n, speed) {
      for (let k = 0; k < n; k++) {
        const a = Math.atan2(ny, nx) + U.rand(-1.1, 1.1), s = speed * U.rand(0.3, 1);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, t: U.rand(0.2, 0.45), color, size: U.rand(2, 4.5) });
      }
    }
    const ring = (x, y, r0, r1, color, life = 0.5, w = 5) => rings.push({ x, y, r0, r1, color, life, t: life, w });
    const shake = (a, t = 0.35) => { shakeA = Math.max(shakeT > 0 ? shakeA : 0, a); shakeT = Math.max(shakeT, t); };
    function updJuice(dt) {
      for (let k = parts.length - 1; k >= 0; k--) {
        const p = parts[k]; p.t -= dt;
        if (p.t <= 0) { parts.splice(k, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        const d = Math.exp(-3 * dt); p.vx *= d; p.vy *= d;
      }
      for (let k = rings.length - 1; k >= 0; k--) { rings[k].t -= dt; if (rings[k].t <= 0) rings.splice(k, 1); }
      shakeT = Math.max(0, shakeT - dt);
      flashA = Math.max(0, flashA - dt * 2.5);
    }
    function drawJuice() {
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        const a = Math.max(0, p.t / p.life);
        g.globalAlpha = Math.min(1, a * 1.4);
        g.fillStyle = p.color;
        g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, Math.PI * 2); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
      for (const r of rings) {
        const k = 1 - r.t / r.life;
        g.globalAlpha = 1 - k;
        g.strokeStyle = r.color; g.lineWidth = r.w * (1 - k) + 1;
        g.beginPath(); g.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * k, 0, Math.PI * 2); g.stroke();
      }
      g.restore();
    }

    ctx.onResize(() => {
      const ow = W, oh = H;
      layout();
      for (const b of balls) { b.x *= W / ow; b.y *= H / oh; b.trail = []; }
      for (const it of items) { it.x *= W / ow; it.y *= H / oh; }
      parts.length = 0;
      P.forEach(p => { const r = range(p.i); paddles[p.i].u = U.clamp(paddles[p.i].u, r.lo, r.hi); paddles[p.i].tu = U.clamp(paddles[p.i].tu, r.lo, r.hi); });
    });

    // ---------- input ----------
    const owner = new Map();
    function seatActive(x, y) {
      let best = -1, bd = Infinity;
      for (const p of P) {
        if (out[p.i]) continue;
        const d = p.side === 'bottom' ? H - y : p.side === 'top' ? y : p.side === 'left' ? x : W - x;
        if (d < bd) { bd = d; best = p.i; }
      }
      return best;
    }
    function setTarget(i, x, y) {
      const m = edgeMid(i);
      const l = ctx.toLocal(i, x - m.x, y - m.y);
      const r = range(i);
      const lx = has(i, 'rev') ? -l.x : l.x;
      paddles[i].tu = U.clamp(lx, r.lo, r.hi);
      paddles[i].fx = l.x;
    }
    ctx.pointer(cv, {
      down(id, x, y) { if (over) return; const i = seatActive(x, y); if (i < 0) return; owner.set(id, i); setTarget(i, x, y); },
      move(id, x, y) { const i = owner.get(id); if (i == null || out[i]) return; setTarget(i, x, y); },
      up(id) { owner.delete(id); },
    });

    // ---------- balls ----------
    const balls = [];
    let rallyStart = 0;
    let serving = false;
    function newBall(x, y, vx, vy, sp, ownerI) {
      const b = { x, y, vx, vy, sp, trail: [], born: ctx.time, owner: ownerI, fire: false, curve: 0, curveUntil: 0, ghostUntil: 0 };
      balls.push(b);
      return b;
    }
    function spawnBall(toward) {
      const act = active();
      if (toward == null || out[toward]) toward = U.pick(act);
      const v = ctx.inward(toward);
      const ang = U.rand(-0.5, 0.5);
      const dx = -v.x, dy = -v.y, c = Math.cos(ang), s = Math.sin(ang);
      newBall(W / 2, H / 2, (dx * c - dy * s) * BASEV, (dx * s + dy * c) * BASEV, BASEV, null);
      ring(W / 2, H / 2, R, R * 5, '#fff', 0.5, 4);
    }
    function serve(toward) {
      if (over) return;
      serving = false;
      spawnBall(toward);
      rallyStart = ctx.time;
    }
    serving = true;
    ctx.after(600, () => serve());

    function lose(i, b) {
      lives[i]--;
      paddles[i].hit = -1;
      shake(S * 0.018, 0.4);
      flashA = 0.35; flashC = P[i].color;
      burst(U.clamp(b.x, 0, W), U.clamp(b.y, 0, H), P[i].color, 40, S * 0.9, 0.8, 5);
      burst(U.clamp(b.x, 0, W), U.clamp(b.y, 0, H), '#ffffff', 12, S * 0.6, 0.5, 3);
      if (lives[i] <= 0) {
        out[i] = true;
        effects[i] = [];
        const act = active();
        if (act.length <= 1) {
          over = true;
          balls.length = 0;
          items.length = 0;
          const w = act[0];
          say(`🏆 ${P[w].name} победил!`, { color: P[w].color, fg: '#111', ms: 1400 });
          ctx.after(1300, () => ctx.end({ winner: w, scores: lives.slice(), msg: 'Остался последним' }));
          return;
        }
        say(`💀 ${P[i].name} выбывает`, { color: P[i].color, fg: '#111', ms: 1400 });
      } else {
        say(`💔 ${P[i].name}: −1 жизнь`, { color: P[i].color, fg: '#111' });
      }
      rallyStart = ctx.time;
      if (balls.length === 0 && !serving) { serving = true; ctx.after(1000, () => serve(out[i] ? null : i)); }
    }

    // ---------- power-up items ----------
    const items = [];
    let nextItem = 4;
    function spawnItem() {
      const act = active();
      const imbalance = act.some(i => trailing(i));
      const pool = Object.keys(PU).map(k => [k, k === 'life' ? (imbalance ? 1.6 : 0) : PU[k].w]);
      if (N === 2 || act.length === 2) pool.forEach(e => { if (e[0] === 'rev') e[1] = 1.2; });
      let tot = pool.reduce((s, e) => s + e[1], 0), r = Math.random() * tot, k = pool[0][0];
      for (const e of pool) { r -= e[1]; if (r <= 0) { k = e[0]; break; } }
      for (let tries = 0; tries < 20; tries++) {
        const x = U.rand(W * 0.22, W * 0.78), y = U.rand(H * 0.22, H * 0.78);
        if (items.some(it => Math.hypot(it.x - x, it.y - y) < IR * 4)) continue;
        if (Math.hypot(x - W / 2, y - H / 2) < IR * 2) continue;
        items.push({ x, y, k, born: ctx.time, life: 12, spin: U.rand(-1, 1) });
        ring(x, y, IR * 2.5, IR, '#ffffff', 0.4, 3);
        return;
      }
    }
    function collect(it, b) {
      const i = b.owner;
      const def = PU[it.k];
      const bonus = trailing(i) ? 1.3 : 1;
      const opp = active().filter(j => j !== i);
      const col = P[i].color;
      burst(it.x, it.y, col, 26, S * 0.7, 0.7, 4);
      burst(it.x, it.y, '#ffffff', 10, S * 0.4, 0.5, 3);
      ring(it.x, it.y, IR, IR * 4, col, 0.55, 6);
      let msg = `${def.icon} ${def.name}`;
      switch (it.k) {
        case 'long': addEffect(i, 'long', 10 * bonus); break;
        case 'mini': opp.forEach(j => addEffect(j, 'mini', 8 * bonus)); break;
        case 'shield': addEffect(i, 'shield', 15 * bonus); break;
        case 'freeze': opp.forEach(j => { addEffect(j, 'freeze', 1.6 * bonus); const p = paddlePos(j); burst(p.x, p.y, '#bfe9ff', 24, S * 0.4, 0.8, 3); }); break;
        case 'rev': opp.forEach(j => addEffect(j, 'rev', 6 * bonus)); break;
        case 'multi': {
          const base = Math.atan2(b.vy, b.vx);
          for (const da of [-0.45, 0.45]) {
            if (balls.length >= 5) break;
            const nb = newBall(b.x, b.y, Math.cos(base + da) * b.sp, Math.sin(base + da) * b.sp, b.sp, i);
            nb.born = ctx.time - 1;
          }
          break;
        }
        case 'fire':
          b.fire = true; b.sp = Math.min(MAXV * 1.35, b.sp * 1.5);
          shake(S * 0.006, 0.2);
          break;
        case 'curve': b.curve = (Math.random() < 0.5 ? -1 : 1) * 1.6; b.curveUntil = ctx.time + 3.2; break;
        case 'ghost': b.ghostUntil = ctx.time + 5; break;
        case 'life': {
          let who = i;
          if (lives[i] >= LIVES) {
            const act = active();
            who = act.reduce((a, c) => lives[c] < lives[a] ? c : a, act[0]);
          }
          if (lives[who] < LIVES) lives[who]++;
          msg = `❤️ +1 жизнь: ${P[who].name}`;
          break;
        }
      }
      say(msg, { color: col, fg: '#111', ms: 1300 });
    }

    // ---------- physics ----------
    function wallAxis(b) {
      const wallOr = (s) => !isPaddle(s) || has(sideOf(s).i, 'shield');
      const shieldHit = (s) => {
        const p = sideOf(s);
        if (p && !out[p.i] && has(p.i, 'shield')) {
          delEffect(p.i, 'shield');
          sparks(b.x, b.y, ctx.inward(p.i).x, ctx.inward(p.i).y, '#ffcf8a', 26, S * 0.8);
          ring(b.x, b.y, R, R * 6, P[p.i].color, 0.5, 6);
          shake(S * 0.008, 0.2);
          say(`🧱 Щит спас: ${P[p.i].name}`, { color: P[p.i].color, fg: '#111', ms: 1000 });
          b.owner = p.i;
        }
      };
      if (b.x < R && wallOr('left')) { b.x = R; b.vx = Math.abs(b.vx); shieldHit('left'); }
      if (b.x > W - R && wallOr('right')) { b.x = W - R; b.vx = -Math.abs(b.vx); shieldHit('right'); }
      if (b.y < R && wallOr('top')) { b.y = R; b.vy = Math.abs(b.vy); shieldHit('top'); }
      if (b.y > H - R && wallOr('bottom')) { b.y = H - R; b.vy = -Math.abs(b.vy); shieldHit('bottom'); }
      for (const c of corners) {
        const qx = U.clamp(b.x, c.x, c.x + c.w), qy = U.clamp(b.y, c.y, c.y + c.h);
        let dx = b.x - qx, dy = b.y - qy;
        const d = Math.hypot(dx, dy);
        if (d >= R) continue;
        if (d < 1e-6) { const cx = c.x + c.w / 2, cy = c.y + c.h / 2; dx = W / 2 - cx; dy = H / 2 - cy; }
        const L = Math.hypot(dx, dy) || 1, nx = dx / L, ny = dy / L;
        if (d >= 1e-6) { b.x = qx + nx * R; b.y = qy + ny * R; } else { b.x += nx * R; b.y += ny * R; }
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
      }
    }
    function paddleHit(b, i) {
      const p = paddlePos(i), pl = paddles[i].len;
      const l = ctx.toLocal(i, b.x - p.x, b.y - p.y);
      const lv = ctx.toLocal(i, b.vx, b.vy);
      if (lv.y <= 0) return false;
      if (l.y < -PT / 2 - R || l.y > PT / 2) return false;
      if (Math.abs(l.x) > pl / 2 + R * 0.8) return false;
      const off = U.clamp(l.x / (pl / 2), -1, 1);
      const ang = off * 1.05 + U.rand(-0.05, 0.05);
      const wasFire = b.fire;
      if (b.fire) { b.fire = false; b.sp = Math.max(BASEV, b.sp / 1.5); }
      b.curve = 0; b.ghostUntil = 0;
      b.sp = Math.min(MAXV, b.sp * 1.06);
      b.owner = i;
      const nv = ctx.toScreen(i, Math.sin(ang) * b.sp, -Math.cos(ang) * b.sp);
      b.vx = nv.x; b.vy = nv.y;
      const np = ctx.toScreen(i, l.x, -PT / 2 - R);
      b.x = p.x + np.x; b.y = p.y + np.y;
      paddles[i].hit = 1;
      const v = ctx.inward(i);
      sparks(b.x, b.y, v.x, v.y, P[i].color, 10 + Math.round(10 * b.sp / MAXV), S * 0.7);
      if (wasFire) { sparks(b.x, b.y, v.x, v.y, '#ff9a3c', 30, S); shake(S * 0.01, 0.25); }
      return true;
    }
    function missedBy(b) {
      if (b.y > H + R * 2 && isPaddle('bottom')) return sideOf('bottom').i;
      if (b.y < -R * 2 && isPaddle('top')) return sideOf('top').i;
      if (b.x < -R * 2 && isPaddle('left')) return sideOf('left').i;
      if (b.x > W + R * 2 && isPaddle('right')) return sideOf('right').i;
      return -1;
    }
    function fixAngle(b) {
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const minC = 0.22;
      const any = (axis) => axis === 'x' ? (isPaddle('left') || isPaddle('right')) : (isPaddle('top') || isPaddle('bottom'));
      if (Math.abs(b.vy) / sp < minC && !any('x')) { b.vy = (b.vy >= 0 ? 1 : -1) * minC * sp; b.vx = Math.sign(b.vx || 1) * Math.sqrt(1 - minC * minC) * sp; }
      if (Math.abs(b.vx) / sp < minC && !any('y')) { b.vx = (b.vx >= 0 ? 1 : -1) * minC * sp; b.vy = Math.sign(b.vy || 1) * Math.sqrt(1 - minC * minC) * sp; }
    }

    function step(dt) {
      // effects expiry
      for (const p of P) effects[p.i] = effects[p.i].filter(e => e.until > ctx.time);
      for (const p of P) {
        const pd = paddles[p.i];
        pd.len += (targetLen(p.i) - pd.len) * (1 - Math.exp(-dt * 10));
        const r = range(p.i);
        pd.tu = U.clamp(pd.tu, r.lo, r.hi);
        if (!has(p.i, 'freeze')) pd.u += (pd.tu - pd.u) * (1 - Math.exp(-dt * 30));
        pd.u = U.clamp(pd.u, r.lo, r.hi);
        pd.hit = pd.hit > 0 ? Math.max(0, pd.hit - dt * 3) : Math.min(0, pd.hit + dt * 2);
        if (has(p.i, 'freeze') && Math.random() < dt * 20) {
          const pp = paddlePos(p.i), a = ctx.toScreen(p.i, U.rand(-0.5, 0.5) * pd.len, 0);
          burst(pp.x + a.x, pp.y + a.y, '#cdeeff', 1, S * 0.08, 0.6, 2.5);
        }
      }
      for (let bi = balls.length - 1; bi >= 0; bi--) {
        const b = balls[bi];
        if (b.curve && ctx.time > b.curveUntil) b.curve = 0;
        const sp = Math.hypot(b.vx, b.vy);
        const n = U.clamp(Math.ceil(sp * dt / (R * 0.5)), 1, 60);
        const h = dt / n;
        let lost = -1;
        for (let s = 0; s < n; s++) {
          if (b.curve) {
            const a = b.curve * h, c = Math.cos(a), sn = Math.sin(a);
            const vx = b.vx * c - b.vy * sn; b.vy = b.vx * sn + b.vy * c; b.vx = vx;
          }
          b.x += b.vx * h; b.y += b.vy * h;
          for (const p of P) if (!out[p.i]) paddleHit(b, p.i);
          wallAxis(b);
          lost = missedBy(b);
          if (lost >= 0) break;
        }
        fixAngle(b);
        const cs = Math.hypot(b.vx, b.vy) || 1;
        b.vx *= b.sp / cs; b.vy *= b.sp / cs;
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 12) b.trail.shift();
        if (b.fire) { burst(b.x, b.y, Math.random() < 0.5 ? '#ff7a1a' : '#ffd23c', 2, S * 0.12, 0.45, R * 0.45); }
        if (b.curve) { const a = ctx.time * 14; parts.push({ x: b.x + Math.cos(a) * R * 1.4, y: b.y + Math.sin(a) * R * 1.4, vx: 0, vy: 0, life: 0.4, t: 0.4, color: '#b98cff', size: 3 }); }
        // pick up items
        if (b.owner != null && !out[b.owner]) {
          for (let k = items.length - 1; k >= 0; k--) {
            const it = items[k];
            if (Math.hypot(it.x - b.x, it.y - b.y) < IR + R) { items.splice(k, 1); collect(it, b); }
          }
        }
        if (lost >= 0) { balls.splice(balls.indexOf(b), 1); lose(lost, b); if (over) return; }
        else if (b.x < -S || b.x > W + S || b.y < -S || b.y > H + S) balls.splice(balls.indexOf(b), 1);
      }
      if (!over && balls.length === 0 && !serving) { serving = true; ctx.after(800, () => serve()); }
      if (!over && balls.length === 1 && ctx.time - rallyStart > 20) {
        spawnBall();
        rallyStart = ctx.time;
        say('⚽ Второй мяч!', { color: '#fff', fg: '#111' });
      }
      // items
      for (let k = items.length - 1; k >= 0; k--) if (ctx.time - items[k].born > items[k].life) items.splice(k, 1);
      if (ctx.time > nextItem) {
        const imbalance = active().some(i => trailing(i));
        if (items.length < 3) spawnItem();
        nextItem = ctx.time + U.rand(5, 8) - (imbalance ? 1.5 : 0);
      }
    }

    // ---------- drawing ----------
    function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
    function rrect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function emoji(ch, x, y, size) {
      g.font = `${Math.round(size)}px ${EMOJI}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, x, y + size * 0.05);
    }
    function drawField() {
      g.fillStyle = '#0f1220';
      g.fillRect(-40, -40, W + 80, H + 80);
      g.save();
      g.strokeStyle = 'rgba(255,255,255,.08)';
      g.lineWidth = 3;
      g.setLineDash([12, 14]);
      if (N === 2) { g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke(); }
      g.setLineDash([]);
      circle(W / 2, H / 2, S * 0.1); g.stroke();
      g.restore();
      const T = 8;
      for (const s of ['bottom', 'top', 'left', 'right']) {
        const p = sideOf(s);
        if (p && !out[p.i]) {
          const v = ctx.inward(p.i), m = edgeMid(p.i);
          const gr = g.createLinearGradient(m.x, m.y, m.x + v.x * FACE * 1.6, m.y + v.y * FACE * 1.6);
          gr.addColorStop(0, U.alpha(p.color, paddles[p.i].hit < 0 ? 0.6 : 0.18));
          gr.addColorStop(1, U.alpha(p.color, 0));
          g.fillStyle = gr;
          if (s === 'bottom') g.fillRect(0, H - FACE * 1.6, W, FACE * 1.6);
          else if (s === 'top') g.fillRect(0, 0, W, FACE * 1.6);
          else if (s === 'left') g.fillRect(0, 0, FACE * 1.6, H);
          else g.fillRect(W - FACE * 1.6, 0, FACE * 1.6, H);
          if (has(p.i, 'shield')) {
            // glowing brick wall along the edge
            g.save();
            g.shadowColor = '#ffb35c'; g.shadowBlur = 16;
            g.fillStyle = 'rgba(255,170,80,.85)';
            const th = 11 + Math.sin(ctx.time * 8) * 2;
            if (s === 'bottom') g.fillRect(0, H - th, W, th);
            else if (s === 'top') g.fillRect(0, 0, W, th);
            else if (s === 'left') g.fillRect(0, 0, th, H);
            else g.fillRect(W - th, 0, th, H);
            g.restore();
          }
        } else {
          g.fillStyle = p ? '#4a5280' : '#3a4270';
          if (s === 'bottom') g.fillRect(0, H - T, W, T);
          else if (s === 'top') g.fillRect(0, 0, W, T);
          else if (s === 'left') g.fillRect(0, 0, T, H);
          else g.fillRect(W - T, 0, T, H);
        }
      }
      g.fillStyle = '#3a4270';
      for (const c of corners) { rrect(c.x, c.y, c.w, c.h, 6); g.fill(); }
    }
    function heart(x, y, r, full, color) {
      g.beginPath();
      g.moveTo(x, y + r * 0.95);
      g.bezierCurveTo(x - r * 1.6, y - r * 0.1, x - r * 0.9, y - r * 1.35, x, y - r * 0.5);
      g.bezierCurveTo(x + r * 0.9, y - r * 1.35, x + r * 1.6, y - r * 0.1, x, y + r * 0.95);
      g.closePath();
      if (full) { g.fillStyle = U.alpha(color, 0.6); g.fill(); }
      else { g.strokeStyle = U.alpha(color, 0.3); g.lineWidth = 2; g.stroke(); }
    }
    const BAD = { mini: 1, freeze: 1, rev: 1 };
    function drawEffectRings(i, x0, y0, avail) {
      const r = S * 0.028, gap = r * 2.5;
      const perRow = Math.max(1, Math.floor(avail / gap) + 1);
      effects[i].forEach((e, k) => {
        const x = x0 + (k % perRow) * gap, y = y0 - Math.floor(k / perRow) * gap;
        const frac = U.clamp((e.until - ctx.time) / e.dur, 0, 1);
        circle(x, y, r); g.fillStyle = 'rgba(10,12,24,.75)'; g.fill();
        g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 4; g.stroke();
        g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        g.strokeStyle = BAD[e.k] ? '#ff6b6b' : '#5dffa8'; g.lineWidth = 4; g.stroke();
        emoji(PU[e.k].icon, x, y, r * 1.15);
      });
    }
    function drawHud() {
      for (const p of P) {
        const m = edgeMid(p.i), v = ctx.inward(p.i);
        g.save();
        ctx.facing(g, p.i, m.x + v.x * S * 0.2, m.y + v.y * S * 0.2);
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if (out[p.i]) {
          g.font = `900 ${Math.round(S * 0.05)}px ${FONT}`;
          g.fillStyle = U.alpha(p.color, 0.35);
          g.fillText('выбыл', 0, 0);
        } else {
          const r = S * 0.022, gap = S * 0.065;
          for (let k = 0; k < LIVES; k++) heart((k - (LIVES - 1) / 2) * gap, 0, r, k < lives[p.i], p.color);
          const len = (p.side === 'left' || p.side === 'right') ? H : W;
          const x0 = gap * 1.5 + S * 0.05;
          drawEffectRings(p.i, x0, 0, Math.max(0, len / 2 - S * 0.1 - x0));
        }
        g.restore();
      }
    }
    function drawPaddle(p) {
      const pd = paddles[p.i], c = paddlePos(p.i), pl = pd.len;
      const frozen = has(p.i, 'freeze'), rev = has(p.i, 'rev');
      g.save();
      g.translate(c.x, c.y);
      g.rotate(p.rot * Math.PI / 180);
      g.shadowColor = frozen ? '#bfe9ff' : p.color; g.shadowBlur = 16 + 24 * Math.max(0, pd.hit);
      rrect(-pl / 2, -PT / 2, pl, PT, PT / 2);
      g.fillStyle = frozen ? '#a9dcff' : p.color; g.fill();
      g.shadowBlur = 0;
      rrect(-pl / 2 + 6, -PT / 2 + 3, pl - 12, PT * 0.35, PT * 0.2);
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fill();
      if (frozen) { rrect(-pl / 2, -PT / 2, pl, PT, PT / 2); g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.stroke(); }
      if (rev) {
        g.font = `900 ${Math.round(PT * 1.2)}px ${FONT}`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = 'rgba(20,10,40,.9)';
        g.fillText('⇄', 0, 1);
      }
      if (has(p.i, 'long')) {
        // little end-caps glow
        g.fillStyle = 'rgba(255,255,255,.8)';
        circle(-pl / 2 + PT / 2, 0, PT * 0.25); g.fill();
        circle(pl / 2 - PT / 2, 0, PT * 0.25); g.fill();
      }
      g.restore();
    }
    function drawItems() {
      for (const it of items) {
        const age = ctx.time - it.born, left = it.life - age;
        const appear = Math.min(1, age * 4);
        if (left < 2.5 && Math.sin(age * 20) < 0) continue; // blink before expiry
        const r = IR * (0.6 + 0.4 * appear) * (1 + 0.06 * Math.sin(age * 5));
        g.save();
        g.translate(it.x, it.y);
        g.shadowColor = '#fff'; g.shadowBlur = 18;
        circle(0, 0, r); g.fillStyle = 'rgba(30,36,70,.92)'; g.fill();
        g.lineWidth = 3; g.strokeStyle = `hsla(${(age * 120) % 360},90%,70%,.95)`; g.stroke();
        g.shadowBlur = 0;
        g.rotate(Math.sin(age * 1.5) * 0.35);
        emoji(PU[it.k].icon, 0, 0, r * 1.15);
        g.restore();
      }
    }
    function drawBalls() {
      for (const b of balls) {
        const age = ctx.time - b.born;
        const col = b.fire ? '#ff8a2a' : b.owner != null ? P[b.owner].color : '#fff2c8';
        let alpha = Math.min(1, 0.3 + age * 3);
        if (b.ghostUntil > ctx.time) alpha *= (Math.sin(ctx.time * 11) > 0.55 ? 0.9 : 0.04);
        g.save();
        g.globalAlpha = alpha;
        for (let k = 0; k < b.trail.length; k++) {
          const tr = b.trail[k], a = (k + 1) / b.trail.length;
          circle(tr.x, tr.y, R * (0.25 + 0.65 * a));
          g.fillStyle = U.alpha(col, 0.22 * a);
          g.fill();
        }
        g.shadowColor = col; g.shadowBlur = b.fire ? 34 : 22;
        circle(b.x, b.y, b.fire ? R * 1.15 : R);
        g.fillStyle = b.fire ? '#ffe2a8' : '#fffaf0'; g.fill();
        g.shadowBlur = 0;
        if (b.owner != null && !b.fire) { circle(b.x, b.y, R * 0.45); g.fillStyle = U.alpha(col, 0.8); g.fill(); }
        g.restore();
      }
      if (serving && !over) {
        const a = 0.25 + 0.2 * Math.sin(performance.now() / 120);
        circle(W / 2, H / 2, R * 1.3);
        g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3; g.stroke();
      }
    }

    ctx.loop((dt) => {
      if (dt > 0 && !over) step(dt);
      if (dt > 0) updJuice(dt);
      g.save();
      if (shakeT > 0) {
        const k = shakeA * Math.min(1, shakeT / 0.3);
        g.translate(U.rand(-k, k), U.rand(-k, k));
      }
      drawField();
      drawHud();
      drawItems();
      for (const p of P) if (!out[p.i]) drawPaddle(p);
      drawBalls();
      drawJuice();
      g.restore();
      if (flashA > 0) { g.fillStyle = U.alpha(flashC, flashA * 0.35); g.fillRect(0, 0, W, H); }
    });

    ctx._pong = { balls, lives, out, paddles, items, effects, spawnItem, PU };
  },
});

</script>
<script>/* games/potato.js */
registerGame({
  id: 'potato',
  title: 'Горячая картошка',
  emoji: '💣',
  desc: 'Передай бомбу, пока она не взорвалась',
  rules: 'Бомба тикает у одного из игроков, сколько осталось, никто не знает. У кого бомба, тот жмёт свою кнопку, чтобы передать её дальше по кругу. У кого взорвётся, теряет жизнь (всего 3). Последний оставшийся побеждает.\n' +
    'Особые бомбы:\n' +
    '⚡ Быстрая: очень короткий фитиль.\n' +
    '🔀 Хаос: кнопка убегает от пальца.\n' +
    '🎯 Точность: кнопка крошечная.\n' +
    '🔢 Код: чтобы передать, нажми 1 → 2 → 3 по порядку.\n' +
    '👯 Две бомбы сразу (когда играют трое).\n' +
    'Бонусы (хватай первым!): 🛡️ щит спасает от одного взрыва, 💖 возвращает жизнь.\n' +
    '🔄 Разворот: бомба иногда меняет направление.',
  start(ctx) {
    const N = ctx.n;
    const DEPTH = 0.3;
    const LIVES = 3;
    const KINDS = {
      normal: { icon: '💣', name: 'Новая бомба', sub: null, fuse: [6, 15], color: '#ff8a5c' },
      fast: { icon: '⚡', name: 'Быстрая бомба', sub: 'короткий фитиль!', fuse: [3, 6], color: '#ffd84a' },
      chaos: { icon: '🔀', name: 'Хаос', sub: 'кнопка убегает', fuse: [7, 13], color: '#c39bff' },
      tiny: { icon: '🎯', name: 'Точность', sub: 'кнопка крошечная', fuse: [7, 13], color: '#4dd0ff' },
      code: { icon: '🔢', name: 'Код', sub: 'жми 1 → 2 → 3', fuse: [9, 16], color: '#3ddc97' },
      double: { icon: '👯', name: 'Две бомбы!', sub: 'первый взрыв заканчивает раунд', fuse: [6, 13], color: '#ff5a5f' },
    };
    const lives = ctx.players.map(() => LIVES);
    const shield = ctx.players.map(() => false);
    let starter = U.randInt(0, N - 1);
    let dir = 1;
    let state = 'wait'; // wait | pre | play | boom | done
    let kind = 'normal', lastKind = '';
    let bombs = [];
    let pickup = null;
    let roundNo = 0;
    let passes = 0;
    let boomT = 0, boomAt = { x: 0, y: 0 };
    let phase = 0;
    const sparks = [];

    ctx.root.classList.add('g-potato');
    ctx.root.append(U.h('style', null, `
      .g-potato .pz{border-radius:22px;transition:background .2s}
      .g-potato .pz::before{content:'';position:absolute;inset:6px;border-radius:20px;border:3px solid var(--pc);opacity:.22;pointer-events:none}
      .g-potato .pz.hold::before{opacity:0}
      .g-potato .pz.hold{background:rgba(255,90,40,.10);box-shadow:0 0 0 4px var(--pc) inset}
      .g-potato .pz.dead{opacity:.35}
      .g-potato .pz.boom{animation:potBoom .7s}
      .g-potato .pz.saved{animation:potSaved .8s}
      @keyframes potBoom{0%{background:rgba(255,200,80,.9)}100%{background:transparent}}
      @keyframes potSaved{0%{background:rgba(120,200,255,.8)}100%{background:transparent}}
      .g-potato .ph{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;gap:14px;
        font-weight:800;white-space:nowrap}
      .g-potato .ph .lv{letter-spacing:2px}
      .g-potato .ph .st{color:var(--muted)}
      .g-potato .pz.hold .ph .st{color:var(--pc)}
      .g-potato .pa{position:absolute}
      .g-potato .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
        font-weight:800;font-size:26px;opacity:.6}
      .g-potato .pt{position:absolute;border-radius:50%;background:var(--pc);color:#111;font-weight:900;z-index:2;
        display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center;
        box-shadow:0 0 0 6px rgba(255,255,255,.18),0 8px 30px rgba(0,0,0,.4);animation:potIn .15s ease-out}
      .g-potato .pt .e{font-size:1.5em}
      .g-potato .pt.num{border-radius:22px;font-size:40px}
      .g-potato .pt.num.done{opacity:.25}
      .g-potato .pt.bad{animation:potBad .3s}
      .g-potato .pt.b2{background:#fff}
      @keyframes potIn{0%{scale:.4;opacity:.2}100%{scale:1;opacity:1}}
      @keyframes potBad{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
      .g-potato .pk{position:absolute;width:76px;height:76px;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;
        font-size:46px;background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(255,255,255,.4) 55%,rgba(255,255,255,0) 72%);
        animation:potPk .45s ease-in-out infinite alternate}
      @keyframes potPk{0%{scale:.9;rotate:-10deg}100%{scale:1.1;rotate:10deg}}
      .fx-flash{position:absolute;inset:0;z-index:36;pointer-events:none;transition:opacity .55s ease-out}
      .fx-shake{animation:fxShake .35s}
      @keyframes fxShake{0%,100%{translate:0 0}20%{translate:-9px 4px}40%{translate:8px -5px}60%{translate:-6px -3px}80%{translate:5px 3px}}
      .toast.fx-ban{font-size:26px;text-align:center;line-height:1.15;border:2px solid rgba(255,255,255,.3);animation:fxPop .4s ease-out;padding:10px 20px}
      .toast.fx-ban b{font-size:34px;margin-right:8px;vertical-align:-4px}
      .toast.fx-ban small{display:block;font-size:16px;font-weight:700;opacity:.85;margin-top:2px}
      @keyframes fxPop{0%{scale:.3;opacity:0}60%{scale:1.12;opacity:1}100%{scale:1}}
    `));

    const { g } = ctx.canvas();

    // ---------- juice: particles, flashes, shake, announcements ----------
    const fx = (() => {
      const { cv, g } = ctx.canvas({ z: 35 });
      cv.style.pointerEvents = 'none';
      const ps = [];
      const layer = U.h('div', { class: 'toast-layer' });
      ctx.root.append(layer);
      const active = [];
      const api = {
        at(el) {
          const r = el.getBoundingClientRect(), R = ctx.root.getBoundingClientRect();
          return { x: r.left - R.left + r.width / 2, y: r.top - R.top + r.height / 2 };
        },
        burst(x, y, color, n = 22, sp = 360, size = 6) {
          for (let k = 0; k < n; k++) {
            const a = Math.random() * 6.283, s = sp * (0.35 + Math.random() * 0.65), l = 0.5 + Math.random() * 0.5;
            ps.push({ kind: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, color, size: size * (0.6 + Math.random() * 0.8) });
          }
        },
        ring(x, y, color, r = 90) { ps.push({ kind: 'r', x, y, life: 0.5, max: 0.5, color, r }); },
        text(x, y, str, color, i, size = 38) {
          const v = ctx.toScreen(i, 0, -60);
          ps.push({ kind: 't', x, y, vx: v.x, vy: v.y, str, color, rot: ctx.players[i].rot, size, life: 1.1, max: 1.1 });
        },
        flash(color, a = 0.3) {
          const d = U.h('div', { class: 'fx-flash', style: { background: color, opacity: a } });
          ctx.root.append(d); void d.offsetWidth; d.style.opacity = 0;
          setTimeout(() => d.remove(), 700);
        },
        shake(el = ctx.root) { el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake'); },
        // announcement facing each player, just in front of their own zone (stacks if several are shown)
        banner(icon, title, sub, o = {}) {
          ctx.players.forEach(p => {
            const e = U.h('div', { class: 'toast fx-ban' }, U.h('b', null, icon), title, sub ? U.h('small', null, sub) : null);
            if (o.color) e.style.background = o.color;
            if (o.fg) e.style.color = o.fg;
            const z = zones[p.i].z, r = z.rect, v = ctx.inward(p.i);
            Object.assign(e.style, { maxWidth: (z.w - 16) + 'px', whiteSpace: 'normal' });
            layer.append(e);
            // room between this zone's inner edge and the screen center; drop older banners that would not fit
            const ex = r.x + r.w / 2 + v.x * z.h / 2, ey = r.y + r.h / 2 + v.y * z.h / 2;
            const room = (ctx.W / 2 - ex) * v.x + (ctx.H / 2 - ey) * v.y;
            const mine = active.filter(a => a.i === p.i);
            const sum = () => mine.reduce((s, a) => s + a.e.offsetHeight + 8, 0);
            while (mine.length && sum() + e.offsetHeight + 12 > Math.max(room, e.offsetHeight + 12)) {
              const old = mine.shift(); old.e.remove(); active.splice(active.indexOf(old), 1);
            }
            const stack = sum();
            const off = z.h / 2 + 12 + stack + e.offsetHeight / 2;
            Object.assign(e.style, { left: (r.x + r.w / 2 + v.x * off) + 'px', top: (r.y + r.h / 2 + v.y * off) + 'px', transform: `translate(-50%,-50%) rotate(${p.rot}deg)` });
            const a = { i: p.i, e };
            active.push(a);
            ctx.after(o.ms ?? 1700, () => { e.remove(); const k = active.indexOf(a); if (k >= 0) active.splice(k, 1); });
          });
        },
      };
      ctx.loop((dt) => {
        g.clearRect(0, 0, ctx.W, ctx.H);
        const damp = Math.exp(-3 * dt);
        for (let k = ps.length - 1; k >= 0; k--) {
          const p = ps[k];
          p.life -= dt;
          if (p.life <= 0) { ps.splice(k, 1); continue; }
          const f = p.life / p.max;
          if (p.kind === 'p') {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp;
            g.globalAlpha = Math.min(1, f * 1.5);
            g.fillStyle = p.color;
            g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * f), 0, 6.283); g.fill();
          } else if (p.kind === 'r') {
            g.globalAlpha = f;
            g.strokeStyle = p.color; g.lineWidth = 8 * f + 1;
            g.beginPath(); g.arc(p.x, p.y, p.r * (1 - f) + 10, 0, 6.283); g.stroke();
          } else {
            p.x += p.vx * dt; p.y += p.vy * dt;
            g.save();
            g.globalAlpha = Math.min(1, f * 2);
            g.translate(p.x, p.y); g.rotate(p.rot * Math.PI / 180);
            g.font = `900 ${p.size}px -apple-system,system-ui,sans-serif`;
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(p.str, 0, 0);
            g.fillStyle = p.color; g.fillText(p.str, 0, 0);
            g.restore();
          }
        }
        g.globalAlpha = 1;
      });
      return api;
    })();

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH, className: 'pz' });
      const lv = U.h('span', { class: 'lv' });
      const st = U.h('span', { class: 'st' });
      const ph = U.h('div', { class: 'ph' }, lv, st);
      const pa = U.h('div', { class: 'pa' });
      const wait = U.h('div', { class: 'wait' }, 'ждите…');
      pa.append(wait);
      z.el.append(ph, pa);
      return { z, lv, st, ph, pa, wait };
    });

    // ----- layout -----
    function geo(zb) {
      const w = zb.z.w, h = zb.z.h, PAD = 12;
      const HH = Math.round(U.clamp(h * 0.17, 30, 46));
      return { w, h, PAD, HH, aw: w - 2 * PAD, ah: h - HH - PAD, S: Math.round(U.clamp(Math.min(h - HH - PAD, w * 0.42) * 0.86, 76, 150)) };
    }
    function btnSize(b, G) {
      if (b.kind === 'tiny') return Math.max(62, Math.round(G.S * 0.48));
      if (b.kind === 'chaos') return Math.round(G.S * 0.8);
      if (b.kind === 'code') return Math.max(66, Math.round(Math.min(G.S * 0.62, G.ah * 0.55)));
      if (b.kind === 'double') return Math.round(G.S * 0.8);
      return G.S;
    }
    function layout() {
      zones.forEach(zb => {
        const G = geo(zb);
        zb.ph.style.height = G.HH + 'px';
        zb.ph.style.fontSize = Math.round(G.HH * 0.55) + 'px';
        Object.assign(zb.pa.style, { left: G.PAD + 'px', top: G.HH + 'px', width: G.aw + 'px', height: G.ah + 'px' });
      });
      bombs.forEach(b => { if (b.ready) placeBomb(b); });
    }

    // random free spot of size S inside the holder's play area, away from rects in `avoid`
    function freeSpot(G, S, avoid) {
      let best = null, bd = -1;
      for (let t = 0; t < 40; t++) {
        const x = U.rand(0, Math.max(0, G.aw - S)), y = U.rand(0, Math.max(0, G.ah - S));
        let dmin = Infinity;
        for (const r of avoid) dmin = Math.min(dmin, Math.hypot(x + S / 2 - r.x - r.s / 2, y + S / 2 - r.y - r.s / 2) - (S + r.s) / 2);
        if (dmin > 8) return { x, y };
        if (dmin > bd) { bd = dmin; best = { x, y }; }
      }
      return best;
    }
    function occupied(i, except) {
      const out = [];
      bombs.forEach(b => {
        if (b === except || b.holder !== i || !b.ready) return;
        if (b.codeEls) b.codeEls.forEach(e => out.push({ x: e._x, y: e._y, s: e._s }));
        else out.push({ x: b.x, y: b.y, s: b.S });
      });
      return out;
    }
    function setPos(e, x, y, s) { e._x = x; e._y = y; e._s = s; Object.assign(e.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px' }); }

    function placeBomb(b) {
      const zb = zones[b.holder], G = geo(zb), S = btnSize(b, G);
      b.S = S;
      if (b.kind === 'code') {
        const avoid = occupied(b.holder, b);
        b.codeEls.forEach(e => { const p = freeSpot(G, S, avoid); setPos(e, p.x, p.y, S); avoid.push({ x: p.x, y: p.y, s: S }); e.style.fontSize = Math.round(S * 0.5) + 'px'; });
        return;
      }
      const p = freeSpot(G, S, occupied(b.holder, b));
      b.x = p.x; b.y = p.y;
      setPos(b.el, p.x, p.y, S);
      b.el.style.fontSize = Math.round(S * 0.17) + 'px';
      const a = U.rand(0, 6.283);
      b.vx = Math.cos(a) * 230; b.vy = Math.sin(a) * 230;
    }

    function makeBombEls(b) {
      if (b.kind === 'code') {
        b.codeEls = [1, 2, 3].map(k => {
          const e = U.h('div', { class: 'pt num' }, String(k));
          ctx.tap(e, () => codeTap(b, k, e));
          return e;
        });
      } else {
        b.el = U.h('div', { class: 'pt' + (b.id === 1 ? ' b2' : '') }, U.h('div', { class: 'e' }, '💣'), U.h('div', null, 'ПЕРЕДАЙ'));
        ctx.tap(b.el, () => passOn(b));
      }
    }
    function removeEls(b) {
      if (b.el) b.el.remove();
      if (b.codeEls) b.codeEls.forEach(e => e.remove());
    }

    function render() {
      zones.forEach((zb, i) => {
        const dead = lives[i] <= 0;
        zb.lv.textContent = '❤️'.repeat(Math.max(0, lives[i])) + '🖤'.repeat(LIVES - Math.max(0, lives[i])) + (shield[i] ? ' 🛡️' : '');
        const held = state === 'play' ? bombs.filter(b => b.holder === i).length : 0;
        const ready = bombs.some(b => b.holder === i && b.ready);
        zb.z.el.classList.toggle('hold', held > 0 && !dead);
        zb.z.el.classList.toggle('dead', dead);
        zb.st.textContent = held > 1 ? '2 бомбы у тебя!' : held ? 'бомба у тебя!' : '';
        zb.wait.textContent = dead ? '💀 выбыл' : held ? 'лови!' : 'ждите…';
        zb.wait.style.display = held && ready ? 'none' : 'flex';
      });
    }

    const alive = () => ctx.players.filter(p => lives[p.i] > 0).map(p => p.i);
    function nextOf(i) {
      for (let k = 1; k <= N; k++) {
        const j = ((i + dir * k) % N + N) % N;
        if (lives[j] > 0) return j;
      }
      return i;
    }
    // angle on screen pointing from center toward a player's edge
    const angleTo = (i) => { const v = ctx.inward(i); return Math.atan2(-v.y, -v.x); };

    function giveTo(b, i) {
      removeEls(b);
      b.holder = i;
      b.ready = false;
      b.angT = angleTo(i);
      b.codeNext = 1;
      if (b.codeEls) b.codeEls.forEach(e => e.classList.remove('done'));
      ctx.cancel(b.showT);
      render();
      b.showT = ctx.after(U.rand(150, 230), () => {
        if (state !== 'play' || b.holder !== i) return;
        placeBomb(b);
        if (b.el) zones[i].pa.append(b.el); else b.codeEls.forEach(e => zones[i].pa.append(e));
        b.ready = true;
        render();
      });
    }

    function passOn(b) {
      if (state !== 'play' || !b.ready) return;
      const from = b.holder;
      const at = fx.at(b.el || b.codeEls[2]);
      fx.burst(at.x, at.y, ctx.players[from].color, 12, 260, 5);
      passes++;
      b.pass = 1;
      if (alive().length > 2 && passes > 2 && Math.random() < 0.12) {
        dir = -dir;
        fx.banner('🔄', 'Разворот!', null, { ms: 1000 });
      }
      giveTo(b, nextOf(from));
    }

    function codeTap(b, k, e) {
      if (state !== 'play' || !b.ready) return;
      if (k === b.codeNext) {
        e.classList.add('done');
        const at = fx.at(e);
        fx.ring(at.x, at.y, '#3ddc97', 60);
        b.codeNext++;
        if (b.codeNext > 3) passOn(b);
      } else {
        b.codeNext = 1;
        b.codeEls.forEach(x => { x.classList.remove('done'); x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); });
      }
    }

    // ----- pickups -----
    function clearPickup() {
      if (!pickup) return;
      ctx.cancel(pickup.timer);
      pickup.els.forEach(e => e.remove());
      pickup = null;
    }
    function spawnPickup() {
      if (state !== 'play') return;
      clearPickup();
      const hurt = alive().some(i => lives[i] < LIVES);
      const type = hurt && Math.random() < 0.5 ? 'heart' : 'shield';
      const icon = type === 'heart' ? '💖' : '🛡️';
      const els = [];
      alive().forEach(i => {
        const zb = zones[i], G = geo(zb), S = 76;
        const p = freeSpot(G, S, occupied(i));
        const e = U.h('div', { class: 'pk', style: { left: p.x + 'px', top: p.y + 'px' } }, icon);
        ctx.tap(e, () => grab(i));
        zb.pa.append(e);
        els.push(e);
      });
      pickup = { type, els, timer: ctx.after(2600, clearPickup) };
      fx.banner(icon, type === 'heart' ? 'Жизнь!' : 'Щит!', 'хватай первым', { ms: 1300 });
    }
    function grab(i) {
      if (!pickup || state !== 'play') return;
      const type = pickup.type, p = ctx.players[i];
      const e = pickup.els.find(x => zones[i].pa.contains(x));
      const at = e ? fx.at(e) : fx.at(zones[i].z.el);
      clearPickup();
      fx.burst(at.x, at.y, type === 'heart' ? '#ff6b9a' : '#7cc8ff', 28, 380, 7);
      fx.ring(at.x, at.y, '#fff', 90);
      if (type === 'heart') {
        if (lives[i] < LIVES) { lives[i]++; fx.text(at.x, at.y, '+❤️', '#fff', i); fx.banner('💖', `${p.name}: +1 жизнь`, null, { color: p.color, fg: '#111', ms: 1300 }); }
        else fx.banner('💖', `${p.name}: и так полный`, null, { ms: 1100 });
      } else {
        shield[i] = true;
        fx.text(at.x, at.y, '🛡️', '#fff', i);
        fx.banner('🛡️', `${p.name}: щит`, 'спасёт от одного взрыва', { color: p.color, fg: '#111', ms: 1400 });
      }
      render();
    }

    // ----- rounds -----
    function pickKind() {
      if (roundNo === 1) return 'normal';
      const pool = ['normal', 'fast', 'chaos', 'tiny', 'code'];
      if (alive().length === 3) pool.push('double', 'double');
      let k;
      do { k = U.pick(pool); } while (k === lastKind);
      return k;
    }

    function newRound() {
      roundNo++;
      if (lives[starter] <= 0) starter = nextOf(starter);
      kind = pickKind();
      lastKind = kind;
      const K = KINDS[kind];
      state = 'pre';
      fx.banner(K.icon, K.name, K.sub, { color: K.color, fg: '#111', ms: 1500 });
      if (kind !== 'normal') fx.flash(K.color, 0.18);
      bombs = [];
      render();
      ctx.after(kind === 'normal' ? 700 : 1400, () => {
        state = 'play';
        passes = 0;
        const holders = kind === 'double' ? [starter, nextOf(starter)] : [starter];
        bombs = holders.map((h, id) => {
          const b = { id, kind, holder: h, fuseStart: ctx.time, fuseEnd: ctx.time + U.rand(K.fuse[0], K.fuse[1]), ang: angleTo(h), angT: angleTo(h), pass: 0, ready: false };
          makeBombEls(b);
          return b;
        });
        bombs.forEach(b => giveTo(b, b.holder));
        if (Math.random() < 0.75) ctx.after(U.rand(1500, 4500), spawnPickup);
      });
    }

    function explode(b) {
      state = 'boom';
      boomT = 1;
      const i = b.holder;
      bombs.forEach(removeEls);
      clearPickup();
      const zb = zones[i], p = ctx.players[i];
      const C = centerXY();
      boomAt = { x: C.x + bombOffset(b).x, y: C.y + bombOffset(b).y };
      const za = fx.at(zb.z.el);
      if (shield[i]) {
        shield[i] = false;
        zb.z.el.classList.remove('saved'); void zb.z.el.offsetWidth; zb.z.el.classList.add('saved');
        fx.burst(boomAt.x, boomAt.y, '#7cc8ff', 50, 520, 8);
        fx.burst(za.x, za.y, '#7cc8ff', 30, 400, 7);
        fx.flash('#7cc8ff', 0.35);
        fx.shake();
        fx.banner('🛡️', 'Щит спас!', p.name, { color: '#7cc8ff', fg: '#111', ms: 1600 });
      } else {
        lives[i]--;
        zb.z.el.classList.remove('boom'); void zb.z.el.offsetWidth; zb.z.el.classList.add('boom');
        for (let k = 0; k < 40; k++) {
          const a = U.rand(0, Math.PI * 2), s = U.rand(120, 520);
          sparks.push({ x: boomAt.x, y: boomAt.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.5, 1) });
        }
        fx.burst(za.x, za.y, '#ffb340', 40, 500, 8);
        fx.flash('#ffc850', 0.45);
        fx.shake();
        fx.text(za.x, za.y, '−❤️', '#fff', i, 46);
        const msg = lives[i] > 0 ? `${p.name}: −1 ❤️` : `${p.name} выбывает!`;
        fx.banner('💥', 'БУМ!', msg, { color: p.color, fg: '#111', ms: 1700 });
      }
      bombs = [];
      render();
      const left = alive();
      if (left.length <= 1) {
        state = 'done';
        ctx.after(1700, () => ctx.end({ winner: left[0], msg: 'Жизни: ' + lives.map((l, k) => `${NAMES[k]} ${Math.max(0, l)}`).join(' · ') }));
        return;
      }
      // the one who exploded starts next (if still in)
      starter = i;
      ctx.after(2100, newRound);
    }

    ctx.loop((dt, t) => {
      if (dt > 0 && state === 'play') {
        const b = bombs.find(x => ctx.time >= x.fuseEnd);
        if (b) explode(b);
      }
      // chaos: the pass button runs around
      if (dt > 0 && state === 'play') {
        for (const b of bombs) {
          if (b.kind !== 'chaos' || !b.ready) continue;
          const G = geo(zones[b.holder]);
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (Math.random() < dt * 1.2) { const a = U.rand(0, 6.283); b.vx = Math.cos(a) * 230; b.vy = Math.sin(a) * 230; }
          const mx = Math.max(0, G.aw - b.S), my = Math.max(0, G.ah - b.S);
          if (b.x < 0 || b.x > mx) { b.vx = -b.vx; b.x = U.clamp(b.x, 0, mx); }
          if (b.y < 0 || b.y > my) { b.vy = -b.vy; b.y = U.clamp(b.y, 0, my); }
          b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
        }
      }
      let prog = 0;
      if (state === 'play') for (const b of bombs) prog = Math.max(prog, U.clamp((ctx.time - b.fuseStart) / 15, 0, 1)); // relative to max fuse: hides real length
      if (state === 'play' && kind === 'fast') prog = Math.min(1, prog * 2.5);
      const freq = 1.1 + 5 * Math.pow(prog, 1.4) + (state === 'play' ? 0.4 * Math.sin(t / 700) : 0);
      phase += dt * Math.PI * 2 * freq;
      for (const b of bombs) {
        let da = b.angT - b.ang;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        b.ang += da * Math.min(1, dt * 14);
        b.pass = Math.max(0, b.pass - dt * 5);
      }
      boomT = Math.max(0, boomT - dt * 0.9);
      for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.96; s.vy *= 0.96; s.life -= dt; }
      for (let k = sparks.length - 1; k >= 0; k--) if (sparks[k].life <= 0) sparks.splice(k, 1);
      draw(t / 1000, prog);
    });

    function centerXY() {
      // center of the free area between zones
      const d = zones[0].z.h;
      if (N === 2) return { x: ctx.W / 2, y: ctx.H / 2, r: Math.min(ctx.W, ctx.H - 2 * d) };
      return { x: ctx.W / 2, y: (ctx.H - d) / 2, r: Math.min(ctx.W - 2 * d, ctx.H - d) };
    }
    function bombR() {
      const C = centerXY();
      return U.clamp(C.r * (bombs.length > 1 ? 0.15 : 0.2), 30, 90);
    }
    function bombOffset(b) {
      const R = bombR();
      const sep = bombs.length > 1 ? (b.id ? 1 : -1) * R * 1.6 : 0;
      return { x: sep + Math.cos(b.ang) * R * 0.5, y: Math.sin(b.ang) * R * 0.5 };
    }

    function drawBomb(b, x, y, R, hc, pulse, prog) {
      const scale = 1 + 0.06 * pulse * (0.5 + prog) + 0.15 * b.pass;
      g.save();
      g.translate(x, y);
      g.rotate(b.ang);
      g.scale(scale, scale);
      // fuse (points along +x = toward holder)
      g.strokeStyle = '#c9a36b';
      g.lineWidth = Math.max(4, R * 0.1);
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(R * 0.85, 0);
      g.quadraticCurveTo(R * 1.25, -R * 0.25, R * 1.45, R * 0.05);
      g.stroke();
      g.fillStyle = '#555c78';
      g.fillRect(R * 0.72, -R * 0.24, R * 0.26, R * 0.48);
      const bg = g.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
      bg.addColorStop(0, b.id ? '#8a8fa8' : '#5a6286');
      bg.addColorStop(1, '#151829');
      g.fillStyle = bg;
      g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
      g.lineWidth = 4;
      g.strokeStyle = U.alpha(hc, 0.6 + 0.4 * pulse);
      g.stroke();
      // kind icon on the bomb
      if (kind !== 'normal') {
        g.rotate(-b.ang);
        g.font = `${Math.round(R * 0.8)}px -apple-system,system-ui,sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.globalAlpha = 0.85;
        g.fillText(KINDS[kind].icon, 0, 0);
        g.globalAlpha = 1;
        g.rotate(b.ang);
      }
      const sx = R * 1.45, sy = R * 0.05;
      const sr = R * (0.16 + 0.12 * pulse);
      const sg = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.2);
      sg.addColorStop(0, '#fff7c2');
      sg.addColorStop(0.4, '#ffb340');
      sg.addColorStop(1, 'rgba(255,90,40,0)');
      g.fillStyle = sg;
      g.beginPath(); g.arc(sx, sy, sr * 2.2, 0, Math.PI * 2); g.fill();
      g.restore();
    }

    function draw(T, prog) {
      const W = ctx.W, H = ctx.H;
      g.clearRect(0, 0, W, H);
      const C = centerXY();
      const R = bombR();
      const pulse = 0.5 + 0.5 * Math.sin(phase);
      // glow toward each holder
      if (state === 'play') {
        for (const b of bombs) {
          const hc = ctx.players[b.holder].color;
          const v = ctx.inward(b.holder);
          const ox = C.x - v.x * R * 1.6, oy = C.y - v.y * R * 1.6;
          const gr = g.createRadialGradient(ox, oy, 0, ox, oy, R * 4);
          gr.addColorStop(0, U.alpha(hc, 0.28 + 0.25 * pulse * prog));
          gr.addColorStop(1, U.alpha(hc, 0));
          g.fillStyle = gr;
          g.fillRect(0, 0, W, H);
        }
      }
      if (boomT > 0) {
        g.fillStyle = `rgba(255,190,80,${boomT * 0.3})`;
        g.fillRect(0, 0, W, H);
        g.strokeStyle = `rgba(255,220,150,${boomT})`;
        g.lineWidth = 12 * boomT;
        g.beginPath(); g.arc(boomAt.x, boomAt.y, (1 - boomT) * Math.max(W, H) * 0.6, 0, Math.PI * 2); g.stroke();
      }
      if (state === 'play') {
        for (const b of bombs) {
          const o = bombOffset(b);
          drawBomb(b, C.x + o.x, C.y + o.y, R, ctx.players[b.holder].color, pulse, prog);
        }
      } else if (state === 'wait' || state === 'pre') {
        // idle bomb waiting in the middle
        drawBomb({ id: 0, ang: angleTo(starter), pass: 0 }, C.x, C.y, R, ctx.players[starter].color, pulse, 0);
      }
      // explosion sparks
      for (const s of sparks) {
        g.fillStyle = `rgba(255,${150 + Math.round(100 * s.life)},60,${Math.min(1, s.life * 1.5)})`;
        g.beginPath(); g.arc(s.x, s.y, 4 + 6 * s.life, 0, Math.PI * 2); g.fill();
      }
    }

    layout();
    ctx.onResize(layout);
    render();
    ctx.after(0, newRound); // starts when the countdown ends
  },
});

</script>
<script>/* games/racing.js */
registerGame({
  id: 'racing',
  title: 'Гонки',
  emoji: '🏎️',
  desc: '3 круга, ящики с сюрпризами и дождь',
  rules: 'Машина газует сама. Держи ◀ или ▶, чтобы поворачивать (◀ против часовой, ▶ по часовой).\n' +
    'Трава сильно тормозит. Машины толкаются. Нужно проехать 3 круга через все чекпоинты: срезать не выйдет.\n' +
    'Собирай ❓ ящики и жми ПРЕДМЕТ:\n' +
    '🚀 Турбо  🍌 Банан (бросаешь назад, кто наедет — крутится)\n' +
    '🛢️ Масло (лужа назад, на ней заносит)  🛡️ Щит от всех ловушек\n' +
    '🧲 Магнит (тянет к сопернику впереди)  ⚡ Молния (тормозит всех соперников)\n' +
    '🆘 Отстающий получает предметы лучше и чуть быстрее едет.\n' +
    '🌧️ Иногда начинается дождь: трасса становится скользкой.\n' +
    'Кто первым проедет 3 круга, тот победил.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n;
    const DEPTH = 0.2, LAPS = 3, NCP = 16, TAU = Math.PI * 2;
    const ITEMS = {
      turbo: { icon: '🚀', name: 'Турбо!', c: '#ff9a3c' },
      banana: { icon: '🍌', name: 'Банан!', c: '#ffe14d' },
      oil: { icon: '🛢️', name: 'Масло!', c: '#8a7cff' },
      shield: { icon: '🛡️', name: 'Щит!', c: '#7fe7ff' },
      magnet: { icon: '🧲', name: 'Магнит!', c: '#ff7ad9' },
      bolt: { icon: '⚡', name: 'Молния!', c: '#fff36b' },
    };
    const WEIGHTS = {
      lead: { banana: 4, oil: 3, shield: 3, turbo: 1 },
      mid: { turbo: 3, banana: 2, oil: 2, magnet: 2, shield: 1, bolt: 1 },
      last: { turbo: 4, magnet: 3, bolt: 3, shield: 1 },
    };

    ctx.root.classList.add('g-racing');
    ctx.root.append(U.h('style', null, `
      .g-racing .zone-inner{display:flex;align-items:stretch;gap:1.4vmin;padding:1.4vmin}
      .g-racing .cb{flex:1 1 0;max-width:24vmin;min-width:0;border-radius:3vmin;border:.5vmin solid var(--pc);color:var(--pc);
        background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
        font-size:8vmin;font-weight:900;touch-action:none;transition:transform .07s,background .07s,box-shadow .07s}
      .g-racing .cb.on{background:var(--pc);color:#0f1220;transform:scale(.95);box-shadow:0 0 3.5vmin var(--pc)}
      .g-racing .mid{flex:1.8 1 0;min-width:0;display:flex;flex-direction:column;gap:1vmin}
      .g-racing .info{display:flex;align-items:center;justify-content:space-between;gap:1vmin;color:#fff;
        font-weight:900;pointer-events:none;padding:0 .6vmin;height:4.8vmin;font-size:3vmin;white-space:nowrap}
      .g-racing .info .pos{color:var(--pc);font-size:3.4vmin}
      .g-racing .info .note{font-size:3vmin;min-width:0;overflow:hidden}
      .g-racing .item{flex:1 1 auto;max-width:none;flex-direction:column;gap:.3vmin;font-size:3vmin;letter-spacing:.2vmin;position:relative}
      .g-racing .item .ic{font-size:6.5vmin;line-height:1;min-height:6.5vmin}
      .g-racing .item.has{background:rgba(255,255,255,.14);box-shadow:0 0 2.5vmin var(--pc);animation:rcPulse .8s ease-in-out infinite alternate}
      .g-racing .item.rolling .ic{animation:rcRoll .12s linear infinite}
      @keyframes rcPulse{from{box-shadow:0 0 1vmin var(--pc)}to{box-shadow:0 0 4vmin var(--pc)}}
      @keyframes rcRoll{from{transform:translateY(-15%)}to{transform:translateY(15%)}}
      .g-racing .zone-inner.flash{animation:rcFlash .6s ease-out}
      @keyframes rcFlash{from{background:rgba(255,255,255,.35)}to{background:transparent}}
    `));

    const C = ctx.canvas();
    const g = C.g;
    let bg = null; // offscreen static track

    /* ---------- geometry ---------- */
    let F = { x: 0, y: 0, w: 100, h: 100 }, T = {};
    function fieldRect() {
      const d = Math.round(DEPTH * Math.min(ctx.W, ctx.H));
      const s = P.map(p => p.side);
      const l = s.includes('left') ? d : 0, r = s.includes('right') ? d : 0;
      const t = s.includes('top') ? d : 0, b = s.includes('bottom') ? d : 0;
      const m = 8, el = N === 2 ? 44 : 0, et = N === 3 ? 44 : 0; // keep the exit button spot free
      return { x: l + m + el, y: t + m + et, w: Math.max(150, ctx.W - l - r - 2 * m - el), h: Math.max(150, ctx.H - t - b - 2 * m - et) };
    }
    function buildTrack() {
      const hw = Math.max(26, Math.min(F.w, F.h) * 0.1);
      const cx = F.x + F.w / 2, cy = F.y + F.h / 2;
      const a = F.w / 2 - hw - 12, b = F.h / 2 - hw - 12;
      const rc = Math.min(a, b) * 0.78;
      const L = 4 * (a - rc) + 4 * (b - rc) + TAU * rc;
      const land = a >= b;
      T = { hw, cx, cy, a, b, rc, L, land, a0: land ? Math.PI / 2 : 0,
        vmax: L / 12, carL: hw * 0.7, carW: hw * 0.4 };
      T.cr = T.carL * 0.45;
    }
    // point on centerline at arc length s (clockwise on screen, from the top-left end of the top straight)
    function pointAt(s) {
      const { a, b, rc, cx, cy } = T;
      const sa = 2 * (a - rc), sb = 2 * (b - rc), q = Math.PI / 2 * rc;
      s = ((s % T.L) + T.L) % T.L;
      const segs = [
        [sa, (d) => [-a + rc + d, -b, 0]],
        [q, (d) => { const t = -Math.PI / 2 + d / rc; return [a - rc + Math.cos(t) * rc, -b + rc + Math.sin(t) * rc, t + Math.PI / 2]; }],
        [sb, (d) => [a, -b + rc + d, Math.PI / 2]],
        [q, (d) => { const t = d / rc; return [a - rc + Math.cos(t) * rc, b - rc + Math.sin(t) * rc, t + Math.PI / 2]; }],
        [sa, (d) => [a - rc - d, b, Math.PI]],
        [q, (d) => { const t = Math.PI / 2 + d / rc; return [-a + rc + Math.cos(t) * rc, b - rc + Math.sin(t) * rc, t + Math.PI / 2]; }],
        [sb, (d) => [-a, b - rc - d, -Math.PI / 2]],
        [q, (d) => { const t = Math.PI + d / rc; return [-a + rc + Math.cos(t) * rc, -b + rc + Math.sin(t) * rc, t + Math.PI / 2]; }],
      ];
      for (const [len, f] of segs) {
        if (s <= len) { const [x, y, ang] = f(s); return { x: cx + x, y: cy + y, ang }; }
        s -= len;
      }
      return { x: cx - a + rc, y: cy - b, ang: 0 };
    }
    // s of the start line (middle of the longest straight)
    const startS = () => T.land ? 2 * (T.a - T.rc) + Math.PI / 2 * T.rc + 2 * (T.b - T.rc) + Math.PI / 2 * T.rc + (T.a - T.rc)
      : 2 * (T.a - T.rc) + Math.PI / 2 * T.rc + (T.b - T.rc);
    function sd(x, y) {
      const px = x - T.cx, py = y - T.cy;
      const qx = Math.abs(px) - T.a + T.rc, qy = Math.abs(py) - T.b + T.rc;
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - T.rc;
    }
    const onTrack = (x, y, k = 1) => Math.abs(sd(x, y)) < T.hw * k;
    function frac(x, y) {
      let f = (Math.atan2(y - T.cy, x - T.cx) - T.a0) / TAU;
      f -= Math.floor(f);
      return f;
    }

    function drawStatic() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      bg = document.createElement('canvas');
      bg.width = Math.round(ctx.W * dpr); bg.height = Math.round(ctx.H * dpr);
      const b = bg.getContext('2d');
      b.setTransform(dpr, 0, 0, dpr, 0, 0);
      b.fillStyle = '#0f1220'; b.fillRect(0, 0, ctx.W, ctx.H);
      // grass with stripes
      b.fillStyle = '#1d4a2c';
      b.beginPath(); b.roundRect(F.x, F.y, F.w, F.h, 16); b.fill();
      b.save(); b.clip();
      b.fillStyle = 'rgba(255,255,255,.035)';
      for (let k = -F.h; k < F.w; k += 36) {
        b.beginPath(); b.moveTo(F.x + k, F.y); b.lineTo(F.x + k + 18, F.y); b.lineTo(F.x + k + 18 + F.h, F.y + F.h); b.lineTo(F.x + k + F.h, F.y + F.h); b.fill();
      }
      for (let k = 0; k < 40; k++) {
        const x = F.x + Math.random() * F.w, y = F.y + Math.random() * F.h;
        if (onTrack(x, y, 1.3)) continue;
        b.font = `${T.hw * 0.5}px sans-serif`; b.globalAlpha = 0.5;
        b.fillText(Math.random() < 0.5 ? '🌳' : '🌿', x, y);
      }
      b.globalAlpha = 1;
      b.restore();
      const path = new Path2D();
      path.roundRect(T.cx - T.a, T.cy - T.b, T.a * 2, T.b * 2, T.rc);
      // curbs
      b.lineJoin = 'round';
      b.strokeStyle = '#e8ecff'; b.lineWidth = T.hw * 2 + 12; b.stroke(path);
      b.strokeStyle = '#ff4d5e'; b.setLineDash([16, 16]); b.stroke(path); b.setLineDash([]);
      // asphalt
      b.strokeStyle = '#3a3f55'; b.lineWidth = T.hw * 2; b.stroke(path);
      b.strokeStyle = 'rgba(255,255,255,.04)'; b.lineWidth = T.hw * 1.2; b.stroke(path);
      // center dashes
      b.strokeStyle = 'rgba(255,255,255,.35)'; b.lineWidth = 3; b.setLineDash([22, 22]); b.stroke(path); b.setLineDash([]);
      // start line (checkered)
      const sp = pointAt(startS());
      b.save(); b.translate(sp.x, sp.y); b.rotate(sp.ang + Math.PI / 2);
      const cs = T.hw / 4;
      for (let i = 0; i < 8; i++) for (let j = 0; j < 2; j++) {
        b.fillStyle = (i + j) % 2 ? '#111' : '#fff';
        b.fillRect(-T.hw + i * cs, -cs + j * cs, cs, cs);
      }
      b.restore();
      // direction arrows
      for (let k = 1; k < 8; k++) {
        const p = pointAt(startS() + T.L * k / 8);
        b.save(); b.translate(p.x, p.y); b.rotate(p.ang);
        b.fillStyle = 'rgba(255,255,255,.12)';
        b.beginPath(); b.moveTo(T.hw * 0.35, 0); b.lineTo(-T.hw * 0.15, -T.hw * 0.3); b.lineTo(-T.hw * 0.15, T.hw * 0.3); b.fill();
        b.restore();
      }
    }

    let firstLayout = true;
    function layout() {
      const oF = F;
      F = fieldRect();
      buildTrack();
      drawStatic();
      boxes.forEach(bx => { const p = pointAt(bx.s); const n = { x: -Math.sin(p.ang), y: Math.cos(p.ang) }; bx.x = p.x + n.x * bx.lat * T.hw; bx.y = p.y + n.y * bx.lat * T.hw; });
      if (firstLayout) { firstLayout = false; return; }
      const map = (o) => { o.x = F.x + (o.x - oF.x) / oF.w * F.w; o.y = F.y + (o.y - oF.y) / oF.h * F.h; };
      cars.forEach(c => { map(c); c.vx *= F.w / oF.w; c.vy *= F.h / oF.h; });
      hazards.forEach(map); parts.forEach(map); skids.forEach(map);
    }

    /* ---------- state ---------- */
    const cars = P.map(p => ({
      i: p.i, c: p.color, x: 0, y: 0, ang: 0, vx: 0, vy: 0, spd: 0,
      cps: 0, finished: false, item: null, rolling: 0, rollIcon: '❓',
      turbo: 0, spin: 0, oil: 0, shield: 0, magnet: 0, slow: 0, bump: 0, warned: 0, lastLapSaid: false, grass: 0,
    }));
    let boxes = [], hazards = [], parts = [], skids = [], floats = [];
    let rain = 0, rainDrops = [], ended = false, raceT = 0, flashA = 0, flashC = '#fff', shake = 0;
    for (const sf of [0.3, 0.72]) for (const lat of [-0.55, 0, 0.55]) boxes.push({ sfrac: sf, lat, s: 0, x: 0, y: 0, cd: 0 });

    layout();
    function placeBoxes() { boxes.forEach(b => { b.s = startS() + T.L * b.sfrac; }); layout(); }
    placeBoxes();
    ctx.onResize(() => { layout(); });

    function gridStart() {
      const st = pointAt(startS());
      const fwd = { x: Math.cos(st.ang), y: Math.sin(st.ang) }, nrm = { x: -fwd.y, y: fwd.x };
      const lats = N === 2 ? [-0.45, 0.45] : [-0.6, 0, 0.6];
      const order = U.shuffle(cars.map((_, i) => i));
      order.forEach((ci, k) => {
        const c = cars[ci], back = T.carL * 1.6;
        c.x = st.x - fwd.x * back + nrm.x * lats[k] * T.hw;
        c.y = st.y - fwd.y * back + nrm.y * lats[k] * T.hw;
        c.ang = st.ang;
      });
    }
    gridStart();

    /* ---------- progress ---------- */
    const sector = (c) => Math.floor(frac(c.x, c.y) * NCP) % NCP;
    const lapOf = (c) => Math.max(0, Math.floor((c.cps - 1) / NCP));
    function key(c) {
      if (c.finished) return 1e6 - c.finishT;
      const f = frac(c.x, c.y) * NCP;
      const cur = Math.floor(f) % NCP, exp = (c.cps - 1 + NCP) % NCP;
      return c.cps + (c.cps > 0 && cur === exp ? f - Math.floor(f) : 0);
    }
    function ranks() {
      const order = cars.slice().sort((a, b) => key(b) - key(a));
      const r = [];
      order.forEach((c, k) => { r[c.i] = k; });
      return r;
    }
    let rank = cars.map((_, i) => i);

    /* ---------- UI ---------- */
    const allBtns = [];
    function holdBtn(label) {
      const b = U.h('div', { class: 'cb' }, label);
      b.ids = new Set();
      ctx.pointer(b, {
        down: (id) => { b.ids.add(id); b.classList.add('on'); },
        up: (id) => { b.ids.delete(id); if (!b.ids.size) b.classList.remove('on'); },
      });
      allBtns.push(b);
      return b;
    }
    const releaseAll = (e) => allBtns.forEach(b => { if (b.ids.delete(e.pointerId) && !b.ids.size) b.classList.remove('on'); });
    window.addEventListener('pointerup', releaseAll);
    window.addEventListener('pointercancel', releaseAll);
    ctx.onCleanup(() => { window.removeEventListener('pointerup', releaseAll); window.removeEventListener('pointercancel', releaseAll); });

    const ui = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      z.el.style.background = `linear-gradient(0deg, ${U.alpha(p.color, .22)}, ${U.alpha(p.color, .05)})`;
      z.el.style.borderTop = `2px solid ${U.alpha(p.color, .6)}`;
      const L = holdBtn('◀︎'), R = holdBtn('▶︎');
      const ic = U.h('div', { class: 'ic' }, '');
      const lbl = U.h('div', null, 'ПРЕДМЕТ');
      const item = U.h('div', { class: 'cb item' }, ic, lbl);
      ctx.tap(item, () => useItem(p.i));
      const pos = U.h('div', { class: 'pos' }), lap = U.h('div'), note = U.h('div', { class: 'note' });
      const mid = U.h('div', { class: 'mid' }, U.h('div', { class: 'info' }, pos, note, lap), item);
      z.el.append(L, mid, R);
      return { z, L, R, item, ic, lbl, pos, lap, note, cache: {} };
    });
    const MEDAL = ['🥇 1-й', '🥈 2-й', '🥉 3-й'];
    function renderUI() {
      cars.forEach((c, i) => {
        const u = ui[i], k = u.cache;
        const pos = MEDAL[rank[i]];
        if (k.pos !== pos) { k.pos = pos; u.pos.textContent = pos; }
        const lap = c.finished ? '🏁 финиш' : `🏁 ${Math.min(LAPS, lapOf(c) + 1)}/${LAPS}`;
        if (k.lap !== lap) { k.lap = lap; u.lap.textContent = lap; }
        let note = '';
        if (rain > 0) note = '🌧️';
        if (rank[i] === N - 1 && !c.finished) note += '🆘';
        if (k.note !== note) { k.note = note; u.note.textContent = note; }
        const ic = c.rolling > 0 ? c.rollIcon : c.item ? ITEMS[c.item].icon : '';
        if (k.ic !== ic) { k.ic = ic; u.ic.textContent = ic; }
        const lbl = c.rolling > 0 ? '…' : c.item ? 'ЖМИ!' : 'ПРЕДМЕТ';
        if (k.lbl !== lbl) { k.lbl = lbl; u.lbl.textContent = lbl; }
        u.item.classList.toggle('has', !!c.item && c.rolling <= 0);
        u.item.classList.toggle('rolling', c.rolling > 0);
      });
    }
    function zoneFlash(i) { const el = ui[i].z.el; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

    /* ---------- effects ---------- */
    function burst(x, y, color, n, sp, size, life) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, s = U.rand(sp * 0.3, sp);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life || 1, c: color, r: U.rand(size * 0.5, size) });
      }
    }
    function floatText(i, x, y, text, color) { floats.push({ i, x, y, text, c: color || '#fff', t: 0 }); }
    function say(text, o) { return ctx.toast(text, Object.assign({ ms: 1500, offset: Math.min(F.w, F.h) * (N === 2 ? 0.16 : 0.22) }, o || {})); }

    /* ---------- items ---------- */
    function rollItem(c) {
      const r = rank[c.i];
      const w = r === 0 ? WEIGHTS.lead : r === N - 1 ? WEIGHTS.last : WEIGHTS.mid;
      let tot = 0; for (const k in w) tot += w[k];
      let x = Math.random() * tot;
      for (const k in w) { x -= w[k]; if (x <= 0) return k; }
      return 'turbo';
    }
    function behind(c, d) { return { x: c.x - Math.cos(c.ang) * d, y: c.y - Math.sin(c.ang) * d }; }
    function aheadOf(c) {
      const order = cars.slice().sort((a, b) => key(b) - key(a));
      const k = order.indexOf(c);
      return k > 0 ? order[k - 1] : null;
    }
    function useItem(i) {
      const c = cars[i];
      if (!c.item || c.rolling > 0 || ended || c.finished) return;
      const it = c.item; c.item = null;
      const info = ITEMS[it];
      floatText(i, c.x, c.y - T.carL, `${info.icon} ${info.name}`, info.c);
      if (it === 'turbo') { c.turbo = 2.0; burst(c.x, c.y, '#ff9a3c', 16, 220, 4); }
      if (it === 'banana') { const p = behind(c, T.carL * 1.1); hazards.push({ k: 'banana', x: p.x, y: p.y, r: T.hw * 0.28, owner: i, t: 0, life: 40 }); }
      if (it === 'oil') { const p = behind(c, T.carL * 1.4); hazards.push({ k: 'oil', x: p.x, y: p.y, r: T.hw * 0.62, owner: i, t: 0, life: 12 }); }
      if (it === 'shield') { c.shield = 6; }
      if (it === 'magnet') {
        c.magnet = 2.6;
        const tg = aheadOf(c);
        if (!tg) floatText(i, c.x, c.y, 'впереди никого 🙂', '#fff');
      }
      if (it === 'bolt') {
        flashA = 0.6; flashC = '#fff36b'; shake = 8;
        say(`⚡ ${P[i].name}: молния!`, { color: '#fff36b', fg: '#111', ms: 1300 });
        cars.forEach(o => {
          if (o === c || o.finished) return;
          if (o.shield > 0) { floatText(o.i, o.x, o.y - T.carL, '🛡️ отбито!', '#7fe7ff'); return; }
          o.slow = 2.4; o.spd *= 0.5;
          burst(o.x, o.y, '#fff36b', 18, 260, 4);
        });
      }
      renderUI();
    }

    /* ---------- events ---------- */
    let rainPlanned = U.rand(10, 22);
    function startRain() {
      rain = 15;
      say('🌧️ Дождь! Трасса скользкая', { color: '#5aa9ff', fg: '#fff', ms: 1900 });
      flashA = 0.3; flashC = '#5aa9ff';
    }
    ctx.after(1, () => say('ГАЗ! 🏁', { color: '#3ddc97', fg: '#111', ms: 900 }));

    function finish(c) {
      c.finished = true; c.finishT = raceT;
      if (ended) return;
      ended = true;
      flashA = 0.6; flashC = c.c;
      burst(c.x, c.y, c.c, 70, 500, 6, 1.4);
      burst(c.x, c.y, '#fff', 40, 400, 4, 1.4);
      say(`🏁 ${P[c.i].name} побеждает!`, { color: c.c, fg: '#111', ms: 1800 });
      const sc = cars.map(o => Math.min(LAPS, lapOf(o)));
      ctx.after(1900, () => ctx.end({ winner: c.i, scores: sc, msg: 'Первым проехал 3 круга' }));
    }

    /* ---------- simulation ---------- */
    function hitHazard(c, h) {
      if (c.shield > 0) { floatText(c.i, c.x, c.y - T.carL, '🛡️ щит спас!', '#7fe7ff'); burst(h.x, h.y, '#7fe7ff', 12, 200, 3); return true; }
      if (h.k === 'banana') {
        c.spin = 1.1; c.spd *= 0.3; shake = 6;
        floatText(c.i, c.x, c.y - T.carL, '🍌 Занесло!', '#ffe14d');
        burst(h.x, h.y, '#ffe14d', 18, 250, 4);
        return true;
      }
      if (h.k === 'oil') {
        if (c.oil <= 0) floatText(c.i, c.x, c.y - T.carL, '🛢️ Скользко!', '#b9b0ff');
        c.oil = 0.9;
        return false;
      }
      return false;
    }
    function update(dt) {
      raceT += dt;
      if (rainPlanned > 0 && raceT > rainPlanned) { rainPlanned = -1; startRain(); }
      rain = Math.max(0, rain - dt);
      if (rain > 0 && rain - dt <= 0) say('☀️ Дождь кончился', { ms: 1200 });
      rank = ranks();
      const lastI = cars.findIndex((_, i) => rank[i] === N - 1);
      for (const c of cars) {
        for (const k of ['turbo', 'spin', 'oil', 'shield', 'magnet', 'slow', 'bump', 'warned']) c[k] = Math.max(0, c[k] - dt);
        if (c.rolling > 0) {
          c.rolling -= dt;
          if (Math.random() < dt * 14) c.rollIcon = ITEMS[U.pick(Object.keys(ITEMS))].icon;
          if (c.rolling <= 0) {
            zoneFlash(c.i);
            if (rank[c.i] === N - 1 && N > 1 && (c.item === 'bolt' || c.item === 'magnet' || c.item === 'turbo'))
              floatText(c.i, c.x, c.y - T.carL, '🆘 Удачный ящик!', '#fff');
          }
        }
        const u = ui[c.i];
        let steer = 0;
        if (u.L.ids.size) steer -= 1;
        if (u.R.ids.size) steer += 1;
        const on = onTrack(c.x, c.y);
        const rb = (c.i === lastI && N > 1 && !c.finished) ? 1.05 : 1;
        let vmax = T.vmax * rb;
        if (!on && c.turbo <= 0 && c.magnet <= 0) vmax *= 0.4;
        if (c.turbo > 0) vmax *= 1.65;
        if (c.slow > 0) vmax *= 0.55;
        if (c.finished) vmax *= 0.5;
        const acc = c.spd < vmax ? T.vmax * 0.9 : T.vmax * (on ? 1.2 : 2.6);
        c.spd += U.clamp(vmax - c.spd, -acc * dt, acc * dt);
        if (c.spin > 0) {
          c.ang += dt * 13;
        } else {
          const turn = 2.7 * (c.oil > 0 ? 0.35 : 1) * (0.6 + 0.4 * Math.min(1, c.spd / T.vmax));
          c.ang += steer * turn * dt;
        }
        let grip = rain > 0 ? 2.3 : 9;
        if (c.oil > 0) grip = 0.9;
        if (c.spin > 0) grip = 1.5;
        const hx = Math.cos(c.ang), hy = Math.sin(c.ang);
        let tx = hx * c.spd, ty = hy * c.spd;
        if (c.magnet > 0) {
          const tg = aheadOf(c);
          if (tg) {
            const dx = tg.x - c.x, dy = tg.y - c.y, d = Math.hypot(dx, dy) || 1;
            tx += dx / d * T.vmax * 0.5; ty += dy / d * T.vmax * 0.5;
            if (Math.random() < dt * 20) parts.push({ x: c.x + dx * Math.random(), y: c.y + dy * Math.random(), vx: 0, vy: 0, life: 0.5, c: '#ff7ad9', r: 3 });
          }
        }
        const k = Math.min(1, grip * dt);
        c.vx += (tx - c.vx) * k; c.vy += (ty - c.vy) * k;
        c.x += c.vx * dt; c.y += c.vy * dt;
        // field bounds
        if (c.x < F.x + T.cr) { c.x = F.x + T.cr; c.vx = Math.abs(c.vx) * 0.4; }
        if (c.x > F.x + F.w - T.cr) { c.x = F.x + F.w - T.cr; c.vx = -Math.abs(c.vx) * 0.4; }
        if (c.y < F.y + T.cr) { c.y = F.y + T.cr; c.vy = Math.abs(c.vy) * 0.4; }
        if (c.y > F.y + F.h - T.cr) { c.y = F.y + F.h - T.cr; c.vy = -Math.abs(c.vy) * 0.4; }
        // effects
        const slip = Math.hypot(c.vx - hx * c.spd, c.vy - hy * c.spd);
        if (slip > T.vmax * 0.35 && skids.length < 600 && on) skids.push({ x: c.x, y: c.y, a: 0.5 });
        if (!on && c.spd > 30 && Math.random() < dt * 25) parts.push({ x: c.x, y: c.y, vx: U.rand(-40, 40), vy: U.rand(-40, 40), life: 0.7, c: Math.random() < 0.5 ? '#6b8f3a' : '#8a6a3c', r: U.rand(2, 5) });
        if (c.turbo > 0 && Math.random() < dt * 50) {
          const b = behind(c, T.carL * 0.55);
