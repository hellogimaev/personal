      .g-math .ob.right{background:rgba(61,220,151,.35)}
      .g-math .ob.gone{opacity:.12;pointer-events:none}
      .g-math .ob.hidden{display:none}
      .g-math .ob.blank{opacity:.25}
      .g-math .mz.locked .ob:not(.bad){opacity:.3}
      .g-math .mz.won{box-shadow:0 0 0 5px var(--pc) inset, 0 0 40px var(--pc)}
      @keyframes mathShake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
      @keyframes mathOk{0%{scale:1}50%{scale:1.12}100%{scale:1}}
      .g-math .pips{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
      .g-math .pips div{display:flex;gap:8px;align-items:center}
      .g-math .pips span{border-radius:50%;border:3px solid;opacity:.9;transition:background .3s}
      .g-math .pips em{font-style:normal;font-size:18px;width:22px;text-align:center}
      .g-math .coin{position:absolute;z-index:45;font-size:44px;font-weight:900;pointer-events:none;transform:translate(-50%,-50%);
        transition:left .75s cubic-bezier(.5,-0.3,.5,1.3),top .75s cubic-bezier(.5,-0.3,.5,1.3),opacity .3s}
      .fx-flash{position:absolute;inset:0;z-index:36;pointer-events:none;transition:opacity .55s ease-out}
      .fx-shake{animation:fxShake .35s}
      @keyframes fxShake{0%,100%{translate:0 0}20%{translate:-9px 4px}40%{translate:8px -5px}60%{translate:-6px -3px}80%{translate:5px 3px}}
      .toast.fx-ban{font-size:26px;text-align:center;line-height:1.15;border:2px solid rgba(255,255,255,.3);animation:fxPop .4s ease-out;padding:10px 20px}
      .toast.fx-ban b{font-size:34px;margin-right:8px;vertical-align:-4px}
      .toast.fx-ban small{display:block;font-size:16px;font-weight:700;opacity:.85;margin-top:2px}
      @keyframes fxPop{0%{scale:.3;opacity:0}60%{scale:1.12;opacity:1}100%{scale:1}}
    `));

    // ---------- juice: particles, flashes, shake, announcements ----------
    const fx = (() => {
      const { cv, g } = ctx.canvas({ z: 35 });
      cv.style.pointerEvents = 'none';
      const ps = [];
      const layer = U.h('div', { class: 'toast-layer' });
      ctx.root.append(layer);
      const active = [];
      const api = {
        at(el) {
          const r = el.getBoundingClientRect(), R = ctx.root.getBoundingClientRect();
          return { x: r.left - R.left + r.width / 2, y: r.top - R.top + r.height / 2 };
        },
        burst(x, y, color, n = 22, sp = 360, size = 6) {
          for (let k = 0; k < n; k++) {
            const a = Math.random() * 6.283, s = sp * (0.35 + Math.random() * 0.65), l = 0.5 + Math.random() * 0.5;
            ps.push({ kind: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, color, size: size * (0.6 + Math.random() * 0.8) });
          }
        },
        ring(x, y, color, r = 90) { ps.push({ kind: 'r', x, y, life: 0.5, max: 0.5, color, r }); },
        text(x, y, str, color, i, size = 38) {
          const v = ctx.toScreen(i, 0, -60);
          ps.push({ kind: 't', x, y, vx: v.x, vy: v.y, str, color, rot: ctx.players[i].rot, size, life: 1.1, max: 1.1 });
        },
        flash(color, a = 0.3) {
          const d = U.h('div', { class: 'fx-flash', style: { background: color, opacity: a } });
          ctx.root.append(d); void d.offsetWidth; d.style.opacity = 0;
          setTimeout(() => d.remove(), 700);
        },
        shake(el = ctx.root) { el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake'); },
        // announcement facing each player, just in front of their own zone (stacks if several are shown)
        banner(icon, title, sub, o = {}) {
          ctx.players.forEach(p => {
            const e = U.h('div', { class: 'toast fx-ban' }, U.h('b', null, icon), title, sub ? U.h('small', null, sub) : null);
            if (o.color) e.style.background = o.color;
            if (o.fg) e.style.color = o.fg;
            const z = zones[p.i].z, r = z.rect, v = ctx.inward(p.i);
            Object.assign(e.style, { maxWidth: (z.w - 16) + 'px', whiteSpace: 'normal' });
            layer.append(e);
            // room between this zone's inner edge and the screen center; drop older banners that would not fit
            const ex = r.x + r.w / 2 + v.x * z.h / 2, ey = r.y + r.h / 2 + v.y * z.h / 2;
            const room = (ctx.W / 2 - ex) * v.x + (ctx.H / 2 - ey) * v.y;
            const mine = active.filter(a => a.i === p.i);
            const sum = () => mine.reduce((s, a) => s + a.e.offsetHeight + 8, 0);
            while (mine.length && sum() + e.offsetHeight + 12 > Math.max(room, e.offsetHeight + 12)) {
              const old = mine.shift(); old.e.remove(); active.splice(active.indexOf(old), 1);
            }
            const stack = sum();
            const off = z.h / 2 + 12 + stack + e.offsetHeight / 2;
            Object.assign(e.style, { left: (r.x + r.w / 2 + v.x * off) + 'px', top: (r.y + r.h / 2 + v.y * off) + 'px', transform: `translate(-50%,-50%) rotate(${p.rot}deg)` });
            const a = { i: p.i, e };
            active.push(a);
            ctx.after(o.ms ?? 1700, () => { e.remove(); const k = active.indexOf(a); if (k >= 0) active.splice(k, 1); });
          });
        },
      };
      ctx.loop((dt) => {
        g.clearRect(0, 0, ctx.W, ctx.H);
        const damp = Math.exp(-3 * dt);
        for (let k = ps.length - 1; k >= 0; k--) {
          const p = ps[k];
          p.life -= dt;
          if (p.life <= 0) { ps.splice(k, 1); continue; }
          const f = p.life / p.max;
          if (p.kind === 'p') {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp;
            g.globalAlpha = Math.min(1, f * 1.5);
            g.fillStyle = p.color;
            g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * f), 0, 6.283); g.fill();
          } else if (p.kind === 'r') {
            g.globalAlpha = f;
            g.strokeStyle = p.color; g.lineWidth = 8 * f + 1;
            g.beginPath(); g.arc(p.x, p.y, p.r * (1 - f) + 10, 0, 6.283); g.stroke();
          } else {
            p.x += p.vx * dt; p.y += p.vy * dt;
            g.save();
            g.globalAlpha = Math.min(1, f * 2);
            g.translate(p.x, p.y); g.rotate(p.rot * Math.PI / 180);
            g.font = `900 ${p.size}px -apple-system,system-ui,sans-serif`;
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(p.str, 0, 0);
            g.fillStyle = p.color; g.fillText(p.str, 0, 0);
            g.restore();
          }
        }
        g.globalAlpha = 1;
      });
      return api;
    })();

    // center: score pips (no text, so readable from every side)
    const pipsEl = U.h('div', { class: 'pips' });
    const pipRows = ctx.players.map(p => {
      const row = U.h('div');
      for (let k = 0; k < TARGET; k++) row.append(U.h('span', { style: { borderColor: p.color } }));
      row.append(U.h('em'));
      pipsEl.append(row);
      return row;
    });
    ctx.root.append(pipsEl);

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH, className: 'mz' });
      const q = U.h('div', { class: 'q' }, '…');
      const sc = U.h('div', { class: 'sc' }, '0/' + TARGET);
      const tag = U.h('div', { class: 'tag' }, '');
      const tmBar = U.h('i');
      const tm = U.h('div', { class: 'tm' }, tmBar);
      const hd = U.h('div', { class: 'hd' }, tag, q, sc, tm);
      const opts = U.h('div', { class: 'opts' });
      const btns = [0, 1, 2, 3].map(k => {
        const b = U.h('div', { class: 'ob' }, '');
        ctx.tap(b, () => answer(p.i, k));
        opts.append(b);
        return b;
      });
      z.el.append(hd, opts);
      return { z, q, sc, tag, hd, opts, btns, tm, tmBar, qf: 40, qw: 200 };
    });

    let nOpts = 4;
    function layout() {
      for (const zb of zones) {
        const w = zb.z.w - 24, h = zb.z.h - 22;
        const wide = w / h >= 2.1;
        const cols = nOpts === 3 ? 3 : nOpts === 2 ? 2 : wide ? 4 : 2;
        const rows = Math.ceil(nOpts / cols);
        const hh = Math.round(h * (rows === 1 ? 0.36 : 0.3));
        zb.hd.style.height = hh + 'px';
        zb.sc.style.fontSize = zb.tag.style.fontSize = Math.round(U.clamp(hh * 0.3, 16, 24)) + 'px';
        zb.qf = Math.round(Math.min(hh * 0.72, 56));
        zb.qw = w - 2 * (Math.max(zb.sc.offsetWidth, zb.tag.offsetWidth) + 10);
        fit(zb);
        zb.opts.style.gridTemplateColumns = `repeat(${cols},1fr)`;
        const bh = (h - hh - 10 * (rows - 1)) / rows, bw = (w - 10 * (cols - 1)) / cols;
        const bf = Math.round(Math.min(bh * 0.5, bw * 0.3, 44));
        zb.btns.forEach(b => { b.style.fontSize = bf + 'px'; });
      }
      const s = Math.max(10, Math.min(18, (Math.min(ctx.W, ctx.H) * 0.3) / TARGET - 8));
      pipsEl.querySelectorAll('span').forEach(e => { e.style.width = e.style.height = s + 'px'; });
    }

    // shrink the problem text until it fits between the pills
    function fit(zb, scale = 1) {
      let f = Math.round((zb.qf || 40) * scale);
      zb.q.style.fontSize = f + 'px';
      while (f > 14 && zb.q.scrollWidth > zb.qw) { f -= 2; zb.q.style.fontSize = f + 'px'; }
    }

    function renderScores() {
      zones.forEach((zb, i) => { zb.sc.textContent = score[i] + '/' + TARGET; });
      pipRows.forEach((row, i) => {
        [...row.querySelectorAll('span')].forEach((e, k) => { e.style.background = k < score[i] ? ctx.players[i].color : 'transparent'; });
        row.querySelector('em').textContent = lastWinner === i && streak >= 2 ? '🔥' : '';
      });
    }

    // ----- problems -----
    const R = U.randInt;
    function arith(L) {
      const t = Math.random();
      let text, ans, a, b, c, kind;
      if (t < 0.25) {
        kind = 'add';
        if (L === 0) { a = R(13, 59); b = R(12, 49); } else if (L === 1) { a = R(25, 89); b = R(25, 89); } else { a = R(105, 399); b = R(26, 99); }
        ans = a + b; text = `${a} + ${b}`;
      } else if (t < 0.5) {
        kind = 'sub';
        if (L === 0) { a = R(31, 99); b = R(12, a - 9); } else if (L === 1) { a = R(100, 199); b = R(25, 99); } else { a = R(200, 499); b = R(45, 199); }
        ans = a - b; text = `${a} − ${b}`;
      } else if (t < 0.75 - L * 0.1) {
        kind = 'mul';
        if (L === 0) { a = R(3, 9); b = R(3, 9); } else if (L === 1) { a = R(3, 12); b = R(4, 12); } else { a = R(11, 19); b = R(3, 9); }
        ans = a * b; text = `${a} × ${b}`;
      } else {
        kind = 'mul'; a = R(3, 9 + L); b = R(3, 9); c = R(5, 29 + L * 20);
        const m = a * b, f = Math.random();
        if (f < 0.4 && m - c >= 0) { ans = m - c; text = `${a} × ${b} − ${c}`; }
        else if (f < 0.7) { ans = m + c; text = `${a} × ${b} + ${c}`; }
        else { ans = c + m; text = `${c} + ${a} × ${b}`; }
      }
      // distractors close to the answer
      let cands = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + 9, ans - 11];
      if (kind === 'mul') cands = cands.concat([ans + a, ans - a, ans + b, ans - b, ans + a, ans - b]);
      if (ans >= 10) { const r = +String(ans).split('').reverse().join(''); if (r !== ans) cands.push(r); }
      const out = [ans];
      for (const x of U.shuffle(cands)) { if (out.length >= 4) break; if (x >= 0 && !out.includes(x)) out.push(x); }
      for (let k = 3; out.length < 4; k++) if (!out.includes(ans + k)) out.push(ans + k);
      return { text, ans: String(ans), opts: out.map(String) };
    }
    function signProblem(L) {
      for (;;) {
        const op = U.pick(['+', '−', '×', '÷']);
        let a, b;
        if (op === '÷') { b = R(2, 9); a = b * R(2, 12); }
        else if (op === '×') { a = R(3, 9 + L * 3); b = R(3, 9); }
        else { a = R(12, 60 + L * 30); b = R(4, Math.min(a - 1, 40)); }
        const res = { '+': a + b, '−': a - b, '×': a * b, '÷': a % b === 0 ? a / b : NaN };
        const c = res[op];
        if (Object.keys(res).filter(k => res[k] === c).length > 1) continue;
        return { text: `${a} ? ${b} = ${c}`, ans: op, opts: ['+', '−', '×', '÷'] };
      }
    }
    function expr(v) {
      // random expression whose value is v
      if (Math.random() < 0.5 || v < 20) { const x = R(Math.max(1, Math.round(v * 0.25)), Math.max(2, Math.round(v * 0.75))); return `${x} + ${v - x}`; }
      const y = R(5, 30); return `${v + y} − ${y}`;
    }
    function cmpProblem(L) {
      const a = R(3, 9 + L * 2), b = R(4, 12);
      const v1 = a * b;
      const d = Math.random() < 0.25 ? 0 : U.pick([-3, -2, -1, 1, 2, 3]) * (L + 1);
      const v2 = Math.max(4, v1 + d);
      const left = `${a} × ${b}`, right = expr(v2);
      const ans = v1 > v2 ? '>' : v1 < v2 ? '<' : '=';
      return { text: `${left}  ?  ${right}`, ans, opts: ['<', '=', '>'] };
    }
    function makeProblem() {
      const L = Math.min(2, Math.floor((num - 1) / 6));
      if (mode === 'sign') return signProblem(L);
      if (mode === 'cmp') return cmpProblem(L);
      return arith(L);
    }

    function pickMode() {
      if (num <= 1) return 'normal';
      const pool = ['normal', 'normal', 'normal', 'blitz', 'double', 'sign', 'cmp', 'risk'];
      const max = Math.max(...score);
      if (max >= 2) pool.push('steal');
      let m;
      do { m = U.pick(pool); } while (m !== 'normal' && m === lastMode);
      return m;
    }

    function next() {
      num++;
      mode = pickMode();
      lastMode = mode;
      locked = new Set();
      zones.forEach(zb => { zb.z.el.classList.remove('locked', 'won'); zb.tm.classList.toggle('blitz', mode === 'blitz'); });
      if (mode === 'normal') { show(); return; }
      const M = MODES[mode];
      state = 'pre';
      fx.banner(M.icon, M.name, M.sub, { color: M.color, fg: '#111', ms: 1500 });
      fx.flash(M.color, 0.18);
      zones.forEach(zb => {
        zb.q.className = 'q pre';
        zb.q.style.setProperty('--mc', M.color);
        zb.q.textContent = `${M.icon} ${M.name}`;
        fit(zb, 0.65);
        zb.tag.style.display = 'block';
        zb.tag.textContent = M.icon;
        zb.btns.forEach(b => { b.className = 'ob blank'; b.textContent = ''; });
      });
      ctx.after(1300, show);
    }

    function show() {
      prob = makeProblem();
      if (nOpts !== prob.opts.length) { nOpts = prob.opts.length; }
      popts = ctx.players.map(() => U.shuffle(prob.opts));
      state = 'q';
      qStart = ctx.time;
      qLimit = mode === 'blitz' ? 4000 : LIMIT;
      const maxS = Math.max(...score);
      const newHints = [];
      zones.forEach((zb, i) => {
        zb.q.className = 'q';
        zb.q.textContent = prob.text;
        zb.tag.style.display = mode === 'normal' ? 'none' : 'block';
        zb.btns.forEach((b, k) => {
          b.className = 'ob' + (k >= nOpts ? ' hidden' : '');
          b.textContent = k < nOpts ? popts[i][k] : '';
        });
        // 🆘 comeback hint: remove one wrong option
        if (maxS - score[i] >= 3) {
          const wrong = [];
          for (let k = 0; k < nOpts; k++) if (popts[i][k] !== prob.ans) wrong.push(k);
          const k = U.pick(wrong);
          zb.btns[k].classList.add('gone');
          zb.btns[k].textContent = '✕';
          if (!hinted[i]) { hinted[i] = true; newHints.push(ctx.players[i].name); }
        }
      });
      if (newHints.length) fx.banner('🆘', 'Подсказка', newHints.join(', ') + ': один неверный ответ убран', { ms: 1600 });
      layout();
      timeoutId = ctx.after(qLimit, () => { fx.banner('⏰', 'Время вышло', null, { ms: 1000 }); reveal(-1); });
    }

    function fly(from, to, str) {
      const e = U.h('div', { class: 'coin', style: { left: from.x + 'px', top: from.y + 'px' } }, str);
      ctx.root.append(e);
      void e.offsetWidth;
      e.style.left = to.x + 'px';
      e.style.top = to.y + 'px';
      ctx.after(800, () => { fx.burst(to.x, to.y, '#ffd84a', 20, 300, 6); e.remove(); });
    }

    function answer(i, k) {
      if (state !== 'q' || locked.has(i)) return;
      const zb = zones[i], p = ctx.players[i];
      const b = zb.btns[k];
      const at = fx.at(b);
      if (popts[i][k] === prob.ans) {
        const gain = mode === 'double' || mode === 'risk' ? 2 : 1;
        score[i] += gain;
        b.classList.add('ok');
        zb.z.el.classList.add('won');
        fx.burst(at.x, at.y, p.color, 26, 420, 7);
        fx.burst(at.x, at.y, '#3ddc97', 14, 300, 5);
        fx.ring(at.x, at.y, '#fff', 100);
        fx.text(at.x, at.y, '+' + gain, '#fff', i);
        // 🕵️ steal from the leader
        if (mode === 'steal') {
          let j = -1;
          for (let q = 0; q < N; q++) if (q !== i && score[q] > 0 && (j < 0 || score[q] > score[j])) j = q;
          if (j >= 0) {
            score[j]--;
            fly(fx.at(zones[j].sc), fx.at(zb.sc), '🪙');
            fx.text(fx.at(zones[j].sc).x, fx.at(zones[j].sc).y, '−1', '#ff4d6d', j);
            fx.banner('🕵️', `${p.name} крадёт очко!`, `у игрока ${ctx.players[j].name}`, { color: p.color, fg: '#111', ms: 1500 });
          }
        }
        // 🔥 streak
        if (lastWinner === i) streak++; else { lastWinner = i; streak = 1; }
        if (streak >= 3) {
          streak = 0;
          score[i]++;
          ctx.after(450, () => {
            const a = fx.at(zb.sc);
            fx.burst(a.x, a.y, '#ff9a3c', 30, 380, 7);
            fx.text(a.x, a.y, '🔥+1', '#ffb340', i, 42);
          });
          fx.banner('🔥', 'Серия!', `${p.name}: 3 подряд, бонус +1`, { color: '#ff9a3c', fg: '#111', ms: 1600 });
        }
        reveal(i);
      } else {
        locked.add(i);
        b.classList.add('bad');
        zb.z.el.classList.add('locked');
        fx.burst(at.x, at.y, '#ff4d6d', 12, 220, 5);
        if (lastWinner === i) { lastWinner = -1; streak = 0; }
        if (mode === 'risk' && score[i] > 0) {
          score[i]--;
          fx.text(at.x, at.y, '−1', '#ff4d6d', i);
          fx.shake(zb.z.el);
          renderScores();
        }
        if (locked.size >= N) { fx.banner('🤷', 'Никто не угадал', null, { ms: 1100 }); reveal(-1); }
      }
    }

    function reveal(w) {
      state = 'reveal';
      ctx.cancel(timeoutId);
      zones.forEach((zb, i) => {
        zb.q.innerHTML = '';
        if (prob.text.includes('?')) {
          const [l, r] = prob.text.split('?');
          zb.q.append(l, U.h('b', null, prob.ans), r);
        } else zb.q.append(prob.text + ' = ', U.h('b', null, prob.ans));
        fit(zb);
        zb.btns.forEach((b, k) => { if (popts[i][k] === prob.ans && !b.classList.contains('ok')) b.classList.add('right'); });
      });
      renderScores();
      const max = Math.max(...score);
      if (max >= TARGET) {
        const wi = score.indexOf(max);
        state = 'done';
        fx.flash(ctx.players[wi].color, 0.35);
        fx.shake();
        const a = fx.at(zones[wi].z.el);
        fx.burst(a.x, a.y, ctx.players[wi].color, 60, 600, 9);
        fx.banner('🏆', `${ctx.players[wi].name} победил!`, null, { color: ctx.players[wi].color, fg: '#111', ms: 1500 });
        ctx.after(1500, () => ctx.end({ winner: wi, scores: score.slice() }));
        return;
      }
      ctx.after(w >= 0 ? 1400 : 1700, next);
    }

    ctx.loop(() => {
      const f = state === 'q' ? U.clamp(1 - (ctx.time - qStart) / (qLimit / 1000), 0, 1) : 0;
      zones.forEach(zb => { zb.tmBar.style.width = (f * 100).toFixed(1) + '%'; });
    });

    layout();
    ctx.onResize(layout);
    renderScores();
    zones.forEach(zb => { zb.q.textContent = 'Готовьтесь…'; fit(zb); });
    ctx.after(0, next); // fires when the countdown ends
  },
});

</script>
<script>/* games/memory.js */
registerGame({
  id: 'memory',
  title: 'Мемори',
  emoji: '🃏',
  desc: 'Пары, джокеры, бомбы и магнит-воришка',
  rules: 'Ходите по очереди: чей ход, у того светится край экрана.\nОткрой две карты. Одинаковые: +1 и ходишь ещё. Разные: ход переходит.\n⏳ На каждую карту 8 секунд, потом ход сгорает.\n🔥 Вторая и следующие пары за один ход: +1 сверху.\nОсобые пары (золотые карты):\n💣 Бомба: все закрытые карты перемешиваются.\n👁️ Глаз: на секунду показывает одну пару.\n🧲 Магнит: забирает 1 очко у лидера.\n💰 Клад: пара стоит 2.\n🃏 Джокер подходит к любой карте: открой джокер и любую карту, и её пара тоже твоя.\nПобеждает тот, у кого больше очков.',
  start(ctx) {
    const TURN = 8;
    const SPECIAL = { '💣': 'bomb', '👁️': 'eye', '🧲': 'magnet', '💰': 'chest' };
    const JOKER = '🃏';
    const SYMBOLS = ['🍎', '🍉', '🍓', '🍒', '🌻', '🌵', '🍄', '⭐', '🌙', '🔥', '💧', '❄️', '⚽', '🏀', '🎈',
      '🎁', '🐸', '🐼', '🦋', '🐙', '🐢', '👑', '💎', '🌈', '🍩', '🎲', '🐞', '🍋', '🌸', '🍀'];
    const score = ctx.players.map(() => 0);
    let turn = U.randInt(0, ctx.n - 1);
    let open = [];       // up to 2 cards currently face up (not yet matched)
    let busy = false;    // animations / effects in progress
    let done = false;
    let combo = 0;       // pairs found in the current turn
    let deadline = 0;

    ctx.root.classList.add('g-memory');
    ctx.root.append(U.h('style', null, `
      .g-memory .board{position:absolute}
      .g-memory .mc{position:absolute;perspective:700px;transition:left .6s cubic-bezier(.5,0,.3,1),top .6s cubic-bezier(.5,0,.3,1)}
      .g-memory .mc .in{position:absolute;inset:0;transition:transform .32s;transform-style:preserve-3d}
      .g-memory .mc.up .in{transform:rotateY(180deg)}
      .g-memory .mc .f,.g-memory .mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        display:flex;align-items:center;justify-content:center}
      .g-memory .mc .b{background:radial-gradient(circle at 50% 50%,#3a4372 0 18%,transparent 19%),
        repeating-linear-gradient(45deg,#2b3360 0 10px,#252c55 10px 20px);
        box-shadow:inset 0 0 0 3px #3d4680}
      .g-memory .mc .f{background:#f4f1e8;transform:rotateY(180deg);line-height:1}
      .g-memory .mc.sp .f{background:radial-gradient(circle,#fff6d0,#ffd56a);box-shadow:inset 0 0 0 5px #e0a800}
      .g-memory .mc.jk .f{background:radial-gradient(circle,#f3e8ff,#c9a6ff);box-shadow:inset 0 0 0 5px #8a4dff}
      .g-memory .mc.got .f{box-shadow:inset 0 0 0 6px var(--fc)}
      .g-memory .mc.got{opacity:.5;transition:opacity .4s .5s}
      .g-memory .mc.gone{opacity:0;transform:scale(.6);transition:opacity .5s .4s,transform .5s .4s;pointer-events:none}
      .g-memory .mc.miss .f{box-shadow:inset 0 0 0 5px #7d84a8}
      .g-memory .mc.miss{animation:memShake .35s}
      .g-memory .mc.peek .f{box-shadow:inset 0 0 0 6px #61e3ff,0 0 24px #61e3ff}
      @keyframes memShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
      .g-memory .mc.pop .in{animation:memPop .35s}
      @keyframes memPop{50%{transform:rotateY(180deg) scale(1.12)}}
      .g-memory .zi{position:absolute;inset:6px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;
        padding:0 18px;gap:12px;background:#1a1f35;border:3px solid transparent;transition:background .25s,box-shadow .25s;font-weight:900;overflow:hidden}
      .g-memory .zi .tx{font-size:24px;color:#9aa1c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .g-memory .zi .tx b{color:var(--tc)}
      .g-memory .zi .sc{font-size:22px;color:var(--pc);white-space:nowrap;flex:0 0 auto;display:flex;align-items:baseline;gap:6px}
      .g-memory .zi .sc span{font-size:34px;display:inline-block}
      .g-memory .zi .sc span.bump{animation:memBump .5s}
      @keyframes memBump{40%{transform:scale(1.5)}}
      .g-memory .zi.on{background:var(--pc);border-color:#fff;box-shadow:0 0 30px 6px var(--pc)}
      .g-memory .zi.on .tx{color:#111;font-size:28px}
      .g-memory .zi.on .sc{color:#111}
      .g-memory .zi .tm{position:absolute;left:0;bottom:0;height:7px;background:rgba(0,0,0,.45);display:none}
      .g-memory .zi.on .tm{display:block}
      .g-memory .zi .tm.low{background:#fff}
    `));

    /* ---------- zones: name / score / turn indicator ---------- */
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 78 });
      const tx = U.h('div', { class: 'tx' });
      const scN = U.h('span', null, '0');
      const sc = U.h('div', { class: 'sc' }, 'очки:', scN);
      const tm = U.h('div', { class: 'tm' });
      const inner = U.h('div', { class: 'zi' }, tx, sc, tm);
      z.el.append(inner);
      return { z, inner, tx, scN, tm };
    });

    /* ---------- cards ---------- */
    const board = U.h('div', { class: 'board' });
    ctx.root.append(board);
    const normal = U.shuffle(SYMBOLS).slice(0, 10);
    const syms = [...normal, ...normal, ...Object.keys(SPECIAL), ...Object.keys(SPECIAL), JOKER, JOKER];
    const cards = U.shuffle(syms).map((sym, k) => {
      const f = U.h('div', { class: 'f' }, sym);
      const cls = 'mc' + (SPECIAL[sym] ? ' sp' : '') + (sym === JOKER ? ' jk' : '');
      const el = U.h('div', { class: cls }, U.h('div', { class: 'in' }, U.h('div', { class: 'b' }), f));
      const c = { sym, el, f, up: false, got: false, slot: k, joker: sym === JOKER };
      ctx.tap(el, () => flip(c));
      board.append(el);
      return c;
    });

    let grid = null;
    function layout() {
      const W = ctx.W, H = ctx.H, d = seats[0].z.h;
      // keep clear of the exit button (2p: middle of the left edge, 3p: middle of the top edge)
      const r = ctx.n === 2 ? { x: 50, y: d, w: W - 100, h: H - 2 * d } : { x: d, y: 50, w: W - 2 * d, h: H - d - 50 };
      const pad = 10;
      const iw = r.w - 2 * pad, ih = r.h - 2 * pad;
      let best = null;
      for (const [c, rr] of [[6, 5], [5, 6], [10, 3], [3, 10]]) {
        const s = Math.min(iw / c, ih / rr);
        if (!best || s > best.s) best = { c, r: rr, s };
      }
      const cell = best.s, gap = Math.max(5, cell * 0.07), size = cell - gap;
      grid = { cols: best.c, cell, gap, size };
      const bw = cell * best.c, bh = cell * best.r;
      Object.assign(board.style, { left: r.x + (r.w - bw) / 2 + 'px', top: r.y + (r.h - bh) / 2 + 'px', width: bw + 'px', height: bh + 'px' });
      cards.forEach(place);
    }
    function place(c) {
      const { cols, cell, gap, size } = grid;
      const x = c.slot % cols, y = Math.floor(c.slot / cols);
      Object.assign(c.el.style, { left: x * cell + gap / 2 + 'px', top: y * cell + gap / 2 + 'px', width: size + 'px', height: size + 'px' });
      c.f.style.fontSize = size * 0.62 + 'px';
    }
    layout();
    ctx.onResize(layout);

    function render() {
      seats.forEach((s, i) => {
        const on = i === turn && !done;
        s.inner.classList.toggle('on', on);
        s.scN.textContent = score[i];
        s.inner.style.setProperty('--tc', ctx.players[turn].color);
        if (done) s.tx.textContent = '';
        else if (on) s.tx.textContent = combo >= 1 ? `Твой ход! 🔥×${combo}` : 'Твой ход!';
        else s.tx.replaceChildren('Ход: ', U.h('b', null, ctx.players[turn].name));
      });
    }
    function bump(i) {
      const e = seats[i].scN;
      e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump');
    }
    const say = (text, color) => ctx.toast(text, { color: color || ctx.players[turn].color, fg: '#111', ms: 1300 });

    function flip(c) {
      if (done || busy || c.up || c.got || open.length >= 2) return;
      c.up = true;
      c.el.classList.add('up');
      open.push(c);
      deadline = ctx.time + TURN;
      if (open.length < 2) return;
      const [a, b] = open;
      busy = true;
      if (a.joker || b.joker || a.sym === b.sym) {
        ctx.after(420, () => resolveMatch(a, b));
      } else {
        ctx.after(450, () => { a.el.classList.add('miss'); b.el.classList.add('miss'); });
        ctx.after(1250, () => {
          [a, b].forEach(x => { x.up = false; x.el.classList.remove('up', 'miss'); });
          nextTurn();
        });
      }
    }

    function take(list) {
      list.forEach(x => {
        x.got = true; x.up = true;
        x.el.classList.add('up', 'got', 'pop');
        x.el.style.setProperty('--fc', ctx.players[turn].color);
      });
    }

    function resolveMatch(a, b) {
      open = [];
      let sym = a.sym, delay = 0;
      if (a.joker && b.joker) {
        take([a, b]);
      } else if (a.joker || b.joker) {
        const x = a.joker ? b : a, j = a.joker ? a : b;
        sym = x.sym;
        const partner = cards.find(c => c !== x && !c.got && !c.joker && c.sym === x.sym);
        take([j, x]);
        j.el.classList.add('gone');
        if (partner) { partner.up = true; partner.el.classList.add('up'); ctx.after(500, () => take([partner])); delay = 600; }
        say('🃏 Джокер!');
      } else take([a, b]);

      ctx.after(delay, () => {
        let pts = 1;
        const msgs = [];
        if (combo >= 1) { pts++; msgs.push('🔥 Комбо +1'); }
        combo++;
        const eff = SPECIAL[sym];
        if (eff === 'chest') { pts++; msgs.push('💰 Клад +1'); }
        score[turn] += pts;
        bump(turn);
        let wait = 0;
        if (eff === 'magnet') {
          const others = ctx.players.filter(p => p.i !== turn && score[p.i] > 0);
          if (others.length) {
            const max = Math.max(...others.map(p => score[p.i]));
            const victim = U.pick(others.filter(p => score[p.i] === max)).i;
            score[victim]--; score[turn]++;
            bump(victim);
            msgs.push(`🧲 −1 у: ${ctx.players[victim].name}`);
          } else msgs.push('🧲 Красть не у кого');
        }
        if (eff === 'bomb') { msgs.push('💣 Перемешка!'); wait = 900; ctx.after(300, shuffleDown); }
        if (eff === 'eye') { msgs.push('👁️ Подсказка!'); wait = peek(); }
        if (msgs.length) say(msgs.join('  '));
        else say(`Пара! +${pts}`);
        render();
        ctx.after(wait, () => {
          busy = false;
          deadline = ctx.time + TURN;
          if (cards.filter(c => !c.got).length <= 1 && cards.filter(c => !c.got && !c.joker).length === 0) finish();
        });
      });
    }

    function shuffleDown() {
      const down = cards.filter(c => !c.got && !c.up);
      const slots = U.shuffle(down.map(c => c.slot));
      down.forEach((c, k) => { c.slot = slots[k]; place(c); });
    }

    // Show one random hidden pair for a moment. Returns how long the effect takes (ms).
    function peek() {
      const down = cards.filter(c => !c.got && !c.up && !c.joker);
      if (!down.length) return 0;
      const a = U.pick(down);
      const pair = down.filter(c => c.sym === a.sym);
      ctx.after(400, () => pair.forEach(c => c.el.classList.add('up', 'peek')));
      ctx.after(1900, () => pair.forEach(c => c.el.classList.remove('up', 'peek')));
      return 2300;
    }

    function nextTurn() {
      open = [];
      busy = false;
      combo = 0;
      turn = (turn + 1) % ctx.n;
      deadline = ctx.time + TURN;
      render();
    }

    function finish() {
      done = true;
      render();
      const best = Math.max(...score);
      const winners = ctx.players.filter(p => score[p.i] === best).map(p => p.i);
      const draw = winners.length === ctx.n;
      ctx.after(1100, () => ctx.end({ winners: draw ? [] : winners, scores: score.slice(), msg: 'Очки: ' + score.join(' : ') }));
    }

    ctx.loop(() => {
      if (done) return;
      const s = seats[turn];
      const left = busy ? TURN : Math.max(0, deadline - ctx.time);
      s.tm.style.width = (left / TURN) * 100 + '%';
      s.tm.classList.toggle('low', left < 3);
      if (!busy && !ctx.paused && left <= 0) {
        // time is up: close open cards, pass the turn
        busy = true;
        say(`⏳ Время! Ход переходит`, '#9aa1c4');
        open.forEach(x => { x.up = false; x.el.classList.remove('up'); });
        ctx.after(400, nextTurn);
      }
    });

    deadline = TURN;
    render();
  },
});

</script>
<script>/* games/nerves.js */
registerGame({
  id: 'nerves',
  title: 'Нервы',
  emoji: '😬',
  desc: 'Держи палец, пока растёт банк. Успей до взрыва',
  rules: 'Каждый держит палец на своей кнопке. Когда держат все, в центре начинает расти банк, всё быстрее и быстрее.\n' +
    'Отпустил палец: забрал текущий банк. В случайный момент бомба взрывается: кто ещё держит, получает 0.\n' +
    '⚠️ Перед взрывом часто искрит фитиль, но не всегда.\n' +
    'Особые раунды:\n' +
    '✖️2 Двойные очки\n' +
    '🎰 Рулетка: фитиль искрит обманом\n' +
    '👑 Последний получает всё: очки ×3 только у того, кто отпустил последним (до взрыва)\n' +
    '🔥 Штраф: взорвался — минус 30\n' +
    '🤑 Жадина: отпустил меньше чем за 0,5 с до взрыва — +50%\n' +
    '🛟 Страховка: отстающий в 5-м раунде получает защиту (половина банка при взрыве)\n' +
    '7 раундов, больше всех очков — победа.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n, ROUNDS = 7, DEPTH = 0.26, TAU = Math.PI * 2;
    const TYPES = {
      normal: { icon: '💣', name: 'Обычный', hint: 'отпусти до взрыва', mult: 1 },
      double: { icon: '✖️2', name: 'Двойные очки', hint: 'всё ×2', mult: 2 },
      roulette: { icon: '🎰', name: 'Рулетка', hint: 'фитиль искрит обманом!', mult: 1 },
      last: { icon: '👑', name: 'Последний получает всё', hint: 'очки ×3 только последнему', mult: 3 },
      penalty: { icon: '🔥', name: 'Штраф', hint: 'взорвался: −30', mult: 1 },
      final: { icon: '🏆', name: 'Финал ×2', hint: 'решающий раунд', mult: 2 },
    };
    const schedule = ['normal'].concat(U.shuffle(['double', 'roulette', 'last', 'penalty', 'normal']), ['final']);

    ctx.root.classList.add('g-nerves');
    ctx.root.append(U.h('style', null, `
      .g-nerves .nb{position:absolute;inset:1.6vmin;border-radius:3.5vmin;border:.7vmin solid var(--pc);
        background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;
        padding:1.4vmin 2.4vmin;color:#fff;font-weight:900;touch-action:none;transition:background .12s, box-shadow .12s, transform .12s}
      .g-nerves .nb .top{display:flex;justify-content:space-between;align-items:center;gap:2vmin;font-size:3.2vmin;white-space:nowrap}
      .g-nerves .nb .tot{color:var(--pc)}
      .g-nerves .nb .chips{display:flex;gap:1.6vmin;font-size:2.8vmin}
      .g-nerves .nb .chips b{display:inline-block;width:2.4vmin;height:2.4vmin;border-radius:50%;margin-right:.6vmin;vertical-align:-.3vmin}
      .g-nerves .nb .main{text-align:center;font-size:6vmin;line-height:1.1;white-space:nowrap;overflow:hidden}
      .g-nerves .nb .sub{text-align:center;font-size:2.7vmin;opacity:.85;white-space:nowrap;overflow:hidden}
      .g-nerves .nb.hold{background:var(--pc);color:#0f1220;box-shadow:0 0 5vmin var(--pc);transform:scale(.985)}
      .g-nerves .nb.hold .tot{color:#0f1220}
      .g-nerves .nb.need{animation:nvPulse .9s ease-in-out infinite alternate}
      .g-nerves .nb.banked{background:rgba(61,220,151,.18);border-color:#3ddc97}
      .g-nerves .nb.bust{background:rgba(255,77,109,.25);border-color:#ff4d6d;animation:nvShake .45s linear}
      @keyframes nvPulse{from{box-shadow:0 0 0 var(--pc)}to{box-shadow:0 0 4vmin var(--pc)}}
      @keyframes nvShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2vmin)}40%{transform:translateX(1.6vmin)}60%{transform:translateX(-1vmin)}80%{transform:translateX(.6vmin)}}
    `));

    const { g } = ctx.canvas();

    /* ---------- state ---------- */
    const total = P.map(() => 0);
    const held = P.map(() => new Set());
    let round = 0, type = null, phase = 'intro';
    let readyT = 0, t0 = 0, boomAt = 0, pot = 0, warn = 0, warnPlan = [], warnShown = false;
    let released = [], busted = [], gained = [], insured = P.map(() => false), insUsed = P.map(() => false);
    let parts = [], rings = [], flash = 0, flashC = '#fff', shake = 0, boomVis = 0, lastPot = 0, popT = 0;
    let result = '';

    /* ---------- geometry ---------- */
    function fieldRect() {
      const d = Math.round(DEPTH * Math.min(ctx.W, ctx.H));
      const s = P.map(p => p.side);
      const l = s.includes('left') ? d : 0, r = s.includes('right') ? d : 0;
      const t = s.includes('top') ? d : 0, b = s.includes('bottom') ? d : 0;
      return { x: l, y: t, w: ctx.W - l - r, h: ctx.H - t - b };
    }

    /* ---------- UI ---------- */
    const ui = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      const tot = U.h('div', { class: 'tot' }), chips = U.h('div', { class: 'chips' });
      const main = U.h('div', { class: 'main' }), sub = U.h('div', { class: 'sub' });
      const b = U.h('div', { class: 'nb' }, U.h('div', { class: 'top' }, tot, chips), main, sub);
      z.el.append(b);
      ctx.pointer(b, {
        down: (id) => { const was = held[p.i].size > 0; held[p.i].add(id); if (!was) holdChange(p.i, true); },
        up: (id) => { if (held[p.i].delete(id) && !held[p.i].size) holdChange(p.i, false); },
      });
      return { z, b, tot, chips, main, sub, cache: {} };
    });
    const releaseAll = (e) => held.forEach((s, i) => { if (s.delete(e.pointerId) && !s.size) holdChange(i, false); });
    window.addEventListener('pointerup', releaseAll);
    window.addEventListener('pointercancel', releaseAll);
    ctx.onCleanup(() => { window.removeEventListener('pointerup', releaseAll); window.removeEventListener('pointercancel', releaseAll); });
    const isHeld = (i) => held[i].size > 0;

    function set(u, k, el, v, html) {
      if (u.cache[k] === v) return;
      u.cache[k] = v;
      if (html) el.innerHTML = v; else el.textContent = v;
      if (k === 'main' || k === 'sub') fit(u, el, k);
    }
    // shrink text until it fits the button width (zones differ a lot in length)
    function fit(u, el, k) {
      const z = u.z;
      let s = k === 'main' ? Math.min(z.h * 0.27, z.w * 0.1, 60) : Math.min(z.h * 0.11, 24);
      el.style.fontSize = s + 'px';
      while (el.scrollWidth > el.clientWidth + 1 && s > 11) { s *= 0.9; el.style.fontSize = s + 'px'; }
    }
    ctx.onResize(() => ui.forEach(u => { fit(u, u.main, 'main'); fit(u, u.sub, 'sub'); }));
    function render() {
      P.forEach((p, i) => {
        const u = ui[i];
        set(u, 'tot', u.tot, `⭐ ${total[i]}${insured[i] && !insUsed[i] ? ' 🛟' : ''}`);
        let ch = '';
        P.forEach((q, j) => {
          if (j === i) return;
          let v = '…';
          if (phase === 'arm' || phase === 'ready' || phase === 'intro') v = isHeld(j) ? '✓' : '✗';
          else if (released[j]) v = String(released[j].v);
          else if (busted[j]) v = '💥';
          if ((phase === 'boom') && gained[j] != null) v = (gained[j] > 0 ? '+' : '') + gained[j];
          ch += `<span><b style="background:${q.color}"></b>${v}</span>`;
        });
        set(u, 'ch', u.chips, ch, true);
        let main = '', sub = '';
        const T = type || TYPES.normal;
        const cls = { hold: false, need: false, banked: false, bust: false };
        if (phase === 'intro' || phase === 'arm') {
          main = isHeld(i) ? '✓ держишь' : '☝️ ПОЛОЖИ ПАЛЕЦ';
          sub = `Раунд ${round}/${ROUNDS}: ${T.icon} ${T.name}`;
          cls.hold = isHeld(i); cls.need = !isHeld(i);
        } else if (phase === 'ready') {
          main = 'Держи…'; sub = `${T.icon} ${T.hint}`; cls.hold = isHeld(i);
        } else if (phase === 'run') {
          if (released[i]) { main = `✋ ${released[i].v}`; sub = 'забрал, ждём взрыва'; cls.banked = true; }
          else { main = 'ДЕРЖИШЬ'; sub = 'отпусти, чтобы забрать банк'; cls.hold = isHeld(i); }
        } else if (phase === 'boom') {
          main = result ? resultText(i) : '';
          sub = subText(i);
          cls.banked = gained[i] > 0; cls.bust = !!busted[i];
        }
        set(u, 'main', u.main, main); set(u, 'sub', u.sub, sub);
        for (const k in cls) if (u.cache['c' + k] !== cls[k]) { u.cache['c' + k] = cls[k]; u.b.classList.toggle(k, cls[k]); }
      });
    }
    function resultText(i) {
      if (busted[i] && gained[i] < 0) return `💥 ${gained[i]}`;
      if (busted[i] && gained[i] > 0) return `🛟 +${gained[i]}`;
      if (busted[i]) return '💥 0';
      return gained[i] > 0 ? `+${gained[i]}` : '0';
    }
    function subText(i) {
      const r = released[i];
      const notes = [];
      if (r && r.greedy) notes.push('🤑 Жадина +50%');
      if (r && type === TYPES.last && !(gained[i] > 0)) notes.push('👑 не последний');
      if (busted[i] && insured[i] && gained[i] > 0) notes.push('страховка сработала');
      notes.push(`💣 на ${lastPot}`);
      return notes.join(' · ');
    }

    /* ---------- effects ---------- */
    function center() { const f = fieldRect(); return { x: f.x + f.w / 2, y: f.y + f.h / 2, S: Math.min(640, Math.min(f.w, f.h)) }; }
    function burst(x, y, color, n, sp, size, life) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, s = U.rand(sp * 0.25, sp);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life || 1, c: color, r: U.rand(size * 0.4, size) });
      }
    }
    function toZone(i, color, n) {
      const c = center(), r = ui[i].z.rect;
      const tx = r.x + r.w / 2, ty = r.y + r.h / 2;
      for (let k = 0; k < n; k++) {
        const t = U.rand(0.5, 0.9);
        parts.push({ x: c.x + U.rand(-20, 20), y: c.y + U.rand(-20, 20), vx: (tx - c.x) / t * U.rand(0.8, 1.1), vy: (ty - c.y) / t * U.rand(0.8, 1.1), life: 1, c: color, r: U.rand(3, 7), nodrag: true });
      }
    }
    function say(text, o) { const c = center(); return ctx.toast(text, Object.assign({ ms: 1500, offset: c.S * 0.33 }, o || {})); }

    /* ---------- flow ---------- */
    function nextRound() {
      round++;
      if (round > ROUNDS) return finishGame();
      type = TYPES[schedule[round - 1]];
      released = P.map(() => null); busted = P.map(() => false); gained = P.map(() => null);
      result = ''; pot = 0; lastPot = 0; warn = 0; boomVis = 0;
      if (round === 5) {
        const mn = Math.min(...total), lows = total.map((v, i) => v === mn ? i : -1).filter(i => i >= 0);
        if (lows.length === 1 && Math.max(...total) > mn) {
          insured[lows[0]] = true;
          say(`🛟 ${P[lows[0]].name}: страховка!`, { color: P[lows[0]].color, fg: '#111', ms: 1800 });
        }
      }
      phase = 'arm';
      if (type !== TYPES.normal || round === 1) {
        ctx.after(round === 5 && insured.some(Boolean) ? 1900 : 0, () => say(`${type.icon} ${type.name}`, { color: '#fff', fg: '#111', ms: 1500 }));
      }
      checkAll();
      render();
    }
    function checkAll() {
      if (phase === 'arm' && P.every(p => isHeld(p.i))) { phase = 'ready'; readyT = 1.1; render(); }
    }
    function holdChange(i, on) {
      if (!ctx.alive) return;
      if (phase === 'arm') { if (on) checkAll(); render(); return; }
      if (phase === 'ready' && !on) {
        phase = 'arm';
        say(`${P[i].name} отпустил рано!`, { color: P[i].color, fg: '#111', ms: 1100 });
        render(); return;
      }
      if (phase === 'run' && !on && !released[i] && !busted[i]) {
        const el = ctx.time - t0;
        released[i] = { v: pot, t: el };
        toZone(i, P[i].color, 18);
        burst(center().x, center().y, P[i].color, 14, 260, 5);
        if (P.every(p => released[p.i])) resolve(false);
        render(); return;
      }
      render();
    }
    function startRun() {
      phase = 'run'; t0 = ctx.time;
      boomAt = 2.4 + Math.pow(Math.random(), 0.85) * 10.5;
      warnPlan = [];
      const real = type === TYPES.roulette ? Math.random() < 0.5 : Math.random() < 0.7;
      if (real) warnPlan.push(boomAt - U.rand(0.45, 0.85));
      if (type === TYPES.roulette) {
        for (let t = U.rand(0.8, 2); t < boomAt - 0.9; t += U.rand(0.9, 2.2)) warnPlan.push(t);
      } else if (Math.random() < 0.25) warnPlan.push(U.rand(1, Math.max(1.2, boomAt - 1.5))); // the odd false alarm
      warnPlan.sort((a, b) => a - b);
      render();
    }
    const potAt = (t) => Math.floor(6 * (Math.exp(0.3 * t) - 1));
    function resolve(exploded) {
      phase = 'boom';
      lastPot = potAt(boomAt);
      if (exploded) {
        const c = center();
        boomVis = 1; flash = 0.9; flashC = '#ffb347'; shake = 22;
        burst(c.x, c.y, '#ffb347', 70, 700, 9, 1.3);
        burst(c.x, c.y, '#ff4d3d', 50, 520, 7, 1.3);
        burst(c.x, c.y, '#fff', 30, 400, 4, 1.1);
        rings.push({ x: c.x, y: c.y, r0: c.S * 0.1, r1: c.S * 0.9, t: 0, c: '#ffb347' });
      } else {
        boomVis = 0.5;
        const c = center();
        burst(c.x, c.y, '#9aa1c4', 26, 260, 5);
      }
      const mult = type.mult;
      // who scores?
      let lastT = -1;
      P.forEach(p => { const r = released[p.i]; if (r && r.t > lastT) lastT = r.t; });
      P.forEach(p => {
        const i = p.i, r = released[i];
        if (!r) {
          busted[i] = true;
          if (insured[i] && !insUsed[i]) { insUsed[i] = true; gained[i] = Math.max(1, Math.round(lastPot * 0.5)); }
          else gained[i] = type === TYPES.penalty ? -Math.min(30, total[i]) : 0;
          return;
        }
        r.greedy = boomAt - r.t <= 0.5;
        let v = r.v;
        if (type === TYPES.last) v = r.t === lastT ? v * 3 : 0;
        else v *= mult;
        if (r.greedy && v > 0) v = Math.round(v * 1.5);
        gained[i] = v;
      });
      P.forEach(p => {
        total[p.i] += gained[p.i];
        const r = released[p.i];
        if (r && r.greedy && gained[p.i] > 0) ctx.after(500, () => toZone(p.i, '#3ddc97', 25));
        if (busted[p.i]) { const z = ui[p.i].z.rect; burst(z.x + z.w / 2, z.y + z.h / 2, '#ff4d6d', 20, 300, 5); }
      });
      result = 'y';
      render();
      ctx.after(exploded ? 2900 : 2400, nextRound);
    }
    function finishGame() {
      phase = 'over';
      const mx = Math.max(...total);
      const w = P.filter(p => total[p.i] === mx).map(p => p.i);
      ctx.end({ winners: w.length === N ? [] : w, scores: total.slice(), msg: '7 раундов позади' });
    }

    ctx.after(1, nextRound); // game timers only run after the countdown

    /* ---------- loop ---------- */
    function update(dt) {
      if (phase === 'ready') {
        readyT -= dt;
        if (!P.every(p => isHeld(p.i))) { phase = 'arm'; render(); }
        else if (readyT <= 0) startRun();
      } else if (phase === 'run') {
        const el = ctx.time - t0;
        const np = potAt(el);
        if (np !== pot) { pot = np; popT = 1; }
        while (warnPlan.length && el >= warnPlan[0]) {
          warnPlan.shift(); warn = 0.4;
          const c = center();
          burst(c.x, c.y - c.S * 0.2, '#ffe14d', 12, 220, 3, 0.6);
        }
        if (el >= boomAt) { pot = potAt(boomAt); resolve(true); }
      }
      warn = Math.max(0, warn - dt);
      popT = Math.max(0, popT - dt * 6);
    }

    ctx.loop((dt, now) => {
      const t = now / 1000;
      if (dt > 0) update(dt);
      if (dt > 0) {
        for (const p of parts) {
          p.life -= dt * 1.2; p.x += p.vx * dt; p.y += p.vy * dt;
          if (!p.nodrag) { p.vx *= 0.94; p.vy *= 0.94; }
        }
        parts = parts.filter(p => p.life > 0);
        for (const r of rings) r.t += dt * 1.6;
        rings = rings.filter(r => r.t < 1);
        flash = Math.max(0, flash - dt * 1.4);
        shake = Math.max(0, shake - dt * 40);
        boomVis = Math.max(0, boomVis - dt * 0.6);
      }
      const c = center(), S = c.S;
      g.save();
      g.fillStyle = '#0f1220'; g.fillRect(0, 0, ctx.W, ctx.H);
      if (shake > 0) g.translate(U.rand(-shake, shake) * 0.5, U.rand(-shake, shake) * 0.5);
      const el = phase === 'run' ? ctx.time - t0 : 0;
      const heat = phase === 'run' ? Math.min(1, pot / 150) : 0;
      // background glow
      const bgR = S * 0.75;
      const bgG = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, bgR);
      bgG.addColorStop(0, `rgba(${Math.round(60 + 190 * heat)},${Math.round(70 - 40 * heat)},${Math.round(140 - 100 * heat)},.45)`);
      bgG.addColorStop(1, 'rgba(15,18,32,0)');
      g.fillStyle = bgG; g.beginPath(); g.arc(c.x, c.y, bgR, 0, TAU); g.fill();
      // bomb
      const R = S * 0.15;
      const jit = phase === 'run' ? heat * 4 + (warn > 0 ? 5 : 0) : 0;
      const bx = c.x + U.rand(-jit, jit), by = c.y + U.rand(-jit, jit);
      const pulse = 1 + popT * 0.06 + (phase === 'run' ? Math.sin(t * (6 + el * 2)) * 0.03 * (1 + heat) : 0);
      if (phase !== 'boom' || boomVis < 0.6) {
        g.save(); g.translate(bx, by); g.scale(pulse, pulse);
        const bodyG = g.createRadialGradient(-R * 0.35, -R * 0.35, R * 0.1, 0, 0, R);
        bodyG.addColorStop(0, warn > 0 ? '#ff8a8a' : '#5b6390'); bodyG.addColorStop(1, warn > 0 ? '#7a0f1f' : '#1b1f38');
        g.fillStyle = bodyG; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
        g.lineWidth = 4; g.strokeStyle = warn > 0 ? '#ff4d6d' : `rgba(255,255,255,${0.15 + heat * 0.4})`; g.stroke();
        // progress ring of heat
        if (phase === 'run') {
          g.strokeStyle = `hsl(${50 - heat * 50},100%,60%)`; g.lineWidth = 6;
          g.beginPath(); g.arc(0, 0, R + 10, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, el / 13)); g.stroke();
        }
        // fuse spark
        const fx = R * 0.55, fy = -R * 0.8;
        g.strokeStyle = '#c9a26b'; g.lineWidth = 4; g.beginPath(); g.moveTo(R * 0.4, -R * 0.85); g.quadraticCurveTo(R * 0.7, -R * 1.2, fx + 6, fy - 14); g.stroke();
        if (phase === 'run' || warn > 0) {
          const sp = 6 + Math.random() * 6 + (warn > 0 ? 12 : 0);
          g.fillStyle = warn > 0 ? '#ff4d6d' : '#ffe14d';
          g.beginPath(); g.arc(fx + 6, fy - 14, sp, 0, TAU); g.fill();
          if (dt > 0 && Math.random() < 0.6) parts.push({ x: bx + fx + 6, y: by + fy - 14, vx: U.rand(-80, 80), vy: U.rand(-120, 20), life: 0.4, c: '#ffd84d', r: 2.5 });
        }
        g.font = `${R * 0.8}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(type ? (type.icon === '✖️2' ? '✖️' : type.icon) : '💣', 0, 4);
        g.restore();
      }
      // shock rings
      for (const r of rings) {
        g.strokeStyle = U.alpha(r.c, 1 - r.t); g.lineWidth = 12 * (1 - r.t) + 2;
        g.beginPath(); g.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * r.t, 0, TAU); g.stroke();
      }
      // pot copies facing each player
      const big = S * 0.13;
      const D = R + big * 0.95 + 14;
      P.forEach(p => {
        const v = ctx.inward(p.i);
        g.save(); ctx.facing(g, p.i, c.x - v.x * D, c.y - v.y * D);
        g.textAlign = 'center'; g.textBaseline = 'middle';
        let txt = '', col = '#fff', small = '';
        if (phase === 'run') {
          txt = String(pot); col = `hsl(${55 - heat * 55},100%,${70 - heat * 10}%)`;
          small = type.mult > 1 ? `банк ×${type.mult}` : 'банк';
          if (warn > 0) small = '⚠️ ИСКРИТ!';
        } else if (phase === 'boom') {
          txt = boomVis > 0.5 ? 'БАХ!' : String(lastPot); col = boomVis > 0.5 ? '#ffb347' : '#ff6b6b';
          small = `💥 на ${lastPot}`;
        } else if (phase === 'ready') {
          txt = String(Math.max(1, Math.ceil(readyT / 0.37))); col = '#fff'; small = 'приготовились';
        } else if (phase === 'arm') {
          const k = P.filter(q => isHeld(q.i)).length;
          txt = `${k}/${N}`; col = '#9aa1c4'; small = 'пальцы на кнопки';
        }
        const sc = 1 + popT * 0.12;
        g.scale(sc, sc);
        g.font = `900 ${big}px -apple-system, sans-serif`;
        g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(txt, 0, 0);
        g.fillStyle = col; g.fillText(txt, 0, 0);
        g.font = `800 ${big * 0.3}px -apple-system, sans-serif`;
        g.fillStyle = warn > 0 && phase === 'run' ? '#ff4d6d' : 'rgba(255,255,255,.75)';
        g.fillText(small, 0, big * 0.72);
        g.restore();
      });
      for (const p of parts) {
        g.globalAlpha = Math.min(1, p.life * 1.5); g.fillStyle = p.c;
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
      g.restore();
      if (warn > 0 && phase === 'run') { g.fillStyle = `rgba(255,40,60,${warn * 0.35})`; g.fillRect(0, 0, ctx.W, ctx.H); }
      if (flash > 0) { g.fillStyle = U.alpha(flashC, Math.min(0.6, flash)); g.fillRect(0, 0, ctx.W, ctx.H); }
      if (phase === 'run') renderT -= dt; else renderT = 0;
      if (renderT <= 0) { renderT = 0.1; render(); }
    });
    let renderT = 0;
    render();
    ctx.dbg = { ui, get phase() { return phase; }, get round() { return round; }, get pot() { return pot; }, total }; // for automated tests
  },
});

</script>
<script>/* games/paint.js */
registerGame({
  id: 'paint',
  title: 'Покраска',
  emoji: '🖌️',
  desc: 'Закрась своим цветом больше всех, лови бонусы',
  rules: 'Твой валик катится сам и красит поле. Держи ◀ или ▶ в своей зоне, чтобы поворачивать.\n' +
    'Чужую краску можно закрашивать. Через 60 секунд побеждает больший процент поля.\n' +
    'Бонусы:\n' +
    '🖌️ широкая кисть · ⚡ скорость · 💣 клякса · ❄️ заморозить соперников\n' +
    '🛡️ щит (твою краску не закрасить) · 🔀 соперникам руль наоборот\n' +
    '🧲 магнит для бонусов · 🔄 обмен всей территорией с лидером\n' +
    'События: 🌧️ ливень из краски (больше капель отстающим) и ⏩ финишный рывок в последние 10 секунд.\n' +
    'Игра бывает особой: 🧊 скользко, 🎁 бонусы ×2, 🖌️ широкие кисти.\n' +
    'Последнему месту помогает 🆘 фора: кисть шире, бонусы ближе.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const DUR = 60;
    const DEPTH = 0.2;
    const BG = '#0f1220';
    const ARW_L = '◀︎', ARW_R = '▶︎';
    const TAU = Math.PI * 2;

    ctx.root.classList.add('g-paint');
    ctx.root.append(U.h('style', null, `
      .g-paint .zone-inner{display:flex;align-items:stretch;gap:1.6vmin;padding:1.5vmin}
      .g-paint .cb{flex:1 1 0;max-width:27vmin;border-radius:3vmin;border:.5vmin solid var(--pc);color:var(--pc);
        background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;
        font-size:8vmin;font-weight:900;touch-action:none;transition:transform .07s}
      .g-paint .cb.on{background:var(--pc);color:#0f1220;transform:scale(.95);box-shadow:0 0 3.5vmin var(--pc)}
      .g-paint .cb.rev{border-style:dashed;animation:pt-wob .5s ease-in-out infinite alternate}
      .g-paint .cb.ice{background:rgba(160,220,255,.35);border-color:#bfe8ff}
      @keyframes pt-wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
      .g-paint .info{flex:1.1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        color:var(--pc);font-weight:900;text-align:center;pointer-events:none}
      .g-paint .pct{font-size:6vmin;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
      .g-paint .pct.lead::after{content:' 👑';font-size:3.4vmin;vertical-align:middle}
      .g-paint .sub{font-size:2.6vmin;margin-top:.5vmin;white-space:nowrap;color:#e8ebff;opacity:.9;font-variant-numeric:tabular-nums}
      .g-paint .sub.hot{color:#ff6b6b;opacity:1}
      .g-paint .fx{font-size:2.7vmin;min-height:3.3vmin;margin-top:.5vmin;white-space:nowrap;color:#fff;font-variant-numeric:tabular-nums;
        overflow:hidden;max-width:100%}
      .g-paint .fx span{display:inline-block;margin:0 .3vmin;padding:.1vmin .6vmin;border-radius:1vmin;background:rgba(255,255,255,.12)}
      .g-paint .fx span.bad{background:rgba(255,77,109,.35)}
      .g-paint .bar{width:90%;height:.8vmin;border-radius:1vmin;background:rgba(255,255,255,.1);margin-top:.5vmin;overflow:hidden}
      .g-paint .bar i{display:block;height:100%;background:#e8ebff;opacity:.8;width:100%}
      .g-paint .bans{position:absolute;left:0;right:0;bottom:calc(100% + 1.2vmin);display:flex;flex-direction:column;
        align-items:center;gap:.8vmin;pointer-events:none;z-index:5}
      .g-paint .ban{padding:.9vmin 2.2vmin;border-radius:2vmin;background:rgba(15,18,32,.78);border:.4vmin solid var(--bc);
        color:#fff;font-weight:900;font-size:3vmin;white-space:nowrap;box-shadow:0 0 3vmin var(--bc);
        animation:pt-ban 1.9s ease-out forwards}
      .g-paint .ban.long{animation-duration:3s}
      @keyframes pt-ban{0%{transform:scale(.3);opacity:0}10%{transform:scale(1.15);opacity:1}20%{transform:scale(1)}
        80%{opacity:1}100%{opacity:0;transform:translateY(-2vmin)}}
    `));

    const C = ctx.canvas();

    /* ---------- controls ---------- */
    const allBtns = [];
    function btn(label) {
      const b = U.h('div', { class: 'cb' }, label);
      const ids = new Set();
      b.ids = ids;
      ctx.pointer(b, {
        down: (id) => { ids.add(id); b.classList.add('on'); },
        up: (id) => { ids.delete(id); if (!ids.size) b.classList.remove('on'); },
      });
      allBtns.push(b);
      return b;
    }
    const releaseAll = (e) => allBtns.forEach(b => { if (b.ids.delete(e.pointerId) && !b.ids.size) b.classList.remove('on'); });
    window.addEventListener('pointerup', releaseAll);
    window.addEventListener('pointercancel', releaseAll);
    ctx.onCleanup(() => {
      window.removeEventListener('pointerup', releaseAll);
      window.removeEventListener('pointercancel', releaseAll);
    });

    const ui = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      z.el.style.background = `linear-gradient(0deg, ${U.alpha(p.color, .2)}, ${U.alpha(p.color, .05)})`;
      z.el.style.borderTop = `2px solid ${U.alpha(p.color, .6)}`;
      const L = btn(ARW_L), R = btn(ARW_R);
      const pct = U.h('div', { class: 'pct' }, '0%');
      const sub = U.h('div', { class: 'sub' }, '1:00');
      const fx = U.h('div', { class: 'fx' });
      const barI = U.h('i');
      const bans = U.h('div', { class: 'bans' });
      z.el.append(L, U.h('div', { class: 'info' }, pct, sub, fx, U.h('div', { class: 'bar' }, barI)), R, bans);
      return { z, L, R, pct, sub, fx, barI, bans, last: '', fxKey: '' };
    });

    function banner(i, text, color, long) {
      const u = ui[i];
      const b = U.h('div', { class: 'ban' + (long ? ' long' : '') }, text);
      b.style.setProperty('--bc', color || ctx.players[i].color);
      u.bans.append(b);
      while (u.bans.children.length > 2) u.bans.firstChild.remove();
      setTimeout(() => b.remove(), long ? 3100 : 2000);
    }
    function bannerAll(text, color, long) { ctx.players.forEach(p => banner(p.i, text, color, long)); }

    /* ---------- field geometry ---------- */
    function say(text, o) {
      const fr = fieldRect();
      return ctx.toast(text, Object.assign({ offset: Math.max(70, Math.min(fr.w, fr.h) * 0.27) }, o || {}));
    }
    function fieldRect() {
      const d = Math.round(DEPTH * Math.min(ctx.W, ctx.H));
      const sides = ctx.players.map(p => p.side);
      const l = sides.includes('left') ? d : 0, r = sides.includes('right') ? d : 0;
      const t = sides.includes('top') ? d : 0, b = sides.includes('bottom') ? d : 0;
      const m = 8;
      // keep the core exit button (2p: middle of left edge, 3p: middle of top edge) off the field
      const ex = 46;
      const exL = ctx.n === 2 ? ex : 0, exT = ctx.n === 2 ? 0 : ex;
      return { x: l + m + exL, y: t + m + exT, w: Math.max(120, ctx.W - l - r - 2 * m - exL), h: Math.max(120, ctx.H - t - b - 2 * m - exT) };
    }
    const fr0 = fieldRect();
    const S = Math.sqrt(fr0.w * fr0.h);
    const CS = Math.max(8, Math.round(S / 62)); // cell size
    const gw = Math.max(10, Math.floor(fr0.w / CS)), gh = Math.max(10, Math.floor(fr0.h / CS));
    const FW = gw * CS, FH = gh * CS;
    const TOTAL = gw * gh;
    let view = { s: 1, ox: 0, oy: 0 };
    function updView() {
      const fr = fieldRect();
      const s = Math.min(fr.w / FW, fr.h / FH);
      view = { s, ox: fr.x + (fr.w - FW * s) / 2, oy: fr.y + (fr.h - FH * s) / 2 };
    }
    updView();
    ctx.onResize(updView);

    /* ---------- round modifier ---------- */
    const MODS = {
      none:  { name: '' },
      ice:   { name: '🧊 Скользко!', chip: '🧊' },
      bonus: { name: '🎁 Бонусы ×2!', chip: '🎁' },
      wide:  { name: '🖌️ Широкие кисти у всех!', chip: '🖌️' },
    };
    const mod = window.__dbgMod || (Math.random() < 0.3 ? 'none' : U.pick(['ice', 'bonus', 'wide'])); // __dbgMod: test hook

    /* ---------- paint grid ---------- */
    const owner = new Int8Array(TOTAL).fill(-1);
    const counts = ctx.players.map(() => 0);
    const off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    const og = off.getContext('2d');
    const rgb = ctx.players.map(p => { const n = parseInt(p.color.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; });
    function redrawAll() {
      const img = og.createImageData(gw, gh);
      for (let k = 0; k < TOTAL; k++) {
        const o = owner[k];
        if (o < 0) continue;
        img.data[k * 4] = rgb[o][0]; img.data[k * 4 + 1] = rgb[o][1]; img.data[k * 4 + 2] = rgb[o][2]; img.data[k * 4 + 3] = 255;
      }
      og.putImageData(img, 0, 0);
    }
    function paintCircle(x, y, r, who) {
      const x0 = Math.max(0, Math.floor((x - r) / CS)), x1 = Math.min(gw - 1, Math.floor((x + r) / CS));
      const y0 = Math.max(0, Math.floor((y - r) / CS)), y1 = Math.min(gh - 1, Math.floor((y + r) / CS));
      const r2 = r * r;
      og.fillStyle = ctx.players[who].color;
      for (let cy = y0; cy <= y1; cy++) {
        const dy = (cy + .5) * CS - y;
        for (let cx = x0; cx <= x1; cx++) {
          const dx = (cx + .5) * CS - x;
          if (dx * dx + dy * dy > r2) continue;
          const k = cy * gw + cx;
          const o = owner[k];
          if (o === who) continue;
          if (o >= 0) {
            if (blobs && blobs[o].fx.shield > 0) continue;
            counts[o]--;
          }
          owner[k] = who;
          counts[who]++;
          og.fillRect(cx, cy, 1, 1);
        }
      }
    }

    /* ---------- blobs ---------- */
    const R0 = CS * 2.3;
    const SPEED = S * 0.21 * (mod === 'ice' ? 1.15 : 1);
    const TURN = 3.3 * (mod === 'ice' ? 0.55 : 1);
    const edge = Math.max(R0 * 2.5, Math.min(FW, FH) * 0.12);
    let blobs = null;
    blobs = ctx.players.map(p => {
      const v = ctx.inward(p.i);
      let x, y;
      if (p.side === 'bottom') { x = FW / 2; y = FH - edge; }
      else if (p.side === 'top') { x = FW / 2; y = edge; }
      else if (p.side === 'left') { x = edge; y = FH / 2; }
      else { x = FW - edge; y = FH / 2; }
      if (ctx.n === 2) x += (p.side === 'bottom' ? -1 : 1) * FW * 0.12;
      return { i: p.i, color: p.color, x, y, a: Math.atan2(v.y, v.x), bump: 0, roll: 0, r: R0,
        fx: { big: 0, fast: 0, freeze: 0, shield: 0, rev: 0, magnet: 0 }, help: false };
    });
    blobs.forEach(b => paintCircle(b.x, b.y, R0 * 1.3, b.i));

    /* ---------- power-ups ---------- */
    const PU = {
      big:    { em: '🖌️', col: '#c58bff', w: 2.5, self: '🖌️ Широкая кисть!' },
      fast:   { em: '⚡', col: '#3ddc97', w: 2.5, self: '⚡ Скорость!' },
      bomb:   { em: '💣', col: '#ff9f43', w: 2,   self: '💣 Клякса!' },
      freeze: { em: '❄️', col: '#9fdcff', w: 1.6, self: '❄️ Враги заморожены!', foe: '❄️ Заморозка!' },
      shield: { em: '🛡️', col: '#ffd166', w: 1.6, self: '🛡️ Щит на краску!' },
      rev:    { em: '🔀', col: '#ff6b9a', w: 1.6, self: '🔀 Путаница врагам!', foe: '🔀 Руль наоборот!' },
      magnet: { em: '🧲', col: '#ff5a7a', w: 1.2, self: '🧲 Магнит!' },
      swap:   { em: '🔄', col: '#7af0ff', w: 0.7, self: '🔄 Обмен с лидером!', foe: '🔄 Тебя обокрали!' },
    };
    const PU_KEYS = Object.keys(PU);
    function pickPU() {
      if (window.__dbgPU) return U.pick(window.__dbgPU); // test hook
      const keys = PU_KEYS.filter(k => k !== 'swap' || elapsed > 15);
      let tot = 0; for (const k of keys) tot += PU[k].w;
      let r = Math.random() * tot;
      for (const k of keys) { r -= PU[k].w; if (r <= 0) return k; }
      return 'big';
    }
    let pups = [];
    let parts = [], rings = [], drops = [];
    let shake = 0;
    function spawnPU() {
      if (state !== 'play' || pups.length >= (mod === 'bonus' ? 4 : 2)) return;
      const pr = CS * 1.6;
      const helped = blobs.find(b => b.help);
      for (let tries = 0; tries < 40; tries++) {
        let x, y;
        if (helped && Math.random() < 0.6 && tries < 20) {
          const a = Math.random() * TAU, d = U.rand(S * 0.15, S * 0.3);
          x = helped.x + Math.cos(a) * d; y = helped.y + Math.sin(a) * d;
          if (x < pr * 2 || y < pr * 2 || x > FW - pr * 2 || y > FH - pr * 2) continue;
        } else { x = U.rand(pr * 2, FW - pr * 2); y = U.rand(pr * 2, FH - pr * 2); }
        if (blobs.some(b => U.dist(b.x, b.y, x, y) < S * 0.14)) continue;
        if (pups.some(q => U.dist(q.x, q.y, x, y) < S * 0.15)) continue;
        pups.push({ x, y, r: pr, type: pickPU(), t: 0, life: 10 });
        return;
      }
    }

    let state = 'play';
    let elapsed = 0;
    let lastTick = -1;
    let nextPU = 3;
    const rainAt = U.rand(18, 38);
    let rainLeft = 0, rainAcc = 0, rushOn = false, rained = false;

    function fmt(t) {
      t = Math.max(0, Math.ceil(t));
      return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    }
    function renderUI() {
      const left = DUR - elapsed;
      const best = Math.max(...counts);
      ui.forEach((u, i) => {
        const pc = Math.round(counts[i] / TOTAL * 100);
        const key = pc + '|' + fmt(left) + (counts[i] === best);
        if (key !== u.last) {
          u.last = key;
          u.pct.textContent = pc + '%';
          u.pct.classList.toggle('lead', counts[i] === best && best > 0 && counts.filter(c => c === best).length === 1);
          u.sub.textContent = '⏱ ' + fmt(left) + (rushOn ? ' ⏩' : '') + (MODS[mod].chip ? ' ' + MODS[mod].chip : '');
          u.sub.classList.toggle('hot', left <= 10);
          u.barI.style.width = (Math.max(0, left) / DUR * 100).toFixed(1) + '%';
        }
        const b = blobs[i], f = b.fx, chips = [];
        const add = (em, t, bad) => chips.push([em + ' ' + Math.ceil(t), bad]);
        if (f.big > 0) add('🖌️', f.big);
        if (f.fast > 0) add('⚡', f.fast);
        if (f.shield > 0) add('🛡️', f.shield);
        if (f.magnet > 0) add('🧲', f.magnet);
        if (f.freeze > 0) add('❄️', f.freeze, true);
        if (f.rev > 0) add('🔀', f.rev, true);
        if (b.help) chips.push(['🆘 фора', false]);
        const fk = chips.map(c => c[0]).join('|');
        if (fk !== u.fxKey) {
          u.fxKey = fk;
          u.fx.replaceChildren(...chips.map(c => U.h('span', { class: c[1] ? 'bad' : '' }, c[0])));
          u.L.classList.toggle('rev', f.rev > 0); u.R.classList.toggle('rev', f.rev > 0);
          u.L.classList.toggle('ice', f.freeze > 0); u.R.classList.toggle('ice', f.freeze > 0);
        }
      });
    }

    function finish() {
      state = 'over';
      let pcs = counts.map(c => Math.round(c / TOTAL * 100));
      if (new Set(pcs).size < pcs.length) pcs = counts.map(c => Math.round(c / TOTAL * 1000) / 10);
      const best = Math.max(...counts);
      const winners = counts.map((c, i) => c === best ? i : -1).filter(i => i >= 0);
      const msg = ctx.players.map(p => `${p.name} ${pcs[p.i]}%`).join(' · ');
      if (winners.length === 1) {
        const p = ctx.players[winners[0]];
        say(`${p.name}: ${pcs[p.i]}%!`, { color: p.color, fg: '#111', ms: 1800 });
      } else say('Ничья!', { ms: 1800 });
      ctx.after(1900, () => ctx.end({ winners, scores: pcs, msg }));
    }

    ctx.onStart = () => {
      say('Крась!', { ms: 800, color: '#3ddc97', fg: '#0f1220' });
      if (mod !== 'none') bannerAll(MODS[mod].name, '#ffffff', true);
    };

    ctx.loop((dt) => {
      if (dt > 0 && state === 'play') update(dt);
      if (dt > 0) {
        for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
        parts = parts.filter(p => p.t < p.life);
        for (const r of rings) r.t += dt;
        rings = rings.filter(r => r.t < r.life);
        shake *= Math.exp(-dt * 9);
      }
      renderUI();
      draw();
    });

    function applyPU(b, q) {
      const def = PU[q.type];
      const foes = blobs.filter(o => o !== b);
      rings.push({ x: q.x, y: q.y, t: 0, life: 0.45, c: def.col, r: CS * 6 });
      burst(q.x, q.y, def.col, 18);
      switch (q.type) {
        case 'big': b.fx.big = 5; break;
        case 'fast': b.fx.fast = 5; b.fx.freeze = 0; break;
        case 'bomb':
          paintCircle(q.x, q.y, CS * 6.5, b.i);
          burst(q.x, q.y, b.color, 40);
          rings.push({ x: q.x, y: q.y, t: 0, life: 0.6, c: b.color, r: CS * 9 });
          shake = Math.max(shake, 7);
          break;
        case 'freeze': foes.forEach(o => { o.fx.freeze = 2.2; o.fx.fast = 0; burst(o.x, o.y, '#bfe8ff', 16); }); shake = Math.max(shake, 4); break;
        case 'shield': b.fx.shield = 5; break;
        case 'rev': foes.forEach(o => { o.fx.rev = 4; }); break;
        case 'magnet': b.fx.magnet = 6; break;
        case 'swap': {
          let lead = -1, lc = -1;
          for (const o of foes) if (counts[o.i] > lc) { lc = counts[o.i]; lead = o.i; }
          if (lead < 0 || counts[lead] <= counts[b.i]) { // already leading: becomes a big splash
            paintCircle(q.x, q.y, CS * 6.5, b.i);
            banner(b.i, '💣 Ты лидер: клякса!', def.col);
            shake = Math.max(shake, 6);
            return;
          }
          for (let k = 0; k < TOTAL; k++) {
            if (owner[k] === b.i) owner[k] = lead; else if (owner[k] === lead) owner[k] = b.i;
          }
          const t = counts[b.i]; counts[b.i] = counts[lead]; counts[lead] = t;
          redrawAll();
          shake = Math.max(shake, 12);
          banner(b.i, def.self, def.col);
          banner(lead, def.foe, '#ff4d6d');
          return;
        }
      }
      banner(b.i, def.self, def.col);
      if (def.foe) foes.forEach(o => banner(o.i, def.foe, '#ff4d6d'));
    }

    function update(dt) {
      elapsed += dt;
      const left = DUR - elapsed;
      if (left <= 3.999 && Math.ceil(left) !== lastTick && left > 0) {
        lastTick = Math.ceil(left);
        say(String(lastTick), { ms: 700, size: 40 });
      }
      if (!rushOn && left <= 10) {
        rushOn = true;
        bannerAll('⏩ Финишный рывок: скорость ×1.5!', '#ff6b6b', true);
        shake = Math.max(shake, 5);
      }
      if (!rained && elapsed >= rainAt) {
        rained = true;
        rainLeft = 4;
        bannerAll('🌧️ Ливень из краски!', '#5ec8ff', true);
      }
      if (rainLeft > 0) {
        rainLeft = Math.max(0, rainLeft - dt);
        rainAcc += dt;
        while (rainAcc > 0.09) {
          rainAcc -= 0.09;
          // weight toward players with less paint
          const w = counts.map(c => Math.pow(1 - c / TOTAL, 3) + 0.05);
          let r = Math.random() * w.reduce((a, b) => a + b, 0), who = 0;
          for (let k = 0; k < w.length; k++) { r -= w[k]; if (r <= 0) { who = k; break; } }
          drops.push({ x: U.rand(0, FW), y: U.rand(0, FH), who, t: 0, life: 0.45, r: CS * U.rand(1.6, 2.8) });
        }
      }
      drops = drops.filter(d => {
        d.t += dt;
        if (d.t >= d.life) {
          paintCircle(d.x, d.y, d.r, d.who);
          burst(d.x, d.y, ctx.players[d.who].color, 5);
          return false;
        }
        return true;
      });
      if (elapsed >= nextPU) { spawnPU(); nextPU = elapsed + U.rand(3.5, 6) * (mod === 'bonus' ? 0.5 : 1); }
      // comeback: last place with a real gap gets help
      const best = Math.max(...counts), worst = Math.min(...counts);
      blobs.forEach(b => {
        b.helpHold = Math.max(0, (b.helpHold || 0) - dt);
        if (b.helpHold > 0) return; // hysteresis: keep the state for a while
        const want = elapsed > 8 && counts[b.i] === worst && (best - worst) / TOTAL > (b.help ? 0.03 : 0.06);
        if (want !== b.help) {
          b.help = want;
          b.helpHold = 5;
          if (want && !b.helpSaid) { b.helpSaid = true; banner(b.i, '🆘 Фора: кисть шире!', '#ff9f43'); }
        }
      });
      for (const b of blobs) {
        const u = ui[b.i];
        let L = u.L.ids.size > 0, R = u.R.ids.size > 0;
        if (b.fx.rev > 0) { const t = L; L = R; R = t; }
        const turn = (R ? 1 : 0) - (L ? 1 : 0);
        for (const k in b.fx) b.fx[k] = Math.max(0, b.fx[k] - dt);
        b.bump = Math.max(0, b.bump - dt);
        if (b.fx.freeze > 0) { b.r = R0; continue; }
        b.a += turn * TURN * dt;
        const sp = SPEED * (b.fx.fast > 0 ? 1.65 : 1) * (rushOn ? 1.5 : 1);
        const rad = R0 * (b.fx.big > 0 ? 1.8 : 1) * (mod === 'wide' ? 1.35 : 1) * (b.help ? 1.25 : 1);
        b.r = rad;
        const dist = sp * dt;
        const steps = Math.max(1, Math.ceil(dist / (CS * 0.5)));
        for (let k = 0; k < steps; k++) {
          b.x += Math.cos(b.a) * dist / steps;
          b.y += Math.sin(b.a) * dist / steps;
          const rr = R0 * 0.9;
          let hitWall = false;
          if (b.x < rr) { b.x = rr; b.a = Math.PI - b.a; hitWall = true; }
          if (b.x > FW - rr) { b.x = FW - rr; b.a = Math.PI - b.a; hitWall = true; }
          if (b.y < rr) { b.y = rr; b.a = -b.a; hitWall = true; }
          if (b.y > FH - rr) { b.y = FH - rr; b.a = -b.a; hitWall = true; }
          if (hitWall) burst(b.x, b.y, b.color, 4);
          paintCircle(b.x, b.y, rad, b.i);
        }
        b.roll += dist / (R0 * 0.5);
        if (b.fx.fast > 0 || rushOn) parts.push({ x: b.x - Math.cos(b.a) * R0, y: b.y - Math.sin(b.a) * R0, vx: 0, vy: 0, life: 0.3, t: 0, c: b.color });
      }
      // blob-blob bumps
      for (let i = 0; i < blobs.length; i++) for (let j = i + 1; j < blobs.length; j++) {
        const a = blobs[i], b = blobs[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), md = R0 * 1.8;
        if (d >= md || d < 0.001) continue;
        const nx = dx / d, ny = dy / d, ov = (md - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const reflect = (o, mx, my) => {
          const vx = Math.cos(o.a), vy = Math.sin(o.a), dot = vx * mx + vy * my;
          if (dot > 0) o.a = Math.atan2(vy - 2 * dot * my, vx - 2 * dot * mx);
        };
        reflect(a, nx, ny); reflect(b, -nx, -ny);
        if (a.bump <= 0) { burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#ffffff', 12); shake = Math.max(shake, 3); }
        a.bump = b.bump = 0.25;
      }
      // power-ups (magnet pulls)
      for (const q of pups) {
        q.t += dt;
        for (const b of blobs) {
          if (b.fx.magnet <= 0) continue;
          const dx = b.x - q.x, dy = b.y - q.y, d = Math.hypot(dx, dy);
          if (d > 1) { const v = Math.min(d, S * 0.45 * dt); q.x += dx / d * v; q.y += dy / d * v; }
        }
      }
      pups = pups.filter(q => {
        if (q.t > q.life) return false;
        for (const b of blobs) {
          if (b.fx.freeze <= 0 && U.dist(b.x, b.y, q.x, q.y) < R0 + q.r) { applyPU(b, q); return false; }
        }
        return true;
      });
      if (elapsed >= DUR) finish();
    }

    function burst(x, y, c, n) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, v = U.rand(30, 160) * S / 700;
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: U.rand(.35, .8), t: 0, c });
      }
    }

    function draw() {
      const g = C.g, dpr = C.dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = BG;
      g.fillRect(0, 0, ctx.W, ctx.H);
      const { s } = view;
      const ox = view.ox + (shake > 0.3 ? U.rand(-shake, shake) : 0), oy = view.oy + (shake > 0.3 ? U.rand(-shake, shake) : 0);
      g.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
      const now = performance.now() / 1000;
      g.fillStyle = mod === 'ice' ? '#16203a' : '#151a35';
      g.fillRect(0, 0, FW, FH);
      // painted cells
      g.imageSmoothingEnabled = false;
      g.globalAlpha = 0.82;
      g.drawImage(off, 0, 0, FW, FH);
      g.globalAlpha = 1;
      g.imageSmoothingEnabled = true;
      // shielded territory shimmer
      for (const b of blobs) {
        if (b.fx.shield <= 0) continue;
        g.save();
        g.globalAlpha = 0.18 + 0.1 * Math.sin(now * 8);
        g.fillStyle = '#ffffff';
        for (let k = 0; k < TOTAL; k += 1) {
          if (owner[k] !== b.i) continue;
          const cx = k % gw, cy = (k - cx) / gw;
          if ((cx + cy) % 2) continue;
          g.fillRect(cx * CS + CS * 0.3, cy * CS + CS * 0.3, CS * 0.4, CS * 0.4);
        }
        g.restore();
      }
      // cell grid
      g.strokeStyle = 'rgba(15,18,32,.55)';
      g.lineWidth = Math.max(1, 1.2 / s);
      g.beginPath();
      for (let x = CS; x < FW; x += CS) { g.moveTo(x, 0); g.lineTo(x, FH); }
      for (let y = CS; y < FH; y += CS) { g.moveTo(0, y); g.lineTo(FW, y); }
      g.stroke();
      // border
      g.save();
      g.strokeStyle = rushOn ? '#ff6b6b' : '#3a4580';
      g.lineWidth = 3;
      g.shadowColor = rushOn ? '#ff6b6b' : '#6c7cff';
      g.shadowBlur = rushOn ? 14 + 8 * Math.sin(now * 10) : 10;
      g.strokeRect(-1.5, -1.5, FW + 3, FH + 3);
      g.restore();

      // rain drops (shrinking target rings)
      for (const d of drops) {
        const k = d.t / d.life;
        g.strokeStyle = U.alpha(ctx.players[d.who].color, 0.3 + 0.6 * k);
        g.lineWidth = CS * 0.25;
        g.beginPath(); g.arc(d.x, d.y, d.r * (2.2 - 1.2 * k), 0, TAU); g.stroke();
      }
      // power-ups
      for (const q of pups) {
        const blink = q.life - q.t < 2 && Math.floor(now * 8) % 2 === 0;
        if (blink) continue;
        const pop = Math.min(1, q.t * 4);
        const r = q.r * pop * (1 + 0.08 * Math.sin(now * 6 + q.x));
        const col = PU[q.type].col;
        g.save();
        g.shadowColor = col; g.shadowBlur = 18;
        g.fillStyle = 'rgba(15,18,32,.85)';
        g.strokeStyle = col; g.lineWidth = CS * 0.3;
        g.beginPath(); g.arc(q.x, q.y, r, 0, TAU); g.fill(); g.stroke();
        g.restore();
        g.font = `${Math.round(r * 1.15)}px sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(PU[q.type].em, q.x, q.y + r * 0.06);
      }
      // particles under the blobs
      for (const p of parts) {
        const k = 1 - p.t / p.life;
        g.globalAlpha = k;
        g.fillStyle = p.c;
        g.beginPath(); g.arc(p.x, p.y, CS * 0.3 * (0.4 + k), 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
      // blobs
      for (const b of blobs) {
        const R = b.r || R0;
        const frozen = b.fx.freeze > 0;
        g.save();
        g.shadowColor = b.color; g.shadowBlur = 22;
        g.fillStyle = b.color;
        g.beginPath(); g.arc(b.x, b.y, R0, 0, TAU); g.fill();
        g.shadowBlur = 0;
        if (R > R0 * 1.01) {
          g.strokeStyle = U.alpha('#ffffff', 0.55);
          g.setLineDash([CS * 0.6, CS * 0.5]);
          g.lineWidth = CS * 0.2;
          g.beginPath(); g.arc(b.x, b.y, R, now * 2, now * 2 + TAU); g.stroke();
          g.setLineDash([]);
        }
        g.translate(b.x, b.y);
        g.rotate(b.a);
        g.fillStyle = 'rgba(255,255,255,.9)';
        g.beginPath(); g.arc(R0 * 0.35, 0, R0 * 0.32, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(15,18,32,.45)';
        g.lineWidth = R0 * 0.12;
        const ph = (b.roll % 1) * R0 * 0.6;
        for (let k = -2; k <= 2; k++) {
          const xx = k * R0 * 0.6 - ph + R0 * 0.3;
          if (Math.abs(xx) > R0 * 0.85) continue;
          const hh = Math.sqrt(R0 * R0 - xx * xx) * 0.85;
          g.beginPath(); g.moveTo(xx, -hh); g.lineTo(xx, hh); g.stroke();
        }
        g.restore();
        if (frozen) {
          g.save();
          g.fillStyle = 'rgba(190,232,255,.55)';
          g.strokeStyle = '#e6f7ff';
          g.lineWidth = CS * 0.2;
          g.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = k / 6 * TAU + 0.3;
            const rr = R0 * (1.25 + (k % 2) * 0.2);
            if (k === 0) g.moveTo(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr); else g.lineTo(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr);
          }
          g.closePath(); g.fill(); g.stroke();
          g.font = `${Math.round(R0 * 1.1)}px sans-serif`;
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText('❄️', b.x, b.y);
          g.restore();
        }
        if (b.fx.shield > 0) {
          g.save();
          g.strokeStyle = U.alpha('#ffd166', 0.6 + 0.3 * Math.sin(now * 8));
          g.lineWidth = CS * 0.3;
