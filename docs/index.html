          drawOrb(x + q.x + U.rand(-jit, jit), y + q.y + U.rand(-jit, jit), rad * sc, P[c.o].color);
        }
        g.shadowBlur = 0; g.globalAlpha = 1;
      }
      // blocked tap feedback
      for (const c of all()) if (c.pop < 0 && (c.blocked || c.n === 0)) { if (dt > 0) c.pop = Math.min(0, c.pop + dt); }
      // flyers
      for (const f of flyers) {
        const a = cellXY(f.from), b = cellXY(f.to), t = Math.min(1, f.t), e = t * t * (3 - 2 * t);
        const x = U.lerp(a.x, b.x, e), y = U.lerp(a.y, b.y, e);
        g.shadowColor = P[f.o].color; g.shadowBlur = 20;
        drawOrb(x, y, rad * 1.1, P[f.o].color);
        g.shadowBlur = 0;
      }
      // armed bomb preview
      if (armed && state === 'input') {
        g.strokeStyle = `rgba(255,77,109,${0.5 + 0.4 * Math.sin(pulse * 8)})`; g.lineWidth = 4;
        g.setLineDash([10, 8]); g.strokeRect(bx + 2, by + 2, bw - 4, bh - 4); g.setLineDash([]);
      }
      // rings + particles
      for (let k = rings.length - 1; k >= 0; k--) {
        const r = rings[k]; r.t += dt;
        if (r.t > r.life) { rings.splice(k, 1); continue; }
        const f = r.t / r.life;
        g.strokeStyle = U.alpha(r.color, 1 - f); g.lineWidth = 5 * (1 - f) + 1;
        g.beginPath(); g.arc(r.x, r.y, U.lerp(r.r, r.max, f), 0, 6.283); g.stroke();
      }
      g.globalCompositeOperation = 'lighter';
      for (let k = parts.length - 1; k >= 0; k--) {
        const p = parts[k]; p.t += dt;
        if (p.t > p.life) { parts.splice(k, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
        g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.color;
        g.beginPath(); g.arc(p.x, p.y, p.s, 0, 6.283); g.fill();
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      if (flash > 0) { g.fillStyle = U.alpha(flashColor, Math.min(0.35, flash)); g.fillRect(-20, -20, ctx.W + 40, ctx.H + 40); flash -= dt; }
      g.restore();
    });

    // test hook
    ctx.root._ch = () => ({ state, turn, alive: alive.slice(), armed, bombUsed: bombUsed.slice(), moves: moves.slice(), turns,
      cells: all().map(c => ({ a: c.a, b: c.b, o: c.o, n: c.n, blocked: c.blocked, star: c.star, ...cellXY(c) })) });

    render();
    ctx.onStart = () => sayP(turn, `Первым ходит ${P[turn].name}`, { ms: 1500 });
  },
});

</script>
<script>/* games/connect.js */
registerGame({
  id: 'connect',
  title: '4 в ряд',
  emoji: '🔴',
  desc: 'Четыре в ряд с бомбами, переворотами и землетрясениями',
  rules: 'Ходите по очереди: чей ход, у того светится край экрана. Нажми на столбец, и фишка упадёт.\nСобери 4 своих фишки подряд по горизонтали, вертикали или диагонали.\nУ каждого по одному разу за игру (кнопки у твоего края):\n💣 Бомба: следующая фишка взрывается и сносит всё вокруг.\n✌️ Две фишки: ходишь дважды подряд.\n🙃 Переворот: гравитация меняется, все фишки падают в другую сторону.\n✨ Каждые 5 ходов случается событие: 🌪️ Сдвиг ряда, 🪨 Камень, 🙃 Переворот или 💥 Землетрясение.\n⏳ На ход 12 секунд, потом фишка падает сама.\nДля двоих поле 7×6, для троих 9×7.',
  start(ctx) {
    const C = ctx.n === 2 ? 7 : 9;
    const R = ctx.n === 2 ? 6 : 7;
    const TURN = 12;
    const EVENT_EVERY = 5;
    const STONE = '#8a8fa3';
    const grid = Array.from({ length: R }, () => Array(C).fill(null)); // grid[row][col] = disc | null
    let gdir = 1;                // 1: discs fall toward the bottom of the screen, -1: toward the top
    let turn = U.randInt(0, ctx.n - 1);
    let phase = 'idle';          // idle | anim | done
    let moves = 0;
    let extraDrops = 0;
    let armed = null;            // 'bomb' when the next disc is a bomb
    let deadline = TURN;
    let winLines = null;
    let flash = null;            // {col, t, bad}
    let onSettled = null;
    let shake = 0;
    const parts = [];            // explosion particles
    const rings = [];
    const used = ctx.players.map(() => ({ bomb: false, dbl: false, flip: false }));
    let geo = null;

    ctx.root.classList.add('g-connect');
    ctx.root.append(U.h('style', null, `
      .g-connect .zi{position:absolute;inset:6px;border-radius:18px;display:flex;align-items:center;justify-content:flex-start;
        padding:0 10px 0 16px;gap:12px;background:#1a1f35;border:3px solid transparent;transition:background .25s,box-shadow .25s;font-weight:900;overflow:hidden}
      .g-connect .zi .dc{width:30px;height:30px;border-radius:50%;background:var(--pc);flex:0 0 auto;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
      .g-connect .zi .tx{flex:1;font-size:24px;color:#9aa1c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
      .g-connect .zi .tx b{color:var(--tc)}
      .g-connect .zi.on{background:var(--pc);border-color:#fff;box-shadow:0 0 30px 6px var(--pc)}
      .g-connect .zi.on .tx{color:#111;font-size:27px}
      .g-connect .zi.on .dc{background:#fff}
      .g-connect .zi.win{background:var(--pc);border-color:#fff}
      .g-connect .zi.win .tx{color:#111}
      .g-connect .pws{display:flex;gap:8px;flex:0 0 auto}
      .g-connect .pw{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;
        justify-content:center;font-size:34px;line-height:1;transition:opacity .2s,transform .08s;opacity:.45;position:relative}
      .g-connect .zi.on .pw{background:rgba(255,255,255,.85);opacity:1}
      .g-connect .pw:active{transform:scale(.92)}
      .g-connect .pw.used{opacity:.15 !important;filter:grayscale(1)}
      .g-connect .pw.used::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:4px;background:#111;transform:rotate(-35deg);border-radius:2px}
      .g-connect .pw.armed{background:#fff;box-shadow:0 0 0 4px #111,0 0 18px 6px #fff;animation:c4Pulse .7s infinite alternate}
      @keyframes c4Pulse{to{transform:scale(1.1)}}
      .g-connect .zi .tm{position:absolute;left:0;bottom:0;height:7px;background:rgba(0,0,0,.45);display:none}
      .g-connect .zi.on .tm{display:block}
      .g-connect .zi .tm.low{background:#fff}
    `));

    /* ---------- zones ---------- */
    const POWERS = [['bomb', '💣'], ['dbl', '✌️'], ['flip', '🙃']];
    const seats = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 92 });
      const tx = U.h('div', { class: 'tx' });
      const pw = {};
      const pws = U.h('div', { class: 'pws' });
      POWERS.forEach(([k, ic]) => {
        const b = U.h('div', { class: 'pw' }, ic);
        ctx.tap(b, () => usePower(p.i, k));
        pw[k] = b;
        pws.append(b);
      });
      const tm = U.h('div', { class: 'tm' });
      const inner = U.h('div', { class: 'zi' }, U.h('div', { class: 'dc' }), tx, pws, tm);
      z.el.append(inner);
      return { z, inner, tx, pw, tm };
    });

    function render(winners) {
      seats.forEach((s, i) => {
        s.inner.style.setProperty('--tc', ctx.players[turn].color);
        s.inner.classList.toggle('on', phase !== 'done' && i === turn);
        s.inner.classList.toggle('win', !!winners && winners.includes(i));
        if (phase === 'done') s.tx.textContent = !winners || !winners.length ? 'Ничья' : winners.includes(i) ? 'Победа!' : `Победил ${winners.map(w => ctx.players[w].name).join(' и ')}`;
        else if (i === turn) s.tx.textContent = extraDrops > 0 ? 'Твой ход! ✌️ ещё' : armed === 'bomb' ? 'Бомба готова!' : 'Твой ход!';
        else s.tx.replaceChildren('Ход: ', U.h('b', null, ctx.players[turn].name));
        for (const [k] of POWERS) {
          s.pw[k].classList.toggle('used', used[i][k]);
          s.pw[k].classList.toggle('armed', k === 'bomb' && armed === 'bomb' && i === turn);
        }
      });
    }
    const say = (text, color, fg) => ctx.toast(text, { color: color || '#2b3157', fg: fg || '#fff', ms: 1400, size: 26 });

    /* ---------- board geometry ---------- */
    const { cv, g } = ctx.canvas();
    function layout() {
      const W = ctx.W, H = ctx.H, d = seats[0].z.h;
      // keep clear of the exit button (2p: middle of the left edge, 3p: middle of the top edge)
      const r = ctx.n === 2 ? { x: 50, y: d, w: W - 100, h: H - 2 * d } : { x: d, y: 50, w: W - 2 * d, h: H - d - 50 };
      const pad = 10;
      const cell = Math.min((r.w - 2 * pad) / (C + 0.3), (r.h - 2 * pad) / (R + 0.8));
      const bw = cell * C, bh = cell * R;
      const bx = r.x + (r.w - bw) / 2;
      const by = r.y + (r.h - bh) / 2;
      geo = { r, cell, bx, by, bw, bh };
    }
    layout();
    ctx.onResize(layout);

    /* ---------- board helpers ---------- */
    const full = () => grid.every(row => row.every(v => v));
    function targetRow(col) {
      if (gdir > 0) { for (let k = R - 1; k >= 0; k--) if (!grid[k][col]) return k; }
      else { for (let k = 0; k < R; k++) if (!grid[k][col]) return k; }
      return -1;
    }
    function collapse() {
      for (let c = 0; c < C; c++) {
        const list = [];
        const order = gdir > 0 ? [...Array(R).keys()].reverse() : [...Array(R).keys()];
        for (const r of order) if (grid[r][c]) list.push(grid[r][c]);
        for (let r = 0; r < R; r++) grid[r][c] = null;
        list.forEach((dsc, k) => { grid[order[k]][c] = dsc; dsc.v = 0; });
      }
    }
    function settle(cb) { phase = 'anim'; onSettled = cb; }

    function findLines() {
      const lines = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const d0 = grid[r][c];
        if (!d0 || d0.p < 0) continue;
        for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
          const pr = r - dr, pc = c - dc;
          if (pr >= 0 && pr < R && pc >= 0 && pc < C && grid[pr][pc] && grid[pr][pc].p === d0.p) continue; // not a run start
          const cells = [];
          let rr = r, cc = c;
          while (rr >= 0 && rr < R && cc >= 0 && cc < C && grid[rr][cc] && grid[rr][cc].p === d0.p) { cells.push([rr, cc]); rr += dr; cc += dc; }
          if (cells.length >= 4) lines.push({ p: d0.p, cells });
        }
      }
      return lines;
    }

    // After any settle: game over? Returns true if the game ended.
    function checkEnd() {
      const lines = findLines();
      if (lines.length) {
        phase = 'done';
        winLines = lines;
        const winners = [...new Set(lines.map(l => l.p))];
        render(winners);
        ctx.after(2000, () => ctx.end(winners.length === 1 ? { winner: winners[0] } : { winners }));
        return true;
      }
      if (full()) {
        phase = 'done';
        render([]);
        ctx.after(1500, () => ctx.end({}));
        return true;
      }
      return false;
    }

    function ready() {
      phase = 'idle';
      deadline = ctx.time + TURN;
      render();
    }

    /* ---------- moves ---------- */
    function drop(col) {
      const row = targetRow(col);
      if (row < 0) { flash = { col, t: 0.35, bad: true }; return false; }
      flash = { col, t: 0.25, bad: false };
      const kind = armed === 'bomb' ? 'bomb' : 'n';
      if (armed === 'bomb') { armed = null; used[turn].bomb = true; }
      grid[row][col] = { p: turn, kind, x: col, y: gdir > 0 ? -1 : R, v: 0 };
      render();
      settle(() => afterDrop(row, col));
      return true;
    }

    function afterDrop(row, col) {
      const dsc = grid[row][col];
      if (dsc && dsc.kind === 'bomb') {
        explode(row, col);
        collapse();
        phase = 'anim';
        ctx.after(350, () => settle(finishAction));
        return;
      }
      finishAction();
    }

    function explode(row, col) {
      const { cell, bx, by } = geo;
      const cx = bx + (col + 0.5) * cell, cy = by + (row + 0.5) * cell;
      for (let r = row - 1; r <= row + 1; r++) for (let c = col - 1; c <= col + 1; c++) {
        if (r < 0 || r >= R || c < 0 || c >= C || !grid[r][c]) continue;
        const dsc = grid[r][c];
        const color = dsc.p >= 0 ? ctx.players[dsc.p].color : STONE;
        for (let k = 0; k < 7; k++) {
          const a = Math.random() * Math.PI * 2, s = U.rand(2, 9) * cell;
          parts.push({ x: bx + (c + 0.5) * cell, y: by + (r + 0.5) * cell, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.5, 0.9), color, r: U.rand(0.06, 0.14) * cell });
        }
        grid[r][c] = null;
      }
      rings.push({ x: cx, y: cy, t: 0 });
      shake = 0.4;
      say('💥 БУМ!', '#ff7a1a', '#111');
    }

    function finishAction() {
      if (checkEnd()) return;
      if (extraDrops > 0) { extraDrops--; ready(); return; }
      moves++;
      turn = (turn + 1) % ctx.n;
      if (moves % EVENT_EVERY === 0) runEvent(() => { if (!checkEnd()) ready(); });
      else ready();
    }

    /* ---------- powers ---------- */
    function usePower(i, k) {
      if (phase !== 'idle' || i !== turn || used[i][k]) return;
      if (k === 'bomb') {
        armed = armed === 'bomb' ? null : 'bomb';
        if (armed) say(`💣 ${ctx.players[i].name}: следующая фишка взорвётся`, ctx.players[i].color, '#111');
        render();
      } else if (k === 'dbl') {
        used[i].dbl = true;
        extraDrops++;
        say(`✌️ ${ctx.players[i].name} ходит дважды`, ctx.players[i].color, '#111');
        render();
      } else if (k === 'flip') {
        used[i].flip = true;
        say('🙃 Переворот гравитации!', ctx.players[i].color, '#111');
        gdir = -gdir;
        collapse();
        render();
        settle(() => { if (!checkEnd()) ready(); });
      }
    }

    /* ---------- random events ---------- */
    function runEvent(cb) {
      phase = 'anim';
      const discs = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c]) discs.push([r, c]);
      const rowsWith = [...Array(R).keys()].filter(r => grid[r].filter(Boolean).length >= 2);
      const opts = ['stone', 'flip'];
      if (rowsWith.length) opts.push('shift');
      if (discs.length >= C) opts.push('quake');
      const ev = U.pick(opts);
      const NAMES_EV = { shift: '🌪️ Сдвиг ряда!', stone: '🪨 Камень!', flip: '🙃 Переворот!', quake: '💥 Землетрясение!' };
      say('✨ ' + NAMES_EV[ev], '#8a4dff');
      ctx.after(1000, () => {
        if (ev === 'shift') {
          const r = U.pick(rowsWith);
          const dir = Math.random() < 0.5 ? 1 : -1;
          const row = grid[r].slice();
          for (let c = 0; c < C; c++) grid[r][(c + dir + C) % C] = row[c];
          collapse();
          settle(cb);
        } else if (ev === 'stone') {
          const cols = [...Array(C).keys()].filter(c => targetRow(c) >= 0);
          if (!cols.length) { cb(); return; }
          const col = U.pick(cols), row = targetRow(col);
          grid[row][col] = { p: -1, kind: 'stone', x: col, y: gdir > 0 ? -1 : R, v: 0 };
          settle(cb);
        } else if (ev === 'flip') {
          gdir = -gdir;
          collapse();
          settle(cb);
        } else {
          const r = gdir > 0 ? R - 1 : 0;
          for (let c = 0; c < C; c++) if (grid[r][c]) {
            const dsc = grid[r][c];
            const { cell, bx, by } = geo;
            for (let k = 0; k < 4; k++) {
              const a = Math.random() * Math.PI * 2, s = U.rand(1, 5) * cell;
              parts.push({ x: bx + (c + 0.5) * cell, y: by + (r + 0.5) * cell, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.4, 0.8), color: dsc.p >= 0 ? ctx.players[dsc.p].color : STONE, r: 0.1 * cell });
            }
            grid[r][c] = null;
          }
          shake = 0.6;
          collapse();
          ctx.after(300, () => settle(cb));
        }
      });
    }

    /* ---------- input ---------- */
    ctx.pointer(cv, {
      down(id, x, y) {
        if (ctx.paused || phase !== 'idle' || !geo) return;
        const { r, bx, bw, cell } = geo;
        if (x < bx || x > bx + bw || y < r.y || y > r.y + r.h) return;
        drop(U.clamp(Math.floor((x - bx) / cell), 0, C - 1));
      },
    });

    /* ---------- animation + drawing ---------- */
    let pulse = 0;
    function drawDisc(x, y, rad, dsc, alpha = 1) {
      g.globalAlpha = alpha;
      const color = dsc.p >= 0 ? ctx.players[dsc.p].color : STONE;
      g.fillStyle = color;
      g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
      if (dsc.kind === 'stone') {
        g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = Math.max(2, rad * 0.08);
        g.beginPath(); g.moveTo(x - rad * 0.5, y - rad * 0.3); g.lineTo(x - rad * 0.05, y + rad * 0.05); g.lineTo(x + rad * 0.4, y - rad * 0.15);
        g.moveTo(x - rad * 0.05, y + rad * 0.05); g.lineTo(x + rad * 0.1, y + rad * 0.55); g.stroke();
      } else {
        g.fillStyle = 'rgba(0,0,0,.18)';
        g.beginPath(); g.arc(x, y, rad * 0.62, 0, Math.PI * 2); g.fill();
        g.fillStyle = color;
        g.beginPath(); g.arc(x, y - rad * 0.06, rad * 0.56, 0, Math.PI * 2); g.fill();
      }
      if (dsc.kind === 'bomb') {
        g.font = `${rad * 1.1}px sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('💣', x, y + rad * 0.05);
      }
      g.globalAlpha = 1;
    }

    ctx.loop((dt) => {
      if (!geo) return;
      pulse += dt;
      // move discs toward their cells
      if (dt > 0) {
        let moving = false;
        const G = 70;
        for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
          const dsc = grid[r][c];
          if (!dsc) continue;
          if (dsc.x !== c) {
            const s = Math.sign(c - dsc.x) * 7 * dt;
            dsc.x = Math.abs(c - dsc.x) <= Math.abs(s) ? c : dsc.x + s;
            moving = true;
          }
          if (dsc.y !== r) {
            dsc.v += G * dt;
            const s = Math.sign(r - dsc.y) * dsc.v * dt;
            dsc.y = Math.abs(r - dsc.y) <= Math.abs(s) ? r : dsc.y + s;
            if (dsc.y === r) dsc.v = 0;
            moving = true;
          }
        }
        if (!moving && phase === 'anim' && onSettled) { const f = onSettled; onSettled = null; f(); }
        if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }
        if (shake > 0) shake = Math.max(0, shake - dt);
        for (let k = parts.length - 1; k >= 0; k--) {
          const q = parts[k];
          q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
          if (q.life <= 0) parts.splice(k, 1);
        }
        for (let k = rings.length - 1; k >= 0; k--) { rings[k].t += dt; if (rings[k].t > 0.5) rings.splice(k, 1); }
        // turn timer
        if (phase === 'idle' && ctx.time > deadline) {
          const cols = [...Array(C).keys()].filter(c => targetRow(c) >= 0);
          if (cols.length) { say('⏳ Время! Фишка падает сама', '#9aa1c4', '#111'); drop(U.pick(cols)); }
        }
      }
      const s = seats[turn];
      const left = phase === 'idle' ? U.clamp(deadline - ctx.time, 0, TURN) : TURN;
      s.tm.style.width = (left / TURN) * 100 + '%';
      s.tm.classList.toggle('low', left < 4);

      const { cell, bx, by, bw, bh, r } = geo;
      const rad = cell * 0.4;
      g.clearRect(0, 0, ctx.W, ctx.H);
      g.save();
      if (shake > 0) g.translate(U.rand(-1, 1) * cell * 0.12 * shake / 0.4, U.rand(-1, 1) * cell * 0.12 * shake / 0.4);
      if (flash) {
        g.fillStyle = flash.bad ? 'rgba(255,77,109,.35)' : U.alpha(ctx.players[turn].color, 0.22);
        g.fillRect(bx + flash.col * cell, r.y, cell, r.h);
      }
      g.fillStyle = '#0a0d18';
      g.fillRect(bx, by, bw, bh);
      const winSet = new Set((winLines || []).flatMap(l => l.cells.map(([a, b]) => a * 100 + b)));
      for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++) {
        const dsc = grid[rr][cc];
        if (!dsc) continue;
        const dim = winLines && !winSet.has(rr * 100 + cc) ? 0.35 : 1;
        drawDisc(bx + (dsc.x + 0.5) * cell, by + (dsc.y + 0.5) * cell, rad, dsc, dim);
      }
      // frame with holes (drawn over the discs)
      g.fillStyle = gdir > 0 ? '#2c3566' : '#4a2c66';
      g.beginPath();
      const fr = cell * 0.14;
      g.roundRect ? g.roundRect(bx - fr, by - fr, bw + 2 * fr, bh + 2 * fr, fr * 1.6) : g.rect(bx - fr, by - fr, bw + 2 * fr, bh + 2 * fr);
      for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++) {
        const x = bx + (cc + 0.5) * cell, y = by + (rr + 0.5) * cell;
        g.moveTo(x + rad + 1, y);
        g.arc(x, y, rad + 1, 0, Math.PI * 2);
      }
      g.fill('evenodd');
      g.strokeStyle = 'rgba(255,255,255,.08)';
      g.lineWidth = 2;
      g.stroke();
      // explosion
      for (const q of parts) {
        g.globalAlpha = U.clamp(q.life * 1.5, 0, 1);
        g.fillStyle = q.color;
        g.beginPath(); g.arc(q.x, q.y, q.r, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      for (const q of rings) {
        g.strokeStyle = `rgba(255,200,80,${1 - q.t / 0.5})`;
        g.lineWidth = cell * 0.15;
        g.beginPath(); g.arc(q.x, q.y, cell * (0.3 + q.t * 4), 0, Math.PI * 2); g.stroke();
      }
      // winning lines
      if (winLines) {
        const a = 0.6 + 0.4 * Math.sin(pulse * 10);
        for (const l of winLines) {
          g.strokeStyle = `rgba(255,255,255,${a})`;
          g.lineWidth = Math.max(4, cell * 0.08);
          for (const [rr, cc] of l.cells) { g.beginPath(); g.arc(bx + (cc + 0.5) * cell, by + (rr + 0.5) * cell, rad + 2, 0, Math.PI * 2); g.stroke(); }
          const [s0, e0] = [l.cells[0], l.cells[l.cells.length - 1]];
          g.lineCap = 'round';
          g.lineWidth = Math.max(6, cell * 0.12);
          g.beginPath();
          g.moveTo(bx + (s0[1] + 0.5) * cell, by + (s0[0] + 0.5) * cell);
          g.lineTo(bx + (e0[1] + 0.5) * cell, by + (e0[0] + 0.5) * cell);
          g.stroke();
        }
      }
      // gravity chevrons on the entry side, in the current player's color
      if (phase !== 'done') {
        const hy = gdir > 0 ? by - fr - cell * 0.28 : by + bh + fr + cell * 0.28;
        if (hy - cell * 0.15 > r.y && hy + cell * 0.15 < r.y + r.h) {
          g.globalAlpha = 0.55 + 0.3 * Math.sin(pulse * 5);
          g.fillStyle = armed === 'bomb' ? '#fff' : ctx.players[turn].color;
          const w = cell * 0.16, hgt = cell * 0.12 * gdir;
          for (let cc = 0; cc < C; cc++) {
            const x = bx + (cc + 0.5) * cell;
            g.beginPath(); g.moveTo(x - w, hy - hgt); g.lineTo(x + w, hy - hgt); g.lineTo(x, hy + hgt); g.closePath(); g.fill();
          }
          g.globalAlpha = 1;
        }
      }
      g.restore();
    });

    render();
  },
});

</script>
<script>/* games/curling.js */
registerGame({
  id: 'curling',
  title: 'Кёрлинг',
  emoji: '🥌',
  desc: 'Щелчком запусти камень к центру мишени',
  rules: 'Ходите по очереди. Чей бросок — у того светится край.\n' +
    'Положи палец на свой камень у своего края, разгони и отпусти — скорость броска берётся из движения пальца. Медленно отпустил — камень просто переставлен.\n' +
    'Камни сталкиваются: выбивай чужие. Улетел за край — камень пропал.\n' +
    'В конце энда очки: центр 5, середина 3, край 1. 3 камня на игрока, 3 энда.\n' +
    '💣 Бомба — каждый 2-й камень может быть бомбой: взрывается при остановке и раскидывает всех.\n' +
    '🪨 Тяжёлый — тройной вес, сносит всё.\n' +
    '🧊 Лёд — на пятне нет трения.\n' +
    '🌀 Вихрь — закручивает камни.\n' +
    '⭐ Звезда — камень на ней даёт +2.\n' +
    '🔨 Отстающий бросает последним.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const ENDS = 3, PER = 3, DEPTH = 64;
    const SR = 0.034;                     // stone radius (S units)
    const R1 = 0.06, R2 = 0.12, R3 = 0.18; // house rings
    const MU = 1.3, DRAG = 0.5, VMAX = 3.0, VSCALE = 0.8, E = 0.92;
    const BOMB_R = 0.22;

    const score = P.map(() => 0);
    let end = 0, order = [], turnIdx = 0, state = 'idle';
    let stones = [], cur = null, hazards = [];
    let drag = null;                       // {id, samples:[{t,x,y}]}
    const parts = [], rings = [], floats = [];
    let shake = 0, flash = 0, flashColor = '#fff', pulse = 0;
    let W, H, S, cx, cy, B = {};           // B = sheet bounds in world units

    ctx.root.classList.add('g-curling');
    ctx.root.append(U.h('style', null, `
      .g-curling .bx{position:absolute;inset:6px 8px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;
        background:#1a1f35;border:2px solid transparent;font-weight:900;color:#f2f4ff;padding:0 12px;white-space:nowrap;overflow:hidden;
        transition:background .25s, box-shadow .25s, border-color .25s}
      .g-curling .bx .dot{width:26px;height:26px;border-radius:50%;background:var(--pc);flex:0 0 auto;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
      .g-curling .bx .sc{font-size:30px;color:var(--pc);min-width:36px;text-align:center}
      .g-curling .bx .st{font-size:20px;letter-spacing:2px}
      .g-curling .bx .tx{font-size:18px;color:#9aa1c4;overflow:hidden;text-overflow:ellipsis}
      .g-curling .bx.on{background:color-mix(in srgb, var(--pc) 30%, #1a1f35);border-color:var(--pc);box-shadow:0 0 28px 4px var(--pc)}
      .g-curling .bx.on .tx{color:#fff}
    `));

    const { cv, g } = ctx.canvas();

    /* ---------- HUD ---------- */
    const hud = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      const sc = U.h('div', { class: 'sc' }, '0'), st = U.h('div', { class: 'st' }), tx = U.h('div', { class: 'tx' });
      const bx = U.h('div', { class: 'bx' }, U.h('div', { class: 'dot' }), sc, st, tx);
      z.el.append(bx);
      return { bx, sc, st, tx };
    });
    function thrownBy(i) { let k = 0; for (let t = 0; t < turnIdx; t++) if (order[t % N] === i) k++; return k; }
    const special = P.map(() => ({}));
    function specialFor(i) { return special[i][end] || 'bomb'; }
    function renderHud() {
      const ti = state === 'aim' || state === 'roll' ? order[turnIdx % N] : -1;
      hud.forEach((h, i) => {
        h.sc.textContent = score[i];
        const used = thrownBy(i) + (state === 'roll' && ti === i ? 0 : 0);
        let s = '';
        for (let k = 0; k < PER; k++) s += k < used ? '·' : (k === 1 ? (specialFor(i) === 'bomb' ? '💣' : '🪨') : '🥌');
        h.st.textContent = s;
        h.bx.classList.toggle('on', i === ti && state === 'aim');
        h.tx.textContent = state === 'aim' ? (i === ti ? (cur && cur.kind === 'bomb' ? 'Бросай бомбу! 💣' : cur && cur.kind === 'heavy' ? 'Тяжёлый бросок! 🪨' : 'Твой бросок!') : `бросает ${P[ti].name}`)
          : state === 'roll' ? 'катится…' : `энд ${Math.min(end, ENDS)}/${ENDS}`;
      });
    }

    /* ---------- geometry ---------- */
    function layout() {
      W = ctx.W; H = ctx.H; S = Math.min(W, H);
      const s = P.map(p => p.side), m = 8;
      const x0 = (s.includes('left') ? DEPTH : 0) + m, x1 = W - (s.includes('right') ? DEPTH : 0) - m;
      const y0 = (s.includes('top') ? DEPTH : 0) + m, y1 = H - DEPTH - m;
      cx = (x0 + x1) / 2;
      if (N === 2) cy = (y0 + y1) / 2;
      else cy = U.clamp(y1 - (cx - x0), y0 + (R3 + 0.06) * S, y1 - (R3 + 0.2) * S);
      B = { x0: (x0 - cx) / S, x1: (x1 - cx) / S, y0: (y0 - cy) / S, y1: (y1 - cy) / S };
    }
    layout();
    ctx.onResize(() => {
      layout();
      for (const st of stones) { st.u = U.clamp(st.u, B.x0 + SR, B.x1 - SR); st.v = U.clamp(st.v, B.y0 + SR, B.y1 - SR); }
      if (cur && !cur.thrown) { const L = launch(cur.o); cur.u = L.u; cur.v = L.v; }
      drag = null;
    });
    const X = (u) => cx + u * S, Y = (v) => cy + v * S;
    function edgeDist(i) { // distance (world) from center to player's sheet edge
      const sd = P[i].side;
      return sd === 'bottom' ? B.y1 : sd === 'top' ? -B.y0 : sd === 'left' ? -B.x0 : B.x1;
    }
    function hackDepth(i) { return U.clamp(edgeDist(i) - R3 - 0.05, 0.12, 0.24); }
    function launch(i) {
      const v = ctx.inward(i), d = edgeDist(i) - SR * 2.2;
      return { u: -v.x * d, v: -v.y * d };
    }
    // signed depth of a world point into player i's hack band (0 at edge, grows inward)
    function depthFromEdge(i, u, v) {
      const iv = ctx.inward(i);
      return edgeDist(i) + (u * iv.x + v * iv.y);
    }

    /* ---------- juice ---------- */
    function burst(x, y, color, n = 16, sp = 220) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * 6.283, s = U.rand(0.25, 1) * sp;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.35, 0.8), t: 0, color, s: U.rand(2, 5) });
      }
    }
    function ring(x, y, r, color, grow = 2.4, life = 0.5) { rings.push({ x, y, r, max: r * grow, color, life, t: 0 }); }
    // toasts anchored between the house and each player's throwing line (keeps the house visible)
    const tLayer = U.h('div', { class: 'toast-layer' });
    ctx.root.append(tLayer);
    const live = P.map(() => []);
    function say(text, o = {}) {
      const ms = o.ms ?? 1600;
      const els = P.map(p => {
        const iv = ctx.inward(p.i);
        const line = edgeDist(p.i) - hackDepth(p.i);
        const mid = Math.max(R3 + 0.045, (R3 + line) / 2) * S + live[p.i].length * 52;
        const t = U.h('div', { class: 'toast' }, text);
        if (o.color) t.style.background = o.color;

    function drawHazard(h) {

        g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 3;
        const gl = (pulse * 0.6) % 2;
        g.beginPath(); g.arc(x, y, r * 0.7, -2.4 + gl, -1.7 + gl); g.stroke();
        g.font = `${Math.round(r * 0.6)}px ${FONT}`; g.globalAlpha = 0.85; g.fillText('🧊', x, y); g.globalAlpha = 1;
      } else if (h.kind === 'vortex') {
        g.fillStyle = 'rgba(176,107,255,.14)'; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
        g.strokeStyle = 'rgba(176,107,255,.75)'; g.lineWidth = 3;
        for (let k = 0; k < 3; k++) {
          g.beginPath();
          for (let s = 0; s <= 30; s++) {
            const f = s / 30, a = h.spin * (pulse * 2.5 + k * 2.094 + f * 4), rr = r * (1 - f * 0.85);
            const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
            s ? g.lineTo(px, py) : g.moveTo(px, py);
          }
          g.stroke();
        }
        g.font = `${Math.round(r * 0.5)}px ${FONT}`; g.fillText('🌀', x, y);
      } else if (h.kind === 'star') {
        const sc = 1 + 0.08 * Math.sin(pulse * 4);
        g.shadowColor = '#ffd84d'; g.shadowBlur = 22;
        g.fillStyle = 'rgba(255,216,77,.25)'; g.beginPath(); g.arc(x, y, r * sc, 0, 6.283); g.fill();
        g.shadowBlur = 0;
        g.strokeStyle = '#ffd84d'; g.lineWidth = 2; g.setLineDash([5, 5]); g.stroke(); g.setLineDash([]);
        g.beginPath();
        for (let k = 0; k < 10; k++) {
          const a = pulse * 0.6 - Math.PI / 2 + k * Math.PI / 5, rr = (k % 2 ? 0.42 : 0.85) * r * sc;
          k ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        g.closePath(); g.fillStyle = '#ffd84d'; g.shadowColor = '#ffd84d'; g.shadowBlur = 14; g.fill(); g.shadowBlur = 0;
        g.font = `900 ${Math.round(r * 0.55)}px ${FONT}`; g.fillStyle = '#5a3d00'; g.fillText('+2', x, y + 1);
      }
    }
    function drawStone(st) {
      let x = X(st.u), y = Y(st.v), r = SR * S;
      const col = P[st.o].color;
      // trail
      if (st.trail.length > 1) {
        for (let k = 1; k < st.trail.length; k++) {
          const a = k / st.trail.length;
          g.strokeStyle = U.alpha(col, a * 0.35); g.lineWidth = r * 1.4 * a;
          g.beginPath(); g.moveTo(X(st.trail[k - 1].u), Y(st.trail[k - 1].v)); g.lineTo(X(st.trail[k].u), Y(st.trail[k].v)); g.stroke();
        }
      }
      let alpha = 1, scale = st.m > 1 ? 1.12 : 1;
      if (st.out) { alpha = Math.max(0, 1 - st.out / 0.6); scale *= 1 - st.out * 0.8; }
      if (alpha <= 0) return;
      r *= scale;
      g.globalAlpha = alpha;
      const active = st === cur && state === 'aim';
      if (active) {
        g.strokeStyle = U.alpha(col, 0.5 + 0.4 * Math.sin(pulse * 6)); g.lineWidth = 4;
        g.beginPath(); g.arc(x, y, r * 1.9 + 4 * Math.sin(pulse * 6), 0, 6.283); g.stroke();
      }
      g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.arc(x + 3, y + 4, r, 0, 6.283); g.fill();
      g.fillStyle = st.m > 1 ? '#5b5f70' : '#8c93a8'; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      g.shadowColor = col; g.shadowBlur = st.hit > 0 || active ? 24 : 10;
      g.fillStyle = col; g.beginPath(); g.arc(x, y, r * 0.74, 0, 6.283); g.fill();
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(x - r * 0.2, y - r * 0.25, r * 0.35, r * 0.18, -0.5, 0, 6.283); g.fill();
      if (st.kind !== 'norm') {
        const blink = st.fuse > 0 && Math.sin(pulse * 30) > 0;
        if (blink) { g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); }
        g.font = `${Math.round(r * 1.05)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(st.kind === 'bomb' ? '💣' : '🪨', x, y + 1);
      }
      g.globalAlpha = 1;
    }

    // test hook
    ctx.root._cu = () => ({ state, end, score: score.slice(), turnIdx, S, cx, cy, cur: cur && { u: cur.u, v: cur.v, o: cur.o, kind: cur.kind, thrown: cur.thrown },
      stones: stones.map(s => ({ u: s.u, v: s.v, o: s.o, out: s.out })), hazards });

    renderHud();
    newEnd();
  },
});

</script>
<script>/* games/dots.js */
registerGame({
  id: 'dots',
  title: 'Точки и квадраты',
  emoji: '▦',
  desc: 'Рисуй линии, замыкай квадраты, лови бонусы',
  rules: 'Ходите по очереди: чей ход, у того светится край.\n' +
    'Коснись между двумя точками — проведёшь линию (палец можно подвинуть, линия ставится, когда отпустишь).\n' +
    'Замкнул квадрат — он твой, и ты ходишь ещё раз. Больше очков — победа.\n' +
    '✖️2 — квадрат стоит 2 очка.\n' +
    '💣 Бомба — при замыкании стирает пару линий рядом.\n' +
    '❄️ Заморозка — следующий игрок пропускает ход.\n' +
    '💎 Кража — забираешь один квадрат у лидера.\n' +
    '🔁 Разворот (на троих) — порядок ходов меняется.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const SHORT = N === 2 ? 5 : 6, LONG = N === 2 ? 6 : 7;
    const DEPTH = 80;
    const GEN = ['Красного', 'Синего', 'Жёлтого'];
    const ICON = { x2: '✖️2', bomb: '💣', freeze: '❄️', steal: '💎', rev: '🔁' };

    /* ---------- model ---------- */
    // dots (a,b): a in [0..SHORT], b in [0..LONG]; edges: t='a' joins (a,b)-(a+1,b); t='b' joins (a,b)-(a,b+1)
    const edges = [], emap = new Map();
    const addE = (t, a, b) => { const e = { t, a, b, o: -1, anim: 0, fade: 0, boxes: [] }; edges.push(e); emap.set(`${t}${a},${b}`, e); };
    for (let b = 0; b <= LONG; b++) for (let a = 0; a < SHORT; a++) addE('a', a, b);
    for (let b = 0; b < LONG; b++) for (let a = 0; a <= SHORT; a++) addE('b', a, b);
    const boxes = [];
    for (let a = 0; a < SHORT; a++) for (let b = 0; b < LONG; b++) {
      const bx = { a, b, o: -1, kind: null, pop: 0, es: [emap.get(`a${a},${b}`), emap.get(`a${a},${b + 1}`), emap.get(`b${a},${b}`), emap.get(`b${a + 1},${b}`)] };
      bx.es.forEach(e => e.boxes.push(bx));
      boxes.push(bx);
    }
    // specials
    const kinds = N === 2 ? ['x2', 'x2', 'bomb', 'bomb', 'freeze', 'steal'] : ['x2', 'x2', 'bomb', 'bomb', 'freeze', 'steal', 'rev', 'x2'];
    U.shuffle(boxes).slice(0, kinds.length).forEach((bx, k) => { bx.kind = kinds[k]; });

    const score = P.map(() => 0);
    let turn = U.randInt(0, N - 1), dir = 1, skipNext = false;
    let state = 'input';
    let preview = null, pid = null;
    const parts = [], rings = [];
    let pulse = 0, shake = 0, flash = 0, flashColor = '#fff';
    let geo = null;

    /* ---------- HUD ---------- */
    ctx.root.classList.add('g-dots');
    ctx.root.append(U.h('style', null, `
      .g-dots .bx{position:absolute;inset:8px 10px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 18px;
        background:#1a1f35;border:3px solid transparent;font-weight:900;color:#f2f4ff;transition:background .25s, box-shadow .25s, border-color .25s}
      .g-dots .bx .dot{width:30px;height:30px;border-radius:8px;background:var(--pc);flex:0 0 auto}
      .g-dots .bx .tx{flex:0 1 auto;min-width:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9aa1c4}
      .g-dots .bx .tx b{color:var(--tc)}
      .g-dots .bx .fz{font-size:26px}
      .g-dots .bx .sc{font-size:40px;color:var(--pc);min-width:44px;text-align:center;margin-left:10px;transition:transform .2s}
      .g-dots .bx .sc.bump{transform:scale(1.35)}
      .g-dots .bx.on{background:color-mix(in srgb, var(--pc) 28%, #1a1f35);border-color:var(--pc);box-shadow:0 0 30px 6px var(--pc)}
      .g-dots .bx.on .tx{color:#fff}
      .g-dots .bx.win{background:var(--pc);border-color:#fff}
      .g-dots .bx.win .tx,.g-dots .bx.win .sc{color:#111}
    `));
    const { cv, g } = ctx.canvas();
    const hud = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      const tx = U.h('div', { class: 'tx' }), sc = U.h('div', { class: 'sc' }, '0'), fz = U.h('div', { class: 'fz' });
      const bx = U.h('div', { class: 'bx' }, U.h('div', { class: 'dot' }), tx, fz, sc);
      z.el.append(bx);
      return { bx, tx, sc, fz };
    });
    const step = (i, d = dir) => (i + d + N) % N;
    function render(winners) {
      const frozen = skipNext ? step(turn) : -1;
      hud.forEach((h, i) => {
        h.bx.style.setProperty('--tc', P[turn].color);
        const on = state !== 'over' && i === turn;
        h.bx.classList.toggle('on', on);
        h.bx.classList.toggle('win', !!winners && winners.includes(i));
        if (h.sc.textContent !== String(score[i])) { h.sc.classList.add('bump'); setTimeout(() => h.sc.classList.remove('bump'), 220); }
        h.sc.textContent = score[i];
        h.fz.textContent = (i === frozen ? '❄️' : '') + (N === 3 && on ? (dir > 0 ? ' ↻' : ' ↺') : '');
        if (state === 'over') h.tx.textContent = winners.length === 0 ? 'Ничья' : winners.includes(i) ? 'Победа! 🏆' : 'Не в этот раз';
        else if (on) h.tx.textContent = 'Твой ход!';
        else h.tx.replaceChildren('Ход: ', U.h('b', null, P[turn].name));
      });
    }

    /* ---------- geometry ---------- */
    function layout() {
      const W = ctx.W, H = ctx.H;
      const r = N === 2 ? { x: 56, y: DEPTH, w: W - 112, h: H - 2 * DEPTH } : { x: DEPTH, y: 54, w: W - 2 * DEPTH, h: H - DEPTH - 54 };
      const portrait = r.h >= r.w;
      const cols = portrait ? SHORT : LONG, rows = portrait ? LONG : SHORT;
      const pad = 26;
      const cell = Math.floor(Math.min((r.w - 2 * pad) / cols, (r.h - 2 * pad) / rows));
      const bw = cell * cols, bh = cell * rows;
      geo = { portrait, cols, rows, cell, bx: Math.round(r.x + (r.w - bw) / 2), by: Math.round(r.y + (r.h - bh) / 2), bw, bh };
    }
    layout();
    ctx.onResize(layout);
    function dotXY(a, b) {
      const { portrait, cell, bx, by } = geo;
      return portrait ? { x: bx + a * cell, y: by + b * cell } : { x: bx + b * cell, y: by + a * cell };
    }
    function edgeEnds(e) { return [dotXY(e.a, e.b), e.t === 'a' ? dotXY(e.a + 1, e.b) : dotXY(e.a, e.b + 1)]; }
    function boxXY(bx) { const p = dotXY(bx.a + 0.5, bx.b + 0.5); return p; }
    function segDist(px, py, p, q) {
      const dx = q.x - p.x, dy = q.y - p.y, L = dx * dx + dy * dy;
      const t = U.clamp(((px - p.x) * dx + (py - p.y) * dy) / L, 0, 1);
      return Math.hypot(px - (p.x + t * dx), py - (p.y + t * dy));
    }
    function nearestEdge(x, y) {
      const { cell, bx, by, bw, bh } = geo;
      if (x < bx - cell * 0.5 || x > bx + bw + cell * 0.5 || y < by - cell * 0.5 || y > by + bh + cell * 0.5) return null;
      let best = null, bd = 1e9;
      for (const e of edges) {
        if (e.o >= 0) continue;
        const [p, q] = edgeEnds(e);
        const d = segDist(x, y, p, q);
        if (d < bd) { bd = d; best = e; }
      }
      return bd < cell * 0.6 ? best : null;
    }

    /* ---------- juice ---------- */
    function burst(x, y, color, n = 14, sp = 200) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * 6.283, s = U.rand(0.25, 1) * sp;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.35, 0.8), t: 0, color, s: U.rand(2, 5) });
      }
    }
    function ring(x, y, r, color, grow = 2.2, life = 0.45) { rings.push({ x, y, r, max: r * grow, color, life, t: 0 }); }
    // queued toasts: one message at a time; a waiting message shortens the current one
    const tq = []; let tShown = null;
    function say(text, o = {}) { tq.push({ text, o }); }
    ctx.loop(() => {
      if (tShown && (ctx.time - tShown.t0 >= tShown.ms || (tq.length && ctx.time - tShown.t0 >= 0.9))) { tShown.els.forEach(e => e.remove()); tShown = null; }
      if (!tShown && tq.length) {
        const it = tq.shift();
        const o = Object.assign({ offset: N === 3 ? Math.min(ctx.W, ctx.H) * 0.34 : 80 }, it.o);
        tShown = { t0: ctx.time, ms: (o.ms ?? 1700) / 1000, els: ctx.toast(it.text, Object.assign({}, o, { ms: 600000 })) };
      }
    });
    function sayP(i, text, o = {}) { return say(text, Object.assign({ color: P[i].color, fg: '#111' }, o)); }

    /* ---------- input ---------- */
    ctx.pointer(cv, {
      down(id, x, y) {
        if (ctx.paused || state !== 'input' || pid != null) return;
        pid = id;
        preview = nearestEdge(x, y);
      },
      move(id, x, y) {
        if (id !== pid || state !== 'input') return;
        preview = nearestEdge(x, y);
      },
      up(id, x, y) {
        if (id !== pid) return;
        pid = null;
        const e = preview; preview = null;
        if (!e || state !== 'input' || ctx.paused || e.o >= 0) return;
        playEdge(e);
      },
    });

    /* ---------- moves ---------- */
    function playEdge(e) {
      const me = turn;
      e.o = me; e.anim = 0.001;
      const [p, q] = edgeEnds(e);
      burst((p.x + q.x) / 2, (p.y + q.y) / 2, P[me].color, 8, 120);
      const closed = e.boxes.filter(bx => bx.o < 0 && bx.es.every(s => s.o >= 0));
      const msgs = [];
      for (const bx of closed) {
        bx.o = me; bx.pop = 0.45;
        score[me] += bx.kind === 'x2' ? 2 : 1;
        const c = boxXY(bx);
        burst(c.x, c.y, P[me].color, 26, 280); ring(c.x, c.y, geo.cell * 0.3, P[me].color, 2.4, 0.5);
        if (bx.kind) msgs.push(bx);
      }
      let skipMsg = null;
      for (const bx of msgs) special(bx, me);
      if (!closed.length) {
        let nt = step(turn);
        if (skipNext) {
          skipNext = false;
          skipMsg = nt;
          nt = step(nt);
        }
        turn = nt;
        if (skipMsg != null) sayP(skipMsg, `❄️ ${P[skipMsg].name} пропускает ход`, { ms: 1600 });
      }
      if (boxes.every(bx => bx.o >= 0)) { finish(); return; }
      render();
    }
    function special(bx, me) {
      const c = boxXY(bx);
      if (bx.kind === 'x2') {
        sayP(me, `✖️2 ${P[me].name}: двойной квадрат!`, { ms: 1400 });
        ring(c.x, c.y, geo.cell * 0.3, '#ffd84d', 3, 0.6); burst(c.x, c.y, '#ffd84d', 24, 260);
      } else if (bx.kind === 'bomb') {
        // erase up to 2 drawn lines near the box whose neighbouring boxes are all still free
        const near = edges.filter(e => e.o >= 0 && e.boxes.every(b2 => b2.o < 0) &&
          e.boxes.some(b2 => Math.abs(b2.a - bx.a) + Math.abs(b2.b - bx.b) <= 2));
        const pick = U.shuffle(near).slice(0, 2);
        for (const e of pick) {
          e.o = -1; e.fade = 0.5;
          const [p, q] = edgeEnds(e);
          burst((p.x + q.x) / 2, (p.y + q.y) / 2, '#ffb347', 20, 260);
        }
        burst(c.x, c.y, '#ffb347', 40, 420); ring(c.x, c.y, geo.cell * 0.4, '#ffb347', 3.5, 0.6);
        shake = 0.45; flash = 0.3; flashColor = '#ffb347';
        say(pick.length ? `💣 Бум! Стёрто линий: ${pick.length}` : '💣 Бум! Но стирать нечего', { color: '#ffb347', fg: '#111', ms: 1600 });
      } else if (bx.kind === 'freeze') {
        skipNext = true;
        ring(c.x, c.y, geo.cell * 0.3, '#9be7ff', 3.2, 0.7); burst(c.x, c.y, '#9be7ff', 30, 260);
        flash = 0.25; flashColor = '#9be7ff';
        say('❄️ Заморозка: следующий пропустит ход', { color: '#9be7ff', fg: '#111', ms: 1800 });
      } else if (bx.kind === 'rev') {
        dir = -dir;
        ring(c.x, c.y, geo.cell * 0.3, '#b06bff', 3.2, 0.7); burst(c.x, c.y, '#b06bff', 30, 260);
        say('🔁 Разворот: ходы в обратную сторону', { color: '#b06bff', fg: '#fff', ms: 1800 });
      } else if (bx.kind === 'steal') {
        const opp = P.filter(p => p.i !== me && boxes.some(b2 => b2.o === p.i)).sort((x, y) => score[y.i] - score[x.i]);
        if (!opp.length) { say('💎 Кража: красть пока нечего', { ms: 1400 }); return; }
        const v = opp[0].i;
        const cand = boxes.filter(b2 => b2.o === v);
        const t = cand.find(b2 => b2.kind === 'x2') || U.pick(cand);
        t.o = me; t.pop = 0.5;
        const val = t.kind === 'x2' ? 2 : 1;
        score[v] -= val; score[me] += val;
        const tc = boxXY(t);
        burst(tc.x, tc.y, P[me].color, 30, 300); ring(tc.x, tc.y, geo.cell * 0.3, '#ffffff', 3, 0.6);
        sayP(me, `💎 ${P[me].name} крадёт квадрат у ${GEN[v]}`, { ms: 1900 });
      }
    }
    function finish() {
      state = 'over';
      const top = Math.max(...score);
      const winners = P.filter(p => score[p.i] === top).map(p => p.i);
      const ws = winners.length === N ? [] : winners;
      render(ws);
      for (const bx of boxes) if (ws.includes(bx.o)) { const c = boxXY(bx); burst(c.x, c.y, P[bx.o].color, 6, 220); }
      say(ws.length === 1 ? `🏆 ${P[ws[0]].name} побеждает!` : ws.length ? 'Ничья среди лидеров!' : 'Ничья!', { ms: 2200 });
      ctx.after(2300, () => ctx.end({ winners: ws, scores: score.slice(), msg: 'Квадраты: ' + score.join(' : ') }));
    }

    /* ---------- drawing ---------- */
    ctx.loop((dt) => {
      pulse += dt;
      if (!geo) return;
      const { cell, bx, by, bw, bh } = geo;
      g.save();
      g.fillStyle = '#0f1220'; g.fillRect(0, 0, ctx.W, ctx.H);
      if (shake > 0) { g.translate(U.rand(-7, 7) * shake, U.rand(-7, 7) * shake); shake -= dt; }
      const tc = state === 'over' ? '#ffffff' : P[turn].color;
      // board backdrop with glow in current player's colour
      g.shadowColor = tc; g.shadowBlur = 26 + 10 * Math.sin(pulse * 3);
      g.fillStyle = '#141933';
      g.beginPath(); g.roundRect(bx - 22, by - 22, bw + 44, bh + 44, 20); g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = U.alpha(tc, 0.8); g.lineWidth = 3; g.stroke();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      // boxes
      for (const b of boxes) {
        const c = boxXY(b);
        if (b.pop > 0 && dt > 0) b.pop = Math.max(0, b.pop - dt);
        if (b.o >= 0) {
          const s = (1 - b.pop * 0.8) * (cell - 10);
          g.fillStyle = U.alpha(P[b.o].color, 0.6 + b.pop);
          g.beginPath(); g.roundRect(c.x - s / 2, c.y - s / 2, s, s, 10); g.fill();
          g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 2; g.stroke();
          if (b.kind) { g.globalAlpha = 0.55; g.font = `${Math.round(cell * 0.3)}px ${FONT}`; g.fillText(b.kind === 'x2' ? '✖️2' : ICON[b.kind], c.x, c.y + 2); g.globalAlpha = 1; }
          else { g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.arc(c.x, c.y, cell * 0.12, 0, 6.283); g.fill(); }
        } else if (b.kind) {
          const k = 0.5 + 0.5 * Math.sin(pulse * 3 + b.a + b.b);
          const col = { x2: '#ffd84d', bomb: '#ffb347', freeze: '#9be7ff', steal: '#7dffb0', rev: '#b06bff' }[b.kind];
          const gr = g.createRadialGradient(c.x, c.y, 2, c.x, c.y, cell * 0.45);
          gr.addColorStop(0, U.alpha(col, 0.28 + 0.12 * k)); gr.addColorStop(1, U.alpha(col, 0));
          g.fillStyle = gr; g.fillRect(c.x - cell / 2, c.y - cell / 2, cell, cell);
          g.font = `${Math.round(cell * (0.34 + 0.03 * k))}px ${FONT}`;
          if (b.kind === 'x2') { g.font = `900 ${Math.round(cell * 0.3)}px ${FONT}`; g.fillStyle = col; g.fillText('×2', c.x, c.y + 2); }
          else g.fillText(ICON[b.kind], c.x, c.y + 2);
        }
      }
      // empty edge hints
      g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 2; g.setLineDash([4, 8]);
      g.beginPath();
      for (const e of edges) if (e.o < 0 && e.fade <= 0) { const [p, q] = edgeEnds(e); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); }
      g.stroke(); g.setLineDash([]);
      // fading (bombed) edges
      for (const e of edges) if (e.fade > 0) {
        if (dt > 0) e.fade -= dt;
        const [p, q] = edgeEnds(e);
        g.strokeStyle = `rgba(255,179,71,${Math.max(0, e.fade * 2)})`; g.lineWidth = 8; g.lineCap = 'round';
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
      }
      // drawn edges
      g.lineCap = 'round';
      for (const e of edges) {
        if (e.o < 0) continue;
        if (e.anim > 0 && e.anim < 1 && dt > 0) e.anim = Math.min(1, e.anim + dt / 0.18);
        const f = e.anim > 0 ? e.anim : 1;
        const [p, q] = edgeEnds(e);
        const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
        g.strokeStyle = P[e.o].color; g.lineWidth = Math.max(6, cell * 0.075);
        g.shadowColor = P[e.o].color; g.shadowBlur = f < 1 ? 20 : 8;
        g.beginPath(); g.moveTo(mx + (p.x - mx) * f, my + (p.y - my) * f); g.lineTo(mx + (q.x - mx) * f, my + (q.y - my) * f); g.stroke();
      }
      g.shadowBlur = 0;
      // preview
      if (preview && state === 'input') {
        const [p, q] = edgeEnds(preview);
        g.strokeStyle = U.alpha(P[turn].color, 0.45 + 0.3 * Math.sin(pulse * 10)); g.lineWidth = Math.max(10, cell * 0.11);
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
      }
      g.lineCap = 'butt';
      // dots
      const dr = Math.max(5, cell * 0.06);
      g.fillStyle = '#e8ecff'; g.shadowColor = '#9fb2ff'; g.shadowBlur = 10;
      for (let a = 0; a <= SHORT; a++) for (let b = 0; b <= LONG; b++) { const p = dotXY(a, b); g.beginPath(); g.arc(p.x, p.y, dr, 0, 6.283); g.fill(); }
      g.shadowBlur = 0;
      // fx
      for (let k = rings.length - 1; k >= 0; k--) {
        const r = rings[k]; r.t += dt;
        if (r.t > r.life) { rings.splice(k, 1); continue; }
        const f = r.t / r.life;
        g.strokeStyle = U.alpha(r.color, 1 - f); g.lineWidth = 5 * (1 - f) + 1;
        g.beginPath(); g.arc(r.x, r.y, U.lerp(r.r, r.max, f), 0, 6.283); g.stroke();
      }
      g.globalCompositeOperation = 'lighter';
      for (let k = parts.length - 1; k >= 0; k--) {
        const p = parts[k]; p.t += dt;
        if (p.t > p.life) { parts.splice(k, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
        g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.color;
        g.beginPath(); g.arc(p.x, p.y, p.s, 0, 6.283); g.fill();
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      if (flash > 0) { g.fillStyle = U.alpha(flashColor, Math.min(0.35, flash)); g.fillRect(-20, -20, ctx.W + 40, ctx.H + 40); flash -= dt; }
      g.restore();
    });

    // test hook
    ctx.root._dt = () => ({ state, turn, dir, skipNext, score: score.slice(),
      free: edges.filter(e => e.o < 0).map(e => { const [p, q] = edgeEnds(e); return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, closes: e.boxes.some(b => b.es.filter(s => s.o >= 0).length === 3) }; }) });

    render();
    ctx.onStart = () => sayP(turn, `Первым ходит ${P[turn].name}`, { ms: 1500 });
  },
});

</script>
<script>/* games/draw.js */
registerGame({
  id: 'draw',
  title: 'Рисуй и угадывай',
  emoji: '✏️',
  desc: 'Рисуй с заданиями, угадывай быстрее всех',
  rules: 'Ходят по очереди: один рисует, остальные угадывают. Каждый рисует 2 раза.\nХудожник удерживает «Показать слово» и рисует пальцем в центре. Буквы писать нельзя!\nУгадывающие выбирают из 6 вариантов. Ошибся: ждёшь следующего хода.\nЧем быстрее угадал, тем больше очков: +3, +2 или +1. Художнику +1, с заданием +2.\n💡 Подсказки: на середине и в конце хода пропадает по неверному варианту. Можно купить подсказку за 1 очко: −2 неверных варианта.\nЗадания художнику:\n〰️ Одной линией · 📏 Только прямые · ⭕ Только кружочки\n👻 Исчезающие чернила · 🌀 Лист крутится · ⏱️ Блиц: 25 секунд, очки ×2\n🔥 Последний круг: все очки ×2.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const TURN = 60;
    const WORDS = {
      'животные': ['кошка', 'собака', 'корова', 'лошадь', 'свинья', 'курица', 'утка', 'кролик', 'мышь', 'слон', 'жираф', 'лев',
        'тигр', 'медведь', 'заяц', 'лиса', 'змея', 'черепаха', 'рыба', 'акула', 'кит', 'осьминог', 'краб', 'улитка',

      'еда': ['яблоко', 'банан', 'груша', 'арбуз', 'виноград', 'клубника', 'вишня', 'лимон', 'морковь', 'помидор', 'огурец',
        'гриб', 'хлеб', 'сыр', 'яйцо', 'торт', 'мороженое', 'пицца', 'бургер', 'сосиска', 'конфета', 'пончик', 'суп',
        'ананас', 'кукуруза', 'леденец', 'блины', 'макароны'],
      'предметы': ['стул', 'стол', 'кровать', 'лампа', 'часы', 'телефон', 'ключ', 'зонт', 'очки', 'книга', 'ножницы', 'чашка',
        'ложка', 'вилка', 'чайник', 'утюг', 'телевизор', 'гитара', 'барабан', 'мяч', 'шарик', 'подарок', 'свеча', 'лестница',
        'молоток', 'карандаш', 'рюкзак', 'шапка', 'ботинок', 'носок', 'корона', 'зеркало', 'дверь', 'колокольчик', 'ведро',
        'якорь', 'фонарик', 'магнит', 'пылесос'],
      'транспорт': ['машина', 'автобус', 'поезд', 'самолёт', 'вертолёт', 'корабль', 'лодка', 'велосипед', 'мотоцикл', 'трактор',
        'ракета', 'самокат', 'трамвай', 'грузовик', 'парашют', 'танк', 'экскаватор', 'санки', 'скейт', 'подводная лодка'],
      'природа': ['солнце', 'луна', 'звезда', 'облако', 'дождь', 'снег', 'радуга', 'молния', 'гора', 'вулкан', 'река', 'море',
        'остров', 'дерево', 'цветок', 'кактус', 'лист', 'трава', 'камень', 'огонь', 'волна', 'пальма', 'ёлка', 'снеговик',
        'ракушка', 'водопад', 'торнадо', 'капля'],
      'места': ['дом', 'замок', 'мост', 'башня', 'палатка', 'маяк', 'пирамида', 'забор', 'колодец', 'качели', 'горка',
        'больница', 'школа', 'церковь', 'стадион'],
      'люди': ['врач', 'повар', 'пожарный', 'полицейский', 'художник', 'космонавт', 'пират', 'рыбак', 'клоун', 'фокусник',
        'балерина', 'футболист', 'король', 'принцесса', 'робот', 'призрак', 'ниндзя', 'водолаз', 'ковбой', 'вампир'],
      'действия': ['плавать', 'спать', 'бегать', 'прыгать', 'танцевать', 'петь', 'читать', 'плакать', 'смеяться', 'летать',
        'готовить', 'фотографировать', 'кататься', 'чихать', 'зевать', 'копать', 'стрелять', 'ловить', 'мыться', 'звонить'],
    };
    const ALL = [];
    for (const cat in WORDS) for (const w of WORDS[cat]) ALL.push({ w, cat });

    const FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
    const n = ctx.n;
    const score = ctx.players.map(() => 0);
    const TURNS = n * 2;
    const CHALLENGES = [
      { id: 'line', icon: '〰️', name: 'Одной линией', tip: 'не отрывай палец' },
      { id: 'straight', icon: '📏', name: 'Только прямые', tip: 'линии сами выпрямляются' },
      { id: 'circle', icon: '⭕', name: 'Только кружочки', tip: 'каждый штрих станет кругом' },
      { id: 'fade', icon: '👻', name: 'Исчезающие чернила', tip: 'линии тают через 4 с' },
      { id: 'spin', icon: '🌀', name: 'Лист крутится', tip: 'рисунок вращается' },
      { id: 'blitz', icon: '⏱️', name: 'Блиц ×2', tip: '25 секунд, очки ×2' },
    ];
    let turn = -1, artist = 0, word = null, options = [], phase = 'idle'; // idle | draw | reveal
    let turnEnd = 0, turnStart = 0, turnLen = TURN, locked = new Set(), challenge = null, lineDone = false;
    let hintsGiven = 0;
    const removed = ctx.players.map(() => new Set());
    const bought = ctx.players.map(() => false);
    let chalBag = [];
    const used = new Set();
    let strokes = []; // {c, pts:[[u,v],...], circle?, tEnd?} normalized to the paper (unit = min side, origin = center)
    let dirty = true;
    let parts = [];

    ctx.root.classList.add('g-draw');
    ctx.root.append(U.h('style', null, `
      .g-draw .dz{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px 0;
        border-top:4px solid var(--pc)}
      .g-draw .dz.shake{animation:gdShake .4s linear}
      @keyframes gdShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}
        60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
      .g-draw .main{flex:1;min-height:0;display:flex;gap:8px;justify-content:center}
      .g-draw .info{height:44px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;
        font-weight:800;font-size:18px;white-space:nowrap;color:var(--muted)}
      .g-draw .info .role{color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0}
      .g-draw .info b{color:var(--pc);font-size:22px;font-variant-numeric:tabular-nums}
      .g-draw .info .pts{color:#3ddc97}
      .g-draw .info .tm{font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
      .g-draw .info .tm.low{color:#ff4d6d;animation:gdBlink .5s infinite alternate}
      @keyframes gdBlink{to{opacity:.4}}
      .g-draw .buy{background:#ffd84a;color:#111;border-radius:12px;padding:0 12px;height:36px;display:flex;align-items:center;font-size:17px}
      .g-draw .buy.off{opacity:.25}
      .g-draw .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px;
        max-width:760px;margin:0 auto;width:100%}
      .g-draw .op{border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;
        text-align:center;font-weight:800;font-size:19px;line-height:1.05;padding:2px 4px;min-height:0;overflow:hidden;
        transition:background .1s, opacity .3s, transform .3s;overflow-wrap:anywhere}
      .g-draw .op.sm{font-size:16px}
      .g-draw .op.xs{font-size:13px}
      .g-draw .op.wrong{background:#ff4d6d;color:#111}
      .g-draw .op.right{background:#3ddc97;color:#111;transform:scale(1.06)}
      .g-draw .op.gone{opacity:.1;transform:scale(.85)}
      .g-draw .grid.locked .op:not(.wrong):not(.right){opacity:.3}
      .g-draw .grid.off .op:not(.right):not(.wrong){opacity:.35}
      .g-draw .show{flex:2;max-width:480px;border-radius:16px;background:var(--pc);color:#111;font-weight:900;font-size:20px;
        display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:4px 10px}
      .g-draw .show.held{background:#fff;font-size:30px;flex-direction:column}
      .g-draw .show .cat{display:block;font-size:14px;font-weight:700;opacity:.6;margin-top:3px}
      .g-draw .clr{flex:1;max-width:200px;border-radius:16px;background:var(--card2);font-weight:800;font-size:19px;
        display:flex;align-items:center;justify-content:center}
      .g-draw .clr:active{background:#3a4374}
      .g-draw .ban{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);background:rgba(0,0,0,.8);
        border:3px solid var(--pc);color:#fff;font-weight:900;font-size:24px;border-radius:16px;padding:10px 18px;
        text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 20px);line-height:1.2;z-index:5;
        animation:gdIn .25s ease-out}
      .g-draw .ban small{display:block;font-size:17px;color:#cfd3ef;font-weight:700;margin-top:2px}
      @keyframes gdIn{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
    `));

    const { cv, g } = ctx.canvas();
    const fxc = ctx.canvas({ z: 4 });
    fxc.cv.style.pointerEvents = 'none';

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 0.24 });
      z.el.style.background = `linear-gradient(to bottom, ${U.alpha(p.color, 0.16)}, ${U.alpha(p.color, 0.05)})`;
      const box = U.h('div', { class: 'dz' });
      const main = U.h('div', { class: 'main' });
      const role = U.h('span', { class: 'role' }, '');
      const sc = U.h('b', null, '0');
      const pts = U.h('span', { class: 'pts' }, '');
      const buy = U.h('div', { class: 'buy' }, '💡 −1');
      ctx.tap(buy, () => buyHint(p.i));
      const tm = U.h('span', { class: 'tm' }, '1:00');
      box.append(main, U.h('div', { class: 'info' }, role, U.h('span', null, 'очки ', sc), pts, buy, tm));
      z.el.append(box);
      return { z, box, main, role, sc, pts, buy, tm, ban: null, grid: null };
    });

    function banner(i, html, sub, ms) {
      const zz = zones[i];
      if (zz.ban) zz.ban.remove();
      const b = U.h('div', { class: 'ban' }, html, sub ? U.h('small', null, sub) : null);
      zz.z.el.append(b);
      zz.ban = b;
      ctx.after(ms, () => { if (zz.ban === b) { b.remove(); zz.ban = null; } });
    }
    function shakeZone(i) { const b = zones[i].box; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

    function optClass(w) { return w.length > 11 ? 'op xs' : w.length > 8 ? 'op sm' : 'op'; }
    const isFinal = () => turn >= TURNS - n;
    const mult = () => (challenge && challenge.id === 'blitz' ? 2 : 1) * (isFinal() ? 2 : 1);
    // guesser points by speed: first third of the turn +3, second +2, last +1
    function guessPts() {
      const frac = (ctx.time - turnStart) / turnLen;
      return (frac < 1 / 3 ? 3 : frac < 2 / 3 ? 2 : 1) * mult();
    }
    const artistPts = () => (challenge ? 2 : 1) * mult();

    function buildZones() {
      ctx.players.forEach(p => {
        const zz = zones[p.i];
        zz.main.replaceChildren();
        zz.sc.textContent = score[p.i];
        if (p.i === artist) {
          zz.role.textContent = challenge ? `${challenge.icon} ${challenge.name}` : 'Ты рисуешь';
          zz.buy.style.display = 'none';
          zz.pts.textContent = '';
          const show = U.h('div', { class: 'show' }, 'Показать слово (удерживай)');
          let held = 0;
          const on = () => {
            show.classList.add('held');
            show.replaceChildren(word.w, U.h('span', { class: 'cat' }, word.cat));
          };
          const off = () => { show.classList.remove('held'); show.textContent = 'Показать слово (удерживай)'; };
          ctx.pointer(show, {
            down: () => { held++; on(); },
            up: () => { held = Math.max(0, held - 1); if (!held) off(); },
          });
          const clr = U.h('div', { class: 'clr' }, '🧽 Очистить');
          ctx.tap(clr, () => { if (phase === 'draw') { strokes = []; active.clear(); lineDone = false; dirty = true; } });
          zz.main.append(show, clr);
          zz.grid = null;
        } else {
          zz.role.textContent = 'Угадай!';
          zz.buy.style.display = '';
          zz.buy.classList.toggle('off', score[p.i] < 1);
          const grid = U.h('div', { class: 'grid' });
          U.shuffle(options).forEach(w => {
            const b = U.h('div', { class: optClass(w) }, w);
            b.dataset.w = w;
            ctx.tap(b, () => guess(p.i, w, b));
            grid.append(b);
          });
          zz.main.append(grid);
          zz.grid = grid;
        }
      });
    }

    function pickWord() {
      let cands = ALL.filter(x => !used.has(x.w));
      if (!cands.length) { used.clear(); cands = ALL; }
      const wd = U.pick(cands);
      used.add(wd.w);
      return wd;
    }

    function nextTurn() {
      turn++;
      if (turn >= TURNS) return finish();
      artist = turn % n;
      word = pickWord();
      const same = U.shuffle(WORDS[word.cat].filter(w => w !== word.w)).slice(0, 5);
      while (same.length < 5) {
        const o = U.pick(ALL).w;
        if (o !== word.w && !same.includes(o)) same.push(o);
      }
      options = [word.w, ...same];
      // first turn plain, then a random artist challenge every turn
      if (turn === 0) challenge = null;
      else {
        if (!chalBag.length) chalBag = U.shuffle(CHALLENGES);
        challenge = chalBag.pop();
      }
      strokes = []; active.clear(); dirty = true; lineDone = false;
      locked = new Set(); hintsGiven = 0;
      removed.forEach(s => s.clear());
      bought.fill(false);
      phase = 'draw';
      turnLen = challenge && challenge.id === 'blitz' ? 25 : TURN;
      turnStart = ctx.time;
      turnEnd = ctx.time + turnLen;
      buildZones();
      const head = `Ход ${turn + 1}/${TURNS}`;
      const fin = isFinal() ? ' · 🔥 очки ×2' : '';
      if (isFinal() && turn === TURNS - n) ctx.toast('🔥 Последний круг: все очки ×2!', { ms: 1800, color: '#ff8c42', fg: '#111' });
      ctx.players.forEach(p => {
        const ch = challenge ? `${challenge.icon} ${challenge.name}: ${challenge.tip}` : '';
        if (p.i === artist) banner(p.i, `${head}: ты рисуешь! 🎨${fin}`, ch || 'Удерживай кнопку, чтобы увидеть слово', 2600);
        else banner(p.i, `${head}: рисует ${ctx.players[artist].name}${fin}`, ch || 'Чем быстрее угадаешь, тем больше очков', 2600);
      });
    }

    function removeWrong(i, k) {
      const zz = zones[i];
      if (!zz.grid) return 0;
      const cands = [...zz.grid.querySelectorAll('.op')].filter(o => o.dataset.w !== word.w && !removed[i].has(o.dataset.w) && !o.classList.contains('wrong'));
      let c = 0;
      U.shuffle(cands).slice(0, k).forEach(o => { removed[i].add(o.dataset.w); o.classList.add('gone'); c++; });
      return c;
    }

    function buyHint(i) {
      if (phase !== 'draw' || i === artist || locked.has(i) || bought[i] || score[i] < 1) return;
      if (!removeWrong(i, 2)) return;
      bought[i] = true;
      score[i] -= 1;
      zones[i].sc.textContent = score[i];
      zones[i].buy.classList.add('off');
      banner(i, '💡 −1 очко: убрал 2 варианта', null, 1300);
    }

    function guess(i, w, b) {
      if (phase !== 'draw' || i === artist || locked.has(i) || removed[i].has(w)) return;
      if (w === word.w) {
        const gp = guessPts(), ap = artistPts();
        score[i] += gp;
        score[artist] += ap;
        b.classList.add('right');
        confetti(i);
        endTurn(i, gp, ap);
      } else {
        b.classList.add('wrong');
        shakeZone(i);
        locked.add(i);
        zones[i].grid.classList.add('locked');
        zones[i].role.textContent = 'Мимо, жди';
        zones[i].pts.textContent = '';
        if (locked.size >= n - 1) endTurn(null);
      }
    }

    function endTurn(winner, gp, ap) {
      if (phase !== 'draw') return;
      phase = 'reveal';
      active.clear();
      ctx.players.forEach(p => {
        const zz = zones[p.i];
        zz.sc.textContent = score[p.i];
        zz.pts.textContent = '';
        zz.buy.classList.add('off');
        if (zz.grid) {
          zz.grid.classList.add('off');
          zz.grid.querySelectorAll('.op').forEach(o => { if (o.dataset.w === word.w) { o.classList.remove('gone'); o.classList.add('right'); } });
        }
        let head;
        if (winner == null) head = (locked.size >= n - 1 ? 'Никто не угадал' : '⏰ Время вышло');
        else if (winner === p.i) head = `🎉 Угадал! +${gp}`;
        else if (p.i === artist) head = `${ctx.players[winner].name} угадал! Тебе +${ap}`;
        else head = `${ctx.players[winner].name} угадал первым`;
        banner(p.i, head, `Слово: «${word.w}»`, 2200);
      });
      ctx.after(2200, nextTurn);
    }

    function finish() {
      phase = 'idle';
      const max = Math.max(...score);
      let winners = ctx.players.map(p => p.i).filter(i => score[i] === max);
      if (winners.length === n) winners = [];
      ctx.end({ winners, scores: score.slice() });
    }

    /* ---------- paper geometry ---------- */
    function paper() {
      let x0 = 0, y0 = 0, x1 = ctx.W, y1 = ctx.H;
      ctx.players.forEach((p, i) => {
        const r = zones[i].z.rect;
        if (p.side === 'left') x0 = r.x + r.w;
        if (p.side === 'right') x1 = r.x;
        if (p.side === 'top') y0 = r.y + r.h;
        if (p.side === 'bottom') y1 = r.y;
      });
      const m = 8;
      x0 += m; y0 += m; x1 -= m; y1 -= m;
      // keep clear of the exit button (2p: middle of the left edge, 3p: middle of the top edge)
      if (n === 2) { x0 += 44; x1 -= 44; } else y0 += 44;
      return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, unit: Math.min(x1 - x0, y1 - y0) };
    }
    const angle = () => (challenge && challenge.id === 'spin' && phase !== 'idle') ? (ctx.time - turnStart) * 0.3 : 0;
    // screen -> normalized paper coords (undoing the paper rotation)
    function toN(P, x, y) {
      const u = (x - P.cx) / P.unit, v = (y - P.cy) / P.unit, a = -angle();
      return [u * Math.cos(a) - v * Math.sin(a), u * Math.sin(a) + v * Math.cos(a)];
    }

    /* ---------- drawing input ---------- */
    const active = new Map(); // pointerId -> stroke
    ctx.pointer(cv, {
      down(id, x, y) {
        if (phase !== 'draw' || ctx.paused) return;
        const P = paper();
        if (x < P.x0 || x > P.x1 || y < P.y0 || y > P.y1) return;
        if (challenge && challenge.id === 'line' && (lineDone || active.size)) {
          banner(artist, '〰️ Только одна линия! Очисти, чтобы начать заново', null, 1400);
          return;
        }
        const s = { c: ctx.players[artist].color, pts: [toN(P, x, y)], circle: challenge && challenge.id === 'circle', tEnd: null };
        strokes.push(s); active.set(id, s); dirty = true;
      },
      move(id, x, y) {
        const s = active.get(id);
        if (!s || phase !== 'draw') return;
        const P = paper();
        const q = toN(P, U.clamp(x, P.x0, P.x1), U.clamp(y, P.y0, P.y1));
        if (challenge && challenge.id === 'straight') { s.pts[1] = q; dirty = true; return; }
        const l = s.pts[s.pts.length - 1];
        if (Math.hypot(q[0] - l[0], q[1] - l[1]) * P.unit < 2.5) return;
        s.pts.push(q); dirty = true;
      },
      up(id) {
        const s = active.get(id);
        if (!s) return;
        active.delete(id);
        s.tEnd = ctx.time;
        if (challenge && challenge.id === 'line' && s.pts.length > 1) lineDone = true;
        dirty = true;
      },
    });
    ctx.onResize(() => { dirty = true; });

    function fitCircle(pts) {
      let cx = 0, cy = 0;
      pts.forEach(p => { cx += p[0]; cy += p[1]; });
      cx /= pts.length; cy /= pts.length;
      let r = 0;
      pts.forEach(p => { r += Math.hypot(p[0] - cx, p[1] - cy); });
      return [cx, cy, Math.max(0.01, r / pts.length)];
    }

    function render() {
      const W = ctx.W, H = ctx.H, P = paper();
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#0f1220';
      g.fillRect(0, 0, W, H);
      g.fillStyle = '#f4f1e8';
      g.beginPath();
      if (g.roundRect) g.roundRect(P.x0, P.y0, P.w, P.h, 18); else g.rect(P.x0, P.y0, P.w, P.h);
      g.fill();
      g.save();
      g.clip();
      if (phase !== 'idle') {
        g.strokeStyle = U.alpha(ctx.players[artist].color, 0.9);
        g.lineWidth = 6;
        g.stroke();
      }
      // time bar along the inner side of the artist's edge
      if (phase === 'draw') {
        const frac = U.clamp((turnEnd - ctx.time) / turnLen, 0, 1);
        g.fillStyle = frac < 0.17 ? '#ff4d6d' : U.alpha(ctx.players[artist].color, 0.5);
        g.fillRect(P.x0, P.y0, P.w * frac, 6);
      }
      g.save();
      g.translate(P.cx, P.cy);
      g.rotate(angle());
      if (challenge && challenge.id === 'spin') {
        // faint grid so the rotation is visible
        g.strokeStyle = 'rgba(0,0,0,0.06)'; g.lineWidth = 2;
        for (let k = -6; k <= 6; k++) {
          g.beginPath(); g.moveTo(k * P.unit * 0.12, -P.unit); g.lineTo(k * P.unit * 0.12, P.unit); g.stroke();
          g.beginPath(); g.moveTo(-P.unit, k * P.unit * 0.12); g.lineTo(P.unit, k * P.unit * 0.12); g.stroke();
        }
      }
      const U1 = P.unit;
      const lw = Math.max(5, U1 * 0.014);
      g.lineCap = 'round'; g.lineJoin = 'round';
      for (const s of strokes) {
        let alpha = 1;
        if (challenge && challenge.id === 'fade' && s.tEnd != null) alpha = U.clamp(1 - (ctx.time - s.tEnd - 3) / 1.2, 0, 1);
        if (alpha <= 0) continue;
        g.globalAlpha = alpha;
        g.strokeStyle = s.c; g.fillStyle = s.c; g.lineWidth = lw;
        const pts = s.pts.map(([u, v]) => [u * U1, v * U1]);
        if (s.circle && pts.length > 2) {
          const [cx, cy, r] = fitCircle(pts);
          if (active.has && [...active.values()].includes(s)) {
            g.globalAlpha = alpha * 0.35;
            g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); pts.forEach(p => g.lineTo(p[0], p[1])); g.stroke();
            g.globalAlpha = alpha;
          }
          g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
          continue;
        }
        if (pts.length === 1) {
          g.beginPath(); g.arc(pts[0][0], pts[0][1], lw / 2, 0, Math.PI * 2); g.fill();
          continue;
        }
        g.beginPath();
        g.moveTo(pts[0][0], pts[0][1]);
        for (let k = 1; k < pts.length - 1; k++) {
          const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
          g.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
        }
        const L = pts[pts.length - 1];
        g.lineTo(L[0], L[1]);
        g.stroke();
      }
      g.globalAlpha = 1;
      g.restore();
      if (phase === 'draw' && !strokes.length) {
        const v = ctx.inward(artist);
        const d = (Math.abs(v.x) ? P.w : P.h) * 0.3;
        g.save();
        ctx.facing(g, artist, P.cx - v.x * d, P.cy - v.y * d);
        g.fillStyle = 'rgba(40,40,60,0.35)';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = `800 ${Math.round(U.clamp(P.unit * 0.05, 18, 30))}px ${FONT}`;
        g.fillText(challenge ? `${challenge.icon} ${challenge.name}` : 'Рисуй здесь пальцем ✏️', 0, 0);
        g.restore();
      }
      g.restore();
    }

    /* ---------- confetti ---------- */
    function confetti(i) {
      const r = zones[i].z.rect, v = ctx.inward(i);
      const x = r.x + r.w / 2 + v.x * r.d * 0.5, y = r.y + r.h / 2 + v.y * r.d * 0.5;
      const cols = ['#ff5a5f', '#3b9cff', '#ffc93c', '#3ddc97', '#c58bff', '#ffffff'];
      for (let k = 0; k < 70; k++) {
        const a = Math.atan2(v.y, v.x) + U.rand(-1.1, 1.1), sp = U.rand(250, 750);
        parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: U.pick(cols), w: U.rand(5, 10), h: U.rand(3, 6), rot: Math.random() * 6, vr: U.rand(-10, 10) });
      }
    }
    function drawParts(dt) {
      const G = fxc.g;
      G.clearRect(0, 0, ctx.W, ctx.H);
      for (const q of parts) {
        if (dt > 0) { q.life -= dt * 0.9; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95; q.rot += q.vr * dt; }
        if (q.life <= 0) continue;
        G.save();
        G.globalAlpha = Math.min(1, q.life * 2);
        G.translate(q.x, q.y); G.rotate(q.rot);
        G.fillStyle = q.c; G.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
        G.restore();
      }
      parts = parts.filter(q => q.life > 0);
    }

    let lastSec = -1, lastPhase = '', lastPts = '';
    ctx.loop((dt) => {
      if (phase === 'draw') {
        const el = (ctx.time - turnStart) / turnLen;
        // automatic hints at 50% and 75% of the turn
        if ((hintsGiven === 0 && el >= 0.5) || (hintsGiven === 1 && el >= 0.75)) {
          hintsGiven++;
          ctx.players.forEach(p => {
            if (p.i === artist || locked.has(p.i)) return;
            if (removeWrong(p.i, 1)) banner(p.i, '💡 Подсказка: −1 вариант', null, 1200);
          });
        }
        if (ctx.time >= turnEnd) endTurn(null);
      }
      const sec = phase === 'draw' ? Math.max(0, Math.ceil(turnEnd - ctx.time)) : phase === 'reveal' ? 0 : TURN;
      if (sec !== lastSec || phase !== lastPhase) {
        lastSec = sec; lastPhase = phase;
        zones.forEach(zz => {
          zz.tm.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
          zz.tm.classList.toggle('low', phase === 'draw' && sec <= 10);
        });
        dirty = true;
      }
      if (phase === 'draw') {
        const pts = '+' + guessPts();
        if (pts !== lastPts) {
          lastPts = pts;
          ctx.players.forEach(p => {
            if (p.i !== artist && !locked.has(p.i)) zones[p.i].pts.textContent = pts;
          });
          zones.forEach((zz, i) => { if (i !== artist) zz.buy.classList.toggle('off', bought[i] || locked.has(i) || score[i] < 1); });
        }
      } else lastPts = '';
      if (phase === 'draw' && challenge && (challenge.id === 'spin' || challenge.id === 'fade')) dirty = true;
      if (phase === 'draw' && dt > 0) dirty = true; // time bar
      if (dirty) { dirty = false; render(); }
      drawParts(dt);
    });

    nextTurn();
  },
});

</script>
<script>/* games/math.js */
registerGame({
  id: 'math',
  title: 'Математический батл',
  emoji: '🧮',
  desc: 'Реши пример быстрее всех',
  rules: 'У каждого перед собой один и тот же пример и варианты ответа. Первый верный ответ даёт очко, ошибся: ждёшь следующий пример. До 7 очков. Примеры постепенно усложняются.\n' +
    'Особые раунды:\n' +
    '⚡ Блиц: всего 4 секунды.\n' +
    '✖️2 Двойные очки: верный ответ +2.\n' +
    '🎯 Угадай знак: 7 ? 8 = 56, выбери + − × ÷.\n' +
    '⚖️ Сравни: что больше, левое или правое?\n' +
    '🕵️ Кража: верный ответ отнимает очко у лидера.\n' +
    '☠️ Риск: верно +2, ошибка −1.\n' +
    '🔥 Серия: 3 победы подряд дают +1 бонус.\n' +
    '🆘 Подсказка: кто отстал на 3+ очка, у того один неверный ответ убран.',
  start(ctx) {
    const N = ctx.n;
    const TARGET = 7;
    const DEPTH = N === 2 ? 0.36 : 0.3;
    const LIMIT = 20000; // ms per problem before it is skipped
    const MODES = {
      blitz: { icon: '⚡', name: 'Блиц', sub: 'всего 4 секунды!', color: '#ffd84a' },
      double: { icon: '✖️2', name: 'Двойные очки', sub: 'верный ответ +2', color: '#3ddc97' },
      sign: { icon: '🎯', name: 'Угадай знак', sub: 'какой знак пропущен?', color: '#4dd0ff' },
      cmp: { icon: '⚖️', name: 'Сравни', sub: 'что больше?', color: '#c39bff' },
      steal: { icon: '🕵️', name: 'Кража', sub: 'верный ответ крадёт очко у лидера', color: '#ff8a5c' },
      risk: { icon: '☠️', name: 'Риск', sub: 'верно +2, ошибка −1', color: '#ff4d6d' },
    };
    const score = ctx.players.map(() => 0);
    const hinted = ctx.players.map(() => false);
    let prob = null, popts = [], locked = new Set(), state = 'wait', timeoutId = null, qStart = 0, qLimit = LIMIT, num = 0;
    let mode = 'normal', lastMode = 'normal';
    let lastWinner = -1, streak = 0;

    ctx.root.classList.add('g-math');
    ctx.root.append(U.h('style', null, `
      .g-math .mz{display:flex;flex-direction:column;padding:10px 12px 12px;border-radius:20px;transition:box-shadow .2s}
      .g-math .hd{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;flex:none}
      .g-math .q{font-weight:900;white-space:nowrap;color:#fff;letter-spacing:.5px}
      .g-math .q b{color:var(--ok)}
      .g-math .q.pre{color:var(--mc,#fff);animation:mathPulse .5s ease-in-out infinite alternate}
      @keyframes mathPulse{0%{scale:1}100%{scale:1.08}}
      .g-math .sc{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--pc);color:#111;
        font-weight:900;border-radius:12px;padding:2px 10px;font-size:20px}
      .g-math .tag{position:absolute;left:0;top:50%;transform:translateY(-50%);border-radius:12px;padding:2px 8px;font-size:20px;
        background:rgba(255,255,255,.12);display:none}
      .g-math .tm{position:absolute;left:4px;right:4px;bottom:2px;height:5px;border-radius:3px;background:rgba(255,255,255,.08)}
      .g-math .tm i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--pc);opacity:.7}
      .g-math .tm.blitz i{background:#ffd84a;opacity:1}
      .g-math .opts{flex:1;display:grid;gap:10px;min-height:0}
      .g-math .ob{border-radius:18px;background:var(--card2);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;
        box-shadow:inset 0 -5px 0 rgba(0,0,0,.25), 0 0 0 3px var(--pc) inset;transition:background .12s,opacity .12s}
      .g-math .ob.bad{background:var(--bad);animation:mathShake .3s}
      .g-math .ob.ok{background:var(--ok);color:#111;animation:mathOk .35s}
