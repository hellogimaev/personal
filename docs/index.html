        const gg = g.createRadialGradient(f.x + f.w / 2, f.y + f.h / 2, 0, f.x + f.w / 2, f.y + f.h / 2, Math.max(f.w, f.h) * 0.6);
        gg.addColorStop(0, 'rgba(255,207,60,.12)'); gg.addColorStop(1, 'rgba(255,207,60,0)');
        g.fillStyle = gg; g.fillRect(f.x, f.y, f.w, f.h);
      }
      // round timer ring in the center
      if (phase === 'pump') {
        const left = Math.max(0, roundEnd - ctx.time), cx = f.x + f.w / 2, cy = f.y + f.h / 2;
        const rr = Math.max(22, Math.min(f.w, f.h) * 0.045);
        const tcx = cx, tcy = N === 3 ? f.y + 56 + rr : cy;
        g.fillStyle = 'rgba(255,255,255,.06)'; g.beginPath(); g.arc(tcx, tcy, rr, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 6; g.beginPath(); g.arc(tcx, tcy, rr, 0, TAU); g.stroke();
        g.strokeStyle = left < 3 ? '#ff4d6d' : '#fff'; g.beginPath(); g.arc(tcx, tcy, rr, -Math.PI / 2, -Math.PI / 2 + TAU * left / ROUND_T); g.stroke();
        g.font = `${rr * 0.9}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('⏳', tcx, tcy + 2);
      }
      bl.forEach(b => drawBalloon(b, t));
      for (const r of rings) {
        g.strokeStyle = U.alpha(r.c, 1 - r.t); g.lineWidth = 6 * (1 - r.t) + 1;
        g.beginPath(); g.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * r.t, 0, TAU); g.stroke();
      }
      for (const p of parts) {
        g.globalAlpha = Math.min(1, p.life * 1.5); g.fillStyle = p.c;
        if (p.rag) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8); g.restore(); }
        else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); }
      }
      g.globalAlpha = 1;
      for (const fl of floats) {
        const p = pos[fl.i];
        g.save(); ctx.facing(g, fl.i, p.x, p.y);
        g.globalAlpha = Math.min(1, (1.8 - fl.t) * 2);
        const fs = fl.big ? Math.max(26, Rm * 0.36) : Math.max(17, Rm * 0.2);
        g.font = `900 ${fs}px -apple-system, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        const y = -Rm * 0.75 - fl.t * 30;
        g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.75)'; g.strokeText(fl.text, 0, y);
        g.fillStyle = fl.c; g.fillText(fl.text, 0, y);
        g.restore();
      }
      g.globalAlpha = 1;
      g.restore();
      if (flash > 0) { g.fillStyle = U.alpha(flashC, Math.min(0.4, flash)); g.fillRect(0, 0, ctx.W, ctx.H); }
      renderT -= dt;
      if (renderT <= 0) { renderT = 0.2; render(); }
    });
    let renderT = 0;
    render();
    ctx.dbg = { ui, bl, total, get phase() { return phase; }, get round() { return round; } }; // for automated tests
  },
});

</script>
<script>/* games/blobs.js */
registerGame({
  id: 'blobs',
  title: 'Пожиратели',
  emoji: '🫧',
  desc: 'Ешь, расти и глотай соперников',
  rules: 'Коснись экрана у своего края и тяни палец — это джойстик, капля плывёт туда.\n' +
    'Ешь точки и расти. Чем больше капля, тем она медленнее.\n' +
    'Проглоти соперника: будь на 25% больше и накрой его центр. Съеденный теряет ❤️ и через 2 с возвращается.\n' +
    '💨 Рывок: двойной тап или тап вторым пальцем (теряешь немного массы).\n' +
    'Бонусы и события:\n' +
    '🌵 Колючка: лопает большие капли (−40% массы), малыши прячутся под ней\n' +
    '⚡ Скорость  🛡️ Щит (тебя не съесть)  🧲 Магнит для еды\n' +
    '🍗 ПИР: взрыв еды в центре\n' +
    '🆘 Съеденный возвращается с бонусом массы\n' +
    '⏱️ Последние 15 секунд еда ×2\n' +
    'У каждого 3 жизни. Побеждает последний выживший или самый большой через 90 секунд.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n;
    const HUD = 0.085, GAME_T = 90, START_M = 200, LIVES = 3;
    const FOOD_N = 70, FOOD_V = 8, JOY_R = 62;
    const TAU = Math.PI * 2;

    ctx.root.classList.add('g-blobs');
    ctx.root.append(U.h('style', null, `
      .g-blobs .zone{pointer-events:none}
      .g-blobs .bh{display:flex;align-items:center;justify-content:space-between;gap:2vmin;padding:0 3vmin;
        color:var(--pc);font-weight:900;font-size:3.3vmin;white-space:nowrap}
      .g-blobs .bh .hearts{font-size:3.2vmin;letter-spacing:.3vmin}
      .g-blobs .bh .hearts .off{opacity:.2;filter:grayscale(1)}
      .g-blobs .bh .mass{color:#fff}
      .g-blobs .bh .pw{display:flex;gap:1.4vmin;min-width:0}
      .g-blobs .bh .pw span{background:rgba(255,255,255,.12);border-radius:2vmin;padding:.3vmin 1.2vmin;color:#fff;font-size:2.8vmin}
      .g-blobs .bh .dash{font-size:2.8vmin;color:#fff;opacity:.9}
      .g-blobs .bh .dash.cd{opacity:.3}
      .g-blobs .bh .tm{color:#fff;opacity:.85}
      .g-blobs .bh .tm.hot{color:#ff4d6d;opacity:1}
      .g-blobs .bh.dead{opacity:.45}
    `));

    const { g } = ctx.canvas();

    /* ---------- geometry: world units, short side of arena = 700 ---------- */
    let ar = { x: 0, y: 0, w: 100, h: 100 }, u = 1, WW = 700, WH = 700;
    function arenaRect() {
      const d = Math.round(HUD * Math.min(ctx.W, ctx.H));
      const s = P.map(p => p.side);
      const l = s.includes('left') ? d : 0, r = s.includes('right') ? d : 0;
      const t = s.includes('top') ? d : 0, b = s.includes('bottom') ? d : 0;
      const m = 6, el = N === 2 ? 44 : 0, et = N === 3 ? 44 : 0; // keep the exit button spot free
      return { x: l + m + el, y: t + m + et, w: Math.max(100, ctx.W - l - r - 2 * m - el), h: Math.max(100, ctx.H - t - b - 2 * m - et) };
    }
    const sx = (x) => ar.x + x * u, sy = (y) => ar.y + y * u;
    const wx = (x) => (x - ar.x) / u, wy = (y) => (y - ar.y) / u;

    /* ---------- state ---------- */
    let food = [], spikes = [], items = [], parts = [], rings = [], floats = [];
    let shake = 0, flash = 0, flashC = '#fff', ended = false, finalPhase = false, started = false;
    const blobs = P.map(p => ({
      i: p.i, c: p.color, x: 0, y: 0, vx: 0, vy: 0, m: START_M, lives: LIVES, alive: true, out: false,
      respawnT: 0, inv: 0, dashT: 0, dashCd: 0, speedT: 0, shieldT: 0, magnetT: 0,
      dirX: 0, dirY: -1, wob: Math.random() * 10, eat: 0, look: { x: 0, y: 0 },
    }));
    const rad = (m) => Math.sqrt(m) * 2.2;
    function spawnPoint(i) {
      const side = P[i].side, M = 90;
      if (side === 'bottom') return { x: WW / 2 + (N === 2 ? -WW * 0.2 : 0), y: WH - M };
      if (side === 'top') return { x: WW / 2 + WW * 0.2, y: M };
      if (side === 'left') return { x: M, y: WH / 2 };
      return { x: WW - M, y: WH / 2 };
    }

    function layout() {
      const oW = WW, oH = WH, first = !ar.set;
      ar = arenaRect(); ar.set = true;
      u = Math.min(ar.w, ar.h) / 700;
      WW = ar.w / u; WH = ar.h / u;
      if (first) return;
      const kx = WW / oW, ky = WH / oH;
      const all = [food, spikes, items, parts, floats];
      for (const arr of all) for (const o of arr) { o.x *= kx; o.y *= ky; }
      for (const b of blobs) { b.x *= kx; b.y *= ky; }
      for (const r of rings) { r.x *= kx; r.y *= ky; }
    }
    layout();
    ctx.onResize(layout);
    blobs.forEach(b => { const s = spawnPoint(b.i); b.x = s.x; b.y = s.y; b.inv = 1.5; });

    function freeSpot(minD) {
      for (let t = 0; t < 40; t++) {
        const x = U.rand(60, WW - 60), y = U.rand(60, WH - 60);
        let ok = true;
        for (const b of blobs) if (b.alive && U.dist(x, y, b.x, b.y) < rad(b.m) + minD) { ok = false; break; }
        if (ok) for (const s of spikes) if (U.dist(x, y, s.x, s.y) < 120) { ok = false; break; }
        if (ok) return { x, y };
      }
      return { x: U.rand(60, WW - 60), y: U.rand(60, WH - 60) };
    }
    function addFood(x, y, vx, vy, v) {
      food.push({ x, y, vx: vx || 0, vy: vy || 0, v: v || FOOD_V, h: Math.floor(Math.random() * 360), r: 4 + Math.random() * 2.5, age: 0 });
    }
    for (let k = 0; k < FOOD_N; k++) { const s = freeSpot(30); addFood(s.x, s.y); }
    for (let k = 0; k < 3; k++) { const s = freeSpot(140); spikes.push({ x: s.x, y: s.y, r: 30, rot: Math.random() * TAU, pulse: 0 }); }

    /* ---------- effects ---------- */
    function burst(x, y, color, n, sp, size) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, s = U.rand(sp * 0.3, sp);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: color, r: U.rand(size * 0.5, size) });
      }
    }
    function ring(x, y, color, r0, r1) { rings.push({ x, y, c: color, r0, r1, t: 0 }); }
    function floatText(i, x, y, text, color) { floats.push({ i, x, y, text, c: color || '#fff', t: 0 }); }
    function say(text, o) { return ctx.toast(text, Object.assign({ ms: 1500, offset: Math.min(ar.w, ar.h) * (N === 2 ? 0.2 : 0.28) }, o || {})); }

    /* ---------- HUD ---------- */
    const hud = P.map(p => {
      const z = ctx.zone(p.i, { depth: HUD, className: 'bh' });
      z.el.style.background = `linear-gradient(0deg, ${U.alpha(p.color, .24)}, ${U.alpha(p.color, .06)})`;
      z.el.style.borderTop = `2px solid ${U.alpha(p.color, .6)}`;
      const hearts = U.h('div', { class: 'hearts' });
      const mass = U.h('div', { class: 'mass' });
      const pw = U.h('div', { class: 'pw' });
      const dash = U.h('div', { class: 'dash' }, '💨 рывок');
      const tm = U.h('div', { class: 'tm' });
      z.el.append(hearts, mass, pw, dash, tm);
      return { z, hearts, mass, pw, dash, tm, cache: {} };
    });
    function setTxt(h, key, el, val, html) {
      if (h.cache[key] === val) return;
      h.cache[key] = val;
      if (html) el.innerHTML = val; else el.textContent = val;
    }
    function renderHud() {
      const left = Math.max(0, Math.ceil(GAME_T - ctx.time));
      const ts = `⏱️ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      const big = leader();
      blobs.forEach((b, i) => {
        const h = hud[i];
        let hs = '';
        for (let k = 0; k < LIVES; k++) hs += k < b.lives ? '❤️' : '<span class="off">❤️</span>';
        setTxt(h, 'h', h.hearts, hs, true);
        setTxt(h, 'm', h.mass, b.out ? 'выбыл' : !b.alive ? `↻ ${Math.ceil(b.respawnT)}` : `${big === i ? '👑 ' : '⚖️ '}${Math.round(b.m)}`);
        let pw = '';
        if (b.speedT > 0) pw += `<span>⚡${Math.ceil(b.speedT)}</span>`;
        if (b.shieldT > 0) pw += `<span>🛡️${Math.ceil(b.shieldT)}</span>`;
        if (b.magnetT > 0) pw += `<span>🧲${Math.ceil(b.magnetT)}</span>`;
        setTxt(h, 'p', h.pw, pw, true);
        h.dash.classList.toggle('cd', b.dashCd > 0 || !b.alive);
        setTxt(h, 't', h.tm, ts);
        h.tm.classList.toggle('hot', left <= 15);
        h.z.el.classList.toggle('dead', b.out);
      });
    }
    function leader() {
      let best = -1, bm = 0;
      blobs.forEach((b, i) => { if (b.alive && !b.out && b.m > bm * 1.02) { bm = b.m; best = i; } });
      return best;
    }

    /* ---------- input: floating joystick per seat ---------- */
    const joy = P.map(() => null);       // {id, bx, by, dx, dy}
    const lastUp = P.map(() => ({ t: -9, dur: 9 }));
    const ptrs = new Map();               // pointerId -> {seat, role, t0}
    ctx.pointer(ctx.root, {
      down(id, x, y) {
        if (ended) return;
        const s = ctx.seatAt(x, y);
        const now = ctx.time;
        if (joy[s] && joy[s].id !== id) { ptrs.set(id, { seat: s, role: 'tap', t0: now }); dash(s); return; }
        ptrs.set(id, { seat: s, role: 'joy', t0: now });
        joy[s] = { id, bx: x, by: y, dx: 0, dy: 0 };
        const lu = lastUp[s];
        if (now - lu.t < 0.32 && lu.dur < 0.3) dash(s);
      },
      move(id, x, y) {
        const p = ptrs.get(id);
        if (!p || p.role !== 'joy') return;
        const j = joy[p.seat];
        if (!j || j.id !== id) return;
        let dx = x - j.bx, dy = y - j.by;
        const d = Math.hypot(dx, dy), max = JOY_R * 1.5;
        if (d > max) { j.bx += dx * (1 - max / d); j.by += dy * (1 - max / d); dx = x - j.bx; dy = y - j.by; }
        j.dx = dx; j.dy = dy;
      },
      up(id) {
        const p = ptrs.get(id);
        if (!p) return;
        ptrs.delete(id);
        if (p.role === 'joy' && joy[p.seat] && joy[p.seat].id === id) {
          joy[p.seat] = null;
          lastUp[p.seat] = { t: ctx.time, dur: ctx.time - p.t0 };
        }
      },
    });

    function dash(i) {
      const b = blobs[i];
      if (!b.alive || b.out || b.dashCd > 0 || ctx.paused || ended) return;
      const j = joy[i];
      let dx = b.dirX, dy = b.dirY;
      if (j && Math.hypot(j.dx, j.dy) > 8) { const d = Math.hypot(j.dx, j.dy); dx = j.dx / d; dy = j.dy / d; }
      const r = rad(b.m), sp = 720 * Math.pow(31 / r, 0.3);
      b.vx = dx * sp; b.vy = dy * sp;
      b.dashT = 0.3; b.dashCd = 1.1;
      if (b.m > 120) {
        const shed = b.m * 0.08;
        b.m -= shed;
        for (let k = 0; k < 3; k++) {
          const a = Math.atan2(-dy, -dx) + U.rand(-0.5, 0.5);
          addFood(b.x - dx * r, b.y - dy * r, Math.cos(a) * 260, Math.sin(a) * 260, shed / 3);
        }
      }
      burst(b.x - dx * r, b.y - dy * r, '#ffffff', 10, 260, 4);
      floatText(i, b.x, b.y - r, '💨', '#fff');
    }

    /* ---------- events ---------- */
    function feast() {
      say('🍗 ПИР! Еда в центре', { color: '#ffb347', fg: '#111', ms: 1800 });
      const cx = WW / 2, cy = WH / 2;
      for (let k = 0; k < 44; k++) {
        const a = Math.random() * TAU, s = U.rand(80, 520);
        addFood(cx, cy, Math.cos(a) * s, Math.sin(a) * s, FOOD_V * 1.5);
      }
      ring(cx, cy, '#ffb347', 10, 380);
      burst(cx, cy, '#ffd27a', 40, 500, 6);
      flash = 0.35; flashC = '#ffb347';
    }
    const ITEM_TYPES = [
      { k: 'speed', icon: '⚡', c: '#ffe14d', text: '⚡ Скорость!' },
      { k: 'shield', icon: '🛡️', c: '#7fe7ff', text: '🛡️ Щит!' },
      { k: 'magnet', icon: '🧲', c: '#ff7ad9', text: '🧲 Магнит!' },
    ];
    function spawnItem() {
      if (items.length >= 2 || ended) return;
      const s = freeSpot(120);
      const t = U.pick(ITEM_TYPES);
      items.push({ x: s.x, y: s.y, t, age: 0 });
      ring(s.x, s.y, t.c, 4, 60);
    }
    ctx.after(1, () => {
      started = true;
      say('Тяни палец у своего края!', { ms: 1600 });
    });
    ctx.every(7000, spawnItem);
    ctx.after(3000, spawnItem);
    ctx.every(24000, feast);
    ctx.after(GAME_T * 1000 - 15000, () => {
      finalPhase = true;
      say('⏱️ 15 секунд! Еда ×2', { color: '#ff4d6d', fg: '#fff', ms: 1800 });
      flash = 0.3; flashC = '#ff4d6d';
    });
    ctx.after(GAME_T * 1000, () => timeUp());

    function timeUp() {
      if (ended) return;
      let best = [], bm = -1;
      blobs.forEach((b, i) => {
        if (b.out) return;
        const m = b.alive ? b.m : START_M;
        if (m > bm + 0.5) { bm = m; best = [i]; } else if (Math.abs(m - bm) <= 0.5) best.push(i);
      });
      finish(best, 'Время вышло: самый большой побеждает');
    }
    function finish(winners, msg) {
      if (ended) return;
      ended = true;
      if (winners.length === 1) {
        const w = blobs[winners[0]];
        say(`🏆 ${P[w.i].name} побеждает!`, { color: w.c, fg: '#111', ms: 1600 });
        if (w.alive) { ring(w.x, w.y, w.c, rad(w.m), rad(w.m) + 300); burst(w.x, w.y, w.c, 60, 600, 7); }
      } else say('Ничья!', { ms: 1600 });
      const scores = blobs.map(b => b.out ? 0 : Math.round(b.alive ? b.m : START_M));
      ctx.after(1700, () => ctx.end({ winners, scores, msg }));
    }

    /* ---------- simulation ---------- */
    function popOnSpike(b, s) {
      const shed = b.m * 0.4;
      b.m -= shed;
      const r = rad(b.m), cnt = 14;
      for (let k = 0; k < cnt; k++) {
        const a = k / cnt * TAU + Math.random() * 0.3, sp = U.rand(250, 520);
        addFood(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, Math.cos(a) * sp, Math.sin(a) * sp, shed / cnt);
      }
      burst(b.x, b.y, b.c, 30, 500, 6);
      burst(s.x, s.y, '#5fe36b', 16, 300, 4);
      ring(b.x, b.y, '#5fe36b', r, r + 140);
      shake = Math.max(shake, 10);
      floatText(b.i, b.x, b.y - r - 10, '🌵 Лопнул! −40%', '#7dff8a');
      const ns = freeSpot(160); s.x = ns.x; s.y = ns.y; s.pulse = 1;
    }
    function eatBlob(a, b) {
      const gain = b.m * 0.6;
      a.m += gain; a.eat = 1;
      b.alive = false; b.lives--; b.vx = b.vy = 0;
      burst(b.x, b.y, b.c, 45, 600, 7);
      burst(b.x, b.y, '#ffffff', 15, 400, 3);
      ring(a.x, a.y, a.c, rad(a.m), rad(a.m) + 220);
      shake = Math.max(shake, 16); flash = 0.25; flashC = a.c;
      if (b.lives <= 0) {
        b.out = true;
        say(`💀 ${P[a.i].name} съел ${P[b.i].name}! Выбыл`, { color: a.c, fg: '#111', ms: 1800 });
        const left = blobs.filter(x => !x.out);
        if (left.length === 1) finish([left[0].i], 'Последний выживший');
      } else {
        b.respawnT = 2;
        say(`🍽️ ${P[a.i].name} съел ${P[b.i].name}!`, { color: a.c, fg: '#111', ms: 1500 });
      }
    }
    function respawn(b) {
      const s = spawnPoint(b.i);
      let maxO = 0;
      blobs.forEach(o => { if (o !== b && o.alive && !o.out) maxO = Math.max(maxO, o.m); });
      const bonus = Math.min(900, Math.max(START_M, maxO * 0.55));
      b.m = bonus; b.x = s.x; b.y = s.y; b.vx = b.vy = 0;
      b.alive = true; b.inv = 3; b.dashCd = 0;
      b.speedT = b.shieldT = b.magnetT = 0;
      ring(b.x, b.y, b.c, 5, 120);
      burst(b.x, b.y, b.c, 20, 300, 5);
      if (bonus > START_M + 20) floatText(b.i, b.x, b.y - rad(b.m) - 14, `🆘 Бонус: масса ${Math.round(bonus)}`, '#fff');
      else floatText(b.i, b.x, b.y - rad(b.m) - 14, '🛡️ Возрождение', '#fff');
    }

    function update(dt) {
      for (const b of blobs) {
        if (b.out) continue;
        if (!b.alive) { b.respawnT -= dt; if (b.respawnT <= 0 && !ended) respawn(b); continue; }
        const r = rad(b.m);
        b.inv = Math.max(0, b.inv - dt);
        b.dashCd = Math.max(0, b.dashCd - dt);
        b.speedT = Math.max(0, b.speedT - dt);
        b.shieldT = Math.max(0, b.shieldT - dt);
        b.magnetT = Math.max(0, b.magnetT - dt);
        b.eat = Math.max(0, b.eat - dt * 3);
        b.wob += dt * 3;
        const j = joy[b.i];
        let jx = 0, jy = 0;
        if (j && started && !ended) {
          const d = Math.hypot(j.dx, j.dy);
          if (d > 7) {
            const mag = Math.min(1, d / JOY_R);
            jx = j.dx / d * mag; jy = j.dy / d * mag;
            b.dirX = j.dx / d; b.dirY = j.dy / d;
          }
        }
        const sp = 255 * Math.pow(31 / r, 0.5) * (b.speedT > 0 ? 1.55 : 1);
        if (b.dashT > 0) {
          b.dashT -= dt;
          if (b.speedT > 0 && Math.random() < 0.5) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.6, c: '#ffe14d', r: 4 });
        } else {
          const k = Math.min(1, dt * 7);
          b.vx += (jx * sp - b.vx) * k; b.vy += (jy * sp - b.vy) * k;
        }
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx) * 0.3; }
        if (b.x > WW - r) { b.x = WW - r; b.vx = -Math.abs(b.vx) * 0.3; }
        if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy) * 0.3; }
        if (b.y > WH - r) { b.y = WH - r; b.vy = -Math.abs(b.vy) * 0.3; }
        b.look.x += ((jx || b.vx / 300) - b.look.x) * Math.min(1, dt * 6);
        b.look.y += ((jy || b.vy / 300) - b.look.y) * Math.min(1, dt * 6);
        if (b.speedT > 0 && Math.hypot(b.vx, b.vy) > 60 && Math.random() < dt * 30)
          parts.push({ x: b.x - b.vx / 300 * r, y: b.y - b.vy / 300 * r, vx: U.rand(-30, 30), vy: U.rand(-30, 30), life: 0.7, c: '#ffe14d', r: U.rand(2, 5) });
        // slow decay for big blobs
        if (b.m > 400) b.m -= (b.m - 400) * 0.012 * dt;

        // food
        const mult = finalPhase ? 2 : 1;
        const magR = r + 190;
        for (let k = food.length - 1; k >= 0; k--) {
          const f = food[k];
          const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
          if (b.magnetT > 0 && d < magR && d > 1 && f.age > 0.3) {
            const pull = 420 * dt;
            f.x += dx / d * pull; f.y += dy / d * pull;
          }
          if (d < r && f.age > 0.25) {
            b.m += f.v * mult;
            food.splice(k, 1);
            if (parts.length < 400) for (let q = 0; q < 3; q++) {
              const a = Math.random() * TAU;
              parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, life: 0.5, c: `hsl(${f.h},90%,70%)`, r: 2.5 });
            }
          }
        }
        // items
        for (let k = items.length - 1; k >= 0; k--) {
          const it = items[k];
          if (U.dist(b.x, b.y, it.x, it.y) < r + 20) {
            items.splice(k, 1);
            if (it.t.k === 'speed') b.speedT = 6;
            if (it.t.k === 'shield') b.shieldT = 6;
            if (it.t.k === 'magnet') b.magnetT = 7;
            floatText(b.i, b.x, b.y - r - 12, it.t.text, it.t.c);
            ring(it.x, it.y, it.t.c, 10, 90);
            burst(it.x, it.y, it.t.c, 20, 320, 5);
          }
        }
        // spikes
        for (const s of spikes) {
          if (r > s.r * 1.3 && b.shieldT <= 0 && b.inv <= 0 && U.dist(b.x, b.y, s.x, s.y) < r * 0.85 + s.r * 0.4) popOnSpike(b, s);
        }
      }
      // blob vs blob
      for (let a = 0; a < blobs.length; a++) for (let c = a + 1; c < blobs.length; c++) {
        const A = blobs[a], B = blobs[c];
        if (!A.alive || !B.alive || A.out || B.out) continue;
        const ra = rad(A.m), rb = rad(B.m);
        const d = U.dist(A.x, A.y, B.x, B.y);
        const big = A.m >= B.m ? A : B, small = big === A ? B : A;
        const rbig = big === A ? ra : rb, rsmall = big === A ? rb : ra;
        const canEat = big.m >= small.m * 1.25 && small.inv <= 0 && small.shieldT <= 0 && !ended;
        if (canEat && d < rbig - rsmall * 0.3) { eatBlob(big, small); continue; }
        if (!canEat && d < ra + rb && d > 0.01) {
          // soft bump
          const ov = (ra + rb - d), nx = (B.x - A.x) / d, ny = (B.y - A.y) / d;
          const wa = B.m / (A.m + B.m), wb = 1 - wa;
          A.x -= nx * ov * wa * 0.5; A.y -= ny * ov * wa * 0.5;
          B.x += nx * ov * wb * 0.5; B.y += ny * ov * wb * 0.5;
          const rv = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          if (rv < 0) {
            A.vx += nx * rv * wa; A.vy += ny * rv * wa;
            B.vx -= nx * rv * wb; B.vy -= ny * rv * wb;
          }
        }
      }
      // food physics + refill
      for (const f of food) {
        f.age += dt;
        if (f.vx || f.vy) {
          f.x += f.vx * dt; f.y += f.vy * dt;
          const fr = Math.pow(0.04, dt);
          f.vx *= fr; f.vy *= fr;
          if (Math.abs(f.vx) + Math.abs(f.vy) < 4) f.vx = f.vy = 0;
          if (f.x < 8) { f.x = 8; f.vx = Math.abs(f.vx); } if (f.x > WW - 8) { f.x = WW - 8; f.vx = -Math.abs(f.vx); }
          if (f.y < 8) { f.y = 8; f.vy = Math.abs(f.vy); } if (f.y > WH - 8) { f.y = WH - 8; f.vy = -Math.abs(f.vy); }
        }
      }
      refillT += dt;
      if (refillT > 0.3) { refillT = 0; if (food.length < FOOD_N) { const s = freeSpot(40); addFood(s.x, s.y); } }
      for (const s of spikes) { s.rot += dt * 0.4; s.pulse = Math.max(0, s.pulse - dt); }
      for (const it of items) it.age += dt;
    }
    let refillT = 0;

    /* ---------- drawing ---------- */
    function drawBlob(b, t) {
      const r = rad(b.m) * u, x = sx(b.x), y = sy(b.y);
      const spd = Math.hypot(b.vx, b.vy);
      // glow
      const gl = g.createRadialGradient(x, y, r * 0.6, x, y, r * 1.6);
      gl.addColorStop(0, U.alpha(b.c, 0.35)); gl.addColorStop(1, U.alpha(b.c, 0));
      g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 1.6, 0, TAU); g.fill();
      // jelly body
      const segs = 36, amp = Math.min(0.06, 2.5 / Math.max(8, r)) + b.eat * 0.08;
      g.beginPath();
      for (let k = 0; k <= segs; k++) {
        const a = k / segs * TAU;
        const w = 1 + amp * Math.sin(a * 3 + b.wob * 2) + amp * 0.6 * Math.sin(a * 5 - b.wob * 3)
          + (spd > 40 ? 0.05 * Math.cos(a - Math.atan2(b.vy, b.vx)) * Math.min(1, spd / 400) : 0);
        const px = x + Math.cos(a) * r * w, py = y + Math.sin(a) * r * w;
        if (k) g.lineTo(px, py); else g.moveTo(px, py);
      }
      g.closePath();
      const fill = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      fill.addColorStop(0, '#ffffff'); fill.addColorStop(0.15, U.alpha(b.c, 1)); fill.addColorStop(1, U.alpha(b.c, 0.85));
      g.fillStyle = fill; g.fill();
      g.lineWidth = Math.max(2, r * 0.07); g.strokeStyle = 'rgba(0,0,0,.35)'; g.stroke();
      // eyes
      const lx = U.clamp(b.look.x, -1, 1), ly = U.clamp(b.look.y, -1, 1);
      const er = Math.max(3.5, r * 0.2), ex = r * 0.32;
      const ld = Math.hypot(lx, ly) || 1, nlx = lx / ld * Math.min(1, ld), nly = ly / ld * Math.min(1, ld);
      for (const s of [-1, 1]) {
        // eyes sit perpendicular to look direction
        const ox = -nly * s * ex + nlx * r * 0.25, oy = nlx * s * ex + nly * r * 0.25;
        const exx = x + (Math.hypot(nlx, nly) > 0.1 ? ox : s * ex), eyy = y + (Math.hypot(nlx, nly) > 0.1 ? oy : -r * 0.1);
        g.fillStyle = '#fff'; g.beginPath(); g.arc(exx, eyy, er, 0, TAU); g.fill();
        g.fillStyle = '#111'; g.beginPath(); g.arc(exx + nlx * er * 0.45, eyy + nly * er * 0.45, er * 0.5, 0, TAU); g.fill();
      }
      // shield / spawn protection
      if (b.shieldT > 0 || b.inv > 0) {
        const blink = b.shieldT > 0 && b.shieldT < 1.5 ? (Math.sin(t * 20) > 0 ? 1 : 0.3) : 1;
        g.strokeStyle = U.alpha('#7fe7ff', 0.8 * blink); g.lineWidth = 3;
        g.beginPath(); g.arc(x, y, r + 7, 0, TAU); g.stroke();
        g.fillStyle = U.alpha('#7fe7ff', 0.12 * blink); g.fill();
      }
      if (b.magnetT > 0) {
        g.strokeStyle = U.alpha('#ff7ad9', 0.35); g.lineWidth = 2; g.setLineDash([6, 10]);
        g.lineDashOffset = -t * 40;
        g.beginPath(); g.arc(x, y, (rad(b.m) + 190) * u, 0, TAU); g.stroke(); g.setLineDash([]);
      }
      if (leader() === b.i && N > 1) {
        g.save(); ctx.facing(g, b.i, x, y);
        g.font = `${Math.max(16, r * 0.55)}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('👑', 0, -r - Math.max(10, r * 0.25));
        g.restore();
      }
    }
    function drawSpike(s, t) {
      const x = sx(s.x), y = sy(s.y), r = s.r * u * (1 + s.pulse * 0.3 + 0.04 * Math.sin(t * 3 + s.x));
      g.save(); g.translate(x, y); g.rotate(s.rot);
      g.beginPath();
      const n = 14;
      for (let k = 0; k <= n * 2; k++) {
        const a = k / (n * 2) * TAU, rr = k % 2 ? r * 0.78 : r * 1.12;
        if (k) g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
      g.fillStyle = 'rgba(70,200,90,.82)'; g.fill();
      g.lineWidth = 3; g.strokeStyle = '#a6ff9e'; g.stroke();
      g.rotate(-s.rot);
      g.font = `${r * 0.9}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('🌵', 0, 2);
      g.restore();
    }
    function drawJoy(i, t) {
      const j = joy[i];
      if (!j) return;
      const c = P[i].color;
      g.strokeStyle = U.alpha(c, 0.55); g.lineWidth = 3;
      g.fillStyle = U.alpha(c, 0.1);
      g.beginPath(); g.arc(j.bx, j.by, JOY_R, 0, TAU); g.fill(); g.stroke();
      const d = Math.hypot(j.dx, j.dy), k = d > JOY_R ? JOY_R / d : 1;
      const kx = j.bx + j.dx * k, ky = j.by + j.dy * k;
      g.fillStyle = U.alpha(c, 0.75);
      g.beginPath(); g.arc(kx, ky, 28, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2; g.stroke();
    }

    ctx.loop((dt, now) => {
      const t = now / 1000;
      if (dt > 0 && !ended) update(dt);
      if (dt > 0) {
        for (const p of parts) { p.life -= dt * 1.6; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
        parts = parts.filter(p => p.life > 0);
        for (const r of rings) r.t += dt * 1.8;
        rings = rings.filter(r => r.t < 1);
        for (const f of floats) f.t += dt;
        floats = floats.filter(f => f.t < 1.6);
        shake = Math.max(0, shake - dt * 40);
        flash = Math.max(0, flash - dt);
      }
      g.save();
      g.fillStyle = '#0f1220'; g.fillRect(0, 0, ctx.W, ctx.H);
      if (shake > 0) g.translate(U.rand(-shake, shake) * 0.5, U.rand(-shake, shake) * 0.5);
      // arena
      g.fillStyle = '#141933';
      g.beginPath(); g.roundRect(ar.x, ar.y, ar.w, ar.h, 18); g.fill();
      g.save(); g.clip();
      const step = 50 * u;
      g.strokeStyle = 'rgba(255,255,255,.045)'; g.lineWidth = 1;
      g.beginPath();
      for (let x = ar.x + (ar.w / 2) % step; x < ar.x + ar.w; x += step) { g.moveTo(x, ar.y); g.lineTo(x, ar.y + ar.h); }
      for (let y = ar.y + (ar.h / 2) % step; y < ar.y + ar.h; y += step) { g.moveTo(ar.x, y); g.lineTo(ar.x + ar.w, y); }
      g.stroke();
      if (finalPhase && !ended) { g.fillStyle = `rgba(255,77,109,${0.05 + 0.04 * Math.sin(t * 6)})`; g.fillRect(ar.x, ar.y, ar.w, ar.h); }
      // food
      const fm = finalPhase ? 1.3 : 1;
      for (const f of food) {
        const x = sx(f.x), y = sy(f.y), r = f.r * u * fm * (f.v > FOOD_V ? 1.25 : 1);
        g.fillStyle = `hsla(${f.h},90%,65%,.22)`; g.beginPath(); g.arc(x, y, r * 2.1, 0, TAU); g.fill();
        g.fillStyle = `hsl(${f.h},90%,66%)`; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      }
      // items
      for (const it of items) {
        const x = sx(it.x), y = sy(it.y), bob = Math.sin(t * 4 + it.x) * 4, r = 22 * u + 6;
        const pop = Math.min(1, it.age * 4);
        g.fillStyle = U.alpha(it.t.c, 0.22 + 0.1 * Math.sin(t * 6)); g.beginPath(); g.arc(x, y + bob, r * 1.5 * pop, 0, TAU); g.fill();
        g.fillStyle = '#1d2242'; g.beginPath(); g.arc(x, y + bob, r * pop, 0, TAU); g.fill();
        g.strokeStyle = it.t.c; g.lineWidth = 3; g.stroke();
        g.font = `${r * 1.1 * pop}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(it.t.icon, x, y + bob + 2);
      }
      // blobs: small ones under spikes, big ones over
      const order = blobs.filter(b => b.alive && !b.out).sort((a, b) => a.m - b.m);
      for (const b of order) if (rad(b.m) <= 39) drawBlob(b, t);
      for (const s of spikes) drawSpike(s, t);
      for (const b of order) if (rad(b.m) > 39) drawBlob(b, t);
      // respawn markers
      for (const b of blobs) if (!b.alive && !b.out) {
        const s = spawnPoint(b.i), x = sx(s.x), y = sy(s.y);
        g.strokeStyle = U.alpha(b.c, 0.6); g.lineWidth = 3; g.setLineDash([8, 8]); g.lineDashOffset = t * 30;
        g.beginPath(); g.arc(x, y, 30 * u, 0, TAU); g.stroke(); g.setLineDash([]);
        g.save(); ctx.facing(g, b.i, x, y); g.fillStyle = b.c; g.font = `900 ${26 * u + 6}px sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(Math.ceil(b.respawnT)), 0, 0); g.restore();
      }
      g.restore(); // clip
      g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect(ar.x, ar.y, ar.w, ar.h, 18); g.stroke();
      // particles & rings
      for (const r of rings) {
        g.strokeStyle = U.alpha(r.c, 1 - r.t); g.lineWidth = 4 * (1 - r.t) + 1;
        g.beginPath(); g.arc(sx(r.x), sy(r.y), (r.r0 + (r.r1 - r.r0) * r.t) * u, 0, TAU); g.stroke();
      }
      for (const p of parts) {
        g.globalAlpha = Math.min(1, p.life * 1.5); g.fillStyle = p.c;
        g.beginPath(); g.arc(sx(p.x), sy(p.y), p.r * u, 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
      for (const f of floats) {
        g.save(); ctx.facing(g, f.i, sx(f.x), sy(f.y));
        g.globalAlpha = Math.min(1, (1.6 - f.t) * 2);
        g.font = `900 ${Math.max(18, 22 * u)}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.7)';
        g.strokeText(f.text, 0, -f.t * 40); g.fillStyle = f.c; g.fillText(f.text, 0, -f.t * 40);
        g.restore();
      }
      g.globalAlpha = 1;
      g.restore();
      for (let i = 0; i < N; i++) drawJoy(i, t);
      if (flash > 0) { g.fillStyle = U.alpha(flashC, Math.min(0.35, flash)); g.fillRect(0, 0, ctx.W, ctx.H); }
      hudT -= dt || 0.016;
      if (hudT <= 0) { hudT = 0.1; renderHud(); }
    });
    let hudT = 0;
    renderHud();
    ctx.dbg = { blobs, food, spikes, items, joy, get W() { return { ar, u, WW, WH }; } }; // for automated tests
  },
});

</script>
<script>/* games/catch.js */
registerGame({
  id: 'catch',
  title: 'Лови фрукты',
  emoji: '🍎',
  desc: 'Лови фрукты и бонусы, уворачивайся от бомб',
  rules: 'Из центра вылетают фрукты и летят к игрокам. Водите пальцем по своей полосе: корзина едет за пальцем.\nФрукт +1, звезда ⭐ +3, бомба 💣 −3. 5 фруктов подряд: 🔥 серия +2.\nБонусы в пузырях:\n🧲 Магнит: фрукты сами летят в корзину, бомбы отталкиваются\n↔️ Широкая корзина  ✖️2 Двойные очки\n❄️ Заморозка: корзины соперников замерзают\n🌫️ Туман над полосами соперников\n🦹 Воришка: −2 очка лидеру, +2 тебе  🎁 Сюрприз\nСобытия: 🍉 фруктовый дождь, 🌠 звездопад, 🌀 вихрь, 💣 бомбы делятся. Последние 10 секунд всё ×2.\nОтстающему помогает 🆘 подмога. Раунд 60 секунд.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const DUR = 60;
    const n = ctx.n;
    const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍐', '🍒', '🍉', '🍑', '🍍', '🥝', '🍋'];
    const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    const FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
    const POWER = {
      magnet: { icon: '🧲', name: 'Магнит!', dur: 5, col: '#ff5a8a' },
      wide: { icon: '↔️', name: 'Широкая корзина!', dur: 7, col: '#3ddc97' },
      double: { icon: '✖️2', name: 'Двойные очки!', dur: 7, col: '#ffd84a' },
      freeze: { icon: '❄️', name: 'Заморозка соперников!', dur: 2.5, col: '#8fe3ff' },
      fog: { icon: '🌫️', name: 'Туман соперникам!', dur: 4, col: '#aab' },
      steal: { icon: '🦹', name: 'Воришка!', dur: 0, col: '#c58bff' },
      mystery: { icon: '🎁', name: 'Сюрприз', dur: 0, col: '#ff8c42' },
    };
    const EVENTS = [
      { id: 'rain', text: '🍉 Фруктовый дождь!', dur: 3.5 },
      { id: 'stars', text: '🌠 Звездопад!', dur: 3 },
      { id: 'whirl', text: '🌀 Вихрь: фрукты петляют!', dur: 7 },
      { id: 'split', text: '💣 Бомбы делятся!', dur: 8 },
    ];
    const score = ctx.players.map(() => 0);
    const streak = ctx.players.map(() => 0);
    // effect timers per player (seconds left)
    const eff = ctx.players.map(() => ({ magnet: 0, wide: 0, double: 0, freeze: 0, fog: 0 }));
    let over = false;
    let event = null, eventLeft = 0, finalPhase = false;

    ctx.root.classList.add('g-catch');
    ctx.root.append(U.h('style', null, `
      .g-catch .cz{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
        padding:0 18px;border-top:4px solid var(--pc);pointer-events:none;gap:10px}
      .g-catch .cz .sc{display:flex;flex-direction:column;align-items:center;min-width:70px;line-height:1}
      .g-catch .cz .sc b{font-size:46px;font-weight:900;color:var(--pc);font-variant-numeric:tabular-nums}
      .g-catch .cz .sc span{font-size:14px;color:var(--muted);margin-top:4px;font-weight:700}
      .g-catch .cz .mid{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;overflow:hidden}
      .g-catch .cz .hint{font-size:16px;color:var(--muted);opacity:.7;font-weight:700;white-space:nowrap}
      .g-catch .cz .bd{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.12);border-radius:12px;
        padding:4px 9px;font-weight:900;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
      .g-catch .cz .bd.bad{background:rgba(143,227,255,.25)}
      .g-catch .cz .tm{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
      .g-catch .cz .tm.low{color:#ff4d6d}
      .g-catch .cz.shake{animation:gcShake .45s linear}
      @keyframes gcShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px)}30%{transform:translateX(11px)}
        45%{transform:translateX(-9px)}60%{transform:translateX(7px)}75%{transform:translateX(-4px)}90%{transform:translateX(2px)}}
      .g-catch .say{position:absolute;left:50%;bottom:calc(100% + 64px);transform:translateX(-50%);background:rgba(0,0,0,.75);
        border:3px solid var(--sc,#fff);color:#fff;font-weight:900;font-size:24px;border-radius:16px;padding:8px 16px;
        white-space:nowrap;pointer-events:none;animation:gcSay .25s ease-out;z-index:3}
      @keyframes gcSay{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
    `));

    const { g } = ctx.canvas();

    const pads = ctx.players.map(() => ({ s: null, target: null, shake: 0, flash: 0, flashColor: '#fff' }));

    const zones = ctx.players.map(p => {
      const z = ctx.zone(p.i, { depth: 0.15 });
      const box = U.h('div', { class: 'cz' });
      z.el.style.background = `linear-gradient(to bottom, ${U.alpha(p.color, 0.22)}, ${U.alpha(p.color, 0.06)})`;
      const sc = U.h('b', null, '0');
      const tm = U.h('div', { class: 'tm' }, '1:00');
      const hint = U.h('div', { class: 'hint' }, '◀ води пальцем ▶');
      const mid = U.h('div', { class: 'mid' }, hint);
      box.append(U.h('div', { class: 'sc' }, sc, U.h('span', null, 'очки')), mid, tm);
      z.el.append(box);
      const ids = new Set();
      const set = (x, y) => { pads[p.i].target = (p.side === 'bottom' || p.side === 'top') ? x : y; };
      ctx.pointer(z.outer, {
        down: (id, x, y) => { ids.add(id); set(x, y); },
        move: (id, x, y) => { if (ids.has(id)) set(x, y); },
        up: (id) => { ids.delete(id); },
      });
      return { z, box, sc, tm, hint, mid, sayEl: null, badgeKey: '' };
    });

    // per-player announcement facing the player, just above their strip
    function say(i, text, color = '#fff', ms = 1400) {
      const zz = zones[i];
      if (zz.sayEl) zz.sayEl.remove();
      const el = U.h('div', { class: 'say', style: { '--sc': color } }, text);
      el.style.setProperty('--sc', color);
      zz.z.el.append(el);
      zz.sayEl = el;
      ctx.after(ms, () => { if (zz.sayEl === el) { el.remove(); zz.sayEl = null; } });
    }

    /* ---------- geometry ---------- */
    function field() {
      let x0 = 0, y0 = 0, x1 = ctx.W, y1 = ctx.H;
      ctx.players.forEach((p, i) => {
        const r = zones[i].z.rect;
        if (p.side === 'left') x0 = r.x + r.w;
        if (p.side === 'right') x1 = r.x;
        if (p.side === 'top') y0 = r.y + r.h;
        if (p.side === 'bottom') y1 = r.y;
      });
      return { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
    }
    function line(i, F) {
      const side = ctx.players[i].side;
      if (side === 'bottom') return { s0: F.x0, s1: F.x1, pt: s => [s, F.y1] };
      if (side === 'top') return { s0: F.x0, s1: F.x1, pt: s => [s, F.y0] };
      if (side === 'left') return { s0: F.y0, s1: F.y1, pt: s => [F.x0, s] };
      return { s0: F.y0, s1: F.y1, pt: s => [F.x1, s] };
    }
    const padHalf = (i, L) => U.clamp((L.s1 - L.s0) * 0.11, 46, 100) * (eff[i].wide > 0 ? 1.7 : 1);
    const itemSize = () => U.clamp(Math.min(ctx.W, ctx.H) * 0.07, 40, 62);

    /* ---------- items ---------- */
    let items = [], floats = [], parts = [];
    let bag = [], bagKind = 'fruit';
    let acc = 0.6, powerAcc = 4;

    function nextPlayer() {
      if (!bag.length) {
        bag = U.shuffle(ctx.players.map(p => p.i));
        const r = Math.random();
        // same kind for everyone in a round -> fair share of stars and bombs
        bagKind = r < 0.17 ? 'bomb' : r < 0.25 ? 'star' : 'fruit';
        if (event && event.id === 'rain') bagKind = 'fruit';
        if (event && event.id === 'stars') bagKind = Math.random() < 0.75 ? 'star' : 'fruit';
      }
      return bag.pop();
    }

    function spawn(prog, p = nextPlayer(), kind = bagKind, power = null) {
      const it = {
        p, kind, power,
        emoji: kind === 'bomb' ? '💣' : kind === 'star' ? '⭐' : kind === 'power' ? POWER[power].icon : U.pick(FRUITS),
        frac: U.rand(0.08, 0.92),
        ox: U.rand(-14, 14), oy: U.rand(-14, 14),
        T: U.lerp(2.5, 1.25, prog) * U.rand(0.92, 1.08) * (kind === 'power' ? 1.15 : 1),
        age: 0, state: 'fly', alpha: 1, ph: Math.random() * 6.28, split: false,
      };
      items.push(it);
      return it;
    }

    // power-ups go preferably to whoever is behind (comeback help)
    function spawnPower(prog) {
      const max = Math.max(...score);
      const w = ctx.players.map(p => 1 + Math.max(0, max - score[p.i]) * 0.35);
      let r = Math.random() * w.reduce((a, b) => a + b, 0), p = 0;
      for (; p < n - 1; p++) { r -= w[p]; if (r <= 0) break; }
      const kinds = ['magnet', 'wide', 'double', 'freeze', 'fog', 'steal', 'mystery'];
      spawn(prog, p, 'power', U.pick(kinds));
    }

    function itemPos(it, F) {
      const L = line(it.p, F);
      const [tx, ty] = L.pt(L.s0 + it.frac * (L.s1 - L.s0));
      const ox = F.cx + it.ox, oy = F.cy + it.oy;
      const f = it.age / it.T;
      let x = ox + (tx - ox) * f, y = oy + (ty - oy) * f;
      if (it.whirl) {
        // sideways loops that vanish at the catch line
        const v = ctx.inward(it.p), side = { x: -v.y, y: v.x };
        const a = Math.sin(it.age * 5 + it.ph) * Math.max(0, f * (1 - f)) * 4 * 70;
        x += side.x * a; y += side.y * a;
      }
      return { x, y, f, L, dist: Math.hypot(tx - ox, ty - oy) };
    }

    function addFloat(p, x, y, text, color) { floats.push({ p, x, y, text, color, life: 1 }); }
    function burst(x, y, color, count, speed = 300) {
      for (let k = 0; k < count; k++) {
        const a = Math.random() * 6.283, sp = U.rand(speed * 0.3, speed);
        parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: color, r: U.rand(2.5, 6) });
      }
    }

    function updateScore(i) { zones[i].sc.textContent = score[i]; }

    const gen = (name) => name.replace(/ый$/, 'ого').replace(/ий$/, 'его');
    const ochk = (k) => k === 1 ? 'очко' : k >= 2 && k <= 4 ? 'очка' : 'очков';
    function applyPower(i, kind, px, py) {
      const P = POWER[kind];
      if (kind === 'mystery') {
        const k = U.pick(['magnet', 'wide', 'double', 'freeze', 'fog', 'steal']);
        say(i, `🎁 → ${POWER[k].icon} ${POWER[k].name}`, POWER[k].col);
        return applyPower(i, k, px, py, true);
      }
      burst(px, py, P.col, 30, 380);
      if (kind === 'steal') {
        // take from the leader among the others
        const others = ctx.players.map(p => p.i).filter(k => k !== i);
        const victim = others.reduce((a, b) => score[b] > score[a] ? b : a, others[0]);
        const amt = Math.min(2, Math.max(0, score[victim]));
        score[victim] -= amt; score[i] += amt;
        updateScore(i); updateScore(victim);
        if (arguments.length < 5) say(i, `🦹 Украл ${amt} ${ochk(amt)} у ${gen(ctx.players[victim].name)}!`, P.col);
        say(victim, `🦹 ${ctx.players[i].name} украл ${amt} ${ochk(amt)}!`, '#ff4d6d');
        return;
      }
      if (kind === 'freeze' || kind === 'fog') {
        ctx.players.forEach(p => {
          if (p.i === i) return;
          eff[p.i][kind] = Math.max(eff[p.i][kind], P.dur);
          say(p.i, kind === 'freeze' ? `❄️ Корзина заморожена!` : `🌫️ Туман от ${gen(ctx.players[i].name)}!`, P.col);
        });
        if (arguments.length < 5) say(i, `${P.icon} ${P.name}`, P.col);
        return;
      }
      eff[i][kind] = P.dur;
      if (arguments.length < 5) say(i, `${P.icon} ${P.name}`, P.col);
    }

    function resolve(it, pos) {
      const i = it.p, pad = pads[i], L = pos.L;
      const s = L.s0 + it.frac * (L.s1 - L.s0);
      const hw = padHalf(i, L);
      const caught = pad.s != null && Math.abs(s - pad.s) <= hw + itemSize() * 0.35;
      if (!caught) {
        it.state = 'miss';
        if (it.kind === 'fruit' || it.kind === 'star') streak[i] = 0;
        return;
      }
      it.state = 'done';
      const v = ctx.inward(i);
      const [bx, by] = L.pt(pad.s);
      const fx = bx + v.x * 50, fy = by + v.y * 50;
      const mul = (eff[i].double > 0 ? 2 : 1) * (finalPhase ? 2 : 1);
      if (it.kind === 'bomb') {
        score[i] -= 3;
        streak[i] = 0;
        pad.shake = 0.45; pad.flash = 0.5; pad.flashColor = '#ff4d6d';
        addFloat(i, fx, fy, '💥 −3', '#ff4d6d');
        burst(bx + v.x * 20, by + v.y * 20, '#ff8c42', 26, 420);
        burst(bx + v.x * 20, by + v.y * 20, '#ff4d6d', 14, 300);
        const box = zones[i].box;
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      } else if (it.kind === 'power') {
        pad.flash = 0.6; pad.flashColor = POWER[it.power].col;
        applyPower(i, it.power, bx + v.x * 20, by + v.y * 20);
      } else {
        const base = it.kind === 'star' ? 3 : 1;
        score[i] += base * mul;
        pad.flash = 0.35; pad.flashColor = it.kind === 'star' ? '#ffd84a' : '#3ddc97';
        addFloat(i, fx, fy, `+${base * mul}`, it.kind === 'star' ? '#ffd84a' : '#3ddc97');
        burst(bx + v.x * 20, by + v.y * 20, it.kind === 'star' ? '#ffd84a' : ctx.players[i].color, it.kind === 'star' ? 22 : 10, 260);
        streak[i]++;
        if (streak[i] >= 5) {
          streak[i] = 0;
          score[i] += 2;
          say(i, '🔥 Серия! +2', '#ff8c42');
          burst(bx + v.x * 20, by + v.y * 20, '#ff8c42', 30, 420);
        }
      }
      updateScore(i);
    }

    function startEvent(ev) {
      event = ev; eventLeft = ev.dur;
      ctx.toast(ev.text, { ms: 1600, color: '#283057' });
      if (ev.id === 'rain' || ev.id === 'stars') bag = [];
    }
    // three random events at fixed moments, then the final double phase
    const evOrder = U.shuffle(EVENTS).slice(0, 3);
    [13, 27, 41].forEach((t, k) => ctx.after(t * 1000, () => { if (!over) startEvent(evOrder[k]); }));
    ctx.after(50 * 1000, () => {
      finalPhase = true;
      ctx.toast('🔥 Финал: все очки ×2!', { ms: 1700, color: '#ff8c42', fg: '#111' });
    });
    // comeback help every 10s for a player far behind
    ctx.every(10000, () => {
      if (over || ctx.time > 52) return;
      const max = Math.max(...score), min = Math.min(...score);
      if (max - min < 6) return;
      const i = score.indexOf(min);
      eff[i].wide = Math.max(eff[i].wide, 6);
      say(i, '🆘 Подмога: широкая корзина!', '#3ddc97', 1800);
    });

    function finish() {
      if (over) return;
      over = true;
      ctx.after(900, () => {
        const max = Math.max(...score);
        let winners = ctx.players.map(p => p.i).filter(i => score[i] === max);
        if (winners.length === n) winners = [];
        ctx.end({ winners, scores: score.slice() });
      });
    }

    let lastSec = -1, warned = false;

    function drawFog(i, F, t) {
      const L = line(i, F), v = ctx.inward(i);
      const len = L.s1 - L.s0;
      const depth = (ctx.players[i].side === 'bottom' || ctx.players[i].side === 'top') ? (F.y1 - F.y0) / 2 : (F.x1 - F.x0) / 2;
      const a = Math.min(1, eff[i].fog * 2);
      for (let k = 0; k < 9; k++) {
        const s = L.s0 + len * (k + 0.5) / 9 + Math.sin(t / 700 + k) * 20;
        const [x, y] = L.pt(s);
        for (let j = 0; j < 2; j++) {
          const d = depth * (0.22 + j * 0.3) + Math.cos(t / 500 + k * 2) * 12;
          const cx = x + v.x * d, cy = y + v.y * d;
          const r = len / 9 * 1.3 + depth * 0.16;
          const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
          grd.addColorStop(0, `rgba(120,128,160,${0.95 * a})`);
          grd.addColorStop(0.6, `rgba(90,96,130,${0.8 * a})`);
          grd.addColorStop(1, 'rgba(60,64,90,0)');
          g.fillStyle = grd;
          g.beginPath(); g.arc(cx, cy, r, 0, 6.283); g.fill();
        }
      }
    }

    function updateBadges() {
      zones.forEach((zz, i) => {
        const e = eff[i];
        const list = [];
        for (const k of ['magnet', 'wide', 'double', 'freeze', 'fog']) if (e[k] > 0) list.push([k, Math.ceil(e[k])]);
        if (streak[i] >= 2) list.push(['streak', streak[i]]);
        const key = list.map(x => x.join(':')).join(',');
        if (key === zz.badgeKey) return;
        zz.badgeKey = key;
        if (!list.length) { zz.mid.replaceChildren(zz.hint); return; }
        zz.mid.replaceChildren(...list.map(([k, v]) => {
          if (k === 'streak') return U.h('span', { class: 'bd' }, '🔥', `${v}/5`);
          return U.h('span', { class: 'bd' + (k === 'freeze' || k === 'fog' ? ' bad' : '') }, POWER[k].icon, String(v));
        }));
      });
    }

    /* ---------- loop ---------- */
    ctx.loop((dt, t) => {
      const W = ctx.W, H = ctx.H;
      const F = field();
      const remain = Math.max(0, DUR - ctx.time);
      const prog = U.clamp(ctx.time / DUR, 0, 1);

      ctx.players.forEach(p => {
        const L = line(p.i, F), hw = padHalf(p.i, L), pad = pads[p.i];
        if (pad.s == null) pad.s = (L.s0 + L.s1) / 2;
        if (pad.target != null && eff[p.i].freeze <= 0) pad.s = pad.target;
        pad.s = U.clamp(pad.s, L.s0 + hw, L.s1 - hw);
        pad.shake = Math.max(0, pad.shake - dt);
        pad.flash = Math.max(0, pad.flash - dt);
        for (const k in eff[p.i]) eff[p.i][k] = Math.max(0, eff[p.i][k] - dt);
      });
      if (dt > 0 && event) { eventLeft -= dt; if (eventLeft <= 0) event = null; }

      if (!over && dt > 0) {
        acc -= dt;
        if (acc <= 0) {
          const it = spawn(prog);
          if (event && event.id === 'whirl') it.whirl = true;
          let gap = U.lerp(1.35, 0.5, prog) / n * U.rand(0.7, 1.3);
          if (event && (event.id === 'rain' || event.id === 'stars')) gap *= 0.3;
          acc += gap;
        }
        powerAcc -= dt;
        if (powerAcc <= 0 && remain > 3) { spawnPower(prog); powerAcc = U.rand(4.5, 7) / Math.sqrt(n / 2); }
        if (remain <= 10 && !warned) { warned = true; }
        if (remain <= 0) finish();
      }

      const sec = Math.ceil(remain);
      if (sec !== lastSec) {
        lastSec = sec;
        zones.forEach(zz => {
          zz.tm.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
          zz.tm.classList.toggle('low', sec <= 10);
        });
      }
      updateBadges();

      /* ----- draw ----- */
      g.clearRect(0, 0, W, H);
      g.fillStyle = finalPhase ? '#1a1224' : '#0f1220';
      g.fillRect(0, 0, W, H);

      // spawn portal + round timer ring
      const R = U.clamp(Math.min(W, H) * 0.06, 34, 54);
      g.beginPath(); g.arc(F.cx, F.cy, R, 0, Math.PI * 2);
      g.fillStyle = event ? 'rgba(255,200,120,0.12)' : 'rgba(255,255,255,0.05)'; g.fill();
      g.lineWidth = 6; g.strokeStyle = 'rgba(255,255,255,0.10)'; g.stroke();
      g.beginPath();
      g.arc(F.cx, F.cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (remain / DUR));
      g.strokeStyle = remain <= 10 ? '#ff4d6d' : 'rgba(255,255,255,0.65)';
      g.lineCap = 'round'; g.stroke(); g.lineCap = 'butt';
      if (event) {
        g.save(); g.translate(F.cx, F.cy); g.rotate(t / 300);
        g.strokeStyle = 'rgba(255,200,120,0.6)'; g.lineWidth = 3; g.setLineDash([8, 10]);
        g.beginPath(); g.arc(0, 0, R + 12, 0, 6.283); g.stroke(); g.setLineDash([]);
        g.restore();
      }

      // catch lines (track)
      ctx.players.forEach(p => {
        const L = line(p.i, F);
        const [ax, ay] = L.pt(L.s0), [bx, by] = L.pt(L.s1);
        g.strokeStyle = U.alpha(p.color, 0.35); g.lineWidth = 2;
        g.setLineDash([10, 10]);
        g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
        g.setLineDash([]);
      });

      // magnets pull fruit (and push bombs) along the line
      if (dt > 0) for (const it of items) {
        if (it.state !== 'fly' || eff[it.p].magnet <= 0) continue;
        const L = line(it.p, F), len = L.s1 - L.s0;
        const pf = (pads[it.p].s - L.s0) / len;
        const f = it.age / it.T;
        if (it.kind === 'bomb') it.frac += Math.sign(it.frac - pf || 1) * dt * 0.25 * f;
        else it.frac += (pf - it.frac) * Math.min(1, dt * 4 * f);
        it.frac = U.clamp(it.frac, 0.02, 0.98);
      }

      // items
      const sz = itemSize();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const born = [];
      for (const it of items) {
        if (dt > 0) it.age += dt;
        const pos = itemPos(it, F);
        if (event && event.id === 'split' && it.kind === 'bomb' && !it.split && pos.f > 0.42 && it.state === 'fly') {
          it.split = true;
          const twin = Object.assign({}, it, { frac: U.clamp(it.frac + (it.frac > 0.5 ? -0.22 : 0.22), 0.05, 0.95) });
          born.push(twin);
          burst(pos.x, pos.y, '#ff8c42', 12, 200);
        }
        if (it.state === 'fly' && pos.f >= 1 - (sz * 0.45) / Math.max(1, pos.dist)) resolve(it, pos);
        if (it.state === 'miss') it.alpha = Math.max(0, it.alpha - dt * 2.2);
        if (it.state === 'done' || it.alpha <= 0 || pos.f > 1.6) { it.dead = true; continue; }
        const scale = U.lerp(0.5, 1, Math.min(1, pos.f)) * (it.kind === 'power' ? 1.05 : 1);
        g.save();
        g.globalAlpha = it.alpha;
        ctx.facing(g, it.p, pos.x, pos.y);
        const s = sz * scale;
        if (it.kind === 'power') {
          // rainbow bubble
          const col = POWER[it.power].col;
          g.beginPath(); g.arc(0, 0, s * 0.72, 0, 6.283);
          g.fillStyle = U.alpha(col, 0.25); g.fill();
          g.lineWidth = 4; g.strokeStyle = `hsl(${(t / 4) % 360},90%,65%)`; g.stroke();
          g.shadowColor = col; g.shadowBlur = 18;
          if (it.power === 'double') {
            g.font = `900 ${Math.round(s * 0.55)}px ${FONT}`; g.fillStyle = '#ffd84a'; g.fillText('×2', 0, 2);
          } else {
            g.font = `${Math.round(s * 0.7)}px ${EMOJI_FONT}`; g.fillStyle = '#fff'; g.fillText(it.emoji, 0, s * 0.04);
          }
          g.restore();
          continue;
        }
        g.rotate(Math.sin(it.age * 4 + it.ph) * 0.22);
        if (it.kind === 'bomb' || it.kind === 'star') {
          const grd = g.createRadialGradient(0, 0, 0, 0, 0, s * 0.85);
          grd.addColorStop(0, it.kind === 'bomb' ? 'rgba(255,60,80,0.55)' : 'rgba(255,220,80,0.6)');
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = grd; g.beginPath(); g.arc(0, 0, s * 0.85, 0, Math.PI * 2); g.fill();
        }
        g.font = `${Math.round(s)}px ${EMOJI_FONT}`;
        g.fillStyle = '#fff';
        g.fillText(it.emoji, 0, s * 0.05);
        g.restore();
      }
      items = items.filter(it => !it.dead).concat(born);

      // fog over players hit by it
      ctx.players.forEach(p => { if (eff[p.i].fog > 0) drawFog(p.i, F, t); });

      // baskets
      ctx.players.forEach(p => {
        const L = line(p.i, F), hw = padHalf(p.i, L), pad = pads[p.i], e = eff[p.i];
        const [x, y] = L.pt(pad.s);
        g.save();
        ctx.facing(g, p.i, x, y);
        if (pad.shake > 0) g.translate(Math.sin(t / 18) * 9 * (pad.shake / 0.45), 0);
        const hgt = 30;
        if (e.magnet > 0) {
          // magnetic field arcs
          g.strokeStyle = `rgba(255,90,138,${0.35 + 0.25 * Math.sin(t / 90)})`; g.lineWidth = 3;
          for (let k = 1; k <= 3; k++) {
            const rr = hw * 0.6 + k * 22 + ((t / 12) % 22);
            g.beginPath(); g.arc(0, 0, rr, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
          }
        }
        if (pad.flash > 0) { g.shadowColor = pad.flashColor; g.shadowBlur = 30 * (pad.flash / 0.5); }
        else if (e.double > 0) { g.shadowColor = '#ffd84a'; g.shadowBlur = 16 + 8 * Math.sin(t / 120); }
        g.beginPath();
        g.moveTo(-hw, -hgt);
        g.lineTo(hw, -hgt);
        g.lineTo(hw * 0.82, -2);
        g.quadraticCurveTo(hw * 0.8, 0, hw * 0.76, 0);
        g.lineTo(-hw * 0.76, 0);
        g.quadraticCurveTo(-hw * 0.8, 0, -hw * 0.82, -2);
        g.closePath();
        g.fillStyle = e.freeze > 0 ? '#9fdcff' : p.color; g.fill();
        g.shadowBlur = 0;
        g.save(); g.clip();
        g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 3;
        for (let k = -hw; k < hw; k += 14) { g.beginPath(); g.moveTo(k, -hgt); g.lineTo(k + 10, 0); g.stroke(); }
        g.beginPath(); g.moveTo(-hw, -hgt / 2); g.lineTo(hw, -hgt / 2); g.stroke();
        g.restore();
        g.fillStyle = e.double > 0 ? '#ffd84a' : '#fff';
        g.beginPath();
        if (g.roundRect) g.roundRect(-hw - 4, -hgt - 6, hw * 2 + 8, 8, 4); else g.rect(-hw - 4, -hgt - 6, hw * 2 + 8, 8);
        g.fill();
        if (e.freeze > 0) {
          g.font = `26px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText('❄️', -hw * 0.5, -hgt / 2); g.fillText('❄️', hw * 0.5, -hgt / 2);
          g.strokeStyle = 'rgba(220,245,255,0.9)'; g.lineWidth = 3;
          g.strokeRect(-hw - 6, -hgt - 8, hw * 2 + 12, hgt + 10);
        }
        g.restore();
      });

      // particles
      for (const q of parts) {
        if (dt > 0) { q.life -= dt * 1.6; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95; }
        if (q.life <= 0) continue;
        g.globalAlpha = Math.min(1, q.life * 1.5);
        g.fillStyle = q.c;
        g.beginPath(); g.arc(q.x, q.y, q.r, 0, 6.283); g.fill();
      }
      g.globalAlpha = 1;
      parts = parts.filter(q => q.life > 0);

      // floating score texts
      g.font = `900 30px ${FONT}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      for (const f of floats) {
        if (dt > 0) f.life -= dt * 1.3;
        if (f.life <= 0) continue;
        const v = ctx.inward(f.p), k = (1 - f.life) * 50;
        g.save();
        g.globalAlpha = Math.min(1, f.life * 1.5);
        ctx.facing(g, f.p, f.x + v.x * k, f.y + v.y * k);
        g.lineWidth = 5; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,0.6)';
        g.strokeText(f.text, 0, 0);
        g.fillStyle = f.color; g.fillText(f.text, 0, 0);
        g.restore();
      }
      floats = floats.filter(f => f.life > 0);
    });

    const fit = () => zones.forEach(zz => { zz.hint.style.display = zz.z.w < 470 ? 'none' : ''; });
    fit();
    ctx.onResize(fit);
  },
});

</script>
<script>/* games/chain.js */
registerGame({
  id: 'chain',
  title: 'Цепная реакция',
  emoji: '💥',
  desc: 'Перегрузи клетки и захвати поле цепными взрывами',
  rules: 'Ходите по очереди: нажми на пустую или свою клетку, чтобы добавить шарик.\n' +
    'Когда шариков столько же, сколько у клетки соседей (угол 2, край 3, середина 4), она взрывается: шарики летят к соседям и перекрашивают их в твой цвет. Взрывы идут цепочкой!\n' +
    'Остался без шариков (после первого круга) — выбыл. Последний с шариками побеждает.\n' +
    '⭐ Звезда — захватил клетку со звездой: ещё один ход.\n' +
    '🧱 Стена — пустая клетка, соседи у неё меньше, взрываются быстрее.\n' +
    '🧨 Бомба — у каждого одна: кнопка в твоей зоне, затем нажми клетку — поле 3×3 очищается (это твой ход).\n' +
    '🎲 Каждые 3 круга событие: ↔️ сдвиг ряда, ⚪ клетка лидера пустеет, ⭐ новая звезда, 🆘 подарок отстающему, 🧱 новая стена.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const SHORT = N === 2 ? 6 : 7, LONG = N === 2 ? 8 : 9;
    const DEPTH = 84;
    const FLY = 0.2;
    const MAX_TURNS = 240;

    // logical grid: a in [0,SHORT), b in [0,LONG)
    const cells = [];
    for (let a = 0; a < SHORT; a++) { cells.push([]); for (let b = 0; b < LONG; b++) cells[a].push({ a, b, o: -1, n: 0, blocked: false, star: false, slide: null, pop: 0 }); }
    const all = () => cells.flat();
    const inside = (a, b) => a >= 0 && a < SHORT && b >= 0 && b < LONG;
    const nbrs = (c) => [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([da, db]) => [c.a + da, c.b + db]).filter(([a, b]) => inside(a, b) && !cells[a][b].blocked).map(([a, b]) => cells[a][b]);
    const cap = (c) => nbrs(c).length;

    let turn = U.randInt(0, N - 1);
    const alive = P.map(() => true);
    const moves = P.map(() => 0);
    const bombUsed = P.map(() => false);
    let armed = false;
    let state = 'input'; // input | anim | over
    let turns = 0, eventEvery = 3 * N, extra = false;
    let flyers = [], waveQueue = null;
    const parts = [], rings = [];
    let pulse = 0, shake = 0, flash = 0, flashColor = '#fff';
    let geo = null;

    /* ---------- board features ---------- */
    function validCaps() { return all().every(c => c.blocked || cap(c) >= 2); }
    function setupBoard() {
      for (let tries = 0; tries < 200; tries++) {
        all().forEach(c => { c.blocked = false; c.star = false; });
        const nb = U.randInt(2, N === 2 ? 3 : 4);
        const free = U.shuffle(all());
        for (let k = 0; k < nb; k++) free[k].blocked = true;
        if (!validCaps()) continue;
        const ns = N === 2 ? 3 : 4;
        U.shuffle(all().filter(c => !c.blocked)).slice(0, ns).forEach(c => { c.star = true; });
        return;
      }
      all().forEach(c => { c.blocked = false; });
    }
    setupBoard();

    /* ---------- styles & HUD ---------- */
    ctx.root.classList.add('g-chain');
    ctx.root.append(U.h('style', null, `
      .g-chain .bx{position:absolute;inset:8px 10px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;
        background:#1a1f35;border:3px solid transparent;font-weight:900;color:#f2f4ff;transition:background .25s, box-shadow .25s, border-color .25s, opacity .3s}
      .g-chain .bx .dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff8, var(--pc) 45%);flex:0 0 auto;box-shadow:0 0 10px var(--pc)}
      .g-chain .bx .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
      .g-chain .bx .tx{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9aa1c4}
      .g-chain .bx .tx b{color:var(--tc)}
      .g-chain .bx .sub{font-size:15px;color:#9aa1c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .g-chain .bx .bomb{width:62px;height:62px;border-radius:16px;background:#2a3157;font-size:32px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
        border:3px solid transparent;transition:transform .15s, opacity .2s, background .2s}
      .g-chain .bx .bomb.off{opacity:.25}
      .g-chain .bx .bomb.used{opacity:.12;filter:grayscale(1)}
      .g-chain .bx .bomb.armed{background:#ff4d6d;border-color:#fff;transform:scale(1.08);animation:gcPulse .6s infinite alternate}
      @keyframes gcPulse{from{box-shadow:0 0 0 0 rgba(255,77,109,.8)}to{box-shadow:0 0 22px 8px rgba(255,77,109,.8)}}
      .g-chain .bx.on{background:color-mix(in srgb, var(--pc) 28%, #1a1f35);border-color:var(--pc);box-shadow:0 0 30px 6px var(--pc)}
      .g-chain .bx.on .tx{color:#fff}
      .g-chain .bx.out{opacity:.35}
      .g-chain .bx.win{background:var(--pc);border-color:#fff}
      .g-chain .bx.win .tx,.g-chain .bx.win .sub{color:#111}
    `));
    const { cv, g } = ctx.canvas();
    const hud = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      const tx = U.h('div', { class: 'tx' }), sub = U.h('div', { class: 'sub' });
      const bomb = U.h('div', { class: 'bomb' }, '🧨');
      const bx = U.h('div', { class: 'bx' }, U.h('div', { class: 'dot' }), U.h('div', { class: 'mid' }, tx, sub), bomb);
      z.el.append(bx);
      ctx.tap(bomb, () => onBomb(p.i));
      return { bx, tx, sub, bomb };
    });
    function orbs(i) { let s = 0; for (const c of all()) if (c.o === i) s += c.n; return s; }
    function render(winner = -1) {
      hud.forEach((h, i) => {
        h.bx.style.setProperty('--tc', P[turn].color);
        const on = state !== 'over' && i === turn && alive[i];
        h.bx.classList.toggle('on', on);
        h.bx.classList.toggle('out', !alive[i]);
        h.bx.classList.toggle('win', winner === i);
        if (state === 'over') h.tx.textContent = winner === i ? 'Победа! 🏆' : winner >= 0 ? `Победил ${P[winner].name}` : 'Конец';
        else if (!alive[i]) h.tx.textContent = '☠ выбыл';
        else if (on) h.tx.textContent = armed ? '🧨 Выбери клетку!' : 'Твой ход!';
        else h.tx.replaceChildren('Ход: ', U.h('b', null, P[turn].name));
        h.sub.textContent = `шариков: ${orbs(i)}` + (bombUsed[i] ? '' : ' · 🧨 бомба есть');
        const can = on && state === 'input' && !bombUsed[i] && moves[i] > 0;
        h.bomb.classList.toggle('used', bombUsed[i]);
        h.bomb.classList.toggle('off', !bombUsed[i] && !can);
        h.bomb.classList.toggle('armed', on && armed);
      });
    }

    /* ---------- geometry ---------- */
    function layout() {
      const W = ctx.W, H = ctx.H;
      const r = N === 2 ? { x: 56, y: DEPTH, w: W - 112, h: H - 2 * DEPTH } : { x: DEPTH, y: 54, w: W - 2 * DEPTH, h: H - DEPTH - 54 };
      const portrait = r.h >= r.w;
      const cols = portrait ? SHORT : LONG, rows = portrait ? LONG : SHORT;
      const pad = 10;
      const cell = Math.floor(Math.min((r.w - 2 * pad) / cols, (r.h - 2 * pad) / rows));
      const bw = cell * cols, bh = cell * rows;
      geo = { r, portrait, cols, rows, cell, bx: Math.round(r.x + (r.w - bw) / 2), by: Math.round(r.y + (r.h - bh) / 2), bw, bh };
    }
    layout();
    ctx.onResize(layout);
    function cellXY(c) { // center in px
      const { portrait, cell, bx, by } = geo;
      const col = portrait ? c.a : c.b, row = portrait ? c.b : c.a;
      return { x: bx + (col + 0.5) * cell, y: by + (row + 0.5) * cell };
    }
    function cellAt(x, y) {
      const { portrait, cell, bx, by, cols, rows } = geo;
      const col = Math.floor((x - bx) / cell), row = Math.floor((y - by) / cell);
      if (col < 0 || row < 0 || col >= cols || row >= rows) return null;
      return portrait ? cells[col][row] : cells[row][col];
    }

    /* ---------- juice ---------- */
    function burst(x, y, color, n = 14, sp = 200) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * 6.283, s = U.rand(0.25, 1) * sp;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.3, 0.7), t: 0, color, s: U.rand(2, 4.5) });
      }
    }
    function ring(x, y, r, color, grow = 2.2, life = 0.45) { rings.push({ x, y, r, max: r * grow, color, life, t: 0 }); }
    // queued toasts: one message at a time; a waiting message shortens the current one
    const tq = []; let tShown = null;
    function say(text, o = {}) { tq.push({ text, o }); }
    ctx.loop(() => {
      if (tShown && (ctx.time - tShown.t0 >= tShown.ms || (tq.length && ctx.time - tShown.t0 >= 0.9))) { tShown.els.forEach(e => e.remove()); tShown = null; }
      if (!tShown && tq.length) {
        const it = tq.shift();
        const o = Object.assign({ offset: N === 3 ? Math.min(ctx.W, ctx.H) * 0.34 : 80 }, it.o);
        tShown = { t0: ctx.time, ms: (o.ms ?? 1600) / 1000, els: ctx.toast(it.text, Object.assign({}, o, { ms: 600000 })) };
      }
    });
    function sayP(i, text, o = {}) { return say(text, Object.assign({ color: P[i].color, fg: '#111' }, o)); }

    /* ---------- moves ---------- */
    function onBomb(i) {
      if (state !== 'input' || i !== turn || bombUsed[i] || !alive[i]) return;
      if (moves[i] === 0) { sayP(i, '🧨 Бомба доступна со второго хода', { ms: 1200 }); return; }
      armed = !armed;
      if (armed) sayP(i, '🧨 Выбери клетку: взрыв 3×3', { ms: 1500 });
      render();
    }
    ctx.pointer(cv, {
      down(id, x, y) {
        if (ctx.paused || state !== 'input' || !geo) return;
        const c = cellAt(x, y);
        if (!c) return;
        const p = cellXY(c);
        if (armed) { useBomb(c); return; }
        if (c.blocked || (c.o !== -1 && c.o !== turn)) {
          c.pop = -0.3; ring(p.x, p.y, geo.cell * 0.3, '#ff4d6d', 1.6, 0.3);
          return;
        }
        play(c);
      },
    });
    function play(c) {
      const me = turn;
      moves[me]++;
      extra = false;
      c.n++; c.o = me; c.pop = 0.25;
      const p = cellXY(c);
      ring(p.x, p.y, geo.cell * 0.25, P[me].color, 2, 0.35);
      if (c.star) takeStar(c, me);
      state = 'anim';
      runWaves(me);
    }
    function takeStar(c, i) {
      c.star = false;
      if (i === turn) extra = true;
      const p = cellXY(c);
      burst(p.x, p.y, '#ffd84d', 30, 280); ring(p.x, p.y, geo.cell * 0.3, '#ffd84d', 3, 0.6);
    }
    function useBomb(c) {
      const me = turn;
      armed = false; bombUsed[me] = true; moves[me]++;
      const p = cellXY(c);
      for (let da = -1; da <= 1; da++) for (let db = -1; db <= 1; db++) {
        if (!inside(c.a + da, c.b + db)) continue;
        const d = cells[c.a + da][c.b + db];
        if (d.blocked) continue;
        const q = cellXY(d);
        if (d.n) burst(q.x, q.y, d.o >= 0 ? P[d.o].color : '#fff', 10 + d.n * 4, 260);
        d.n = 0; d.o = -1; d.pop = 0.3;
      }
      burst(p.x, p.y, '#ffb347', 60, 520); burst(p.x, p.y, '#fff3b0', 30, 320);
      ring(p.x, p.y, geo.cell * 0.5, '#ffb347', 4, 0.6); ring(p.x, p.y, geo.cell * 0.3, '#fff', 4.5, 0.5);
      shake = 0.5; flash = 0.35; flashColor = '#ffb347';
      sayP(me, '🧨 БУМ! Поле 3×3 очищено', { ms: 1500 });
      state = 'anim';
      extra = false;
      ctx.after(500, () => finishMove(me));
    }

    // explode all critical cells in waves, animating orbs flying to neighbours
    function runWaves(me) {
      let guard = 0;
      const next = () => {
        if (!ctx.alive) return;
        if (++guard > 400) { finishMove(me); return; }
        const crit = all().filter(c => !c.blocked && c.n >= cap(c));
        if (!crit.length || (allMoved() && onlyOneLeft())) { finishMove(me); return; }
        flyers = [];
        for (const c of crit) {
          const k = cap(c), o = c.o;
          c.n -= k; if (c.n <= 0) { c.n = 0; c.o = -1; }
          const p = cellXY(c);
          burst(p.x, p.y, P[o].color, 12, 240); ring(p.x, p.y, geo.cell * 0.3, P[o].color, 2.2, 0.35);
          for (const d of nbrs(c)) flyers.push({ from: c, to: d, o, t: 0 });
        }
        shake = Math.max(shake, Math.min(0.35, 0.08 + crit.length * 0.03));
        waveQueue = () => {
          for (const f of flyers) {
            const d = f.to;
            d.n++; d.o = f.o; d.pop = 0.2;
            if (d.star) takeStar(d, f.o);
          }
          flyers = [];
          next();
        };
      };
      next();
    }
    function allMoved() { return P.every(p => !alive[p.i] || moves[p.i] > 0); }
    function onlyOneLeft() {
      const withOrbs = P.filter(p => alive[p.i] && orbs(p.i) > 0);
      return withOrbs.length <= 1;
    }

    function finishMove(me) {
      waveQueue = null; flyers = [];
      turns++;
      // eliminations (only after everyone moved at least once)
      if (allMoved()) {
        for (const p of P) if (alive[p.i] && orbs(p.i) === 0) {
          alive[p.i] = false;
          sayP(p.i, `☠ ${p.name} выбыл`, { ms: 1800 });
          flash = 0.3; flashColor = p.color;
        }
      }
      const left = P.filter(p => alive[p.i]);
      if (left.length <= 1 || turns >= MAX_TURNS) {
        let w;
        if (left.length === 1) w = left[0].i;
        else { const best = Math.max(...P.map(p => orbs(p.i))); const ws = P.filter(p => orbs(p.i) === best); w = ws.length === 1 ? ws[0].i : -1; }
        state = 'over';
        if (w >= 0) {
          for (const c of all()) if (c.o === w) { const q = cellXY(c); burst(q.x, q.y, P[w].color, 8, 260); }
          sayP(w, `🏆 ${P[w].name} захватил поле!`, { ms: 2400 });
        }
        render(w);
        ctx.after(2400, () => ctx.end(w >= 0 ? { winner: w, scores: P.map(p => orbs(p.i)) } : { scores: P.map(p => orbs(p.i)) }));
        return;
      }
      if (extra && alive[me]) {
        sayP(me, `⭐ ${P[me].name}: звезда — ещё ход!`, { ms: 1500 });
        extra = false;
      } else {
        do { turn = (turn + 1) % N; } while (!alive[turn]);
      }
      state = 'input';
      if (turns % eventEvery === 0 && turns > 0) randomEvent();
      render();
    }

    /* ---------- random events ---------- */
    function randomEvent() {
      const opts = ['shift', 'neutral', 'star', 'help', 'wall'];
      for (const kind of U.shuffle(opts)) if (doEvent(kind)) return;
    }
    function doEvent(kind) {
      if (kind === 'shift') {
        // shift one display row by one cell (cyclic, orbs only)
        const rows = [];
        for (let b = 0; b < LONG; b++) rows.push({ line: cells.map(col => col[b]) });
        for (let a = 0; a < SHORT; a++) rows.push({ line: cells[a].slice() });
        const cand = rows.filter(r => r.line.some(c => c.n > 0));
        if (!cand.length) return false;
        const line = U.pick(cand).line.filter(c => !c.blocked);
        const dir = Math.random() < 0.5 ? 1 : -1;
        const data = line.map(c => ({ o: c.o, n: c.n }));
        line.forEach((c, k) => {
          const src = data[(k - dir + line.length) % line.length];
          const from = line[(k - dir + line.length) % line.length];
          c.o = src.o; c.n = Math.min(src.n, cap(c) - 1); if (!c.n) c.o = -1;
          const p0 = cellXY(from), p1 = cellXY(c);
          c.slide = { dx: p0.x - p1.x, dy: p0.y - p1.y, t: 0.4 };
          if (Math.abs(c.slide.dx) + Math.abs(c.slide.dy) > geo.cell * 1.5) c.slide = { dx: 0, dy: 0, t: 0.4, wrap: true };
        });
        say('↔️ Сдвиг! Ряд поехал', { color: '#4de3ff', fg: '#111', ms: 1800 });
        flash = 0.2; flashColor = '#4de3ff';
        return true;
      }
      if (kind === 'neutral') {
        const lead = P.filter(p => alive[p.i]).sort((x, y) => orbs(y.i) - orbs(x.i))[0];
        const cand = all().filter(c => c.o === lead.i && c.n > 0);
        if (cand.length < 2) return false;
        const c = cand.sort((x, y) => y.n - x.n)[0];
        const p = cellXY(c);
        burst(p.x, p.y, '#ffffff', 24, 220); ring(p.x, p.y, geo.cell * 0.3, '#ffffff', 2.6, 0.6);
        c.o = -1; c.n = 0; c.pop = 0.3;
        say(`⚪ Клетка лидера (${lead.name}) опустела`, { color: '#fff', fg: '#111', ms: 2000 });
        return true;
      }
      if (kind === 'star') {
        const cand = all().filter(c => !c.blocked && !c.star && c.n === 0);
        if (!cand.length) return false;
        const c = U.pick(cand); c.star = true;
        const p = cellXY(c);
        ring(p.x, p.y, geo.cell * 0.3, '#ffd84d', 3, 0.7); burst(p.x, p.y, '#ffd84d', 20, 200);
        say('⭐ Новая звезда: захвати — ещё ход', { color: '#ffd84d', fg: '#111', ms: 2000 });
        return true;
      }
      if (kind === 'help') {
        const al = P.filter(p => alive[p.i]).map(p => ({ i: p.i, o: orbs(p.i) })).sort((x, y) => x.o - y.o);
        if (al.length < 2 || al[0].o === al[al.length - 1].o) return false;
        const cand = all().filter(c => !c.blocked && c.n === 0 && cap(c) >= 2);
        if (!cand.length) return false;
        const i = al[0].i;
        const picks = U.shuffle(cand).slice(0, 2);
        for (const c of picks) { c.o = i; c.n = 1; c.pop = 0.3; const p = cellXY(c); burst(p.x, p.y, P[i].color, 20, 200); ring(p.x, p.y, geo.cell * 0.3, P[i].color, 2.6); }
        sayP(i, `🆘 Подмога: ${P[i].name} +2 шарика`, { ms: 2000 });
        return true;
      }
      if (kind === 'wall') {
        const cand = U.shuffle(all().filter(c => !c.blocked && c.n === 0 && !c.star));
        for (const c of cand) {
          c.blocked = true;
          if (validCaps()) {
            for (const d of all()) if (!d.blocked && d.n >= cap(d)) d.n = cap(d) - 1;
            const p = cellXY(c);
            burst(p.x, p.y, '#c98b5a', 24, 220); c.pop = 0.4;
            say('🧱 Выросла стена!', { color: '#c98b5a', fg: '#111', ms: 1800 });
            return true;
          }
          c.blocked = false;
        }
        return false;
      }
      return false;
    }

    /* ---------- drawing ---------- */
    function orbPos(n, k, rad, spin) {
      if (n === 1) return { x: 0, y: 0 };
      const a = spin + k * 6.283 / n;
      const d = rad * (n === 2 ? 0.5 : 0.62);
      return { x: Math.cos(a) * d, y: Math.sin(a) * d };
    }
    function starPath(x, y, r, rot = 0) {
      g.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = rot - Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
        k ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      g.closePath();
    }
    function drawOrb(x, y, r, color) {
      const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, color); gr.addColorStop(1, U.alpha(color, 0.75));
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    ctx.loop((dt) => {
      pulse += dt;
      if (!geo) return;
      // advance flyers
      if (flyers.length && dt > 0) {
        let done = true;
        for (const f of flyers) { f.t += dt / FLY; if (f.t < 1) done = false; }
        if (done && waveQueue) { const q = waveQueue; waveQueue = null; q(); }
      } else if (!flyers.length && waveQueue && dt > 0) { const q = waveQueue; waveQueue = null; q(); }

      const { cell, bx, by, bw, bh } = geo;
      g.save();
      g.fillStyle = '#0f1220'; g.fillRect(0, 0, ctx.W, ctx.H);
      if (shake > 0) { g.translate(U.rand(-7, 7) * shake, U.rand(-7, 7) * shake); shake -= dt; }
      const tc = state === 'over' ? '#ffffff' : P[turn].color;
      // board glow + background
      g.shadowColor = tc; g.shadowBlur = 30 + 10 * Math.sin(pulse * 3);
      g.fillStyle = '#141933';
      g.beginPath(); g.roundRect(bx - 6, by - 6, bw + 12, bh + 12, 14); g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = U.alpha(tc, 0.9); g.lineWidth = 3; g.stroke();
      // cells
      for (const c of all()) {
        const p = cellXY(c);
        const x0 = p.x - cell / 2, y0 = p.y - cell / 2;
        if (c.blocked) {
          g.fillStyle = '#3a2a24'; g.fillRect(x0 + 3, y0 + 3, cell - 6, cell - 6);
          g.strokeStyle = '#6b4a3a'; g.lineWidth = 2;
          const bh2 = (cell - 6) / 4;
          for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x0 + 3, y0 + 3 + k * bh2); g.lineTo(x0 + cell - 3, y0 + 3 + k * bh2); g.stroke(); }
          for (let k = 0; k < 4; k++) {
            const off = k % 2 ? cell * 0.25 : cell * 0.5;
            g.beginPath(); g.moveTo(x0 + off, y0 + 3 + k * bh2); g.lineTo(x0 + off, y0 + 3 + (k + 1) * bh2); g.stroke();
          }
          continue;
        }
        if (c.o >= 0) { g.fillStyle = U.alpha(P[c.o].color, 0.1); g.fillRect(x0 + 2, y0 + 2, cell - 4, cell - 4); }
        if (c.star) {
          g.globalAlpha = c.n ? 0.4 : 0.75 + 0.25 * Math.sin(pulse * 4 + c.a + c.b);
          g.shadowColor = '#ffd84d'; g.shadowBlur = c.n ? 0 : 16;
          starPath(p.x, p.y, cell * 0.24, pulse * 0.5 + c.a);
          g.fillStyle = '#ffd84d'; g.fill();
          g.shadowBlur = 0; g.globalAlpha = 1;
        }
      }
      // grid lines
      g.strokeStyle = U.alpha(tc, 0.35); g.lineWidth = 1.5;
      g.beginPath();
      for (let k = 1; k < geo.cols; k++) { g.moveTo(bx + k * cell, by); g.lineTo(bx + k * cell, by + bh); }
      for (let k = 1; k < geo.rows; k++) { g.moveTo(bx, by + k * cell); g.lineTo(bx + bw, by + k * cell); }
      g.stroke();
      // orbs
      const rad = cell * 0.17;
      for (const c of all()) {
        if (c.blocked || !c.n || c.o < 0) continue;
        let { x, y } = cellXY(c);
        if (c.slide) {
          if (dt > 0) c.slide.t -= dt;
          const f = Math.max(0, c.slide.t / 0.4);
          if (c.slide.wrap) { g.globalAlpha = 1 - f; } else { x += c.slide.dx * f; y += c.slide.dy * f; }
          if (c.slide.t <= 0) c.slide = null;
        }
        const k = cap(c), crit = c.n >= k - 1;
        if (c.pop) { if (dt > 0) c.pop = c.pop > 0 ? Math.max(0, c.pop - dt) : Math.min(0, c.pop + dt); }
        const sc = 1 + Math.abs(c.pop) * 1.2;
        const jit = crit ? 2.2 : 0;
        const spin = pulse * (crit ? 4 : 1.2) + c.a * 1.3 + c.b * 0.7;
        if (crit) {
          g.fillStyle = U.alpha(P[c.o].color, 0.16 + 0.1 * Math.sin(pulse * 10));
          g.beginPath(); g.arc(x, y, cell * 0.42, 0, 6.283); g.fill();
        }
        g.shadowColor = P[c.o].color; g.shadowBlur = crit ? 18 : 8;
        for (let m = 0; m < c.n; m++) {
          const q = orbPos(Math.min(c.n, 4), m, cell * 0.36, spin);
