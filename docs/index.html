<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Игры">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Игры на компанию</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1f2540; --card2:#283057;
  --fg:#f2f4ff; --muted:#9aa1c4; --line:#343c66;
  --p0:#ff5a5f; --p1:#3b9cff; --p2:#ffc93c;
  --ok:#3ddc97; --bad:#ff4d6d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ---------- menu ---------- */
.menu{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.menu-inner{max-width:1100px;margin:0 auto}
.menu h1{font-size:30px;margin:4px 0 4px;letter-spacing:-.5px}
.menu .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.top-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.seg{display:inline-flex;background:var(--card);border-radius:16px;padding:5px;gap:4px}
.seg button{padding:12px 22px;border-radius:12px;font-size:18px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.tally{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;font-weight:700;font-size:18px}
.tally .dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.tally .reset{font-size:13px;color:var(--muted);font-weight:600;padding:4px 8px;border-radius:8px;background:var(--card2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .08s}
.card:active{transform:scale(.97);background:var(--card2)}
.card .em{font-size:36px;line-height:1}
.card .t{font-size:19px;font-weight:800}
.card .d{font-size:14px;color:var(--muted);line-height:1.3}
.card.off{opacity:.35}
.foot{color:var(--muted);font-size:13px;margin-top:22px;text-align:center}

/* ---------- rules ---------- */
.rules{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.rules-box{max-width:560px;width:100%;background:var(--card);border-radius:24px;padding:24px;text-align:center}
.rules-box .em{font-size:64px}
.rules-box h2{margin:6px 0 10px;font-size:30px}
.rules-box p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 0 20px;text-align:left;white-space:pre-line}
.btn{display:inline-block;padding:16px 28px;border-radius:16px;font-weight:800;font-size:20px;background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- game ---------- */
.game-root{position:absolute;inset:0;touch-action:none;overflow:hidden;background:var(--bg)}
.game-root canvas{position:absolute;left:0;top:0;touch-action:none}
.zone{position:absolute;touch-action:none}
.zone-inner{position:absolute;left:50%;top:50%;touch-action:none}
.exit{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);
  font-size:20px;line-height:40px;text-align:center;z-index:50;color:#fff}
.overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,12,24,.72);touch-action:none}
.dialog{background:var(--card);border-radius:24px;padding:22px;text-align:center;min-width:260px;max-width:90vw}
.dialog h3{margin:0 0 16px;font-size:24px}
.countdown{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:160px;font-weight:900;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.toast-layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.toast{position:absolute;left:50%;top:50%;padding:10px 18px;border-radius:14px;background:rgba(0,0,0,.65);color:#fff;
  font-weight:800;font-size:24px;white-space:nowrap}
.result-seat{position:absolute;left:50%;top:50%;font-weight:900;font-size:34px;white-space:nowrap;text-align:center}
.result-seat small{display:block;font-size:16px;font-weight:700;opacity:.8}

</style>
</head>
<body>
<div id="app"></div>
<script>/* core.js */
'use strict';
/* ============================================================
   Core: menu, seats, game context helpers. See API.md.
   ============================================================ */

const COLORS = ['#ff5a5f', '#3b9cff', '#ffc93c'];
const NAMES = ['Красный', 'Синий', 'Жёлтый'];
const SIDE_ROT = { bottom: 0, top: 180, left: 90, right: -90 };

const App = {
  n: 2,
  wins: [0, 0, 0],
  games: [],
  el: null,
  ctx: null,
};

function registerGame(def) {
  if (!def.minPlayers) def.minPlayers = 2;
  if (!def.maxPlayers) def.maxPlayers = 3;
  App.games.push(def);
}

/* ---------- small utils (global, usable by games) ---------- */
const U = {
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  },
  // hex color -> rgba string with alpha
  alpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  },
};

function seatSides(n) {
  return n === 2 ? ['bottom', 'top'] : ['bottom', 'left', 'right'];
}

/* ---------- wake lock (keep screen on during games) ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) { /* not supported */ }
}

/* ============================================================
   Game context
   ============================================================ */
function makeCtx(game, n) {
  const root = U.h('div', { class: 'game-root' });
  App.el.replaceChildren(root);

  const timers = new Map();
  const cleanups = [];
  const resizeFns = [];
  const zones = [];
  const canvases = [];
  let alive = true;

  const ctx = {
    n,
    root,
    game,
    W: root.clientWidth || innerWidth,
    H: root.clientHeight || innerHeight,
    paused: false,
    players: seatSides(n).map((side, i) => ({
      i, side, rot: SIDE_ROT[side], color: COLORS[i], name: NAMES[i],
    })),
    get alive() { return alive; },
  };
  ctx.colors = ctx.players.map(p => p.color);

  /* ----- timing: one rAF clock; game time stops while paused ----- */
  // ctx.time = seconds of un-paused game time. after/every use game time.
  ctx.time = 0;
  let timerSeq = 0;
  const loops = [];
  ctx.after = (ms, fn) => {
    const id = ++timerSeq;
    timers.set(id, { at: ctx.time + ms / 1000, fn });
    return id;
  };
  ctx.every = (ms, fn) => {
    const id = ++timerSeq;
    timers.set(id, { at: ctx.time + ms / 1000, fn, period: ms / 1000 });
    return id;
  };
  ctx.cancel = (id) => { timers.delete(id); };
  // fn(dt, t): dt in seconds (0 while paused, so you can still draw), t = performance.now()
  ctx.loop = (fn) => { loops.push(fn); return fn; };
  let last = performance.now();
  const frame = (t) => {
    if (!alive) return;
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    if (!ctx.paused) {
      ctx.time += dt;
      for (const [id, tm] of [...timers]) {
        if (!alive) return;
        if (timers.get(id) !== tm || tm.at > ctx.time) continue;
        if (tm.period) tm.at += tm.period; else timers.delete(id);
        try { tm.fn(); } catch (e) { console.error(e); }
      }
    }
    for (const fn of loops) {
      if (!alive) return;
      try { fn(ctx.paused ? 0 : dt, t); } catch (e) { console.error(e); }
    }
    rafId = requestAnimationFrame(frame);
  };
  let rafId = requestAnimationFrame(frame);
  ctx.onCleanup = (fn) => cleanups.push(fn);
  ctx.onResize = (fn) => resizeFns.push(fn);

  /* ----- geometry ----- */
  // Which player "owns" a screen point: the one whose edge is closest.
  ctx.seatAt = (x, y) => {
    let best = 0, bd = Infinity;
    for (const p of ctx.players) {
      const d = p.side === 'bottom' ? ctx.H - y : p.side === 'top' ? y : p.side === 'left' ? x : ctx.W - x;
      if (d < bd) { bd = d; best = p.i; }
    }
    return best;
  };
  // Rotate a vector from player-local frame (x right, y down, as the player sees it) into screen frame.
  ctx.toScreen = (i, x, y) => {
    const a = ctx.players[i].rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return { x: x * c - y * s, y: x * s + y * c };
  };
  // Rotate a vector from screen frame into player-local frame.
  ctx.toLocal = (i, x, y) => {
    const a = -ctx.players[i].rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return { x: x * c - y * s, y: x * s + y * c };
  };
  // Canvas: translate to (x,y) and rotate so drawing "upright" faces player i.
  ctx.facing = (g, i, x, y) => {
    g.translate(x, y);
    g.rotate(ctx.players[i].rot * Math.PI / 180);
  };
  // Unit vector pointing from player i's edge towards the screen center.
  ctx.inward = (i) => ({ bottom: { x: 0, y: -1 }, top: { x: 0, y: 1 }, left: { x: 1, y: 0 }, right: { x: -1, y: 0 } })[ctx.players[i].side];

  /* ----- zones: DOM strip along a player's edge, rotated to face them ----- */
  ctx.zone = (i, opts = {}) => {
    const z = {
      i, depth: opts.depth ?? 0.25, // fraction of min(W,H) if <=1, else px
      outer: U.h('div', { class: 'zone' }),
      el: U.h('div', { class: 'zone-inner' }),
      w: 0, h: 0,
    };
    z.outer.append(z.el);
    if (opts.className) z.el.className += ' ' + opts.className;
    z.el.style.setProperty('--pc', ctx.players[i].color);
    (opts.parent || root).append(z.outer);
    zones.push(z);
    layoutZone(z);
    return z;
  };
  function zoneRect(z) {
    const W = ctx.W, H = ctx.H, p = ctx.players[z.i];
    const d = z.depth <= 1 ? Math.round(z.depth * Math.min(W, H)) : z.depth;
    const sides = ctx.players.map(q => q.side);
    const inset = (s) => sides.includes(s) ? d : 0;
    switch (p.side) {
      case 'bottom': return { x: inset('left'), y: H - d, w: W - inset('left') - inset('right'), h: d, len: W - inset('left') - inset('right'), d };
      case 'top': return { x: inset('left'), y: 0, w: W - inset('left') - inset('right'), h: d, len: W - inset('left') - inset('right'), d };
      case 'left': return { x: 0, y: 0, w: d, h: H, len: H, d };
      case 'right': return { x: W - d, y: 0, w: d, h: H, len: H, d };
    }
  }
  function layoutZone(z) {
    const r = zoneRect(z);
    Object.assign(z.outer.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    z.w = r.len; z.h = r.d; z.rect = r;
    Object.assign(z.el.style, {
      width: r.len + 'px', height: r.d + 'px',
      transform: `translate(-50%,-50%) rotate(${ctx.players[z.i].rot}deg)`,
    });
  }

  /* ----- canvas ----- */
  ctx.canvas = (opts = {}) => {
    const cv = U.h('canvas');
    if (opts.z != null) cv.style.zIndex = opts.z;
    root.prepend(cv);
    const c = { cv, g: cv.getContext('2d'), dpr: 1 };
    canvases.push(c);
    sizeCanvas(c);
    return c;
  };
  function sizeCanvas(c) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.dpr = dpr;
    c.cv.width = Math.round(ctx.W * dpr);
    c.cv.height = Math.round(ctx.H * dpr);
    c.cv.style.width = ctx.W + 'px';
    c.cv.style.height = ctx.H + 'px';
    c.g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ----- input ----- */
  // handlers: {down(id,x,y,e), move(id,x,y,e), up(id,x,y,e)}; x,y in screen px relative to root.
  ctx.pointer = (el, handlers) => {
    const rect = () => root.getBoundingClientRect();
    const pos = (e) => { const r = rect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const down = (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (handlers.down) handlers.down(e.pointerId, ...pos(e), e);
    };
    const move = (e) => { if (handlers.move) handlers.move(e.pointerId, ...pos(e), e); };
    const up = (e) => { if (handlers.up) handlers.up(e.pointerId, ...pos(e), e); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  };
  // Fires fn immediately on touch start (no click delay). Returns the element.
  ctx.tap = (el, fn) => {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (alive && !ctx.paused) fn(e); });
    return el;
  };

  /* ----- messages ----- */
  const toastLayer = U.h('div', { class: 'toast-layer' });
  root.append(toastLayer);
  // Shows text once per player, near the center, each copy rotated to face its player.
  ctx.toast = (text, opts = {}) => {
    const ms = opts.ms ?? 1200;
    // default: each copy sits ~28% of the short side from center, toward its player, so copies never cross
    const off = opts.offset ?? (ctx.n === 2 ? 70 : Math.min(ctx.W, ctx.H) * 0.28);
    const els = ctx.players.map(p => {
      const v = ctx.inward(p.i);
      const t = U.h('div', { class: 'toast' }, text);
      if (opts.color) t.style.background = opts.color;
      if (opts.fg) t.style.color = opts.fg;
      if (opts.size) t.style.fontSize = opts.size + 'px';
      const cx = -v.x * off, cy = -v.y * off;
      t.style.transform = `translate(-50%,-50%) translate(${cx}px,${cy}px) rotate(${p.rot}deg)`;
      toastLayer.append(t);
      return t;
    });
    ctx.after(ms, () => els.forEach(e => e.remove()));
    return els;
  };

  /* ----- end of game ----- */
  ctx.end = (result = {}) => {
    if (!alive) return;
    let winners = result.winners ?? (result.winner != null ? [result.winner] : []);
    winners.forEach(w => App.wins[w]++);
    destroy();
    showResult(game, n, winners, result);
  };

  /* ----- resize ----- */
  const onWinResize = () => {
    ctx.W = root.clientWidth; ctx.H = root.clientHeight;
    canvases.forEach(sizeCanvas);
    zones.forEach(layoutZone);
    resizeFns.forEach(f => f(ctx.W, ctx.H));
  };
  window.addEventListener('resize', onWinResize);

  function destroy() {
    if (!alive) return;
    alive = false;
    timers.clear();
    cancelAnimationFrame(rafId);
    window.removeEventListener('resize', onWinResize);
    cleanups.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  ctx._destroy = destroy;

  /* ----- exit button ----- */
  const exit = U.h('button', { class: 'exit', 'aria-label': 'Выход' }, '✕');
  exit.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    ctx.paused = true;
    const ov = U.h('div', { class: 'overlay' },
      U.h('div', { class: 'dialog' },
        U.h('h3', null, 'Выйти из игры?'),
        U.h('div', { class: 'btn-row' },
          U.h('button', { class: 'btn ghost', onclick: () => { ov.remove(); ctx.paused = false; } }, 'Играть дальше'),
          U.h('button', { class: 'btn', onclick: () => { destroy(); showMenu(); } }, 'В меню'))));
    root.append(ov);
  });
  // Put the exit button on an edge no player sits at: 2p → middle of the left edge, 3p → middle of the top edge.
  if (n === 2) Object.assign(exit.style, { left: '6px', top: '50%', transform: 'translateY(-50%)' });
  else Object.assign(exit.style, { left: '50%', top: '6px', transform: 'translateX(-50%)' });
  root.append(exit);

  return ctx;
}

/* ============================================================
   Screens
   ============================================================ */
function tallyEl() {
  const el = U.h('div', { class: 'tally' });
  for (let i = 0; i < App.n; i++) {
    el.append(U.h('span', null, U.h('span', { class: 'dot', style: { background: COLORS[i] } }), String(App.wins[i])));
  }
  const reset = U.h('button', { class: 'reset' }, 'сброс');
  reset.addEventListener('click', () => { App.wins = [0, 0, 0]; save(); showMenu(); });
  el.append(reset);
  return el;
}

function save() {
  try { localStorage.setItem('pg.state', JSON.stringify({ n: App.n, wins: App.wins })); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('pg.state') || 'null');
    if (s) { App.n = s.n === 3 ? 3 : 2; if (Array.isArray(s.wins)) App.wins = s.wins.concat([0, 0, 0]).slice(0, 3); }
  } catch (e) {}
}

function showMenu() {
  keepAwake(false);
  App.ctx = null;
  const grid = U.h('div', { class: 'grid' });
  for (const g of App.games) {
    const ok = App.n >= g.minPlayers && App.n <= g.maxPlayers;
    const card = U.h('button', { class: 'card' + (ok ? '' : ' off') },
      U.h('div', { class: 'em' }, g.emoji),
      U.h('div', { class: 't' }, g.title),
      U.h('div', { class: 'd' }, ok ? g.desc : `Только для ${g.minPlayers === g.maxPlayers ? g.minPlayers : g.minPlayers + '–' + g.maxPlayers} игроков`));
    if (ok) card.addEventListener('click', () => showRules(g));
    grid.append(card);
  }
  const seg = U.h('div', { class: 'seg' });
  [2, 3].forEach(k => {
    const b = U.h('button', { class: App.n === k ? 'on' : '' }, `${k} игрока`);
    b.addEventListener('click', () => { App.n = k; save(); showMenu(); });
    seg.append(b);
  });
  const menu = U.h('div', { class: 'menu' },
    U.h('div', { class: 'menu-inner' },
      U.h('h1', null, 'Игры на одном iPad'),
      U.h('p', { class: 'sub' }, 'Положите iPad на стол, каждый садится к своему краю. Работает без интернета.'),
      U.h('div', { class: 'top-row' }, seg, tallyEl()),
      grid,
      U.h('div', { class: 'foot' }, `${App.games.length} игр · счёт побед сохраняется`)));
  App.el.replaceChildren(menu);
}

function showRules(game) {
  const box = U.h('div', { class: 'rules-box' },
    U.h('div', { class: 'em' }, game.emoji),
    U.h('h2', null, game.title),
    U.h('p', null, game.rules || game.desc),
    U.h('div', { class: 'btn-row' },
      U.h('button', { class: 'btn ghost', onclick: showMenu }, 'Назад'),
      U.h('button', { class: 'btn', onclick: () => startGame(game) }, 'Старт')));
  App.el.replaceChildren(U.h('div', { class: 'rules' }, box));
}

function startGame(game, opts = {}) {
  keepAwake(true);
  const ctx = makeCtx(game, App.n);
  App.ctx = ctx;
  let ret;
  try { ret = game.start(ctx); } catch (e) { console.error(e); }
  if (typeof ret === 'function') ctx.onCleanup(ret);
  if (opts.noCountdown) return ctx;
  // Countdown: pause the game for 3 seconds.
  ctx.paused = true;
  const cd = U.h('div', { class: 'countdown' }, '3');
  ctx.root.append(cd);
  let k = 3;
  const tick = () => {
    k--;
    if (k > 0) { cd.textContent = k; setTimeout(tick, 700); }
    else { cd.remove(); if (ctx.alive) { ctx.paused = false; if (ctx.onStart) ctx.onStart(); } }
  };
  setTimeout(tick, 700);
  return ctx;
}

function showResult(game, n, winners, result) {
  save();
  const root = U.h('div', { class: 'game-root' });
  const players = seatSides(n).map((side, i) => ({ i, side, rot: SIDE_ROT[side] }));
  // per-seat label facing each player
  const W = App.el.clientWidth, H = App.el.clientHeight;
  for (const p of players) {
    const win = winners.includes(p.i);
    const txt = winners.length === 0 ? 'Ничья' : win ? 'Победа! 🏆' : 'Не в этот раз';
    const sc = result.scores ? `очки: ${result.scores[p.i]}` : '';
    const el = U.h('div', { class: 'result-seat', style: { color: COLORS[p.i] } }, txt, sc ? U.h('small', null, sc) : null);
    const off = Math.min(W, H) * 0.36;
    const v = { bottom: [0, 1], top: [0, -1], left: [-1, 0], right: [1, 0] }[p.side];
    el.style.transform = `translate(-50%,-50%) translate(${v[0] * off}px,${v[1] * off}px) rotate(${p.rot}deg)`;
    root.append(el);
  }
  const center = U.h('div', { class: 'dialog', style: { position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)' } },
    U.h('h3', null, winners.length ? winners.map(w => NAMES[w]).join(' и ') + (winners.length > 1 ? ' победили' : ' победил') : 'Ничья'),
    result.msg ? U.h('p', { style: { color: 'var(--muted)', margin: '0 0 14px' } }, result.msg) : null,
    U.h('div', { style: { marginBottom: '14px' } }, tallyEl()),
    U.h('div', { class: 'btn-row' },
      U.h('button', { class: 'btn ghost', onclick: showMenu }, 'Меню'),
      U.h('button', { class: 'btn', onclick: () => startGame(game) }, 'Ещё раз')));
  center.querySelector('.reset')?.remove();
  root.append(center);
  App.el.replaceChildren(root);
}

/* debug hook for automated tests */
window.__start = (id, n) => {
  App.n = n || App.n;
  const g = App.games.find(x => x.id === id);
  if (App.ctx) App.ctx._destroy();
  return startGame(g, { noCountdown: true });
};

<script>/* games/airhockey.js */
registerGame({
  id: 'airhockey',
  title: 'Аэрохоккей',
  emoji: '🏒',
  desc: 'Отбивай шайбу, лови бонусы, защищай ворота',
  rules: 'Каждый водит пальцем свою биту (круг своего цвета) на своей части поля.\n' +
    'Ворота — в середине твоего края. Забей шайбу в чужие ворота и не пропусти в свои.\n' +
    '2 игрока: кто первым забьёт 7 голов, тот победил.\n' +
    '3 игрока: у каждого 5 жизней, пропущенный гол — минус жизнь. Последний оставшийся побеждает.\n' +
    'Бонусы на поле достаются тому, кто последним коснулся шайбы:\n' +
    '🥅 узкие свои ворота · 🕳️ широкие ворота соперникам · ⚫ вторая шайба\n' +
    '🔨 большая бита · 🧱 стенка перед воротами · ⚡ мощный удар (следующий удар ×2)\n' +
    '🧊 лёд (без трения) · 🌪️ вихрь в центре · 👻 шайба-призрак\n' +
    'Иногда включается ⭐ «Золотой гол»: 10 секунд каждый гол считается за два!',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const { cv, g } = ctx.canvas();
    const P = ctx.players;
    const N = ctx.n;
    const WIN_GOALS = 7, LIVES = 5;
    const E_MALLET = 0.9;
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif';
    const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    // toast with copies spread apart so they don't overlap in 3p
    // only the latest message stays on screen, so quick events don't pile up
    let lastToast = null;
    const say = (text, o = {}) => {
      if (lastToast) lastToast.forEach(e => e.remove());
      lastToast = ctx.toast(text, Object.assign({ offset: ctx.n === 3 ? Math.min(ctx.W, ctx.H) * 0.2 : 70 }, o));
      return lastToast;
    };

    const goals = P.map(() => 0);      // 2p: goals scored by player
    const lives = P.map(() => LIVES);  // 3p
    const out = P.map(() => false);
    const effects = P.map(() => []);   // per player {k, until, dur}
    const glob = [];                   // global effects {k, until, dur}
    let over = false;

    const PU = {
      narrow: { icon: '🥅', name: 'Узкие ворота', w: 2 },
      wide: { icon: '🕳️', name: 'Широкие ворота соперникам', w: 2, bad: true },
      puck2: { icon: '⚫', name: 'Вторая шайба!', w: 2 },
      big: { icon: '🔨', name: 'Большая бита', w: 2 },
      wall: { icon: '🧱', name: 'Стенка у ворот', w: 2 },
      power: { icon: '⚡', name: 'Мощный удар', w: 2 },
      ice: { icon: '🧊', name: 'Лёд! Без трения', w: 1.3 },
      vortex: { icon: '🌪️', name: 'Вихрь в центре!', w: 1.3 },
      ghost: { icon: '👻', name: 'Шайба-призрак', w: 1.3 },
      gold: { icon: '⭐', name: 'Золотой гол ×2' },
    };
    function addFx(list, k, dur) {
      const e = list.find(e => e.k === k);
      if (e) { e.until = ctx.time + dur; e.dur = dur; } else list.push({ k, until: ctx.time + dur, dur });
    }
    const has = (i, k) => effects[i].some(e => e.k === k);
    const gHas = (k) => glob.some(e => e.k === k);
    const delFx = (i, k) => { effects[i] = effects[i].filter(e => e.k !== k); };

    // ---------- geometry ----------
    let W = ctx.W, H = ctx.H, S, RM, RP, GOAL, MAXV, MALLET_V, IR;
    const edgeFn = (side) => side === 'bottom' ? { ax: 0, ay: -1, c: H } : side === 'top' ? { ax: 0, ay: 1, c: 0 }
      : side === 'left' ? { ax: 1, ay: 0, c: 0 } : { ax: -1, ay: 0, c: W };
    const active = () => P.filter(p => !out[p.i]).map(p => p.i);
    function clip(poly, nx, ny, k) {
      const res = [];
      for (let j = 0; j < poly.length; j++) {
        const a = poly[j], b = poly[(j + 1) % poly.length];
        const da = nx * a.x + ny * a.y - k, db = nx * b.x + ny * b.y - k;
        if (da <= 0) res.push(a);
        if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
          const t = da / (da - db);
          res.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
        }
      }
      return res;
    }
    function regionPoly(i, inset) {
      let poly = [{ x: inset, y: inset }, { x: W - inset, y: inset }, { x: W - inset, y: H - inset }, { x: inset, y: H - inset }];
      const me = edgeFn(P[i].side);
      for (const k of active()) {
        if (k === i) continue;
        const o = edgeFn(P[k].side);
        poly = clip(poly, me.ax - o.ax, me.ay - o.ay, o.c - me.c);
      }
      return poly;
    }
    let fieldPolys = [];
    function rebuildRegions() { fieldPolys = P.map(p => out[p.i] ? [] : regionPoly(p.i, 0)); }
    function inPoly(poly, x, y) {
      let sign = 0;
      for (let j = 0; j < poly.length; j++) {
        const a = poly[j], b = poly[(j + 1) % poly.length];
        const cr = (b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x);
        if (Math.abs(cr) < 1e-9) continue;
        const s = cr > 0 ? 1 : -1;
        if (sign === 0) sign = s; else if (s !== sign) return false;
      }
      return true;
    }
    function project(poly, x, y) {
      if (poly.length < 3 || inPoly(poly, x, y)) return { x, y };
      let best = null, bd = Infinity;
      for (let j = 0; j < poly.length; j++) {
        const a = poly[j], b = poly[(j + 1) % poly.length];
        const ex = b.x - a.x, ey = b.y - a.y, L2 = ex * ex + ey * ey || 1;
        const t = U.clamp(((x - a.x) * ex + (y - a.y) * ey) / L2, 0, 1);
        const qx = a.x + ex * t, qy = a.y + ey * t, d = (qx - x) ** 2 + (qy - y) ** 2;
        if (d < bd) { bd = d; best = { x: qx, y: qy }; }
      }
      return best;
    }
    function seatActive(x, y) {
      let best = -1, bd = Infinity;
      for (const i of active()) {
        const e = edgeFn(P[i].side), d = e.ax * x + e.ay * y + e.c;
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }
    function edgeMid(i) {
      const s = P[i].side;
      return s === 'bottom' ? { x: W / 2, y: H } : s === 'top' ? { x: W / 2, y: 0 } : s === 'left' ? { x: 0, y: H / 2 } : { x: W, y: H / 2 };
    }
    const ownerOf = (side) => { const p = P.find(q => q.side === side); return p ? p.i : -1; };

    function layout() {
      W = ctx.W; H = ctx.H;
      S = Math.min(W, H);
      RM = S * 0.058;
      RP = S * 0.034;
      GOAL = S * 0.36;
      MAXV = S * 2.4;
      MALLET_V = S * 4.5;
      IR = S * 0.04;
      rebuildRegions();
    }
    layout();
    const goalW = P.map(() => GOAL);   // animated current goal width
    const malR = P.map(() => RM);      // animated mallet radius
    const targetGoal = (i) => GOAL * (has(i, 'narrow') ? 0.55 : 1) * (has(i, 'wide') ? 1.5 : 1);
    const targetMal = (i) => RM * (has(i, 'big') ? 1.6 : 1);
    // goal opening half-width for side, or 0 if closed
    function goalHalf(side) {
      const i = ownerOf(side);
      if (i < 0 || out[i] || over) return 0;
      return goalW[i] / 2;
    }

    // ---------- objects ----------
    const pucks = [];
    const mallets = P.map(p => {
      const m = edgeMid(p.i), v = ctx.inward(p.i);
      return { x: m.x + v.x * S * 0.2, y: m.y + v.y * S * 0.2, vx: 0, vy: 0, tx: null, ty: null, ptr: null };
    });
    const flash = P.map(() => 0);
    const items = [];

    // ---------- juice ----------
    const parts = [], rings = [];
    let shakeT = 0, shakeA = 0, flashA = 0, flashC = '#fff';
    function burst(x, y, color, n, speed, life = 0.6, size = 4) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, s = speed * (0.25 + Math.random() * 0.75);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, t: life * (0.6 + Math.random() * 0.4), color, size: size * (0.6 + Math.random() * 0.8) });
      }
      if (parts.length > 700) parts.splice(0, parts.length - 700);
    }
    function sparks(x, y, nx, ny, color, n, speed) {
      for (let k = 0; k < n; k++) {
        const a = Math.atan2(ny, nx) + U.rand(-1.1, 1.1), s = speed * U.rand(0.3, 1);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, t: U.rand(0.2, 0.45), color, size: U.rand(2, 4.5) });
      }
    }
    const ring = (x, y, r0, r1, color, life = 0.5, w = 5) => rings.push({ x, y, r0, r1, color, life, t: life, w });
    const shake = (a, t = 0.35) => { shakeA = Math.max(shakeT > 0 ? shakeA : 0, a); shakeT = Math.max(shakeT, t); };
    function updJuice(dt) {
      for (let k = parts.length - 1; k >= 0; k--) {
        const p = parts[k]; p.t -= dt;
        if (p.t <= 0) { parts.splice(k, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        const d = Math.exp(-3 * dt); p.vx *= d; p.vy *= d;
      }
      for (let k = rings.length - 1; k >= 0; k--) { rings[k].t -= dt; if (rings[k].t <= 0) rings.splice(k, 1); }
      shakeT = Math.max(0, shakeT - dt);
      flashA = Math.max(0, flashA - dt * 2.5);
    }
    function drawJuice() {
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        const a = Math.max(0, p.t / p.life);
        g.globalAlpha = Math.min(1, a * 1.4);
        g.fillStyle = p.color;
        g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, Math.PI * 2); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
      for (const r of rings) {
        const k = 1 - r.t / r.life;
        g.globalAlpha = 1 - k;
        g.strokeStyle = r.color; g.lineWidth = r.w * (1 - k) + 1;
        g.beginPath(); g.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * k, 0, Math.PI * 2); g.stroke();
      }
      g.restore();
    }

    ctx.onResize(() => {
      const ow = W, oh = H, os = S;
      layout();
      const sx = W / ow, sy = H / oh;
      for (const pk of pucks) { pk.x *= sx; pk.y *= sy; pk.trail = []; }
      for (const it of items) { it.x *= sx; it.y *= sy; }
      parts.length = 0;
      P.forEach(p => { goalW[p.i] *= S / os; malR[p.i] *= S / os; });
      for (const m of mallets) {
        m.x *= sx; m.y *= sy;
        if (m.tx != null) { m.tx *= sx; m.ty *= sy; }
      }
      P.forEach(p => { if (!out[p.i]) { const q = project(regionPoly(p.i, malR[p.i]), mallets[p.i].x, mallets[p.i].y); mallets[p.i].x = q.x; mallets[p.i].y = q.y; } });
    });

    // ---------- input ----------
    const owner = new Map();
    let malletPolys = P.map(p => regionPoly(p.i, RM));
    ctx.pointer(cv, {
      down(id, x, y) {
        if (over) return;
        const i = seatActive(x, y);
        if (i < 0) return;
        owner.set(id, i);
        const m = mallets[i];
        m.ptr = id;
        const q = project(malletPolys[i], x, y);
        m.tx = q.x; m.ty = q.y; m.fx = x; m.fy = y;
      },
      move(id, x, y) {
        const i = owner.get(id);
        if (i == null || out[i]) return;
        const m = mallets[i];
        if (m.ptr !== id) return;
        m.fx = x; m.fy = y;
        const q = project(malletPolys[i], x, y);
        m.tx = q.x; m.ty = q.y;
      },
      up(id) {
        const i = owner.get(id);
        owner.delete(id);
        if (i != null && mallets[i].ptr === id) { mallets[i].ptr = null; mallets[i].tx = null; mallets[i].fx = null; }
      },
    });

    // ---------- serve / goals ----------
    let serving = false;
    function newPuck(x, y, vx, vy) {
      const pk = { x, y, vx, vy, alpha: 0, trail: [], last: null, ghostUntil: 0, boostUntil: 0 };
      pucks.push(pk);
      return pk;
    }
    function serve(toward) {
      serving = false;
      if (over) return;
      const act = active();
      if (toward == null || out[toward]) toward = U.pick(act);
      const v = ctx.inward(toward);
      const ang = U.rand(-0.45, 0.45);
      const dx = -v.x, dy = -v.y, c = Math.cos(ang), s = Math.sin(ang);
      const sp = S * 0.32;
      newPuck(W / 2, H / 2, (dx * c - dy * s) * sp, (dx * s + dy * c) * sp);
      ring(W / 2, H / 2, RP, RP * 4, '#dff1ff', 0.5, 4);
    }
    serving = true;
    ctx.after(500, () => serve());

    function goalAgainst(i, pk) {
      pucks.splice(pucks.indexOf(pk), 1);
      flash[i] = 1;
      const val = gHas('gold') ? 2 : 1;
      const m = edgeMid(i), v = ctx.inward(i);
      burst(m.x + v.x * 10, m.y + v.y * 10, P[i].color, 50, S * 1.1, 0.9, 5);
      burst(m.x + v.x * 10, m.y + v.y * 10, val > 1 ? '#ffd84a' : '#ffffff', 20, S * 0.8, 0.7, 3);
      ring(m.x, m.y, RP, S * 0.3, P[i].color, 0.6, 8);
      shake(S * 0.02, 0.45);
      flashA = 0.4; flashC = P[i].color;
      const x2 = val > 1 ? ' ×2' : '';
      if (N === 2) {
        const sc = 1 - i;
        goals[sc] += val;
        if (goals[sc] >= WIN_GOALS) {
          over = true;
          pucks.length = 0; items.length = 0;
          say(`🏆 ${P[sc].name} победил!`, { color: P[sc].color, fg: '#111', ms: 1400 });
          ctx.after(1300, () => ctx.end({ winner: sc, scores: goals.slice(), msg: `Счёт ${goals[0]} : ${goals[1]}` }));
          return;
        }
        say(`🥅 Гол${x2}! +${val} ${P[sc].name}`, { color: P[sc].color, fg: '#111' });
      } else {
        lives[i] = Math.max(0, lives[i] - val);
        if (lives[i] <= 0) {
          out[i] = true;
          effects[i] = [];
          const mm = mallets[i]; mm.ptr = null; mm.tx = null;
          rebuildRegions();
          const act = active();
          if (act.length <= 1) {
            over = true;
            pucks.length = 0; items.length = 0;
            const w = act[0];
            say(`🏆 ${P[w].name} победил!`, { color: P[w].color, fg: '#111', ms: 1400 });
            ctx.after(1300, () => ctx.end({ winner: w, scores: lives.slice(), msg: 'Остался последним' }));
            return;
          }
          say(`💀 ${P[i].name} выбывает`, { color: P[i].color, fg: '#111', ms: 1400 });
        } else {
          say(`🥅 Гол${x2}! ${P[i].name}: −${val} ${val > 1 ? 'жизни' : 'жизнь'}`, { color: P[i].color, fg: '#111' });
        }
      }
      if (pucks.length === 0 && !serving) { serving = true; ctx.after(1000, () => serve(i)); }
    }

    // ---------- items ----------
    let nextItem = 4, nextGold = U.rand(25, 35);
    function spawnItem() {
      const pool = Object.keys(PU).filter(k => PU[k].w).map(k => [k, PU[k].w]);
      if (pucks.length >= 3) pool.forEach(e => { if (e[0] === 'puck2') e[1] = 0; });
      const tot = pool.reduce((s, e) => s + e[1], 0);
      let r = Math.random() * tot, k = pool[0][0];
      for (const e of pool) { r -= e[1]; if (r <= 0) { k = e[0]; break; } }
      for (let tries = 0; tries < 20; tries++) {
        const x = U.rand(W * 0.2, W * 0.8), y = U.rand(H * 0.2, H * 0.8);
        if (items.some(it => Math.hypot(it.x - x, it.y - y) < IR * 4)) continue;
        if (mallets.some((m, j) => !out[j] && Math.hypot(m.x - x, m.y - y) < malR[j] + IR * 1.5)) continue;
        items.push({ x, y, k, born: ctx.time, life: 12 });
        ring(x, y, IR * 2.5, IR, '#ffffff', 0.4, 3);
        return;
      }
    }
    function collect(it, pk) {
      const i = pk.last, def = PU[it.k], col = P[i].color;
      const opp = active().filter(j => j !== i);
      burst(it.x, it.y, col, 26, S * 0.7, 0.7, 4);
      burst(it.x, it.y, '#ffffff', 10, S * 0.4, 0.5, 3);
      ring(it.x, it.y, IR, IR * 4, col, 0.55, 6);
      switch (it.k) {
        case 'narrow': addFx(effects[i], 'narrow', 10); break;
        case 'wide': opp.forEach(j => addFx(effects[j], 'wide', 9)); break;
        case 'big': addFx(effects[i], 'big', 10); break;
        case 'wall': addFx(effects[i], 'wall', 9); break;
        case 'power': addFx(effects[i], 'power', 12); break;
        case 'ice': addFx(glob, 'ice', 8); break;
        case 'vortex': addFx(glob, 'vortex', 8); break;
        case 'ghost': pk.ghostUntil = ctx.time + 5; break;
        case 'puck2': {
          const a = Math.random() * Math.PI * 2, sp = S * 0.4;
          const np = newPuck(it.x, it.y, Math.cos(a) * sp, Math.sin(a) * sp);
          np.alpha = 1; np.last = i;
          break;
        }
      }
      say(`${def.icon} ${def.name}`, { color: col, fg: '#111', ms: 1300 });
    }

    // ---------- physics ----------
    function collideMallet(pk, j) {
      const m = mallets[j], rm = malR[j];
      const dx = pk.x - m.x, dy = pk.y - m.y, min = rm + RP;
      const d2 = dx * dx + dy * dy;
      if (d2 >= min * min) return;
      let d = Math.sqrt(d2), nx, ny;
      if (d < 1e-6) { nx = 0; ny = -1; } else { nx = dx / d; ny = dy / d; }
      pk.x = m.x + nx * min; pk.y = m.y + ny * min;
      const rel = (pk.vx - m.vx) * nx + (pk.vy - m.vy) * ny;
      if (rel < 0) {
        pk.vx -= (1 + E_MALLET) * rel * nx;
        pk.vy -= (1 + E_MALLET) * rel * ny;
        pk.last = j;
        const imp = -rel;
        const cx = m.x + nx * rm, cy = m.y + ny * rm;
        if (has(j, 'power') && imp > S * 0.25) {
          delFx(j, 'power');
          pk.vx *= 2; pk.vy *= 2;
          pk.boostUntil = ctx.time + 1.2;
          sparks(cx, cy, nx, ny, '#ffe95c', 40, S * 1.3);
          ring(cx, cy, RP, S * 0.18, '#ffe95c', 0.4, 6);
          shake(S * 0.012, 0.25);
          say('⚡ Мощный удар!', { color: P[j].color, fg: '#111', ms: 800 });
        } else if (imp > S * 0.15) {
          sparks(cx, cy, nx, ny, P[j].color, Math.min(24, 4 + Math.round(imp / S * 10)), Math.min(S * 1.2, imp * 0.6));
          if (imp > S * 1.5) shake(S * 0.005, 0.12);
        }
      }
    }
    function bounce(pk, nx, ny, e) {
      const vn = pk.vx * nx + pk.vy * ny;
      if (vn < 0) {
        pk.vx -= (1 + e) * vn * nx; pk.vy -= (1 + e) * vn * ny;
        if (-vn > S * 1.0) sparks(pk.x - nx * RP, pk.y - ny * RP, nx, ny, '#cfe8ff', 6, S * 0.5);
      }
    }
    function postBounce(pk, px, py, e) {
      const dx = pk.x - px, dy = pk.y - py, d = Math.hypot(dx, dy);
      if (d >= RP || d < 1e-6) return;
      const nx = dx / d, ny = dy / d;
      pk.x = px + nx * RP; pk.y = py + ny * RP;
      bounce(pk, nx, ny, e);
    }
    // capsule segment collision (temporary wall in front of a goal)
    function segBounce(pk, ax, ay, bx, by, rad, e) {
      const ex = bx - ax, ey = by - ay, L2 = ex * ex + ey * ey || 1;
      const t = U.clamp(((pk.x - ax) * ex + (pk.y - ay) * ey) / L2, 0, 1);
      const qx = ax + ex * t, qy = ay + ey * t;
      const dx = pk.x - qx, dy = pk.y - qy, d = Math.hypot(dx, dy), min = RP + rad;
      if (d >= min || d < 1e-6) return;
      const nx = dx / d, ny = dy / d;
      pk.x = qx + nx * min; pk.y = qy + ny * min;
      bounce(pk, nx, ny, e);
    }
    function wallSeg(i) {
      const m = edgeMid(i), v = ctx.inward(i), a = ctx.toScreen(i, 1, 0);
      const d = S * 0.15, half = goalW[i] * 0.42;
      const cx = m.x + v.x * d, cy = m.y + v.y * d;
      return [cx - a.x * half, cy - a.y * half, cx + a.x * half, cy + a.y * half];
    }
    function walls(pk, e) {
      for (const side of ['left', 'right']) {
        const gh = goalHalf(side);
        const open = gh > 0 && Math.abs(pk.y - H / 2) < gh;
        if (side === 'left') { if (pk.x < RP && !open) { pk.x = RP; bounce(pk, 1, 0, e); } }
        else if (pk.x > W - RP && !open) { pk.x = W - RP; bounce(pk, -1, 0, e); }
        if (gh > 0) { const ex = side === 'left' ? 0 : W; postBounce(pk, ex, H / 2 - gh, e); postBounce(pk, ex, H / 2 + gh, e); }
      }
      for (const side of ['top', 'bottom']) {
        const gh = goalHalf(side);
        const open = gh > 0 && Math.abs(pk.x - W / 2) < gh;
        if (side === 'top') { if (pk.y < RP && !open) { pk.y = RP; bounce(pk, 0, 1, e); } }
        else if (pk.y > H - RP && !open) { pk.y = H - RP; bounce(pk, 0, -1, e); }
        if (gh > 0) { const ey = side === 'top' ? 0 : H; postBounce(pk, W / 2 - gh, ey, e); postBounce(pk, W / 2 + gh, ey, e); }
      }
      for (const p of P) if (!out[p.i] && has(p.i, 'wall')) { const s = wallSeg(p.i); segBounce(pk, s[0], s[1], s[2], s[3], S * 0.012, e); }
      if (pk.x < -RP * 0.2) return ownerOf('left');
      if (pk.x > W + RP * 0.2) return ownerOf('right');
      if (pk.y < -RP * 0.2) return ownerOf('top');
      if (pk.y > H + RP * 0.2) return ownerOf('bottom');
      return -1;
    }
    function puckPuck(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = RP * 2;
      if (d >= min || d < 1e-6) return;
      const nx = dx / d, ny = dy / d, o = (min - d) / 2;
      a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { const j = -rv * 0.95; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }
    }

    function step(dt) {
      // effects
      for (const p of P) effects[p.i] = effects[p.i].filter(e => e.until > ctx.time);
      for (let k = glob.length - 1; k >= 0; k--) {
        if (glob[k].until <= ctx.time) {
          if (glob[k].k === 'gold') say('⭐ Золотой гол закончился', { ms: 900 });
          glob.splice(k, 1);
        }
      }
      const kk = 1 - Math.exp(-dt * 8);
      for (const p of P) {
        goalW[p.i] += (targetGoal(p.i) - goalW[p.i]) * kk;
        malR[p.i] += (targetMal(p.i) - malR[p.i]) * kk;
      }
      malletPolys = P.map(p => out[p.i] ? [] : regionPoly(p.i, malR[p.i]));
      // re-project targets in case the region changed (bigger mallet, someone knocked out)
      for (const p of P) {
        const m = mallets[p.i];
        if (out[p.i]) continue;
        if (m.fx != null) { const q = project(malletPolys[p.i], m.fx, m.fy); m.tx = q.x; m.ty = q.y; }
        else { const q = project(malletPolys[p.i], m.x, m.y); if (Math.abs(q.x - m.x) + Math.abs(q.y - m.y) > 0.5) { m.tx = q.x; m.ty = q.y; } }
      }
      const ice = gHas('ice'), vortex = gHas('vortex');
      const eWall = ice ? 0.98 : 0.88;
      let maxSp = 0;
      for (const pk of pucks) maxSp = Math.max(maxSp, Math.hypot(pk.vx, pk.vy));
      const n = U.clamp(Math.ceil(Math.max(maxSp, MALLET_V) * dt / (RP * 0.4)), 1, 60);
      const h = dt / n;
      const fr = ice ? 1 : Math.exp(-0.25 * h);
      for (let s = 0; s < n; s++) {
        for (const p of P) {
          const m = mallets[p.i];
          if (out[p.i]) { m.vx = m.vy = 0; continue; }
          const ox = m.x, oy = m.y;
          if (m.tx != null) {
            const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy), mx = MALLET_V * h;
            if (d > mx) { m.x += dx / d * mx; m.y += dy / d * mx; } else { m.x = m.tx; m.y = m.ty; }
          }
          m.vx = (m.x - ox) / h; m.vy = (m.y - oy) / h;
        }
        for (let q = pucks.length - 1; q >= 0; q--) {
          const pk = pucks[q];
          if (vortex) {
            const dx = pk.x - W / 2, dy = pk.y - H / 2, d = Math.hypot(dx, dy), rad = S * 0.32;
            if (d < rad && d > 1) {
              const f = S * 2.2 * (1 - d / rad);
              pk.vx += (-dy / d) * f * h - dx / d * f * 0.15 * h;
              pk.vy += (dx / d) * f * h - dy / d * f * 0.15 * h;
            }
          }
          pk.x += pk.vx * h; pk.y += pk.vy * h;
          pk.vx *= fr; pk.vy *= fr;
          for (const p of P) if (!out[p.i]) collideMallet(pk, p.i);
          for (const o of pucks) if (o !== pk) puckPuck(pk, o);
          const gi = walls(pk, eWall);
          for (const p of P) {
            if (out[p.i]) continue;
            const m = mallets[p.i], dx = m.x - pk.x, dy = m.y - pk.y, d = Math.hypot(dx, dy), min = malR[p.i] + RP;
            if (d < min && d > 1e-6) { m.x = pk.x + dx / d * min; m.y = pk.y + dy / d * min; }
          }
          const cap = pk.boostUntil > ctx.time ? MAXV * 1.5 : MAXV;
          const v = Math.hypot(pk.vx, pk.vy);
          if (v > cap) { pk.vx *= cap / v; pk.vy *= cap / v; }
          if (gi >= 0) { goalAgainst(gi, pk); if (over) return; }
        }
      }
      // items
      for (const pk of pucks) {
        if (pk.last == null || out[pk.last]) continue;
        for (let k = items.length - 1; k >= 0; k--) {
          const it = items[k];
          if (Math.hypot(it.x - pk.x, it.y - pk.y) < IR * 1.3 + RP) { items.splice(k, 1); collect(it, pk); }
        }
      }
      for (let k = items.length - 1; k >= 0; k--) if (ctx.time - items[k].born > items[k].life) items.splice(k, 1);
      if (ctx.time > nextItem) {
        if (items.length < 2) spawnItem();
        nextItem = ctx.time + U.rand(4, 6.5);
      }
      if (ctx.time > nextGold) {
        addFx(glob, 'gold', 10);
        say('⭐ Золотой гол ×2 — 10 секунд!', { color: '#ffd84a', fg: '#111', ms: 1600 });
        ring(W / 2, H / 2, S * 0.05, S * 0.6, '#ffd84a', 0.8, 10);
        nextGold = ctx.time + U.rand(35, 45);
      }
      // per-frame visuals
      for (const pk of pucks) {
        pk.alpha = Math.min(1, pk.alpha + dt * 5);
        pk.trail.push({ x: pk.x, y: pk.y });
        if (pk.trail.length > 10) pk.trail.shift();
        if (pk.boostUntil > ctx.time) burst(pk.x, pk.y, '#ffe95c', 2, S * 0.1, 0.4, 3);
      }
      if (vortex && Math.random() < dt * 40) {
        const a = Math.random() * Math.PI * 2, r = U.rand(0.05, 0.32) * S;
        parts.push({ x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r, vx: -Math.sin(a) * S * 0.5, vy: Math.cos(a) * S * 0.5, life: 0.7, t: 0.7, color: '#9fd8ff', size: 2.5 });
      }
    }

    // ---------- drawing ----------
    function poly(pts) {
      g.beginPath();
      pts.forEach((p, j) => j ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y));
      g.closePath();
    }
    function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
    function emoji(ch, x, y, size) {
      g.font = `${Math.round(size)}px ${EMOJI}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, x, y + size * 0.05);
    }

    function drawField() {
      const gold = gHas('gold'), ice = gHas('ice');
      g.fillStyle = ice ? '#13203a' : '#0f1220';
      g.fillRect(-40, -40, W + 80, H + 80);
      P.forEach(p => {
        if (out[p.i] || fieldPolys[p.i].length < 3) return;
        poly(fieldPolys[p.i]);
        g.fillStyle = U.alpha(p.color, 0.06);
        g.fill();
      });
      if (ice) {
        // frosty sheen
        const gr = g.createLinearGradient(0, 0, W, H);
        gr.addColorStop(0, 'rgba(180,230,255,.07)'); gr.addColorStop(0.5, 'rgba(180,230,255,.02)'); gr.addColorStop(1, 'rgba(180,230,255,.08)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
      }
      g.save();
      g.setLineDash([14, 12]);
      g.lineWidth = 3;
      g.strokeStyle = 'rgba(255,255,255,.12)';
      if (N === 2) {
        g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
        g.setLineDash([]);
        circle(W / 2, H / 2, S * 0.13); g.stroke();
      } else {
        P.forEach(p => { if (!out[p.i] && fieldPolys[p.i].length >= 3) { poly(fieldPolys[p.i]); g.stroke(); } });
      }
      g.restore();
      if (gHas('vortex')) {
        g.save();
        g.translate(W / 2, H / 2);
        g.rotate(ctx.time * 3);
        for (let k = 0; k < 4; k++) {
          g.rotate(Math.PI / 2);
          g.beginPath();
          for (let s = 0; s <= 30; s++) { const t = s / 30, r = S * 0.32 * t, a = t * 2.4; s ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(0, 0); }
          g.strokeStyle = 'rgba(140,210,255,.28)'; g.lineWidth = 3; g.stroke();
        }
        g.restore();
      }
      circle(W / 2, H / 2, 6); g.fillStyle = 'rgba(255,255,255,.18)'; g.fill();

      g.lineWidth = 8;
      g.strokeStyle = gold ? `rgba(255,216,74,${0.55 + 0.3 * Math.sin(ctx.time * 8)})` : '#3a4270';
      g.strokeRect(4, 4, W - 8, H - 8);
      for (const p of P) {
        const side = p.side, gh = out[p.i] ? GOAL / 2 : goalW[p.i] / 2;
        const horiz = side === 'top' || side === 'bottom';
        const ex = side === 'left' ? 0 : side === 'right' ? W : W / 2;
        const ey = side === 'top' ? 0 : side === 'bottom' ? H : H / 2;
        if (out[p.i]) {
          g.fillStyle = '#4a5280';
          if (horiz) g.fillRect(W / 2 - gh, side === 'top' ? 0 : H - 10, gh * 2, 10);
          else g.fillRect(side === 'left' ? 0 : W - 10, H / 2 - gh, 10, gh * 2);
          continue;
        }
        const f = flash[p.i];
        g.fillStyle = '#0f1220';
        if (horiz) g.fillRect(W / 2 - gh, side === 'top' ? 0 : H - 10, gh * 2, 10);
        else g.fillRect(side === 'left' ? 0 : W - 10, H / 2 - gh, 10, gh * 2);
        const v = ctx.inward(p.i);
        const depth = S * 0.07;
        const grad = g.createLinearGradient(ex, ey, ex + v.x * depth, ey + v.y * depth);
        grad.addColorStop(0, U.alpha(gold ? '#ffd84a' : p.color, 0.45 + 0.5 * f));
        grad.addColorStop(1, U.alpha(p.color, 0));
        g.fillStyle = grad;
        if (horiz) g.fillRect(W / 2 - gh, side === 'top' ? 0 : H - depth, gh * 2, depth);
        else g.fillRect(side === 'left' ? 0 : W - depth, H / 2 - gh, depth, gh * 2);
        g.fillStyle = p.color;
        g.shadowColor = p.color; g.shadowBlur = 14;
        const posts = horiz ? [[W / 2 - gh, ey], [W / 2 + gh, ey]] : [[ex, H / 2 - gh], [ex, H / 2 + gh]];
        for (const [x, y] of posts) { circle(x, y, 9); g.fill(); }
        g.shadowBlur = 0;
        g.strokeStyle = U.alpha(p.color, 0.35);
        g.lineWidth = 3;
        g.beginPath();
        const a0 = Math.atan2(v.y, v.x);
        g.arc(ex, ey, gh, a0 - Math.PI / 2, a0 + Math.PI / 2);
        g.stroke();
        if (has(p.i, 'wall')) {
          const s = wallSeg(p.i);
          g.save();
          g.lineCap = 'round';
          g.shadowColor = '#ffb35c'; g.shadowBlur = 18;
          g.strokeStyle = '#ffb35c'; g.lineWidth = S * 0.024;
          g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); g.stroke();
          g.restore();
        }
      }
    }

    // effect timer rings in rows: from x0 going in `dir`, wrapping inward (local -y) before xMax
    function drawEffectRings(list, x0, y0, dir, avail) {
      const r = S * 0.026, gap = r * 2.5;
      const perRow = Math.max(1, Math.floor(avail / gap) + 1);
      list.forEach((e, k) => {
        const x = x0 + dir * (k % perRow) * gap, y = y0 - Math.floor(k / perRow) * gap;
        const frac = U.clamp((e.until - ctx.time) / e.dur, 0, 1);
        circle(x, y, r); g.fillStyle = 'rgba(10,12,24,.75)'; g.fill();
        g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 4; g.stroke();
        g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        g.strokeStyle = PU[e.k].bad ? '#ff6b6b' : e.k === 'gold' ? '#ffd84a' : '#5dffa8'; g.lineWidth = 4; g.stroke();
        emoji(PU[e.k].icon, x, y, r * 1.15);
      });
    }
    function drawHud() {
      for (const p of P) {
        const m = edgeMid(p.i), v = ctx.inward(p.i);
        const len = (p.side === 'left' || p.side === 'right') ? H : W;
        const off = Math.min(GOAL / 2 + S * 0.15, len / 2 - S * 0.1);
        g.save();
        ctx.facing(g, p.i, m.x + v.x * S * 0.075, m.y + v.y * S * 0.075);
        if (!out[p.i]) {
          const x0 = -(GOAL / 2 + S * 0.06), xEnd = -(len / 2 - S * 0.04);
          drawEffectRings(effects[p.i].concat(glob), x0, 0, -1, Math.max(0, x0 - xEnd));
        }
        g.translate(off, 0);
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if (N === 2) {
          const o = 1 - p.i;
          g.font = `900 ${Math.round(S * 0.07)}px ${FONT}`;
          g.fillStyle = p.color;
          g.shadowColor = p.color; g.shadowBlur = 12;
          g.fillText(goals[p.i], -S * 0.045, 0);
          g.shadowBlur = 0;
          g.font = `800 ${Math.round(S * 0.045)}px ${FONT}`;
          g.fillStyle = 'rgba(255,255,255,.5)';
          g.fillText(':', 0, -2);
          g.fillStyle = P[o].color;
          g.fillText(goals[o], S * 0.04, 2);
          g.font = `700 ${Math.round(S * 0.02)}px ${FONT}`;
          g.fillStyle = 'rgba(255,255,255,.45)';
          g.fillText(`до ${WIN_GOALS}`, 0, S * 0.045);
        } else if (out[p.i]) {
          g.font = `900 ${Math.round(S * 0.04)}px ${FONT}`;
          g.fillStyle = U.alpha(p.color, 0.6);
          g.fillText('выбыл', 0, 0);
        } else {
          const r = S * 0.013, gap = S * 0.036;
          for (let k = 0; k < LIVES; k++) {
            circle((k - (LIVES - 1) / 2) * gap, -S * 0.008, r);
            if (k < lives[p.i]) { g.fillStyle = p.color; g.shadowColor = p.color; g.shadowBlur = 10; g.fill(); g.shadowBlur = 0; }
            else { g.strokeStyle = U.alpha(p.color, 0.5); g.lineWidth = 2; g.stroke(); }
          }
          g.font = `700 ${Math.round(S * 0.02)}px ${FONT}`;
          g.fillStyle = 'rgba(255,255,255,.45)';
          g.fillText('жизни', 0, S * 0.03);
        }
        g.restore();
      }
    }

    function drawMallet(p, m) {
      const c = p.color, rm = malR[p.i];
      g.save();
      const pw = has(p.i, 'power');
      g.shadowColor = pw ? '#ffe95c' : c; g.shadowBlur = (m.ptr != null ? 26 : 14) + (pw ? 10 + 8 * Math.sin(ctx.time * 12) : 0);
      circle(m.x, m.y, rm);
      const gr = g.createRadialGradient(m.x - rm * 0.3, m.y - rm * 0.3, rm * 0.1, m.x, m.y, rm);
      gr.addColorStop(0, '#ffffff');
      gr.addColorStop(0.25, c);
      gr.addColorStop(1, U.alpha(c, 0.75));
      g.fillStyle = gr; g.fill();
      g.shadowBlur = 0;
      circle(m.x, m.y, rm * 0.72);
      g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 3; g.stroke();
      circle(m.x, m.y, rm * 0.42);
      g.fillStyle = c; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; g.stroke();
      if (pw) {
        circle(m.x, m.y, rm + 5 + 3 * Math.sin(ctx.time * 12));
        g.strokeStyle = 'rgba(255,233,92,.8)'; g.lineWidth = 3; g.stroke();
        emoji('⚡', m.x, m.y, rm * 0.6);
      }
      g.restore();
    }

    function drawPucks() {
      for (const pk of pucks) {
        let alpha = pk.alpha;
        if (pk.ghostUntil > ctx.time) alpha *= (Math.sin(ctx.time * 11) > 0.5 ? 0.9 : 0.05);
        const col = pk.last != null ? P[pk.last].color : '#bfe6ff';
        g.save();
        g.globalAlpha = alpha;
        for (let k = 0; k < pk.trail.length; k++) {
          const tr = pk.trail[k], a = (k + 1) / pk.trail.length;
          circle(tr.x, tr.y, RP * (0.35 + 0.55 * a));
          g.fillStyle = U.alpha(col, 0.16 * a);
          g.fill();
        }
        g.shadowColor = pk.boostUntil > ctx.time ? '#ffe95c' : col; g.shadowBlur = 22;
        circle(pk.x, pk.y, RP);
        g.fillStyle = '#eef6ff'; g.fill();
        g.shadowBlur = 0;
        circle(pk.x, pk.y, RP * 0.62);
        g.strokeStyle = U.alpha(col, 0.7); g.lineWidth = 3; g.stroke();
        g.restore();
      }
      if (serving && !over) {
        const a = 0.25 + 0.2 * Math.sin(performance.now() / 120);
        circle(W / 2, H / 2, RP * 1.2);
        g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3; g.stroke();
      }
    }
    function drawItems() {
      for (const it of items) {
        const age = ctx.time - it.born, left = it.life - age;
        if (left < 2.5 && Math.sin(age * 20) < 0) continue;
        const r = IR * (0.6 + 0.4 * Math.min(1, age * 4)) * (1 + 0.06 * Math.sin(age * 5));
        g.save();
        g.translate(it.x, it.y);
        g.shadowColor = '#fff'; g.shadowBlur = 18;
        circle(0, 0, r); g.fillStyle = 'rgba(30,36,70,.92)'; g.fill();
        g.lineWidth = 3; g.strokeStyle = `hsla(${(age * 120) % 360},90%,70%,.95)`; g.stroke();
        g.shadowBlur = 0;
        g.rotate(Math.sin(age * 1.5) * 0.35);
        emoji(PU[it.k].icon, 0, 0, r * 1.15);
        g.restore();
      }
    }

    ctx.loop((dt) => {
      if (dt > 0) {
        if (!over) step(dt);
        updJuice(dt);
        for (let i = 0; i < flash.length; i++) flash[i] = Math.max(0, flash[i] - dt * 1.2);
      }
      g.save();
      if (shakeT > 0) { const k = shakeA * Math.min(1, shakeT / 0.3); g.translate(U.rand(-k, k), U.rand(-k, k)); }
      drawField();
      drawHud();
      drawItems();
      for (const p of P) if (!out[p.i]) drawMallet(p, mallets[p.i]);
      drawPucks();
      drawJuice();
      g.restore();
      if (flashA > 0) { g.fillStyle = U.alpha(flashC, flashA * 0.3); g.fillRect(0, 0, W, H); }
    });

    ctx._ah = { pucks, mallets, goals, lives, out, items, effects, glob, spawnItem, PU, newPuck };
  },
});

</script>
<script>/* games/balloon.js */
registerGame({
  id: 'balloon',
  title: 'Шарик',
  emoji: '🎈',
  desc: 'Надувай быстрее всех, но не лопни',
  rules: 'Жми НАСОС, чтобы надуть свой шарик. Каждый качок даёт очки, и чем больше шарик, тем дороже качок.\n' +
    'У каждого шарика свой скрытый предел. Лопнул — 0 за раунд. Жми СДАТЬ, чтобы забрать очки.\n' +
    'На раунд 10 секунд: кто не успел сдать, тому засчитывается как есть.\n' +
    '😰 Шкала напряжения подсказывает, но врёт. Шарик дрожит и скрипит перед взрывом.\n' +
    '🔍 Прощупать (1 раз за игру): узнаёшь, между каким числом качков шарик лопнет.\n' +
    '🪡 Иголка: кто сдал первым, может уколоть шарик соперника (он станет слабее).\n' +
    '🌡️ Жара: все шарики слабее.  🌟 Золотой раунд: очки ×2.\n' +
    '🍀 Отстающему с 4-го раунда шарик чуть прочнее.\n' +
    '5 раундов, больше всех очков — победа.',
  minPlayers: 2, maxPlayers: 3,
  start(ctx) {
    const P = ctx.players, N = ctx.n, ROUNDS = 5, DEPTH = 0.2, ROUND_T = 10, TAU = Math.PI * 2;
    const TYPES = {
      normal: { icon: '🎈', name: 'Обычный раунд', mult: 1, k: 1 },
      heat: { icon: '🌡️', name: 'Жара! Шарики слабее', mult: 1, k: 0.62 },
      golden: { icon: '🌟', name: 'Золотой раунд ×2', mult: 2, k: 1 },
      final: { icon: '🌟', name: 'Золотой финал ×2', mult: 2, k: 1 },
    };
    const schedule = ['normal'].concat(U.shuffle(['heat', 'golden', 'normal']), ['final']);

    ctx.root.classList.add('g-balloon');
    ctx.root.append(U.h('style', null, `
      .g-balloon .zone-inner{display:flex;flex-direction:column;gap:1vmin;padding:1.2vmin 1.6vmin}
      .g-balloon .info{display:flex;justify-content:space-between;align-items:center;gap:2vmin;color:#fff;font-weight:900;
        font-size:3vmin;height:4.4vmin;white-space:nowrap;padding:0 1vmin;pointer-events:none}
      .g-balloon .info .tot{color:var(--pc);font-size:3.6vmin}
      .g-balloon .row{flex:1 1 auto;display:flex;gap:1.4vmin;min-height:0}
      .g-balloon .bt{border-radius:3vmin;border:.5vmin solid var(--pc);color:#fff;background:rgba(255,255,255,.05);
        display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;touch-action:none;min-width:0;
        transition:transform .06s, background .1s, opacity .2s}
      .g-balloon .bt .e{font-size:5.5vmin;line-height:1}
      .g-balloon .bt .l{font-size:2.6vmin;margin-top:.4vmin;white-space:nowrap}
      .g-balloon .pump{flex:2.2 1 0;background:var(--pc);color:#0f1220;font-size:5vmin}
      .g-balloon .pump .l{font-size:4.2vmin}
      .g-balloon .pump.hit{transform:scale(.94)}
      .g-balloon .bank{flex:1.3 1 0}
      .g-balloon .probe{flex:.9 1 0}
      .g-balloon .bt.off{opacity:.25}
      .g-balloon .needle{position:absolute;inset:0;display:none;gap:1.4vmin;padding:1.2vmin 1.6vmin;background:rgba(15,18,32,.94);
        border-radius:2vmin;z-index:3}
      .g-balloon .needle.on{display:flex}
      .g-balloon .needle .bt{flex:1 1 0}
      .g-balloon .needle .bt .l{font-size:3.2vmin}
      .g-balloon .needle .t{flex:0 0 auto;align-self:center;color:#fff;font-weight:900;font-size:3vmin;text-align:center;line-height:1.2}
    `));

    const { g } = ctx.canvas();

    /* ---------- state ---------- */
    const total = P.map(() => 0);
    const probeLeft = P.map(() => 1);
    let round = 0, type = TYPES.normal, phase = 'intro', roundEnd = 0, firstBank = -1;
    let parts = [], rings = [], floats = [], flash = 0, flashC = '#fff', shake = 0;
    const bl = P.map(p => ({
      i: p.i, air: 0, thr: 20, state: 'idle', pts: 0, noise: 0, wob: 0, pumpT: 0, hint: null, luck: false,
      burstT: 0, needleUntil: 0, needled: 0,
    }));
    const ptsFor = (a) => { let s = 0; for (let k = 1; k <= a; k++) s += 1 + Math.floor((k - 1) / 4); return s; };

    /* ---------- geometry ---------- */
    let Rm = 80, pos = [];
    function fieldRect() {
      const d = Math.round(DEPTH * Math.min(ctx.W, ctx.H));
      const s = P.map(p => p.side);
      const l = s.includes('left') ? d : 0, r = s.includes('right') ? d : 0;
      const t = s.includes('top') ? d : 0, b = s.includes('bottom') ? d : 0;
      return { x: l, y: t, w: ctx.W - l - r, h: ctx.H - t - b };
    }
    function layout() {
      const f = fieldRect();
      let R = Math.min(f.w, f.h) * 0.3;
      for (let it = 0; it < 40; it++) {
        pos = P.map(p => {
          const v = ctx.inward(p.i), off = R * 1.25 + 14;
          let x, y;
          if (p.side === 'bottom') { x = f.x + f.w / 2; y = f.y + f.h - off; }
          else if (p.side === 'top') { x = f.x + f.w / 2; y = f.y + off; }
          else if (p.side === 'left') { x = f.x + off; y = f.y + f.h * (N === 3 ? 0.36 : 0.5); }
          else { x = f.x + f.w - off; y = f.y + f.h * (N === 3 ? 0.36 : 0.5); }
          return { x, y, v };
        });
        let ok = true;
        for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) if (U.dist(pos[a].x, pos[a].y, pos[b].x, pos[b].y) < R * 2.75 + 20) ok = false;
        if (P.some(p => (p.side === 'left' || p.side === 'right') && pos[p.i].y - R * 1.4 < f.y + 50)) ok = false;
        if (ok) break;
        R *= 0.94;
      }
      Rm = R;
    }
    layout();
    ctx.onResize(layout);
    const radius = (b) => Rm * (0.34 + 0.66 * Math.min(1.2, b.air / 32));

    /* ---------- UI ---------- */
    const ui = P.map(p => {
      const z = ctx.zone(p.i, { depth: DEPTH });
      z.el.style.background = `linear-gradient(0deg, ${U.alpha(p.color, .2)}, ${U.alpha(p.color, .04)})`;
      z.el.style.borderTop = `2px solid ${U.alpha(p.color, .6)}`;
      const tot = U.h('div', { class: 'tot' }), mid = U.h('div'), cur = U.h('div');
      const probe = U.h('div', { class: 'bt probe' }, U.h('div', { class: 'e' }, '🔍'), U.h('div', { class: 'l' }, 'щупать'));
      const pump = U.h('div', { class: 'bt pump' }, U.h('div', { class: 'e' }, '🎈'), U.h('div', { class: 'l' }, 'НАСОС'));
      const bank = U.h('div', { class: 'bt bank' }, U.h('div', { class: 'e' }, '💰'), U.h('div', { class: 'l' }, 'СДАТЬ'));
      const needle = U.h('div', { class: 'needle' });
      z.el.append(U.h('div', { class: 'info' }, tot, mid, cur), U.h('div', { class: 'row' }, probe, pump, bank), needle);
      ctx.tap(pump, () => doPump(p.i));
      ctx.tap(bank, () => doBank(p.i));
      ctx.tap(probe, () => doProbe(p.i));
      return { z, tot, mid, cur, probe, pump, bank, needle, cache: {} };
    });
    function set(u, k, el, v) { if (u.cache[k] !== v) { u.cache[k] = v; el.textContent = v; } }
    function render() {
      const left = phase === 'pump' ? Math.max(0, Math.ceil(roundEnd - ctx.time)) : ROUND_T;
      bl.forEach((b, i) => {
        const u = ui[i];
        set(u, 'tot', u.tot, `⭐ ${total[i]}`);
        set(u, 'mid', u.mid, `${type.icon} ${round}/${ROUNDS}${phase === 'pump' ? ` · ⏱️ ${left}` : ''}`);
        let cur = '';
        if (b.state === 'pump' || b.state === 'idle') cur = b.hint ? `🔍 ${b.hint[0]}–${b.hint[1]} · ${b.air}` : `качков: ${b.air}`;
        if (b.state === 'banked') cur = `✓ +${b.pts}`;
        if (b.state === 'burst') cur = '💥 0';
        set(u, 'cur', u.cur, cur);
        const canAct = phase === 'pump' && b.state === 'pump';
        u.pump.classList.toggle('off', !canAct);
        u.bank.classList.toggle('off', !canAct || b.air === 0);
        u.probe.classList.toggle('off', !canAct || probeLeft[i] <= 0 || !!b.hint);
      });
    }

    /* ---------- effects ---------- */
    function burst(x, y, color, n, sp, size, life) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, s = U.rand(sp * 0.25, sp);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life || 1, c: color, r: U.rand(size * 0.4, size), rot: Math.random() * 6, rag: Math.random() < 0.5 });
      }
    }
    function floatText(i, text, color, big) {
      const p = pos[i];
      floats.push({ i, x: p.x, y: p.y, text, c: color || '#fff', t: 0, big });
    }
    function say(text, o) {
      const f = fieldRect();
      return ctx.toast(text, Object.assign({ ms: 1500, offset: N === 2 ? 46 : Math.min(f.w, f.h) * 0.08 }, o || {}));
    }
    const colorOf = (i) => (type === TYPES.golden || type === TYPES.final) ? '#ffcf3c' : P[i].color;

    /* ---------- actions ---------- */
    function doPump(i) {
      const b = bl[i];
      if (phase !== 'pump' || b.state !== 'pump') return;
      b.air++;
      b.pumpT = 1;
      b.noise = U.clamp(b.noise + U.rand(-0.12, 0.12), -0.22, 0.22);
      const u = ui[i].pump; u.classList.remove('hit'); void u.offsetWidth; u.classList.add('hit');
      ctx.after(70, () => u.classList.remove('hit'));
      const p = pos[i], r = radius(b);
      for (let k = 0; k < 3; k++) parts.push({ x: p.x + p.v.x * r * 1.2, y: p.y + p.v.y * r * 1.2, vx: p.v.x * U.rand(40, 90) + U.rand(-40, 40), vy: p.v.y * U.rand(40, 90) + U.rand(-40, 40), life: 0.5, c: 'rgba(255,255,255,.7)', r: U.rand(2, 4) });
      if (b.air > b.thr) pop(i);
      render();
    }
    function pop(i) {
      const b = bl[i];
      b.state = 'burst'; b.burstT = 1; b.pts = 0;
      const p = pos[i], r = radius(b);
      burst(p.x, p.y, colorOf(i), 40, 620, 10, 1.2);
      burst(p.x, p.y, '#ffffff', 20, 420, 4, 0.8);
      rings.push({ x: p.x, y: p.y, r0: r, r1: r + Rm * 1.6, t: 0, c: colorOf(i) });
      flash = 0.45; flashC = colorOf(i); shake = Math.max(shake, 14);
      floatText(i, '💥 БАХ!', '#ff6b6b', true);
      checkRoundOver();
    }
    function doBank(i) {
      const b = bl[i];
      if (phase !== 'pump' || b.state !== 'pump' || b.air === 0) return;
      bankIt(i, false);
      if (firstBank < 0) {
        firstBank = i;
        const targets = bl.filter(o => o.i !== i && o.state === 'pump');
        if (targets.length) offerNeedle(i, targets);
      }
      checkRoundOver();
    }
    function bankIt(i, auto) {
      const b = bl[i];
      b.state = 'banked';
      b.pts = ptsFor(b.air) * type.mult;
      total[i] += b.pts;
      const p = pos[i];
      burst(p.x, p.y, '#3ddc97', 18, 260, 5);
      rings.push({ x: p.x, y: p.y, r0: radius(b), r1: radius(b) + 60, t: 0, c: '#3ddc97' });
      floatText(i, `${auto ? '⏰ ' : '💰 '}+${b.pts}`, '#3ddc97', true);
      render();
    }
    function doProbe(i) {
      const b = bl[i];
      if (phase !== 'pump' || b.state !== 'pump' || probeLeft[i] <= 0 || b.hint) return;
      probeLeft[i]--;
      const w = U.randInt(5, 8), lo = Math.max(b.air + 1, b.thr + 1 - U.randInt(1, w - 1));
      b.hint = [lo, Math.max(lo + 2, lo + w)];
      floatText(i, `🔍 лопнет на ${b.hint[0]}–${b.hint[1]}`, '#7fe7ff');
      const p = pos[i];
      rings.push({ x: p.x, y: p.y, r0: radius(b), r1: radius(b) + 40, t: 0, c: '#7fe7ff' });
      render();
    }
    function offerNeedle(i, targets) {
      const nd = ui[i].needle;
      nd.replaceChildren(U.h('div', { class: 't' }, '🪡', U.h('br'), 'уколоть?'));
      const close = () => { nd.classList.remove('on'); ctx.cancel(tmr); };
      targets.forEach(o => {
        const btn = U.h('div', { class: 'bt', style: { borderColor: P[o.i].color, background: U.alpha(P[o.i].color, 0.25) } },
          U.h('div', { class: 'e' }, '🪡'), U.h('div', { class: 'l' }, P[o.i].name));
        ctx.tap(btn, () => { close(); needle(i, o.i); });
        nd.append(btn);
      });
      const no = U.h('div', { class: 'bt', style: { flex: '.6 1 0' } }, U.h('div', { class: 'e' }, '✕'), U.h('div', { class: 'l' }, 'нет'));
      ctx.tap(no, close);
      nd.append(no);
      nd.classList.add('on');
      const tmr = ctx.after(4500, close);
      floatText(i, '🪡 Можешь уколоть!', '#fff');
    }
    function needle(from, to) {
      const b = bl[to];
      if (phase !== 'pump' || b.state !== 'pump') return;
      b.thr = Math.max(1, b.thr - 4);
      b.needled = 1;
      if (b.hint) b.hint = null; // the old hint is no longer valid
      say(`🪡 ${P[from].name} уколол ${P[to].name}!`, { color: P[from].color, fg: '#111', ms: 1500 });
      const p = pos[to];
      burst(p.x, p.y, '#e0e6ff', 14, 300, 3);
      floatText(to, '🪡 Укол! шарик слабее', '#ff9ab0');
      if (b.air > b.thr) ctx.after(250, () => { if (b.state === 'pump') pop(to); });
      render();
    }

    /* ---------- rounds ---------- */
    function nextRound() {
      round++;
      if (round > ROUNDS) return finishGame();
      type = TYPES[schedule[round - 1]];
      firstBank = -1;
      const mn = Math.min(...total), mx = Math.max(...total);
      const lows = total.map((v, i) => v === mn ? i : -1).filter(i => i >= 0);
      bl.forEach(b => {
        b.air = 0; b.state = 'idle'; b.pts = 0; b.noise = U.rand(-0.15, 0.15); b.hint = null; b.burstT = 0; b.needled = 0;
        const base = 6 + (Math.random() + Math.random()) / 2 * 26;
        b.thr = Math.max(3, Math.round(base * type.k));
        b.luck = round >= 4 && lows.length === 1 && lows[0] === b.i && mx > mn;
        if (b.luck) b.thr += 4;
        ui[b.i].needle.classList.remove('on');
      });
      phase = 'pre';
      say(`Раунд ${round}/${ROUNDS}: ${type.icon} ${type.name}`, { color: type === TYPES.heat ? '#ff6b3d' : type.mult > 1 ? '#ffcf3c' : '#fff', fg: '#111', ms: 1700 });
      if (type === TYPES.heat) { flash = 0.4; flashC = '#ff6b3d'; }
      if (type.mult > 1) { flash = 0.4; flashC = '#ffcf3c'; }
      const lucky = bl.find(b => b.luck);
      if (lucky) ctx.after(900, () => floatText(lucky.i, '🍀 Удача: шарик прочнее', '#7dff8a'));
      ctx.after(1800, () => {
        phase = 'pump'; roundEnd = ctx.time + ROUND_T;
        bl.forEach(b => { b.state = 'pump'; });
        say('КАЧАЙ!', { color: '#3ddc97', fg: '#111', ms: 700 });
        render();
      });
      render();
    }
    function checkRoundOver() {
      if (phase !== 'pump') return;
      if (bl.every(b => b.state !== 'pump')) endRound();
    }
    function endRound() {
      phase = 'post';
      bl.forEach(b => { ui[b.i].needle.classList.remove('on'); });
      // reveal thresholds
      bl.forEach(b => { if (b.state === 'banked') ctx.after(500, () => floatText(b.i, `предел был ${b.thr}`, '#9aa1c4')); });
      render();
      ctx.after(2600, nextRound);
    }
    function finishGame() {
      phase = 'over';
      const mx = Math.max(...total);
      const w = P.filter(p => total[p.i] === mx).map(p => p.i);
      ctx.end({ winners: w.length === N ? [] : w, scores: total.slice(), msg: `${ROUNDS} раундов позади` });
    }
    ctx.after(1, nextRound); // game timers only run after the countdown

    /* ---------- loop ---------- */
    function update(dt) {
      if (phase === 'pump' && ctx.time >= roundEnd) {
        bl.forEach(b => { if (b.state === 'pump') { if (b.air > 0) bankIt(b.i, true); else { b.state = 'banked'; b.pts = 0; } } });
        endRound();
      }
      for (const b of bl) {
        b.pumpT = Math.max(0, b.pumpT - dt * 5);
        b.burstT = Math.max(0, b.burstT - dt);
        b.needled = Math.max(0, b.needled - dt);
        b.wob += dt * (4 + 14 * Math.pow(Math.min(1, b.air / Math.max(1, b.thr)), 2));
      }
    }

    function drawBalloon(b, t) {
      const p = pos[b.i];
      const col = colorOf(b.i);
      g.save(); ctx.facing(g, b.i, p.x, p.y);
      const fr = Math.min(1.2, b.air / Math.max(1, b.thr)); // true fraction (drives wobble/squeak)
      const r = radius(b);
      const anchorY = Rm * 1.25 + 14; // edge of the zone in local coords
      if (b.state !== 'burst') {
        // string
        g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, r * 1.1 + 6);
        g.bezierCurveTo(Math.sin(t * 2) * 10, r * 1.1 + (anchorY - r) * 0.4, -Math.sin(t * 2) * 10, r * 1.1 + (anchorY - r) * 0.7, 0, anchorY);
        g.stroke();
        const wob = (b.state === 'pump' ? (0.01 + 0.06 * fr * fr) : 0.012);
        const sxk = 1 + Math.sin(b.wob) * wob + b.pumpT * 0.06, syk = 1 - Math.sin(b.wob) * wob + b.pumpT * 0.03;
        const jx = b.state === 'pump' && fr > 0.75 ? U.rand(-1, 1) * fr * 3 : 0;
        g.save(); g.translate(jx, 0); g.scale(sxk, syk);
        // glow
        const gl = g.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.7);
        gl.addColorStop(0, U.alpha(col, 0.35)); gl.addColorStop(1, U.alpha(col, 0));
        g.fillStyle = gl; g.beginPath(); g.arc(0, 0, r * 1.7, 0, TAU); g.fill();
        // body
        const bg = g.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r * 1.15);
        bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.12, U.alpha(col, 1)); bg.addColorStop(1, U.alpha(col, 0.75));
        g.fillStyle = bg;
        g.beginPath(); g.ellipse(0, 0, r, r * 1.12, 0, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.stroke();
        // knot
        g.fillStyle = col; g.beginPath(); g.moveTo(-7, r * 1.12 + 8); g.lineTo(7, r * 1.12 + 8); g.lineTo(0, r * 1.12 - 2); g.fill();
        // highlight
        g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-r * 0.38, -r * 0.45, r * 0.16, r * 0.28, -0.5, 0, TAU); g.fill();
        g.restore();
        // gold sparkles
        if (type.mult > 1 && Math.random() < 0.3) parts.push({ x: p.x + U.rand(-r, r), y: p.y + U.rand(-r, r), vx: 0, vy: -20, life: 0.7, c: '#fff6c0', r: 2.5, star: true });
        // squeak lines near burst (true value, but noisy)
        if (b.state === 'pump' && fr + b.noise * 0.5 > 0.68) {
          const k = Math.min(1, (fr + b.noise * 0.5 - 0.68) / 0.3);
          g.strokeStyle = `rgba(255,255,255,${0.35 + 0.5 * k})`; g.lineWidth = 3;
          for (let s = 0; s < 3; s++) {
            const a = -Math.PI * 0.85 + s * 0.35 + Math.sin(t * 9 + s) * 0.05;
            const rr = r * 1.18 + 6 + (Math.sin(t * 18 + s * 2) > 0 ? 4 : 0);
            g.beginPath(); g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); g.lineTo(Math.cos(a) * (rr + 10 + 8 * k), Math.sin(a) * (rr + 10 + 8 * k)); g.stroke();
            const a2 = -Math.PI * 0.15 - s * 0.35;
            g.beginPath(); g.moveTo(Math.cos(a2) * rr, Math.sin(a2) * rr); g.lineTo(Math.cos(a2) * (rr + 10 + 8 * k), Math.sin(a2) * (rr + 10 + 8 * k)); g.stroke();
          }
        }
        if (b.needled > 0) {
          g.font = `${Rm * 0.35}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.globalAlpha = b.needled; g.fillText('🪡', r * 0.9, -r * 0.6); g.globalAlpha = 1;
        }
        // label inside balloon
        g.textAlign = 'center'; g.textBaseline = 'middle';
        const lbl = b.state === 'banked' ? `✓ ${b.pts}` : String(ptsFor(b.air) * type.mult);
        g.font = `900 ${Math.max(16, r * 0.42)}px -apple-system, sans-serif`;
        g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.45)'; g.strokeText(lbl, 0, 0);
        g.fillStyle = '#fff'; g.fillText(lbl, 0, 0);
        if (b.luck && b.state === 'pump') { g.font = `${Math.max(14, r * 0.3)}px sans-serif`; g.fillText('🍀', 0, -r * 0.62); }
      } else {
        // burst remains
        g.globalAlpha = 0.6;
        g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, anchorY - Rm * 0.6); g.lineTo(0, anchorY); g.stroke();
        g.fillStyle = col;
        g.beginPath(); g.moveTo(-8, anchorY - Rm * 0.6); g.lineTo(8, anchorY - Rm * 0.6); g.lineTo(3, anchorY - Rm * 0.6 - 14); g.lineTo(-5, anchorY - Rm * 0.6 - 10); g.fill();
        g.globalAlpha = 1;
        g.font = `900 ${Rm * 0.32}px -apple-system, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = '#ff6b6b'; g.fillText('💥 0', 0, 0);
      }
      // stress meter (unreliable!)
      if (b.state === 'pump' || b.state === 'idle') {
        const mh = Rm * 1.7, mw = Math.max(10, Rm * 0.11), mx = Rm * 1.12 + 8, my = -mh / 2;
        const shown = U.clamp(fr * 0.95 + b.noise + Math.sin(t * 3 + b.i) * 0.03, 0, 1);
        g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.roundRect(mx, my, mw, mh, mw / 2); g.fill();
        const gr = g.createLinearGradient(0, my + mh, 0, my);
        gr.addColorStop(0, '#3ddc97'); gr.addColorStop(0.55, '#ffd84d'); gr.addColorStop(1, '#ff4d6d');
        g.fillStyle = gr; g.beginPath(); g.roundRect(mx, my + mh * (1 - shown), mw, mh * shown, mw / 2); g.fill();
        g.font = `${Math.max(14, mw * 1.6)}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('😰', mx + mw / 2, my - mw * 1.3);
      }
      g.restore();
    }

    ctx.loop((dt, now) => {
      const t = now / 1000;
      if (dt > 0) update(dt);
      if (dt > 0) {
        for (const p of parts) { p.life -= dt * 1.3; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; p.rot += dt * 8; }
        parts = parts.filter(p => p.life > 0);
        for (const r of rings) r.t += dt * 1.8;
        rings = rings.filter(r => r.t < 1);
        for (const f of floats) f.t += dt;
        floats = floats.filter(f => f.t < 1.8);
        flash = Math.max(0, flash - dt * 1.3);
        shake = Math.max(0, shake - dt * 40);
      }
      g.save();
      g.fillStyle = '#0f1220'; g.fillRect(0, 0, ctx.W, ctx.H);
      if (shake > 0) g.translate(U.rand(-shake, shake) * 0.5, U.rand(-shake, shake) * 0.5);
      const f = fieldRect();
      if (type === TYPES.heat && phase !== 'over') {
        const hg = g.createLinearGradient(0, f.y, 0, f.y + f.h);
        hg.addColorStop(0, `rgba(255,90,40,${0.12 + 0.05 * Math.sin(t * 3)})`); hg.addColorStop(0.5, 'rgba(255,90,40,.03)'); hg.addColorStop(1, `rgba(255,90,40,${0.12 + 0.05 * Math.cos(t * 3)})`);
        g.fillStyle = hg; g.fillRect(f.x, f.y, f.w, f.h);
        if (dt > 0 && Math.random() < 0.3) parts.push({ x: f.x + Math.random() * f.w, y: f.y + Math.random() * f.h, vx: 0, vy: -30, life: 0.8, c: 'rgba(255,140,60,.5)', r: 3 });
      }
      if (type.mult > 1 && phase !== 'over') {
